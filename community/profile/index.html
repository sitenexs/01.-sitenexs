<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Akun Mitra — Sitenexs</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Kelola informasi akun, profil, foto, dan riwayat aktivitas Anda di ekosistem Sitenexs.">
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Supabase JS Client untuk Upload Foto -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --border-accent: #93c5fd;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
            --radius-sm: 0.375rem;
            --radius-md: 0.625rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
            --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.6;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button, input, textarea, select { font-family: inherit; outline: none; border: none; }

        .container { width: 100%; max-width: 1000px; margin: 0 auto; padding: 0 1rem; }

        .text-primary { color: var(--primary); }
        .text-muted { color: var(--text-muted); }

        /* BUTTONS */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            padding: 0.6rem 1.2rem; font-size: 0.85rem; font-weight: 700;
            border-radius: var(--radius-full); cursor: pointer; transition: var(--transition);
            white-space: nowrap;
        }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-secondary { background: #fff; border: 1px solid var(--border-medium); color: var(--text-main); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-danger { background: #fee2e2; color: #ef4444; border: 1px solid #fecaca; }
        .btn-danger:hover { background: #ef4444; color: #fff; }
        .btn-sm { padding: 0.4rem 0.8rem; font-size: 0.8rem; }

        /* NAVBAR */
        #navbar {
            position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm);
        }
        .nav-container { display: flex; align-items: center; justify-content: space-between; height: 65px; width: 100%; max-width: 1000px; }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.1rem; color: var(--text-main); }
        .logo img { height: 30px; width: 30px; border-radius: 50%; object-fit: cover; }
        .nav-actions { display: flex; gap: 0.5rem; align-items: center; }

        /* PROFILE LAYOUT */
        .profile-wrapper { padding: 2rem 0 4rem 0; width: 100%; }
        
        .profile-header-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl);
            padding: 2rem; box-shadow: var(--shadow-sm); display: flex; flex-direction: column; align-items: center;
            text-align: center; margin-bottom: 1.5rem; position: relative; overflow: hidden;
        }

        .profile-avatar-container {
            position: relative; width: 90px; height: 90px; margin-bottom: 1rem;
        }
        .profile-avatar {
            width: 90px; height: 90px; border-radius: 50%; object-fit: cover; border: 3px solid var(--primary-light);
            box-shadow: var(--shadow-md); background: #cbd5e1;
        }
        .upload-avatar-btn {
            position: absolute; bottom: 0; right: 0; background: var(--primary); color: #fff;
            width: 30px; height: 30px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; cursor: pointer; border: 2px solid #fff; transition: var(--transition);
        }
        .upload-avatar-btn:hover { background: var(--primary-dark); transform: scale(1.05); }

        .profile-name-row { display: flex; align-items: center; justify-content: center; gap: 0.4rem; margin-bottom: 0.2rem; }
        .profile-name { font-size: 1.25rem; font-weight: 800; color: var(--text-main); }
        .verified-badge { width: 16px; height: 16px; object-fit: contain; }
        .profile-email { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 1rem; }

        .profile-stats {
            display: flex; gap: 2rem; border-top: 1px solid var(--border-subtle); border-bottom: 1px solid var(--border-subtle);
            padding: 0.75rem 2rem; width: 100%; justify-content: center; margin-bottom: 1.5rem;
        }
        .stat-item { text-align: center; }
        .stat-value { font-weight: 800; font-size: 1rem; color: var(--text-main); }
        .stat-label { font-size: 0.75rem; color: var(--text-muted); }

        /* FORM SECTION */
        .profile-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl);
            padding: 1.5rem; box-shadow: var(--shadow-sm); margin-bottom: 1.5rem;
        }
        .card-title { font-size: 1rem; font-weight: 800; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.5rem; color: var(--text-main); }
        
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        @media(max-width: 768px) { .form-grid { grid-template-columns: 1fr; } }

        .form-group { margin-bottom: 1rem; }
        .form-label { display: block; font-size: 0.8rem; font-weight: 700; color: var(--text-muted); margin-bottom: 0.3rem; }
        .form-control {
            width: 100%; padding: 0.65rem 0.85rem; border: 1px solid var(--border-medium);
            border-radius: var(--radius-md); font-size: 0.85rem; background: var(--bg-body); color: var(--text-main);
        }
        .form-control:focus { background: #fff; border-color: var(--primary); }
        .form-control:disabled { opacity: 0.7; cursor: not-allowed; }

        /* POSTINGAN SAYA */
        .my-posts-list { display: flex; flex-direction: column; gap: 0.75rem; }
        .my-post-item {
            background: var(--bg-body); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
            padding: 0.85rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem;
        }
        .my-post-info { min-width: 0; flex: 1; }
        .my-post-title { font-weight: 700; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .my-post-meta { font-size: 0.75rem; color: var(--text-muted); margin-top: 0.2rem; }

        .loader-container { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem; }

        #alertBox {
            padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; font-weight: 600;
            margin-bottom: 1rem; display: none;
        }
        .alert-success { background: #d1fae5; color: #065f46; border: 1px solid #a7f3d0; }
        .alert-error { background: #fee2e2; color: #991b1b; border: 1px solid #fecaca; }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header id="navbar">
        <div class="container nav-container">
            <a href="https://sitenexs.com/" class="logo">
                <img src="https://sitenexs.com/assets/logo/logo.png" alt="Sitenexs Logo" onerror="this.src='https://ui-avatars.com/api/?name=Sitenexs&background=2563eb&color=fff'">
                <span>Akun Saya</span>
            </a>
            <div class="nav-actions">
                <a href="https://sitenexs.com/forum/" class="btn btn-secondary btn-sm"><i class="fas fa-comments"></i> Forum</a>
                <button onclick="handleLogout()" class="btn btn-danger btn-sm"><i class="fas fa-sign-out-alt"></i> Keluar</button>
            </div>
        </div>
    </header>

    <!-- KONTEN UTAMA PROFIL -->
    <main class="container profile-wrapper">
        
        <div id="alertBox"></div>

        <!-- HEADER KARTU PROFIL -->
        <div class="profile-header-card">
            <div class="profile-avatar-container">
                <img id="profileAvatarImg" src="https://ui-avatars.com/api/?name=User&background=cbd5e1&color=fff" alt="Avatar" class="profile-avatar">
                <label for="avatarFileInput" class="upload-avatar-btn" title="Ganti Foto Profil">
                    <i class="fas fa-camera"></i>
                </label>
                <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="uploadProfilePhoto(event)">
            </div>

            <div class="profile-name-row">
                <h1 id="profileHeaderName" class="profile-name">Memuat Nama...</h1>
                <img id="profileVerifiedIcon" src="https://sitenexs.com/assets/logo/verified.png" class="verified-badge" alt="Verified" style="display: none;">
            </div>
            <p id="profileHeaderEmail" class="profile-email">Memuat email...</p>

            <div class="profile-stats">
                <div class="stat-item">
                    <div id="statPostCount" class="stat-value">0</div>
                    <div class="stat-label">Diskusi Dibuat</div>
                </div>
                <div class="stat-item">
                    <div id="statStatusMitra" class="stat-value text-primary">Mitra Aktif</div>
                    <div class="stat-label">Status Akun</div>
                </div>
            </div>
        </div>

        <!-- FORM EDIT INFORMASI PROFIL -->
        <div class="profile-card">
            <h3 class="card-title"><i class="fas fa-user-edit text-primary"></i> Informasi Pribadi & Usaha</h3>
            <form id="updateProfileForm" onsubmit="saveProfileChanges(event)">
                <div class="form-grid">
                    <div class="form-group">
                        <label class="form-label">Nama Depan</label>
                        <input type="text" id="inputNamaDepan" class="form-control" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Nama Belakang</label>
                        <input type="text" id="inputNamaBelakang" class="form-control">
                    </div>
                </div>
                <div class="form-group">
                    <label class="form-label">Nama Lengkap (Tampil di Forum)</label>
                    <input type="text" id="inputNamaLengkap" class="form-control" required>
                </div>
                <div class="form-group">
                    <label class="form-label">Email Akun (Tidak dapat diubah)</label>
                    <input type="email" id="inputEmail" class="form-control" disabled>
                </div>
                <div style="display: flex; justify-content: flex-end; margin-top: 1.25rem;">
                    <button type="submit" class="btn btn-primary" id="saveBtn">
                        <i class="fas fa-save"></i> Simpan Perubahan
                    </button>
                </div>
            </form>
        </div>

        <!-- RIWAYAT DISKUSI SAYA -->
        <div class="profile-card">
            <h3 class="card-title"><i class="fas fa-comments text-primary"></i> Riwayat Diskusi Saya</h3>
            <div class="my-posts-list" id="myPostsContainer">
                <div class="loader-container">
                    <i class="fas fa-circle-notch fa-spin fa-2x"></i>
                    <p style="margin-top: 0.5rem;">Memuat daftar postingan Anda...</p>
                </div>
            </div>
        </div>

    </main>

    <!-- SCRIPT FIREBASE & SUPABASE INTEGRATION -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761'
        };

        const supabaseUrl = 'https://xqcbyamxiekdxytntlno.supabase.co';
        const supabaseAnonKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxY2J5YW14aWVrZHh5dG50bG5vIiwicm9sZSI6ImFub24iLCJpZWF0aWN0aW9uOiJzdXAxYmlsaXR5Ij09fQ=='; // Kunci publik publik standar proyek
        const avatarBucket = 'profile-photos';

        // Inisialisasi Supabase client untuk upload foto
        const supabaseClient = window.supabase.createClient(supabaseUrl, supabaseAnonKey);

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        setPersistence(auth, browserLocalPersistence).catch(err => console.log(err));

        let currentUid = null;

        const avatarImg = document.getElementById('profileAvatarImg');
        const headerName = document.getElementById('profileHeaderName');
        const headerEmail = document.getElementById('profileHeaderEmail');
        const verifiedIcon = document.getElementById('profileVerifiedIcon');
        const statPostCount = document.getElementById('statPostCount');
        
        const inputNamaDepan = document.getElementById('inputNamaDepan');
        const inputNamaBelakang = document.getElementById('inputNamaBelakang');
        const inputNamaLengkap = document.getElementById('inputNamaLengkap');
        const inputEmail = document.getElementById('inputEmail');
        const myPostsContainer = document.getElementById('myPostsContainer');
        const alertBox = document.getElementById('alertBox');

        function showAlert(message, type = 'success') {
            alertBox.innerText = message;
            alertBox.className = type === 'success' ? 'alert-success' : 'alert-error';
            alertBox.style.display = 'block';
            setTimeout(() => { alertBox.style.display = 'none'; }, 4000);
        }

        async function loadUserData(uid, fallbackEmail = "", fallbackName = "Mitra Sitenexs") {
            currentUid = uid;
            try {
                const userDocRef = doc(db, "users", uid);
                const userDocSnap = await getDoc(userDocRef);

                let d = {
                    namaDepan: fallbackName.split(' ')[0] || '',
                    namaBelakang: fallbackName.split(' ').slice(1).join(' ') || '',
                    namaLengkap: fallbackName,
                    email: fallbackEmail || auth.currentUser?.email || '',
                    isVerified: false
                };

                if (userDocSnap.exists()) {
                    const data = userDocSnap.data();
                    d.namaDepan = data.namaDepan || d.namaDepan;
                    d.namaBelakang = data.namaBelakang || d.namaBelakang;
                    d.namaLengkap = data.namaLengkap || (d.namaDepan + ' ' + d.namaBelakang).trim() || fallbackName;
                    d.email = data.email || d.email;
                    d.isVerified = data.isVerified || false;
                }

                // Set value form
                inputNamaDepan.value = d.namaDepan;
                inputNamaBelakang.value = d.namaBelakang;
                inputNamaLengkap.value = d.namaLengkap;
                inputEmail.value = d.email;

                headerName.innerText = d.namaLengkap;
                headerEmail.innerText = d.email;

                if (d.isVerified) {
                    verifiedIcon.style.display = 'inline-block';
                }

                // Ambil foto dari Supabase
                const photoUrl = `${supabaseUrl}/storage/v1/object/public/${avatarBucket}/${encodeURIComponent(uid)}/profile-photo?t=${Date.now()}`;
                const fallbackUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(d.namaLengkap)}&background=2563eb&color=fff`;
                
                avatarImg.src = photoUrl;
                avatarImg.onerror = () => { avatarImg.src = fallbackUrl; };

                // Muat postingan forum pengguna ini
                loadUserPosts(uid);

            } catch (err) {
                console.error("Gagal memuat profil:", err);
                showAlert("Gagal memuat data profil.", "error");
            }
        }

        // Cek autentikasi saat halaman dimuat
        const urlParams = new URLSearchParams(window.location.search);
        const urlUid = urlParams.get('uid');

        if (urlUid) {
            localStorage.setItem('sitenexs_uid', urlUid);
            localStorage.setItem('sitenexs_logged_in', 'true');
            loadUserData(urlUid);
        } else {
            onAuthStateChanged(auth, async (user) => {
                if (user) {
                    loadUserData(user.uid, user.email, user.displayName);
                } else {
                    const savedUid = localStorage.getItem('sitenexs_uid');
                    const isLogged = localStorage.getItem('sitenexs_logged_in') === 'true';

                    if (isLogged && savedUid) {
                        loadUserData(savedUid);
                    } else {
                        // Belum login, arahkan ke sign-in
                        window.location.replace("https://account.sitenexs.com/sign-in/");
                    }
                }
            });
        }

        // Simpan Perubahan Profil
        window.saveProfileChanges = async function(e) {
            e.preventDefault();
            if (!currentUid) return;

            const saveBtn = document.getElementById('saveBtn');
            saveBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
            saveBtn.disabled = true;

            try {
                const userDocRef = doc(db, "users", currentUid);
                const updatedData = {
                    namaDepan: inputNamaDepan.value.trim(),
                    namaBelakang: inputNamaBelakang.value.trim(),
                    namaLengkap: inputNamaLengkap.value.trim(),
                    updatedAt: new Date()
                };

                await setDoc(userDocRef, updatedData, { merge: true });
                headerName.innerText = updatedData.namaLengkap;
                showAlert("Profil berhasil diperbarui!");
            } catch (err) {
                console.error("Gagal menyimpan profil:", err);
                showAlert("Terjadi kesalahan saat menyimpan.", "error");
            } finally {
                saveBtn.innerHTML = '<i class="fas fa-save"></i> Simpan Perubahan';
                saveBtn.disabled = false;
            }
        }

        // Upload Foto ke Supabase Bucket
        window.uploadProfilePhoto = async function(event) {
            const file = event.target.files[0];
            if (!file || !currentUid) return;

            showAlert("Mengunggah foto profil...", "success");

            try {
                const filePath = `${currentUid}/profile-photo`;

                // Upload menggunakan Supabase Storage SDK (Upsert true untuk menimpa foto lama)
                const { data, error } = await supabaseClient.storage
                    .from(avatarBucket)
                    .upload(filePath, file, { upsert: true, contentType: file.type });

                if (error) throw error;

                // Refresh foto di tampilan
                const newPhotoUrl = `${supabaseUrl}/storage/v1/object/public/${avatarBucket}/${filePath}?t=${Date.now()}`;
                avatarImg.src = newPhotoUrl;
                showAlert("Foto profil berhasil diperbarui!");
            } catch (err) {
                console.error("Gagal upload foto:", err);
                showAlert("Gagal mengunggah foto. Pastikan ukuran file tidak terlalu besar.", "error");
            }
        }

        // Ambil Riwayat Postingan Pengguna
        async function loadUserPosts(uid) {
            try {
                const qPosts = query(collection(db, "forum_posts"), where("authorUid", "==", uid));
                const querySnapshot = await getDocs(qPosts);

                statPostCount.innerText = querySnapshot.size;

                if (querySnapshot.empty) {
                    myPostsContainer.innerHTML = '<div class="loader-container"><p>Anda belum pernah membuat diskusi.</p></div>';
                    return;
                }

                let html = "";
                querySnapshot.forEach((docSnap) => {
                    const post = docSnap.data();
                    const dateStr = post.createdAt ? new Date(post.createdAt.toDate()).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' }) : 'Baru saja';
                    
                    html += `
                        <div class="my-post-item">
                            <div class="my-post-info">
                                <div class="my-post-title">${post.judul}</div>
                                <div class="my-post-meta">Kategori: <strong>${post.kategori}</strong> • Diposting pada ${dateStr}</div>
                            </div>
                            <a href="https://sitenexs.com/forum/" target="_blank" class="btn btn-secondary btn-sm"><i class="fas fa-external-link-alt"></i> Lihat</a>
                        </div>
                    `;
                });

                myPostsContainer.innerHTML = html;
            } catch (err) {
                console.error("Gagal memuat postingan:", err);
                myPostsContainer.innerHTML = '<div class="loader-container"><p style="color:red;">Gagal memuat riwayat diskusi.</p></div>';
            }
        }

        // Logout
        window.handleLogout = async function() {
            if (confirm("Apakah Anda yakin ingin keluar dari akun Sitenexs?")) {
                localStorage.removeItem('sitenexs_uid');
                localStorage.removeItem('sitenexs_logged_in');
                try {
                    await signOut(auth);
                } catch(e) {}
                window.location.replace("https://account.sitenexs.com/sign-in/");
            }
        }
    </script>
</body>
</html>
