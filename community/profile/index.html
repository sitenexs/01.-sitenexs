<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Anggota & Bisnis — Komunitas Sitenexs</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Profil resmi anggota, bisnis, dan paket layanan UMKM yang tergabung dalam ekosistem digital Sitenexs.">
    <meta name="robots" content="index, follow">
    <link rel="canonical" href="https://sitenexs.com/community/profile">

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-alt: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --border-accent: #93c5fd;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 10px -2px rgba(15, 23, 42, 0.08);
            --shadow-lg: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            --radius-sm: 0.375rem;
            --radius-md: 0.625rem;
            --radius-lg: 1rem;
            --radius-xl: 1.25rem;
            --radius-full: 9999px;
            --transition: all 0.2s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; }

        /* KONTENER LEBIH KECIL (COMPACT) */
        .container {
            width: 100%;
            max-width: 550px; 
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* BACKGROUND PATTERN */
        .bg-grid-pattern {
            background-image: 
                linear-gradient(to right, rgba(37, 99, 235, 0.04) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(37, 99, 235, 0.04) 1px, transparent 1px);
            background-size: 28px 28px;
        }

        /* NAVBAR */
        .profile-nav {
            background: rgba(255, 255, 255, 0.95);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.75rem 0;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }

        .nav-content { display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.05rem; color: var(--text-main); }
        .logo-img { height: 28px; width: 28px; border-radius: var(--radius-full); object-fit: cover; border: 2px solid #fff; box-shadow: var(--shadow-sm); }
        
        .back-btn {
            display: inline-flex; align-items: center; gap: 0.4rem; font-size: 0.8rem; font-weight: 700;
            color: var(--text-muted); transition: var(--transition); background: var(--bg-alt);
            padding: 0.4rem 0.85rem; border-radius: var(--radius-full); border: 1px solid var(--border-subtle);
        }
        .back-btn:hover { color: var(--primary); border-color: var(--border-accent); background: var(--primary-light); }

        /* MAIN SECTION */
        .profile-section {
            padding: 2rem 0;
            flex: 1;
            display: flex;
            align-items: flex-start;
            justify-content: center;
        }

        .profile-card {
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            padding: 1.75rem;
            box-shadow: var(--shadow-md);
            width: 100%;
            position: relative;
            overflow: hidden;
        }

        .profile-card::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(90deg, var(--primary) 0%, var(--accent) 100%);
        }

        /* LOADING & ERROR STATES */
        .state-box { text-align: center; padding: 2.5rem 1rem; }
        .state-box i { font-size: 2rem; color: var(--primary); margin-bottom: 0.75rem; }
        .state-box h3 { font-size: 1.1rem; font-weight: 800; margin-bottom: 0.3rem; }
        .state-box p { color: var(--text-muted); font-size: 0.85rem; }

        /* PROFILE HEADER (COMPACT) */
        .profile-header-flex {
            display: flex;
            align-items: center;
            gap: 1.25rem;
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .avatar-container {
            position: relative; width: 85px; height: 85px; min-width: 85px;
            border-radius: 50%; padding: 3px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            box-shadow: var(--shadow-sm);
        }

        .profile-avatar { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: var(--bg-body); border: 2px solid #fff; }

        .profile-meta h1 {
            font-size: 1.25rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.2rem;
            display: flex; align-items: center; gap: 0.35rem; flex-wrap: wrap; line-height: 1.2;
        }

        .verified-icon { width: 16px; height: 16px; object-fit: contain; transform: translateY(1px); }

        .badges-row { display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.4rem; }
        
        .profile-role-badge, .package-badge {
            display: inline-flex; align-items: center; gap: 0.3rem; font-size: 0.65rem; font-weight: 700;
            padding: 0.2rem 0.5rem; border-radius: var(--radius-full); border: 1px solid transparent;
        }
        .profile-role-badge { color: var(--primary); background: var(--primary-light); border-color: rgba(37, 99, 235, 0.15); }
        .package-badge.pro { background: #fef08a; color: #854d0e; border-color: #fde047; }
        .package-badge.premium { background: #e9d5ff; color: #6b21a8; border-color: #d8b4fe; }
        .package-badge.basic { background: var(--bg-alt); color: var(--text-muted); border-color: var(--border-subtle); }

        .profile-joined { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.3rem; font-weight: 500; }

        /* STATS BAR (BARU & RINGKAS) */
        .profile-stats {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--bg-body); border-radius: var(--radius-lg); padding: 0.85rem;
            margin-bottom: 1.5rem; border: 1px solid var(--border-subtle);
        }
        
        .stat-item { flex: 1; text-align: center; border-right: 1px solid var(--border-subtle); }
        .stat-item:last-child { border-right: none; }
        .stat-value { font-size: 1.05rem; font-weight: 800; color: var(--text-main); line-height: 1.2; }
        .stat-label { font-size: 0.65rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; margin-top: 0.1rem; }

        /* BUSINESS CARD BANNER (COMPACT) */
        .business-showcase {
            background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%);
            border: 1px solid var(--border-accent); border-radius: var(--radius-md);
            padding: 1rem; display: flex; align-items: center; gap: 1rem; margin-bottom: 1.5rem;
            box-shadow: var(--shadow-sm);
        }

        .business-logo-box {
            width: 50px; height: 50px; min-width: 50px; background: #ffffff;
            border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center;
            border: 1px solid var(--border-medium); overflow: hidden; box-shadow: var(--shadow-sm);
        }
        .business-logo { width: 100%; height: 100%; object-fit: cover; }

        .business-info h3 { font-size: 1rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.1rem; line-height: 1.2; }
        .business-info p { font-size: 0.75rem; color: var(--text-muted); display: flex; align-items: center; gap: 0.3rem; font-weight: 500; }

        /* ACTION BUTTONS */
        .profile-actions { display: flex; gap: 0.75rem; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            padding: 0.75rem 1rem; font-size: 0.85rem; font-weight: 700; border-radius: var(--radius-full);
            transition: var(--transition); cursor: pointer; border: 1px solid transparent; text-align: center; flex: 1;
        }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #ffffff; box-shadow: 0 4px 10px rgba(37, 99, 235, 0.25); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 14px rgba(37, 99, 235, 0.35); }
        .btn-secondary { background-color: #ffffff; color: var(--text-main); border: 1px solid var(--border-medium); box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { border-color: var(--border-medium); background: var(--bg-body); transform: translateY(-2px); }

        /* RESPONSIVE */
        @media (max-width: 480px) {
            .profile-header-flex { gap: 1rem; }
            .avatar-container { width: 75px; height: 75px; min-width: 75px; }
            .profile-meta h1 { font-size: 1.15rem; }
            .profile-actions { flex-direction: column; }
            .business-showcase { padding: 0.85rem; gap: 0.75rem; }
        }
    </style>
</head>
<body class="bg-grid-pattern">

    <!-- NAVBAR -->
    <header class="profile-nav">
        <div class="container nav-content">
            <a href="https://sitenexs.com" class="logo">
                <img src="https://sitenexs.com/assets/logo/logo.png" alt="Sitenexs Logo" class="logo-img">
                <span>SiteNexs</span>
            </a>
            <a href="https://sitenexs.com/#mitra" class="back-btn">
                <i class="fas fa-arrow-left"></i> Kembali
            </a>
        </div>
    </header>

    <!-- KONTEN PROFIL -->
    <main class="profile-section">
        <div class="container">
            <div id="profile-card-container" class="profile-card">
                <!-- State Loading Awal -->
                <div class="state-box">
                    <i class="fas fa-spinner fa-spin"></i>
                    <h3>Memuat Profil...</h3>
                    <p>Mengambil data anggota Sitenexs.</p>
                </div>
            </div>
        </div>
    </main>

    <!-- SCRIPT FIREBASE & SUPABASE -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import { getFirestore, doc, getDoc, collection, query, where, getDocs } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761',
            measurementId: 'G-C7YL0Q7YRQ'
        };

        const supabaseUrl = 'https://xqcbyamxiekdxytntlno.supabase.co';
        const avatarBucket = 'profile-photos';
        const businessLogoBucket = 'business-logos';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Fungsi menghitung total likes dari forum
        async function fetchUserReputation(uid) {
            let totalLikes = 0;
            try {
                const forumRef = collection(db, "forum_posts");
                const q = query(forumRef, where("authorUid", "==", uid));
                const querySnapshot = await getDocs(q);
                
                querySnapshot.forEach((doc) => {
                    const postData = doc.data();
                    if (postData.likes && Array.isArray(postData.likes)) {
                        totalLikes += postData.likes.length;
                    }
                });
            } catch (err) {
                console.error("Gagal mengambil data like:", err);
            }
            return totalLikes;
        }

        async function loadUserProfile() {
            const container = document.getElementById('profile-card-container');
            const urlParams = new URLSearchParams(window.location.search);
            const uid = urlParams.get('uid');

            if (!uid) {
                container.innerHTML = `
                    <div class="state-box">
                        <i class="fas fa-user-slash" style="color: #ef4444;"></i>
                        <h3>UID Tidak Ditemukan</h3>
                        <p>Tautan profil tidak menyertakan UID yang valid.</p>
                        <a href="https://sitenexs.com/#mitra" class="btn btn-primary" style="margin-top: 1rem;">Kembali</a>
                    </div>
                `;
                return;
            }

            try {
                const docRef = doc(db, "users", uid);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    container.innerHTML = `
                        <div class="state-box">
                            <i class="fas fa-exclamation-triangle" style="color: #f59e0b;"></i>
                            <h3>Profil Tidak Ditemukan</h3>
                            <p>Pengguna tidak terdaftar di sistem.</p>
                            <a href="https://sitenexs.com/#mitra" class="btn btn-primary" style="margin-top: 1rem;">Kembali</a>
                        </div>
                    `;
                    return;
                }

                const data = docSnap.data();
                const namaLengkap = data.namaLengkap || `${data.namaDepan || ''} ${data.namaBelakang || ''}`.trim() || 'Anggota Sitenexs';
                const bisnisNama = data.bisnis?.nama || 'Usaha Mandiri';
                const bisnisBidang = data.bisnis?.bidang || 'UMKM Umum';
                const telepon = data.telepon || data.whatsapp || '-';
                
                const isVerified = data.isVerified || data.isFounder || data.isDeveloper || false;
                const isDeveloper = data.isDeveloper || false;
                const jabatan = data.jabatanPengembang || (isDeveloper ? 'Mitra Pengembang' : 'Pemilik Usaha');
                const paket = data.paketLangganan || 'Basic';
                
                const totalLikes = await fetchUserReputation(uid);
                
                let tanggalBergabung = 'Baru saja';
                if (data.createdAt) {
                    const dateObj = new Date(data.createdAt);
                    tanggalBergabung = dateObj.toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' });
                }

                // URL Gambar
                const photoUrl = `${supabaseUrl}/storage/v1/object/public/${avatarBucket}/${encodeURIComponent(uid)}/profile-photo?t=${Date.now()}`;
                const fallbackUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(namaLengkap)}&background=2563eb&color=fff&size=200`;
                
                const businessLogoUrl = data.bisnis?.logoUrl || `${supabaseUrl}/storage/v1/object/public/${businessLogoBucket}/${encodeURIComponent(uid)}/logo?t=${Date.now()}`;
                const businessFallbackLogo = `https://ui-avatars.com/api/?name=${encodeURIComponent(bisnisNama)}&background=10b981&color=fff&size=100`;

                const verifiedBadgeHTML = isVerified ? `<img src="https://sitenexs.com/assets/logo/verified.png" class="verified-icon" alt="Verified">` : '';

                // Badge Paket
                let packageClass = 'basic';
                let packageIcon = 'fa-box';
                const paketLower = paket.toLowerCase();
                if (paketLower.includes('pro')) { packageClass = 'pro'; packageIcon = 'fa-crown'; }
                else if (paketLower.includes('premium') || paketLower.includes('vip') || paketLower.includes('ultimate')) { packageClass = 'premium'; packageIcon = 'fa-gem'; }

                // RENDER HTML COMPACT
                container.innerHTML = `
                    <div class="profile-header-flex">
                        <div class="avatar-container">
                            <img src="${photoUrl}" alt="Avatar ${namaLengkap}" class="profile-avatar" onerror="this.onerror=null; this.src='${fallbackUrl}';">
                        </div>
                        <div class="profile-meta">
                            <h1>${namaLengkap} ${verifiedBadgeHTML}</h1>
                            <div class="badges-row">
                                <span class="profile-role-badge">
                                    <i class="fas ${isDeveloper ? 'fa-code' : 'fa-user-tie'}"></i> ${jabatan}
                                </span>
                                <span class="package-badge ${packageClass}">
                                    <i class="fas ${packageIcon}"></i> ${paket}
                                </span>
                            </div>
                            <div class="profile-joined">
                                <i class="fas fa-calendar-alt text-muted"></i> Bergabung ${tanggalBergabung}
                            </div>
                        </div>
                    </div>

                    <!-- STATS BAR HORIZONTAL -->
                    <div class="profile-stats">
                        <div class="stat-item">
                            <div class="stat-value"><i class="fas fa-heart" style="color: #ef4444; font-size:0.9rem;"></i> ${totalLikes}</div>
                            <div class="stat-label">Reputasi</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value" style="color: var(--primary);">${paket.toUpperCase()}</div>
                            <div class="stat-label">Status Layanan</div>
                        </div>
                        <div class="stat-item">
                            <div class="stat-value"><i class="fas fa-check-circle" style="color: var(--accent);"></i></div>
                            <div class="stat-label">Akun Aktif</div>
                        </div>
                    </div>

                    <!-- BUSINESS SHOWCASE COMPACT -->
                    <div class="business-showcase">
                        <div class="business-logo-box">
                            <img src="${businessLogoUrl}" alt="Logo ${bisnisNama}" class="business-logo" onerror="this.onerror=null; this.src='${businessFallbackLogo}';">
                        </div>
                        <div class="business-info">
                            <h3>${bisnisNama}</h3>
                            <p><i class="fas fa-store text-primary"></i> ${bisnisBidang}</p>
                        </div>
                    </div>

                    <!-- ACTIONS -->
                    <div class="profile-actions">
                        ${telepon !== '-' ? `
                            <a href="https://wa.me/${telepon.replace(/[^0-9]/g, '')}?text=Halo%20${encodeURIComponent(namaLengkap)},%20saya%20menemukan%20profil%20bisnis%20${encodeURIComponent(bisnisNama)}%20di%20komunitas%20Sitenexs." target="_blank" rel="noopener noreferrer" class="btn btn-primary">
                                <i class="fab fa-whatsapp" style="font-size: 1rem;"></i> Hubungi
                            </a>
                        ` : ''}
                        <a href="https://sitenexs.com/#mitra" class="btn btn-secondary">
                            <i class="fas fa-users"></i> Jelajahi Komunitas
                        </a>
                    </div>
                `;

            } catch (error) {
                console.error("Gagal memuat profil:", error);
                container.innerHTML = `
                    <div class="state-box">
                        <i class="fas fa-wifi" style="color: #ef4444;"></i>
                        <h3>Terjadi Kesalahan Jaringan</h3>
                        <p>Gagal memuat profil dari server.</p>
                        <a href="https://sitenexs.com/#mitra" class="btn btn-primary" style="margin-top: 1rem;">Kembali</a>
                    </div>
                `;
            }
        }

        loadUserProfile();
    </script>
</body>
</html>
