<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Mitra Sitenexs</title>
    <meta name="description" content="Profil komunitas dan mitra Sitenexs.">
    
    <!-- Google Fonts & Font Awesome -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-sm: 0 4px 12px -2px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.08);
            --radius-md: 0.75rem;
            --radius-lg: 1rem;
            --radius-xl: 1.5rem;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at 50% -20%, rgba(37, 99, 235, 0.08) 0%, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; transition: 0.2s; }
        
        /* Navbar */
        .topbar {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-subtle);
            position: sticky;
            top: 0;
            z-index: 50;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .nav-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 800;
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .brand img {
            width: 34px;
            height: 34px;
            border-radius: 50%;
        }

        .btn-back {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 99px;
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-main);
            box-shadow: var(--shadow-sm);
        }

        .btn-back:hover {
            background: var(--bg-body);
            border-color: var(--border-medium);
        }

        /* Profile Section */
        .profile-wrapper {
            flex: 1;
            padding: 3rem 0;
            display: flex;
            justify-content: center;
        }

        .profile-card {
            width: 100%;
            max-width: 750px;
            background: var(--bg-card);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .profile-header {
            background: linear-gradient(135deg, var(--primary-light) 0%, #ffffff 100%);
            padding: 3.5rem 2rem 2.5rem 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            border-bottom: 1px solid var(--border-subtle);
        }

        /* GAYA UNTUK AVATAR & LOGO BERTUMPUK DENGAN UKURAN SAMA */
        .avatar-group {
            position: relative;
            margin-bottom: 1.5rem;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 40px; 
        }

        .business-logo-stacked {
            position: absolute;
            top: 15px;
            right: -40px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid rgba(255, 255, 255, 0.95);
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
            z-index: 1;
            display: none;
            overflow: hidden;
        }

        .business-logo-stacked img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .avatar-box {
            position: relative;
            z-index: 2;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            background: #ffffff;
            border: 4px solid rgba(255, 255, 255, 0.95);
            padding: 4px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.12);
        }

        .avatar-box img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }

        .profile-name {
            font-size: 1.8rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 0.3rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
        }

        /* GAYA UNTUK IKON VERIFIED */
        .verification-icon {
            width: 18px;
            height: 18px;
            object-fit: contain;
            display: none; /* Akan dimunculkan lewat JS jika akun diverifikasi */
        }

        .profile-business {
            font-size: 1.1rem;
            font-weight: 600;
            color: var(--primary-dark);
            margin-bottom: 0.8rem;
        }

        .badge-category {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 1rem;
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: 99px;
            font-size: 0.85rem;
            font-weight: 700;
            color: var(--text-muted);
            box-shadow: var(--shadow-sm);
        }

        .profile-body {
            padding: 2.5rem;
            background: #ffffff;
            position: relative;
            z-index: 3;
        }

        .info-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .info-item {
            background: #f8fafc;
            border: 1px solid var(--border-subtle);
            padding: 1.25rem;
            border-radius: var(--radius-lg);
            display: flex;
            align-items: flex-start;
            gap: 1rem;
        }

        .info-icon {
            width: 40px;
            height: 40px;
            min-width: 40px;
            background: #ffffff;
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.1rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .info-content h4 {
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-muted);
            margin-bottom: 0.3rem;
        }

        .info-content p {
            font-size: 0.95rem;
            font-weight: 600;
            color: var(--text-main);
            word-break: break-word;
        }

        .action-area {
            margin-top: 2.5rem;
            text-align: center;
        }

        .btn-contact {
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.85rem 2rem;
            background: linear-gradient(135deg, #25d366 0%, #128c7e 100%);
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 99px;
            box-shadow: 0 6px 15px rgba(37, 211, 102, 0.25);
        }

        .btn-contact:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.35);
        }

        #loading-state, #error-state {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-muted);
        }

        #error-state { display: none; color: #ef4444; }

        @media (max-width: 640px) {
            .profile-header { padding: 2.5rem 1.5rem 1.5rem 1.5rem; }
            .profile-body { padding: 1.5rem; }
            .info-grid { grid-template-columns: 1fr; gap: 1rem; }
            .business-logo-stacked { right: -30px; top: 10px; }
            .avatar-group { margin-right: 30px; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <div class="container nav-container">
            <a href="https://sitenexs.com" class="brand">
                <img src="https://sitenexs.com/assets/logo/logo.png" alt="Sitenexs" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Sitenexs&background=2563eb&color=fff';">
                Sitenexs
            </a>
            <a href="https://sitenexs.com/#mitra" class="btn-back">
                <i class="fas fa-arrow-left"></i> Kembali
            </a>
        </div>
    </header>

    <main class="profile-wrapper container">
        
        <!-- Loading State -->
        <div id="loading-state">
            <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary); margin-bottom: 1rem;"></i>
            <h3>Memuat Profil Mitra...</h3>
        </div>

        <!-- Error State -->
        <div id="error-state">
            <i class="fas fa-exclamation-triangle fa-2x" style="margin-bottom: 1rem;"></i>
            <h3 id="error-message">Mitra tidak ditemukan.</h3>
            <a href="https://sitenexs.com/#mitra" class="btn-back" style="margin-top: 1rem; border-color: transparent;">Kembali ke Komunitas</a>
        </div>

        <!-- Profile Card -->
        <div id="profile-card" class="profile-card" style="display: none;">
            <div class="profile-header">
                
                <div class="avatar-group">
                    <div id="p-bg-logo" class="business-logo-stacked">
                        <img id="p-b-logo-img" src="" alt="Logo Bisnis">
                    </div>
                    <div class="avatar-box">
                        <img id="p-avatar" src="" alt="Avatar Utama">
                    </div>
                </div>

                <h1 class="profile-name">
                    <span id="p-name">-</span>
                    <!-- Ikon Verified Sitenexs -->
                    <img id="p-verified" src="https://sitenexs.com/assets/logo/verified.png" alt="Verified" class="verification-icon">
                </h1>
                
                <div id="p-business" class="profile-business">-</div>
                <div class="badge-category">
                    <i id="p-icon" class="fas fa-store"></i> <span id="p-field">UMKM</span>
                </div>
            </div>

            <div class="profile-body">
                <div class="info-grid">
                    <div class="info-item">
                        <div class="info-icon"><i class="fas fa-map-marker-alt"></i></div>
                        <div class="info-content">
                            <h4>Lokasi / Alamat</h4>
                            <p id="p-address">Belum dicantumkan</p>
                        </div>
                    </div>
                    <div class="info-item">
                        <div class="info-icon"><i class="fas fa-envelope"></i></div>
                        <div class="info-content">
                            <h4>Email Bisnis</h4>
                            <p id="p-email">Belum dicantumkan</p>
                        </div>
                    </div>
                    <div class="info-item" style="grid-column: 1 / -1;">
                        <div class="info-icon"><i class="fas fa-calendar-check"></i></div>
                        <div class="info-content">
                            <h4>Bergabung Sejak</h4>
                            <p id="p-date">-</p>
                        </div>
                    </div>
                </div>

                <div class="action-area" id="contact-area">
                    <a id="btn-whatsapp" href="#" target="_blank" rel="noopener noreferrer" class="btn-contact">
                        <i class="fab fa-whatsapp"></i> Hubungi via WhatsApp
                    </a>
                    <p style="font-size: 0.8rem; color: var(--text-muted); margin-top: 0.8rem;">
                        Tautan ini mengarahkan langsung ke nomor kontak yang bersangkutan.
                    </p>
                </div>
            </div>
        </div>

    </main>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import { getFirestore, doc, getDoc } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

        // Konfigurasi Database
        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761',
            measurementId: 'G-C7YL0Q7YRQ'
        };

        const supabaseUrl = 'https://xqcbyamxiekdxytntlno.supabase.co';
        const avatarBucket = 'profile-photos';
        
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // Ambil parameter UID
        const urlParams = new URLSearchParams(window.location.search);
        const uid = urlParams.get('uid');

        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');
        const profileCard = document.getElementById('profile-card');

        async function loadProfile() {
            if (!uid) {
                showError("UID pengguna tidak valid atau tidak ditemukan.");
                return;
            }

            try {
                const docRef = doc(db, "users", uid);
                const docSnap = await getDoc(docRef);

                if (!docSnap.exists()) {
                    showError("Profil mitra tidak ditemukan di database.");
                    return;
                }

                const data = docSnap.data();
                
                let name = data.namaLengkap || data.namaDepan + (data.namaBelakang ? ' ' + data.namaBelakang : '');
                if (!name || name.trim() === '') name = 'Mitra Sitenexs';

                const business = data.bisnis || {};
                const bName = business.nama || 'Bisnis Sitenexs';
                const bField = business.bidang || 'UMKM';
                const bPhone = business.telepon || data.noTelepon || '';
                const bEmail = business.email || data.email || 'Belum dicantumkan';
                const bAddress = data.alamat || 'Belum dicantumkan';
                
                // Variabel untuk Logo Bisnis & Status Verifikasi
                const bLogo = business.logoUrl || null;
                const isVerified = data.isVerified || false;

                let joinedDate = 'Baru-baru ini';
                if (data.createdAt) {
                    const d = new Date(data.createdAt);
                    joinedDate = d.toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
                }

                let icon = 'fa-store';
                const fieldLower = bField.toLowerCase();
                if (fieldLower.includes('cafe') || fieldLower.includes('resto')) icon = 'fa-coffee';
                else if (fieldLower.includes('sekolah') || fieldLower.includes('instansi')) icon = 'fa-school';
                else if (fieldLower.includes('bengkel')) icon = 'fa-wrench';
                else if (fieldLower.includes('perusahaan')) icon = 'fa-building';

                const photoUrl = `${supabaseUrl}/storage/v1/object/public/${avatarBucket}/${encodeURIComponent(uid)}/profile-photo`;
                const fallbackUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(name)}&background=2563eb&color=fff&size=200`;
                
                const imgEl = document.getElementById('p-avatar');
                imgEl.src = photoUrl;
                imgEl.onerror = () => { imgEl.src = fallbackUrl; };

                // Menampilkan Logo Bisnis jika ada
                if (bLogo) {
                    const bgLogoBox = document.getElementById('p-bg-logo');
                    const bgLogoImg = document.getElementById('p-b-logo-img');
                    bgLogoImg.src = bLogo;
                    bgLogoBox.style.display = 'block';
                }

                // Menampilkan Logo Verifikasi (Centang Biru) jika akun di-verifikasi
                if (isVerified) {
                    document.getElementById('p-verified').style.display = 'inline-block';
                }

                document.title = `Profil: ${name} - Sitenexs`;
                document.getElementById('p-name').textContent = name;
                document.getElementById('p-business').textContent = bName;
                document.getElementById('p-field').textContent = bField;
                document.getElementById('p-icon').className = `fas ${icon}`;
                document.getElementById('p-address').textContent = bAddress;
                document.getElementById('p-email').textContent = bEmail;
                document.getElementById('p-date').textContent = joinedDate;

                if (bPhone && bPhone.trim() !== '') {
                    let cleanPhone = bPhone.replace(/\D/g, '');
                    if (cleanPhone.startsWith('0')) cleanPhone = '62' + cleanPhone.substring(1);
                    else if (cleanPhone.startsWith('8')) cleanPhone = '62' + cleanPhone;
                    
                    const waText = encodeURIComponent(`Halo, saya melihat profil bisnis ${bName} di komunitas Sitenexs.`);
                    document.getElementById('btn-whatsapp').href = `https://wa.me/${cleanPhone}?text=${waText}`;
                } else {
                    document.getElementById('contact-area').style.display = 'none';
                }

                loadingState.style.display = 'none';
                profileCard.style.display = 'flex';

            } catch (error) {
                console.error("Error fetching profile:", error);
                showError("Terjadi kesalahan saat memuat profil. Periksa koneksi Anda.");
            }
        }

        function showError(msg) {
            loadingState.style.display = 'none';
            document.getElementById('error-message').textContent = msg;
            errorState.style.display = 'block';
        }

        loadProfile();
    </script>
</body>
</html>
