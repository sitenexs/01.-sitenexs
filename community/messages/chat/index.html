    }, 'message-bubble-verif');
}

function renderCachedMessagesImmediately(chatId, uid) {
    const messagesContainer = document.getElementById('chatMessages');
    const typingBubbleWrapper = document.getElementById('typingBubbleWrapper');
    if (!messagesContainer || !chatId || !uid) return;
    try {
        const raw = localStorage.getItem(getChatCacheKey(chatId));
        if (!raw) return;
        const cachedList = JSON.parse(raw);
        if (!Array.isArray(cachedList) || cachedList.length === 0) return;

        cachedList.sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
        const greenIds = loadPersistedGreenReadIds(chatId);
        const hiddenIds = loadHiddenMessageIds(chatId, uid);

        const fragment = document.createDocumentFragment();
        let hasNew = false;

        cachedList.forEach(item => {
            if (!item?.id || hiddenIds.has(item.id)) return;
            if (messagesContainer.querySelector(`[data-msg-id="${CSS.escape(item.id)}"]`)) return;
            const fakeTimestamp = item.createdAtMs
                ? { toDate: () => new Date(item.createdAtMs) }
                : null;
            const isGreenPersisted = greenIds.has(item.id);
            const msgObj = {
                senderUid: item.senderUid,
                senderName: item.senderName,
                senderIsVerified: item.senderIsVerified,
                senderIsPro: item.senderIsPro,
                text: item.text,
                imageUrl: item.imageUrl || null,
                mediaUrl: item.mediaUrl || item.imageUrl || null,
                mediaType: item.mediaType || (item.imageUrl ? 'image' : null),
                fileName: item.fileName || null,
                fileSize: item.fileSize || 0,
                mimeType: item.mimeType || null,
                replyTo: item.replyTo || null,
                isEdited: Boolean(item.isEdited),
                status: isGreenPersisted ? 'read-green' : (item.status || 'sent'),
                checkColor: isGreenPersisted ? 'green' : (item.checkColor || null),
                delivered: isGreenPersisted ? true : Boolean(item.delivered),
                read: isGreenPersisted ? true : Boolean(item.read),
                createdAt: fakeTimestamp
            };
            messagesStore.set(item.id, msgObj);
            const el = buildMessageElement(item.id, msgObj, uid);
            fragment.appendChild(el);
            hasNew = true;
        });

        if (hasNew) {
            if (typingBubbleWrapper) {
                messagesContainer.insertBefore(fragment, typingBubbleWrapper);
            } else {
                messagesContainer.appendChild(fragment);
            }
            scrollMessagesToBottom(true);
        }
    } catch (e) {}
}

function updateNotificationUIState() {
    const banner = document.getElementById('notifPermissionBanner');
    const bellBtn = document.getElementById('notifBellBtn');
    if (!('Notification' in window)) {
        if (banner) banner.classList.remove('active');
        if (bellBtn) bellBtn.style.display = 'none';
        return;
    }

    if (Notification.permission === 'granted') {
        if (banner) banner.classList.remove('active');
        if (bellBtn) {
            bellBtn.innerHTML = '<i class="fas fa-bell" style="color: var(--accent);"></i>';
            bellBtn.title = 'Notifikasi HP Aktif';
        }
    } else if (Notification.permission === 'denied') {

        if (bellBtn) {
            bellBtn.innerHTML = '<i class="fas fa-bell-slash" style="color: var(--danger);"></i>';
            bellBtn.title = 'Notifikasi Diblokir Browser';
        }
    } else {
        if (banner) banner.classList.add('active');
        if (bellBtn) {
            bellBtn.innerHTML = '<i class="fas fa-bell" style="color: var(--primary);"></i>';
            bellBtn.title = 'Aktifkan Notifikasi HP';
        }
    }
}

        db,

    });
}

window.requestPushNotificationPermission = async function () {
    if (!('Notification' in window)) {
        showToast('Browser Anda tidak mendukung notifikasi sistem.');
        return;
    }

    if (Notification.permission === 'denied') {
        showToast('Notifikasi diblokir. Aktifkan izin notifikasi di pengaturan situs browser HP Anda.');
        return;
    }

    if (Notification.permission === 'granted') {
        await registerPushServiceWorker();
        await refreshFcmToken();
        updateNotificationUIState();
        showToast('Notifikasi HP sudah aktif.');
        return;
    }

    try {
        const permission = await Notification.requestPermission();
        updateNotificationUIState();

        if (permission === 'granted') {
            await registerPushServiceWorker();
            await refreshFcmToken();
            showToast('Notifikasi HP berhasil diaktifkan.');
            triggerLocalSystemNotification(
                'Notifikasi Sitenexs Aktif',
                'Anda akan menerima pemberitahuan saat ada pesan atau panggilan masuk.',
                { tag: 'sitenexs-welcome' }
            );
        } else {
            showToast('Izin notifikasi tidak diaktifkan.');
        }
    } catch (error) {
        console.error('Error meminta izin notifikasi:', error);
    }
};

function playTypingSound() {
    const now = Date.now();
    if (now - lastTypingSoundAt < 90) return;
    lastTypingSoundAt = now;

    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        const ctx = new AudioContextClass();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(190, ctx.currentTime + 0.045);

        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.045);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.045);
        osc.onended = () => ctx.close().catch(() => {});
    } catch (e) {}
}

function playSentMessageSound() {
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        const ctx = new AudioContextClass();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.07);

        gain.gain.setValueAtTime(0.11, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.18);
        osc.onended = () => ctx.close().catch(() => {});
    } catch (e) {}
}

function playMessageNotificationSound() {

function escapeHtml(text) {
    return String(text ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    }[char]));
}

function safeUrl(url) {
    try {
        const parsed = new URL(String(url));
        if (parsed.protocol === 'https:' || parsed.protocol === 'http:') {
            return parsed.href;
        }
    } catch (e) {}
    return '';
}

function formatMessageTime(timestamp) {
    if (!timestamp?.toDate) return 'Baru saja';
    return timestamp.toDate().toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
    });
}

function formatDuration(seconds) {
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function renderMessageBody(messageOrText, legacyImageUrl = '') {
    const isObj = typeof messageOrText === 'object' && messageOrText !== null;
    const text = isObj ? (messageOrText.text || '') : String(messageOrText || '');
    const rawMediaUrl = isObj ? (messageOrText.mediaUrl || messageOrText.imageUrl || '') : legacyImageUrl;
    const validMediaUrl = safeUrl(rawMediaUrl);

    if (validMediaUrl) {
        const mType = isObj
            ? (messageOrText.mediaType || (messageOrText.imageUrl ? 'image' : 'file'))
            : 'image';
        const fileName = isObj ? (messageOrText.fileName || 'Lampiran') : 'Foto';
        const fileSize = isObj ? Number(messageOrText.fileSize || 0) : 0;
        const mimeType = isObj ? (messageOrText.mimeType || '') : '';
        const cleanCaption = String(text || '').trim();
        const captionHtml = cleanCaption
            ? `<div class="chat-media-caption">${escapeHtml(cleanCaption).replace(/\n/g, '<br>')}</div>`
            : '';

        if (mType === 'image') {
            return `
                <div class="chat-photo-box" onclick="openPhotoLightbox('${escapeHtml(validMediaUrl)}')">
                    <img src="${escapeHtml(validMediaUrl)}" alt="${escapeHtml(fileName)}" loading="lazy">
                </div>
                ${captionHtml}
            `;
        }

        if (mType === 'video') {
            return `
                <div class="chat-video-box">
                    <video src="${escapeHtml(validMediaUrl)}" controls preload="metadata" playsinline></video>
                </div>
                ${captionHtml}
            `;
        }

        if (mType === 'audio' || mType === 'voice') {
            const audioIcon = mType === 'voice' ? 'fas fa-microphone' : 'fas fa-music';
            const audioTitle = mType === 'voice' ? 'Pesan Suara' : fileName;
            return `
                <div class="chat-audio-card">
                    <div class="chat-audio-header">
                        <i class="${audioIcon}"></i>
                        <span class="chat-audio-title">${escapeHtml(audioTitle)}</span>
                    </div>
                    <audio src="${escapeHtml(validMediaUrl)}" controls preload="metadata"></audio>
                </div>
                ${captionHtml}
            `;
        }

        const docIcon = getDocumentIconClass(fileName, mimeType);
        const sizeLabel = fileSize > 0 ? formatFileSize(fileSize) : 'Unduh File';
        return `
            <a href="${escapeHtml(validMediaUrl)}" target="_blank" rel="noopener noreferrer" download="${escapeHtml(fileName)}" class="chat-doc-card">
                <div class="chat-doc-icon"><i class="${docIcon}"></i></div>
                <div class="chat-doc-info">
                    <div class="chat-doc-name">${escapeHtml(fileName)}</div>
                    <div class="chat-doc-meta">${escapeHtml(sizeLabel)}</div>
                </div>
                <span class="chat-doc-dl" title="Unduh"><i class="fas fa-download"></i></span>
            </a>
            ${captionHtml}
        `;
    }

    if (!text) return '';

    if (text.startsWith('[CALL_LOG]|')) {
        const [, callType = 'video', status = 'ended', durationStr = '0'] = text.split('|');
        const durationSec = parseInt(durationStr, 10) || 0;
        const isAudio = callType === 'audio';
        const iconClass = isAudio ? 'fas fa-phone' : 'fas fa-video';
        const title = isAudio ? 'Panggilan Suara' : 'Panggilan Video';

        let statusText = 'Memanggil...';
        let isMissed = false;

        if (status === 'ringing') {
            statusText = 'Memanggil...';
        } else if (status === 'connected') {
            statusText = 'Sedang berlangsung...';
        } else if (status === 'ended') {
            statusText = `Selesai • ${formatDuration(durationSec)}`;
        } else if (status === 'missed') {
            statusText = 'Tidak dijawab';
            isMissed = true;
        } else if (status === 'rejected') {
            statusText = 'Panggilan ditolak';
            isMissed = true;
        }

        return `
            <div class="call-log-card">
                <div class="call-log-icon ${isMissed ? 'missed' : ''}">
                    <i class="${iconClass}"></i>
                </div>
                <div class="call-log-info">
                    <div class="call-log-title">${title}</div>
                    <div class="call-log-sub">${escapeHtml(statusText)}</div>
                </div>
            </div>
        `;
    }

    if (text.includes('📋 *LAMARAN KERJA BARU*')) {
        const getMatch = regex => text.match(regex)?.[1]?.trim() || '-';

        const position = getMatch(/🔹 \*Posisi:\* (.*)/);
        const name = getMatch(/👤 \*Nama:\* (.*)/);
        const phone = getMatch(/📞 \*WhatsApp:\* (.*)/);
        const email = getMatch(/📧 \*Email:\* (.*)/);
        const city = getMatch(/🏠 \*Domisili:\* (.*)/);

        const photo = getMatch(/🖼️ \*Link Pasfoto \(Bg Merah\):\* (.*)/);
        const cv = getMatch(/📄 \*Link CV:\* (.*)/);
        const diploma = getMatch(/🎓 \*Link Ijazah:\* (.*)/);

        let motivation = '-';
        const motivationMatch = text.match(/💬 \*Motivasi:\*\s*([\s\S]*?)(?:\n|$)/);

        if (motivationMatch) {
            motivation = motivationMatch[1].trim().replace(/^"|"$/g, '');
        } else {
            const parts = text.split('💬 *Motivasi:*');
            if (parts.length > 1) {
                motivation = parts[1].trim().replace(/^"|"$/g, '');
            }
        }

        const photoUrl = safeUrl(photo);
        const cvUrl = safeUrl(cv);
        const diplomaUrl = safeUrl(diploma);

        return `
            <div style="background:rgba(0,0,0,.03);border:1px solid var(--border-subtle);border-radius:10px;padding:12px;font-size:.82rem;text-align:left;">
                <div style="font-weight:800;font-size:.95rem;margin-bottom:8px;color:var(--primary);">
                    <i class="fas fa-briefcase"></i> Lamaran Kerja: ${escapeHtml(position)}
                </div>

                ${photoUrl ? `
                    <div style="margin-bottom:10px;">
                        <div style="font-size:.72rem;font-weight:700;margin-bottom:3px;color:var(--text-muted);">Pasfoto Formal:</div>
                        <div class="chat-image-preview">
                            <a href="${photoUrl}" target="_blank" rel="noopener noreferrer">
                                <img src="${photoUrl}" alt="Pasfoto">
                            </a>
                        </div>
                    </div>
                ` : ''}

                <div style="display:flex;flex-direction:column;gap:3px;margin-bottom:8px;">
                    <div><b>Nama:</b> ${escapeHtml(name)}</div>
                    <div><b>WhatsApp:</b> ${escapeHtml(phone)}</div>
                    <div><b>Email:</b> ${escapeHtml(email)}</div>
                    <div><b>Domisili:</b> ${escapeHtml(city)}</div>
                </div>

                ${motivation !== '-' ? `
                    <div style="background:#fff;border-left:3px solid var(--primary);padding:8px;border-radius:4px;margin-bottom:10px;">
                        <div style="font-weight:700;margin-bottom:2px;color:var(--primary);">Motivasi:</div>
                        <div style="font-style:italic;white-space:pre-wrap;">${escapeHtml(motivation)}</div>
                    </div>
                ` : ''}

                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    ${cvUrl ? `<a href="${cvUrl}" target="_blank" rel="noopener noreferrer" class="btn" style="padding:4px 10px;font-size:.75rem;background:var(--primary);color:#fff;"><i class="fas fa-file-pdf"></i> CV</a>` : ''}
                    ${diplomaUrl ? `<a href="${diplomaUrl}" target="_blank" rel="noopener noreferrer" class="btn" style="padding:4px 10px;font-size:.75rem;background:var(--accent);color:#fff;"><i class="fas fa-certificate"></i> Ijazah</a>` : ''}
                </div>
            </div>
        `;
    }

    return escapeHtml(text).replace(/\n/g, '<br>');
}

function buildSenderHeaderElement(message, ownerUid = currentUid) {
    const header = document.createElement('div');
    header.className = 'message-sender-header';

    const resolvedName = getSenderDisplayName(message, ownerUid);
    const resolvedBadges = getSenderBadgesHtml(message, ownerUid);

    const nameSpan = document.createElement('span');
    nameSpan.className = 'message-sender-name';
    nameSpan.textContent = resolvedName;

    const badgesSpan = document.createElement('span');
    badgesSpan.className = 'message-sender-badges';
    badgesSpan.innerHTML = resolvedBadges;

    header.append(nameSpan, badgesSpan);
    if (!resolvedName && !resolvedBadges) {
        header.style.display = 'none';
    }
    return header;
}

function buildMessageElement(docId, message, ownerUid = currentUid) {
    const isOutgoing = message.senderUid === ownerUid;
    const wrapper = document.createElement('div');
    wrapper.className = `message-wrapper ${isOutgoing ? 'outgoing' : 'incoming'}`;
    wrapper.dataset.msgId = docId;

    const bubble = document.createElement('div');
    bubble.className = `message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}`;
    if (pinnedMessagesList.some(p => p.id === docId)) {
        bubble.classList.add('pinned-msg');
    }

    const senderHeader = buildSenderHeaderElement(message, ownerUid);

    const quotedEl = buildQuotedReplyElement(message.replyTo);
    if (quotedEl) {
        bubble.appendChild(quotedEl);
    }

    const bodyDiv = document.createElement('div');
    bodyDiv.className = 'message-body';
    bodyDiv.innerHTML = renderMessageBody(message);

    const metaRow = document.createElement('div');
    metaRow.className = 'message-meta-row';

    if (message.isEdited) {
        const editedSpan = document.createElement('span');
        editedSpan.className = 'message-edited-tag';
        editedSpan.textContent = 'Diedit •';
        metaRow.appendChild(editedSpan);
    }

    const timeDiv = document.createElement('span');
    timeDiv.className = 'message-time';
    timeDiv.textContent = formatMessageTime(message.createdAt);

    metaRow.appendChild(timeDiv);

    if (isOutgoing) {
        const checkState = getMessageCheckStatus(message, docId);
        if (checkState === 'read-green' && activeChatId) {
            persistGreenReadId(activeChatId, docId);
        }
        const statusSpan = document.createElement('span');
        statusSpan.className = 'msg-status-slot';
        statusSpan.innerHTML = renderCheckmarkHtml(checkState);
        metaRow.appendChild(statusSpan);
    }

    bubble.append(senderHeader, bodyDiv, metaRow);
    wrapper.appendChild(bubble);
    attachSwipeToReply(wrapper, bubble, docId, message, ownerUid);
    attachLongPressToMessage(wrapper, bubble, docId, message);
    return wrapper;
}

function updateMessageElement(wrapper, docId, message, ownerUid = currentUid) {
    const isOutgoing = message.senderUid === ownerUid;
    wrapper.className = `message-wrapper ${isOutgoing ? 'outgoing' : 'incoming'}`;

    const bubble = wrapper.querySelector('.message-bubble');
    if (bubble) {
        bubble.className = `message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}`;
        if (pinnedMessagesList.some(p => p.id === docId)) {
            bubble.classList.add('pinned-msg');
        }

        const resolvedName = getSenderDisplayName(message, ownerUid);
        const resolvedBadges = getSenderBadgesHtml(message, ownerUid);

        let senderHeader = bubble.querySelector('.message-sender-header');
        if (!senderHeader) {
            senderHeader = buildSenderHeaderElement(message, ownerUid);
            bubble.prepend(senderHeader);
        } else {
            const nameSpan = senderHeader.querySelector('.message-sender-name');
            if (nameSpan && resolvedName) {
                nameSpan.textContent = resolvedName;
            }
            const badgesSpan = senderHeader.querySelector('.message-sender-badges');
            if (badgesSpan && resolvedBadges) {
                badgesSpan.innerHTML = resolvedBadges;
            }
            senderHeader.style.display = (!nameSpan?.textContent && !resolvedBadges) ? 'none' : 'inline-flex';
        }

        const existingQuote = bubble.querySelector('.quoted-reply-box');
        if (message.replyTo && (message.replyTo.senderName || message.replyTo.text)) {
            const nextQuote = buildQuotedReplyElement(message.replyTo);
            if (existingQuote && nextQuote) {
                existingQuote.replaceWith(nextQuote);
            } else if (nextQuote) {
                senderHeader.insertAdjacentElement('afterend', nextQuote);
            }
        } else if (existingQuote) {
            existingQuote.remove();
        }
    }

    const bodyDiv = wrapper.querySelector('.message-body');
    const nextBodyHtml = renderMessageBody(message);
    if (bodyDiv && bodyDiv.innerHTML !== nextBodyHtml) {
        bodyDiv.innerHTML = nextBodyHtml;
    }

    const timeDiv = wrapper.querySelector('.message-time');
    if (timeDiv && message.createdAt) {
        timeDiv.textContent = formatMessageTime(message.createdAt);
    }

    const metaRow = wrapper.querySelector('.message-meta-row');
    if (metaRow) {
        let editedSpan = metaRow.querySelector('.message-edited-tag');
        if (message.isEdited) {
            if (!editedSpan) {
                editedSpan = document.createElement('span');
                editedSpan.className = 'message-edited-tag';
                editedSpan.textContent = 'Diedit •';
                metaRow.prepend(editedSpan);
            }
        } else if (editedSpan) {
            editedSpan.remove();
        }

        let statusSlot = metaRow.querySelector('.msg-status-slot');
        if (isOutgoing) {
            const checkState = getMessageCheckStatus(message, docId);
            if (checkState === 'read-green' && activeChatId) {
                persistGreenReadId(activeChatId, docId);
            }
            if (!statusSlot) {
                statusSlot = document.createElement('span');
                statusSlot.className = 'msg-status-slot';
                metaRow.appendChild(statusSlot);
            }
            const nextCheckHtml = renderCheckmarkHtml(checkState);
            if (statusSlot.innerHTML !== nextCheckHtml) {
                statusSlot.innerHTML = nextCheckHtml;
            }
        } else if (statusSlot) {
            statusSlot.remove();
        }
    }
}

function refreshVisibleSenderInfo() {
    const messagesContainer = document.getElementById('chatMessages');
    if (!messagesContainer) return;
    messagesContainer.querySelectorAll('.message-wrapper').forEach(wrapper => {
        const isOutgoing = wrapper.classList.contains('outgoing');
        const senderHeader = wrapper.querySelector('.message-sender-header');
        const nameSpan = wrapper.querySelector('.message-sender-name');
        const badgesSpan = wrapper.querySelector('.message-sender-badges');

        const nextName = isOutgoing
            ? (!isPlaceholderName(myUserName) ? myUserName : (!isPlaceholderName(auth.currentUser?.displayName) ? auth.currentUser.displayName.trim() : ''))
            : (!isPlaceholderName(otherUserName) ? otherUserName : '');
        const nextBadges = isOutgoing ? myBadgesHtml : otherBadgesHtml;

        if (nameSpan && nextName && nameSpan.textContent !== nextName) {
            nameSpan.textContent = nextName;
        }
        if (badgesSpan && nextBadges && badgesSpan.innerHTML !== nextBadges) {
            badgesSpan.innerHTML = nextBadges;
        }
        if (senderHeader) {
            senderHeader.style.display = (!nameSpan?.textContent && !nextBadges) ? 'none' : 'inline-flex';
        }
    });
}

function handleMessageDocChange(change, ctx) {
    const { chatId, uid, messagesContainer, typingBubbleWrapper } = ctx;
    const msgId = change.doc.id;
    const msgData = change.doc.data();
    const hiddenIds = loadHiddenMessageIds(chatId, uid);

    messagesStore.set(msgId, msgData);
    syncMessageDocToCache(chatId, msgId, msgData);

    if (hiddenIds.has(msgId)) {
        const existingHiddenEl = messagesContainer.querySelector(`[data-msg-id="${CSS.escape(msgId)}"]`);
        if (existingHiddenEl) existingHiddenEl.remove();
        return false;
    }

    if (change.type === 'added') {
        const existingEl = messagesContainer.querySelector(`[data-msg-id="${CSS.escape(msgId)}"]`);
        if (existingEl) {
            updateMessageElement(existingEl, msgId, msgData, uid);
            if (typingBubbleWrapper && existingEl.nextElementSibling !== typingBubbleWrapper) {
                messagesContainer.insertBefore(existingEl, typingBubbleWrapper);
            }
        } else {
            const newEl = buildMessageElement(msgId, msgData, uid);
            if (typingBubbleWrapper) {
                messagesContainer.insertBefore(newEl, typingBubbleWrapper);
            } else {
                messagesContainer.appendChild(newEl);
            }
        }

        if (msgData.senderUid === uid) {
            if (
                !updatedDocIds.has(msgId) &&
                isPlaceholderName(msgData.senderName) &&
                !isPlaceholderName(myUserName) &&
                change.doc.ref
            ) {
                updatedDocIds.add(msgId);
                updateDoc(change.doc.ref, {
                    senderName: myUserName,
                    senderIsVerified: Boolean(myProfile?.isVerified),
                    senderIsPro: hasYellowBadge(myProfile)
                }).catch(() => {});
            }
            const checkState = getMessageCheckStatus(msgData, msgId);
            if (checkState === 'read-green') {
                persistGreenReadId(chatId, msgId);
            }
        } else {
            const isPageVisible = document.visibilityState === 'visible';
            const updates = {};
            const resolvedColor = msgData.checkColor || (msgData.status === 'read-yellow' ? 'yellow' : msgData.status === 'read-blue' ? 'blue' : 'green');

            if (msgData.delivered !== true) {
                updates.delivered = true;
                if (msgData.status !== 'read' && msgData.read !== true) {
                    updates.status = 'delivered';
                }
            }
            if (isPageVisible && msgData.read !== true) {
                updates.read = true;
                updates.status = resolvedColor === 'yellow' ? 'read-yellow' : (resolvedColor === 'blue' ? 'read-blue' : 'read-green');
                updates.checkColor = resolvedColor;
            }

            if (!updatedDocIds.has(msgId) && Object.keys(updates).length > 0 && change.doc.ref) {
                updatedDocIds.add(msgId);
                updateDoc(change.doc.ref, updates).catch(() => {});
            }

            if (
                lastNotifiedMessageId !== msgId &&
                !String(msgData.text || '').startsWith('[CALL_LOG]|')
            ) {
                lastNotifiedMessageId = msgId;

                if (isPageVisible) {
                    syncUnreadReset(chatId, uid);
                    playMessageNotificationSound();
                } else {
                    const attachmentUrl = msgData.mediaUrl || msgData.imageUrl || '';
                    const previewText = attachmentUrl
                        ? getReplyExcerpt(msgData.text || '', msgData)
                        : (String(msgData.text || '').includes('📋 *LAMARAN KERJA BARU*')
                            ? 'Mengirim lamaran kerja baru'
                            : String(msgData.text || 'Pesan baru'));

                    const notifTitle = !isPlaceholderName(otherUserName)
                        ? otherUserName
                        : (!isPlaceholderName(msgData.senderName) ? String(msgData.senderName).trim() : 'Pesan Baru');

                    triggerLocalSystemNotification(
                        notifTitle,
                        previewText,
                        {
                            tag: `chat-${chatId}`,
                            icon: otherProfile?.avatarUrl || getUserAvatarUrl(activeChatUserId),
                            url: window.location.href
                        }
                    );
                }
            }
        }
        return true;
    }

    if (change.type === 'modified') {
        const existingEl = messagesContainer.querySelector(`[data-msg-id="${CSS.escape(msgId)}"]`);
        if (existingEl) {
            updateMessageElement(existingEl, msgId, msgData, uid);
        }
        if (pinnedMessagesList.some(p => p.id === msgId)) {
            addOrUpdatePinnedMessage({
                id: msgId,
                senderUid: msgData.senderUid,
                senderName: getSenderDisplayName(msgData, uid),
                text: getReplyExcerpt(msgData.text || '', msgData)
            }, false);
        }
        if (msgData.senderUid === uid) {
            const checkState = getMessageCheckStatus(msgData, msgId);
            if (checkState === 'read-green') {
                persistGreenReadId(chatId, msgId);
            }
        }
        return false;
    } else if (change.type === 'removed') {
        messagesStore.delete(msgId);
        removeMessageFromLocalCacheAndGreenRead(chatId, msgId);
        const existingEl = messagesContainer.querySelector(`[data-msg-id="${CSS.escape(msgId)}"]`);
        if (existingEl) existingEl.remove();
        if (pinnedMessagesList.some(p => p.id === msgId)) {
            removePinnedMessageById(msgId, false);
        }
    }

    return false;
}

function attachChatSyncListeners(chatId, uid, peerUid) {
    if (unsubscribeChatMeta) unsubscribeChatMeta();
    unsubscribeChatMeta = onSnapshot(doc(db, 'chats', chatId), (chatSnap) => {
        if (!chatSnap.exists()) return;
        const cData = chatSnap.data();
        const isOtherTyping = Boolean(cData[`typing_${peerUid}`]);
        renderOtherTypingIndicator(isOtherTyping);

        if ('pinnedMessages' in cData || 'pinnedMessage' in cData) {
            const remotePins = normalizePinnedArray(cData.pinnedMessages, cData.pinnedMessage);
            setPinnedMessagesList(remotePins, false);
        }

        if (cData[`unread_${uid}`] === true && document.visibilityState === 'visible') {
            syncUnreadReset(chatId, uid);
        }
    });

    const messagesRef = collection(db, 'chats', chatId, 'messages');
    const qMsgs = query(messagesRef, orderBy('createdAt', 'asc'));
    const messagesContainer = document.getElementById('chatMessages');
    const typingBubbleWrapper = document.getElementById('typingBubbleWrapper');

    if (unsubscribeMessages) unsubscribeMessages();
    unsubscribeMessages = onSnapshot(qMsgs, (snapshot) => {
        let shouldScroll = stickToBottom;

        snapshot.docChanges().forEach((change) => {
            const added = handleMessageDocChange(change, {
                chatId,
                uid,
                messagesContainer,
                typingBubbleWrapper
            });
            if (added) shouldScroll = true;
        });

        if (typingBubbleWrapper && messagesContainer && messagesContainer.lastElementChild !== typingBubbleWrapper) {
            messagesContainer.appendChild(typingBubbleWrapper);
        }

        if (shouldScroll) {
            scrollMessagesToBottom(true);
        }
    }, (error) => {
        console.error('Message listener error:', error);
    });
}

function syncProfilesAndPush(user, uid, peerUid) {
    const cachedMe = loadCachedProfile(uid);
    if (cachedMe) {
        if (!isPlaceholderName(cachedMe.name)) myUserName = cachedMe.name;
        if (cachedMe.badgesHtml) myBadgesHtml = cachedMe.badgesHtml;
        refreshVisibleSenderInfo();
    }

    const cachedPeer = loadCachedProfile(peerUid);
    if (cachedPeer) {
        if (!isPlaceholderName(cachedPeer.name)) otherUserName = cachedPeer.name;
        if (cachedPeer.badgesHtml) otherBadgesHtml = cachedPeer.badgesHtml;
        if (cachedPeer.fcmToken) otherUserFcmToken = cachedPeer.fcmToken;
        applyPeerHeaderImmediate(
            otherUserName,
            cachedPeer.headerBadgesHtml || '',
            cachedPeer.avatarUrl || getUserAvatarUrl(peerUid)
        );
        refreshVisibleSenderInfo();
    }

    fetchUserProfile(db, uid, { forceRefresh: true }).then(profile => {
        if (!profile) return;
        myProfile = profile;
        const resolvedName = extractProfileName(profile, user?.displayName);
        if (!isPlaceholderName(resolvedName)) myUserName = resolvedName;
        const resolvedBadges = buildCombinedBadgesHtml(profile, 'message-bubble-verif');
        if (resolvedBadges) myBadgesHtml = resolvedBadges;

        saveCachedProfile(uid, {
            ...(cachedMe || {}),
            name: myUserName || cachedMe?.name || '',
            badgesHtml: myBadgesHtml || cachedMe?.badgesHtml || '',
            avatarUrl: profile?.avatarUrl || cachedMe?.avatarUrl || getUserAvatarUrl(uid)
        });
        refreshVisibleSenderInfo();
    }).catch(() => {});

    fetchUserProfile(db, peerUid, { forceRefresh: true }).then(profile => {
        if (!profile) return;
        otherProfile = profile;
        const resolvedName = extractProfileName(profile);
        if (!isPlaceholderName(resolvedName)) otherUserName = resolvedName;
        const resolvedBadges = buildCombinedBadgesHtml(profile, 'message-bubble-verif');
        if (resolvedBadges) otherBadgesHtml = resolvedBadges;
        const headerBadges = buildCombinedBadgesHtml(profile, 'chat-header-verif');
        const resolvedAvatar = profile?.avatarUrl || getUserAvatarUrl(peerUid);
        if (profile?.fcmToken) otherUserFcmToken = profile.fcmToken;

        applyPeerHeaderImmediate(otherUserName, headerBadges, resolvedAvatar);
        saveCachedProfile(peerUid, {
            ...(cachedPeer || {}),
            name: otherUserName || cachedPeer?.name || '',
            badgesHtml: otherBadgesHtml || cachedPeer?.badgesHtml || '',
            headerBadgesHtml: headerBadges || cachedPeer?.headerBadgesHtml || '',
            avatarUrl: resolvedAvatar,
            fcmToken: otherUserFcmToken
        });
        refreshVisibleSenderInfo();
    }).catch(() => {});

    registerPushServiceWorker().then(() => {
        listenForegroundMessages(app, ({ title, body, tag, icon, url }) => {
            if (document.visibilityState === 'hidden') {
                triggerLocalSystemNotification(title, body, { tag, icon, url });
            }
        });
        if ('Notification' in window && Notification.permission === 'granted') {
            refreshFcmToken();
        }
    }).catch(() => {});
}

   INITIALIZE CHAT (REALTIME SNAPSHOT TERBARU + CACHE)
===================================================== */
async function initChat(user) {
    if (!user?.uid || !activeChatUserId) return;
    const uid = String(user.uid).trim();
    const isSameUser = initializedUid === uid;
    currentUid = uid;

    if (!isPlaceholderName(user.displayName)) {
        myUserName = user.displayName.trim();
    }

    updateNotificationUIState();

    const chatId = resolveActiveChatId(currentUid, activeChatUserId);

    if (!isSameUser) {
        initializedUid = uid;
        loadLocalPinnedMessages(chatId);
        renderCachedMessagesImmediately(chatId, currentUid);

        if (cleanupIncomingRedirect) cleanupIncomingRedirect();
        cleanupIncomingRedirect = attachForcedIncomingCallRedirect({
            rtdb,
            currentUid,
            callPageUrl: DEFAULT_CALL_PAGE_URL,
            fallbackPeerName: otherUserName || 'Mitra Sitenexs'
        });

        if (cleanupOngoingBanner) cleanupOngoingBanner();
        cleanupOngoingBanner = attachOngoingCallBanner({
            rtdb,
            currentUid,
            bannerElement: document.getElementById('activeCallBanner'),
            textElement: document.getElementById('activeCallBannerText'),
            iconElement: document.getElementById('activeCallBannerIcon'),
            filterPeerUid: activeChatUserId,
            filterChatId: chatId,
            fallbackPeerName: otherUserName || 'Mitra Sitenexs',
            callPageUrl: DEFAULT_CALL_PAGE_URL
        });

        attachChatSyncListeners(chatId, currentUid, activeChatUserId);
        syncUnreadReset(chatId, currentUid);
    }

    syncProfilesAndPush(user, currentUid, activeChatUserId);
}

document.addEventListener('visibilitychange', () => {
    const chatId = resolveActiveChatId();
    if (document.visibilityState === 'hidden') {
        setMyTypingState(false);
    } else if (document.visibilityState === 'visible' && chatId && currentUid) {
        syncUnreadReset(chatId, currentUid);
        scrollMessagesToBottom(false);
    }
});

onAuthStateChanged(auth, user => {
    if (user) {
        initChat(user);
    } else {
        const savedUid = localStorage.getItem('sitenexs_uid');
        if (savedUid) {
            initChat({ uid: savedUid });
        } else {
            window.location.replace('https://account.sitenexs.com/sign-in/');
        }
    }
});

async function dispatchNewMessageToFirestore({ senderUid, recipientUid, chatId, text, mediaMeta = null, replyToPayload = null }) {
    stickToBottom = true;
    let senderNameToSave = extractProfileName(
        myProfile,
        myUserName || auth.currentUser?.displayName || loadCachedProfile(senderUid)?.name
    );
    if (!senderNameToSave) {
        const freshProfile = await fetchUserProfile(db, senderUid, { forceRefresh: true }).catch(() => null);
        if (freshProfile) {
            myProfile = freshProfile;
            senderNameToSave = extractProfileName(freshProfile, auth.currentUser?.displayName);
            myUserName = senderNameToSave;
            myBadgesHtml = buildCombinedBadgesHtml(freshProfile, 'message-bubble-verif');
        }
    }
    const senderVerifiedToSave = Boolean(myProfile?.isVerified);
    const senderProToSave = hasYellowBadge(myProfile);

    const msgPayload = {
        senderUid,
        senderName: senderNameToSave,
        senderIsVerified: senderVerifiedToSave,
        senderIsPro: senderProToSave,
        text,
        imageUrl: mediaMeta?.mediaType === 'image' ? mediaMeta.url : null,
        mediaUrl: mediaMeta?.url || null,
        mediaType: mediaMeta?.mediaType || null,
        fileName: mediaMeta?.fileName || null,
        fileSize: mediaMeta?.fileSize || 0,
        mimeType: mediaMeta?.mimeType || null,
        replyTo: replyToPayload,
        createdAt: serverTimestamp(),
        isEdited: false,
        status: 'sent',
        checkColor: null,
        delivered: false,
        read: false
    };

    const summaryText = mediaMeta
        ? getMediaSummaryLabel(mediaMeta.mediaType, mediaMeta.fileName, text)
        : text;

    const summaryPromise = syncChatSummaryOnSend(chatId, senderUid, recipientUid, summaryText).catch(err => {
        console.warn('Sync chat summary warning:', err);
    });

    const addedDocRef = await withTimeout(
        addDoc(collection(db, 'chats', chatId, 'messages'), msgPayload),
        7000,
        'Add message'
    );

    await summaryPromise;

    const nowMs = Date.now();
    const optimisticMsg = {
        ...msgPayload,
        createdAt: { toDate: () => new Date(nowMs) }
    };
    messagesStore.set(addedDocRef.id, optimisticMsg);
    upsertMessageToCache(chatId, {
        id: addedDocRef.id,
        senderUid,
        senderName: senderNameToSave,
        senderIsVerified: senderVerifiedToSave,
        senderIsPro: senderProToSave,
        text,
        imageUrl: msgPayload.imageUrl,
        mediaUrl: msgPayload.mediaUrl,
        mediaType: msgPayload.mediaType,
        fileName: msgPayload.fileName,
        fileSize: msgPayload.fileSize,
        mimeType: msgPayload.mimeType,
        replyTo: replyToPayload,
        isEdited: false,
        status: 'sent',
        checkColor: null,
        delivered: false,
        read: false,
        createdAtMs: nowMs
    });

    const messagesContainer = document.getElementById('chatMessages');
    const typingBubbleWrapper = document.getElementById('typingBubbleWrapper');
    if (messagesContainer && !messagesContainer.querySelector(`[data-msg-id="${CSS.escape(addedDocRef.id)}"]`)) {
        const newEl = buildMessageElement(addedDocRef.id, optimisticMsg, senderUid);
        if (typingBubbleWrapper) {
            messagesContainer.insertBefore(newEl, typingBubbleWrapper);
        } else {
            messagesContainer.appendChild(newEl);
        }
    }

    scrollMessagesToBottom(true);
    playSentMessageSound();

    sendPushNotification({
        db,
        recipientUid,
        cachedToken: otherUserFcmToken,
        title: senderNameToSave || 'Pesan Baru',
        body: summaryText,
        tag: `chat-${chatId}`,
        url: `https://sitenexs.com/community/messages/chat/?to=${encodeURIComponent(senderUid)}`,
        icon: myProfile?.avatarUrl || getUserAvatarUrl(senderUid),
        workerUrl: PUSH_WORKER_URL
    }).then(pushRes => {
        if (pushRes?.token) otherUserFcmToken = pushRes.token;
    }).catch(() => {});
}

window.handleChatFormSubmit = async function (event) {
    event.preventDefault();
    if (isSendingMessage) return;

    closeAttachMenu();

    const inputEl = document.getElementById('messageInput');
    const sendBtnEl = document.getElementById('chatSendBtn');
    const text = inputEl ? inputEl.value.trim() : '';
    const mediaToUpload = selectedMedia ? { ...selectedMedia } : null;
    const senderUid = currentUid || auth.currentUser?.uid || getEarlyUid();
    const recipientUid = activeChatUserId;
    const chatId = resolveActiveChatId(senderUid, recipientUid);

    if (!text && !mediaToUpload) return;
    if (!chatId || !senderUid || !recipientUid) {
        showToast('Sesi chat belum siap, coba lagi.');
        return;
    }

    currentUid = senderUid;
    isSendingMessage = true;
    if (sendBtnEl) {
        sendBtnEl.disabled = true;
        sendBtnEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    }

    const targetEditId = editingMessageId;
    const prevEditOriginal = editingOriginalText;
    const replyToPayload = activeReplyData ? { ...activeReplyData } : null;

    editingMessageId = null;
    editingOriginalText = '';
    window.clearActiveReply();

    if (inputEl) inputEl.value = '';
    if (typingStopTimer) {
        clearTimeout(typingStopTimer);
        typingStopTimer = null;
    }
    setMyTypingState(false);

    try {
        if (targetEditId) {
            await withTimeout(
                updateDoc(doc(db, 'chats', chatId, 'messages', targetEditId), {
                    text,
                    isEdited: true
                }),
                7000,
                'Update message'
            );

            const cachedMsg = messagesStore.get(targetEditId);
            if (cachedMsg) {
                const updatedMsg = { ...cachedMsg, text, isEdited: true };
                messagesStore.set(targetEditId, updatedMsg);
                syncMessageDocToCache(chatId, targetEditId, updatedMsg);
                const el = document.getElementById('chatMessages')?.querySelector(`[data-msg-id="${CSS.escape(targetEditId)}"]`);
                if (el) updateMessageElement(el, targetEditId, updatedMsg, senderUid);
            }

            const existingPin = pinnedMessagesList.find(p => p.id === targetEditId);
            if (existingPin) {
                addOrUpdatePinnedMessage({
                    ...existingPin,
                    text: getReplyExcerpt(text, cachedMsg)
                }, true);
            }
            showToast('Pesan diperbarui.');
            return;
        }

        let uploadedMediaMeta = null;
        if (mediaToUpload?.file) {
            const previewSubEl = document.getElementById('mediaPreviewSub');
            if (previewSubEl) previewSubEl.textContent = 'Mengunggah ke Supabase...';
            uploadedMediaMeta = await uploadMediaToSupabase(
                mediaToUpload.file,
                mediaToUpload.mediaType,
                chatId,
                senderUid,
                recipientUid
            );
            window.clearSelectedMedia();
        }

        await dispatchNewMessageToFirestore({
            senderUid,
            recipientUid,
            chatId,
            text,
            mediaMeta: uploadedMediaMeta,
            replyToPayload
        });

    } catch (error) {
        console.error('Send message error:', error);
        if (targetEditId) {
            editingMessageId = targetEditId;
            editingOriginalText = prevEditOriginal;
            renderReplyPreviewBar();
        } else if (replyToPayload) {
            activeReplyData = replyToPayload;
            renderReplyPreviewBar();
        }
        if (mediaToUpload?.file && !selectedMedia) {
            setSelectedMediaFile(mediaToUpload.file, mediaToUpload.mediaType);
        }
        if (inputEl && !inputEl.value && text) {
            inputEl.value = text;
        }
        const errDetail = error?.message ? `: ${error.message}` : '';
        showToast(mediaToUpload ? `Gagal unggah${errDetail}` : 'Gagal mengirim pesan. Coba lagi.');
    } finally {
        isSendingMessage = false;
        if (sendBtnEl) {
            sendBtnEl.disabled = false;
            sendBtnEl.innerHTML = '<i class="fas fa-paper-plane"></i>';
        }
    }
};
</script>
