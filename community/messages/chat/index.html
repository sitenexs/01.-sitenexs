<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat — Komunitas Sitenexs</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Kirim dan terima pesan langsung dengan sesama mitra UMKM serta Sitenexs AI di ekosistem Sitenexs.">
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --danger: #ef4444;
            --check-blue: #38bdf8;
            --check-yellow: #facc15;
            --check-green: #4ade80;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 8px 10px -6px rgba(15, 23, 42, 0.07);
            --radius-full: 9999px;
            --radius-lg: 1rem;
            --radius-xl: 1.25rem;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; height: 100svh; overflow: hidden; font-size: 15px; 
            user-select: none; -webkit-user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body); color: var(--text-main); line-height: 1.5;
            -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 0.75rem;
        }

        a { text-decoration: none; color: inherit; }
        button, input { font-family: inherit; outline: none; border: none; }

        .container { width: 100%; max-width: 800px; height: 100%; max-height: 100%; display: flex; flex-direction: column; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.55rem 1.1rem; font-size: 0.85rem; font-weight: 700;
            border-radius: var(--radius-full); cursor: pointer; transition: var(--transition);
            border: 1px solid transparent; background: #fff; color: var(--text-main);
        }
        .btn-secondary { border: 1px solid var(--border-medium); background: #fff; box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .btn-icon-only { width: 38px; height: 38px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* BANNER IZIN NOTIFIKASI HP */
        .notif-permission-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.65rem 1.15rem;
            background: #eff6ff;
            border-bottom: 1px solid #bfdbfe;
            font-size: 0.8rem;
            color: #1e3a8a;
            flex: 0 0 auto;
        }
        .notif-permission-banner.active { display: flex; }
        .notif-enable-btn {
            background: var(--primary);
            color: #fff;
            padding: 0.38rem 0.85rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* BANNER DALAM PANGGILAN (DI BAWAH NAVBAR) */
        .active-call-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.6rem 1.15rem;
            background: linear-gradient(90deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 700;
            flex: 0 0 auto;
            z-index: 9;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            transition: var(--transition);
        }
        .active-call-banner:hover {
            filter: brightness(1.04);
        }
        .active-call-banner.active {
            display: flex;
        }
        .active-call-banner-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 0;
        }
        .active-call-pulse {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ffffff;
            flex-shrink: 0;
            animation: callBannerPulse 1.3s infinite ease-in-out;
        }
        @keyframes callBannerPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.45); opacity: 0.55; }
        }
        .active-call-banner-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .active-call-banner-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(255, 255, 255, 0.22);
            padding: 0.28rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.74rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        /* BANNER PESAN TERSEMAT (PINNED MESSAGE) */
        .pinned-message-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 0.65rem;
            padding: 0.52rem 1.15rem;
            background: #ffffff;
            border-bottom: 1px solid var(--border-subtle);
            flex: 0 0 auto;
            z-index: 8;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(15, 23, 42, 0.03);
        }
        .pinned-message-bar.active {
            display: flex;
        }
        .pinned-message-left {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            min-width: 0;
            flex: 1;
            border-left: 3px solid var(--primary);
            padding-left: 0.55rem;
        }
        .pinned-message-icon {
            color: var(--primary);
            font-size: 0.8rem;
            flex-shrink: 0;
        }
        .pinned-message-info {
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .pinned-message-label {
            font-size: 0.7rem;
            font-weight: 800;
            color: var(--primary);
            line-height: 1.2;
        }
        .pinned-message-snippet {
            font-size: 0.78rem;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .pinned-unpin-btn {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            background: transparent;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }
        .pinned-unpin-btn:hover {
            background: var(--bg-body);
            color: var(--danger);
        }

        /* RUANG CHAT UTAMA */
        .chat-wrapper {
            width: 100%; height: 100%; background: #fafbfc; border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-xl); box-shadow: var(--shadow-md); display: flex; flex-direction: column; 
            overflow: hidden; position: relative;
        }
        
        .chat-header {
            padding: 0.75rem 1.25rem; background: #fff; border-bottom: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; z-index: 10;
            box-shadow: var(--shadow-sm);
        }
        .chat-header-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
        .chat-header-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        .chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-medium); flex-shrink: 0; }
        
        .chat-header-info { min-width: 0; display: flex; flex-direction: column; }
        .chat-header-name-row { display: flex; align-items: center; gap: 0.3rem; min-width: 0; }
        .chat-header-name { font-weight: 850; font-size: 0.98rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.45rem; }
        .chat-header-verif { width: 14px; height: 14px; object-fit: contain; flex-shrink: 0; display: inline-block; }

        /* STATUS SEDANG MENGETIK DI BAWAH NAMA */
        .header-typing-status {
            display: none;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.2;
            margin-top: 1px;
        }
        .header-typing-status.active {
            display: block;
        }

        /* ISI CHAT */
        .chat-messages {
            flex: 1 1 auto; min-height: 0; padding: 1.25rem; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 0.75rem; background-color: #f8fafc;
            background-image: radial-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px), radial-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1px);
            background-size: 24px 24px; background-position: 0 0, 12px 12px; -webkit-overflow-scrolling: touch;
            overflow-anchor: none;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 10px; }

        .message-wrapper { position: relative; display: flex; flex-direction: column; width: 100%; flex-shrink: 0; touch-action: pan-y; }
        .message-wrapper.incoming { align-items: flex-start; }
        .message-wrapper.outgoing { align-items: flex-end; }

        /* IKON BALAS MUNCUL SAAT PESAN DIGESER */
        .swipe-reply-icon {
            position: absolute;
            top: 50%;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: #ffffff;
            border: 1px solid var(--border-medium);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.78rem;
            box-shadow: var(--shadow-sm);
            opacity: 0;
            transform: translateY(-50%) scale(0.75);
            pointer-events: none;
            z-index: 1;
            transition: opacity 0.12s ease, transform 0.12s ease, background-color 0.12s ease, color 0.12s ease;
        }
        .message-wrapper.incoming .swipe-reply-icon { left: 6px; }
        .message-wrapper.outgoing .swipe-reply-icon { right: 6px; }
        .swipe-reply-icon.triggered {
            background: var(--primary);
            color: #ffffff;
            border-color: var(--primary);
        }

        .message-bubble {
            max-width: 82%; padding: 0.65rem 0.95rem 0.7rem; border-radius: var(--radius-lg); font-size: 0.88rem;
            line-height: 1.5; word-break: break-word; position: relative; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
            background: #fff; z-index: 2; will-change: transform; transition: transform 0.2s cubic-bezier(0.22, 1, 0.36, 1);
        }
        .message-bubble.swiping { transition: none; }
        .message-bubble.pinned-msg {
            box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.35), 0 4px 12px rgba(15, 23, 42, 0.08);
        }

        /* KUTIPAN REPLY DI DALAM BUBBLE CHAT */
        .quoted-reply-box {
            border-left: 3px solid var(--primary);
            border-radius: 7px;
            padding: 0.38rem 0.6rem;
            margin-bottom: 0.42rem;
            font-size: 0.76rem;
            line-height: 1.35;
            cursor: pointer;
            text-align: left;
        }
        .message-bubble.incoming .quoted-reply-box {
            background: var(--primary-light);
            border-left-color: var(--primary);
            color: var(--text-main);
        }
        .message-bubble.outgoing .quoted-reply-box {
            background: rgba(255, 255, 255, 0.18);
            border-left-color: #ffffff;
            color: #ffffff;
        }
        .quoted-reply-sender {
            font-weight: 800;
            font-size: 0.71rem;
            margin-bottom: 1px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .message-bubble.incoming .quoted-reply-sender { color: var(--primary-dark); }
        .message-bubble.outgoing .quoted-reply-sender { color: #ffffff; }
        .quoted-reply-text {
            opacity: 0.9;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            word-break: break-word;
        }

        /* BANNER REPLY DI ATAS INPUT PESAN */
        .reply-preview-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 0.65rem;
            padding: 0.55rem 1.25rem;
            background: #f1f5f9;
            border-top: 1px solid var(--border-subtle);
            flex: 0 0 auto;
            z-index: 10;
        }
        .reply-preview-bar.active { display: flex; }
        .reply-preview-content {
            flex: 1;
            min-width: 0;
            border-left: 3px solid var(--primary);
            padding-left: 0.6rem;
            display: flex;
            flex-direction: column;
        }
        .reply-preview-title {
            font-size: 0.74rem;
            font-weight: 800;
            color: var(--primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reply-preview-text {
            font-size: 0.78rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .reply-cancel-btn {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: transparent;
            color: var(--text-muted);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: var(--transition);
        }
        .reply-cancel-btn:hover {
            background: rgba(15, 23, 42, 0.08);
            color: var(--text-main);
        }

        /* PRATINJAU MEDIA / FILE SEBELUM DIKIRIM */
        .media-preview-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.6rem 1.15rem;
            background: #eff6ff;
            border-top: 1px solid #bfdbfe;
            flex: 0 0 auto;
            z-index: 10;
        }
        .media-preview-bar.active { display: flex; }
        .media-preview-left {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            min-width: 0;
            flex: 1;
        }
        .media-preview-thumb {
            width: 48px;
            height: 48px;
            border-radius: 10px;
            object-fit: cover;
            border: 1px solid var(--border-medium);
            background: #fff;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--primary);
            font-size: 1.2rem;
            overflow: hidden;
        }
        .media-preview-thumb img,
        .media-preview-thumb video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .media-preview-meta {
            display: flex;
            flex-direction: column;
            min-width: 0;
        }
        .media-preview-title {
            font-size: 0.78rem;
            font-weight: 800;
            color: var(--primary-dark);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .media-preview-sub {
            font-size: 0.72rem;
            color: var(--text-muted);
        }

        /* POPUP MENU PILIHAN LAMPIRAN (KAMERA, FOTO, VIDEO, MUSIK, DOKUMEN) */
        .attach-menu-popover {
            display: none;
            position: absolute;
            bottom: 72px;
            left: 14px;
            right: 14px;
            max-width: 420px;
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-xl);
            box-shadow: 0 18px 38px -8px rgba(15, 23, 42, 0.2);
            padding: 0.85rem;
            z-index: 30;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.65rem;
            animation: popUpScale 0.16s ease-out;
        }
        .attach-menu-popover.active {
            display: grid;
        }
        @keyframes popUpScale {
            from { opacity: 0; transform: translateY(8px) scale(0.97); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .attach-option-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            padding: 0.65rem 0.4rem;
            border-radius: 14px;
            background: var(--bg-body);
            border: 1px solid transparent;
            cursor: pointer;
            transition: var(--transition);
        }
        .attach-option-btn:hover {
            background: var(--primary-light);
            border-color: #bfdbfe;
            transform: translateY(-1px);
        }
        .attach-option-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            color: #fff;
        }
        .attach-option-label {
            font-size: 0.74rem;
            font-weight: 700;
            color: var(--text-main);
            text-align: center;
        }

        /* TAMPILAN MEDIA DI DALAM BUBBLE CHAT */
        .chat-photo-box {
            display: block;
            width: 100%;
            max-width: 245px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 2px;
            margin-bottom: 4px;
            border: 1px solid rgba(15, 23, 42, 0.12);
            background: #0f172a;
            cursor: zoom-in;
        }
        .chat-photo-box img {
            width: 100%;
            max-height: 290px;
            object-fit: cover;
            display: block;
        }
        .chat-video-box {
            display: block;
            width: 100%;
            max-width: 260px;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 2px;
            margin-bottom: 4px;
            background: #000;
            border: 1px solid rgba(15, 23, 42, 0.15);
        }
        .chat-video-box video {
            width: 100%;
            max-height: 280px;
            display: block;
            background: #000;
        }
        .chat-audio-card {
            display: flex;
            flex-direction: column;
            gap: 0.35rem;
            min-width: 225px;
            max-width: 280px;
            padding: 0.45rem 0.55rem;
            border-radius: 10px;
            margin-top: 2px;
            margin-bottom: 4px;
        }
        .message-bubble.incoming .chat-audio-card {
            background: var(--bg-body);
            border: 1px solid var(--border-subtle);
        }
        .message-bubble.outgoing .chat-audio-card {
            background: rgba(255, 255, 255, 0.16);
        }
        .chat-audio-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.76rem;
            font-weight: 700;
        }
        .chat-audio-title {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            flex: 1;
        }
        .chat-audio-card audio {
            width: 100%;
            height: 34px;
            border-radius: 999px;
        }
        .chat-doc-card {
            display: flex;
            align-items: center;
            gap: 0.65rem;
            min-width: 215px;
            max-width: 280px;
            padding: 0.55rem 0.7rem;
            border-radius: 10px;
            margin-top: 2px;
            margin-bottom: 4px;
            text-align: left;
            transition: var(--transition);
        }
        .message-bubble.incoming .chat-doc-card {
            background: var(--bg-body);
            border: 1px solid var(--border-subtle);
            color: var(--text-main);
        }
        .message-bubble.outgoing .chat-doc-card {
            background: rgba(255, 255, 255, 0.16);
            color: #ffffff;
        }
        .chat-doc-icon {
            width: 38px;
            height: 38px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.05rem;
            flex-shrink: 0;
        }
        .message-bubble.incoming .chat-doc-icon {
            background: var(--primary-light);
            color: var(--primary);
        }
        .message-bubble.outgoing .chat-doc-icon {
            background: rgba(255, 255, 255, 0.22);
            color: #ffffff;
        }
        .chat-doc-info {
            flex: 1;
            min-width: 0;
            display: flex;
            flex-direction: column;
        }
        .chat-doc-name {
            font-size: 0.8rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .chat-doc-meta {
            font-size: 0.68rem;
            opacity: 0.82;
        }
        .chat-doc-dl {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            font-size: 0.8rem;
        }
        .message-bubble.incoming .chat-doc-dl {
            background: #fff;
            border: 1px solid var(--border-medium);
            color: var(--primary);
        }
        .message-bubble.outgoing .chat-doc-dl {
            background: rgba(255, 255, 255, 0.22);
            color: #fff;
        }
        .chat-media-caption {
            margin-top: 4px;
            font-size: 0.86rem;
            line-height: 1.45;
            white-space: pre-wrap;
        }

        /* BAR PEREKAM PESAN SUARA (VOICE NOTE) */
        .voice-record-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 0.65rem;
            padding: 0.72rem 1.05rem;
            background: #fef2f2;
            border-top: 1px solid #fecaca;
            flex: 0 0 auto;
            z-index: 12;
        }
        .voice-record-bar.active {
            display: flex;
        }
        .voice-record-left {
            display: flex;
            align-items: center;
            gap: 0.55rem;
            color: var(--danger);
            font-weight: 800;
            font-size: 0.85rem;
        }
        .voice-rec-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--danger);
            animation: callBannerPulse 1s infinite ease-in-out;
        }
        .voice-record-actions {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .voice-cancel-btn {
            padding: 0.42rem 0.85rem;
            border-radius: var(--radius-full);
            background: #ffffff;
            border: 1px solid var(--border-medium);
            color: var(--text-main);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
        }
        .voice-send-btn {
            padding: 0.45rem 0.95rem;
            border-radius: var(--radius-full);
            background: var(--primary);
            color: #ffffff;
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
        }

        /* LIGHTBOX PERBESAR FOTO */
        .photo-lightbox-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.88);
            z-index: 28000;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .photo-lightbox-backdrop.active {
            display: flex;
        }
        .photo-lightbox-content {
            position: relative;
            max-width: 94vw;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.75rem;
        }
        .photo-lightbox-img {
            max-width: 94vw;
            max-height: 78vh;
            border-radius: 12px;
            object-fit: contain;
            background: #000;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.45);
        }
        .photo-lightbox-actions {
            display: flex;
            align-items: center;
            gap: 0.65rem;
        }

        /* MENU TEKAN LAMA PESAN (LONG PRESS ACTION SHEET) */
        .msg-context-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.36);
            z-index: 25000;
            align-items: flex-end;
            justify-content: center;
            padding: 0.75rem;
        }
        .msg-context-backdrop.active { display: flex; }
        .msg-context-sheet {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: var(--radius-xl);
            border: 1px solid var(--border-subtle);
            box-shadow: var(--shadow-md);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .msg-context-preview {
            padding: 0.75rem 1rem;
            background: var(--bg-body);
            border-bottom: 1px solid var(--border-subtle);
            font-size: 0.8rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .msg-context-item {
            width: 100%;
            padding: 0.85rem 1.1rem;
            background: #ffffff;
            color: var(--text-main);
            font-size: 0.88rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 0.75rem;
            cursor: pointer;
            text-align: left;
            border-bottom: 1px solid var(--border-subtle);
            transition: background-color 0.15s ease;
        }
        .msg-context-item:last-child { border-bottom: none; }
        .msg-context-item:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .msg-context-item.danger { color: var(--danger); }
        .msg-context-item.danger:hover {
            background: #fef2f2;
            color: var(--danger);
        }

        /* NAMA PENGIRIM + CENTANG BIRU / LENCANA KUNING DI DALAM BUBBLE CHAT */
        .message-sender-header {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            margin-bottom: 0.22rem;
            line-height: 1.2;
            max-width: 100%;
        }
        .message-sender-name {
            font-size: 0.69rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .message-bubble.incoming .message-sender-name { color: var(--primary); }
        .message-bubble.outgoing .message-sender-name { color: rgba(255, 255, 255, 0.94); }
        .message-sender-badges {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .message-sender-badges img,
        .message-bubble-verif {
            width: 13px;
            height: 13px;
            object-fit: contain;
            display: inline-block;
            vertical-align: middle;
        }

        .message-bubble.incoming { background: #ffffff; color: var(--text-main); border: 1px solid var(--border-subtle); border-bottom-left-radius: 4px; }
        .message-bubble.outgoing { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        
        .message-meta-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.3rem;
            margin-top: 0.32rem;
        }
        .message-edited-tag { font-size: 0.63rem; opacity: 0.78; font-style: italic; font-weight: 500; }
        .message-time { font-size: 0.65rem; opacity: 0.78; font-weight: 500; }

        /* INDIKATOR CENTANG */
        .msg-check-svg {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            transition: all 0.2s ease;
        }
        .msg-check-svg.sent { color: rgba(255, 255, 255, 0.72); }
        .msg-check-svg.delivered { color: rgba(255, 255, 255, 0.94); }
        .msg-check-svg.read-blue {
            color: var(--check-blue);
            filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.35));
        }
        .msg-check-svg.read-yellow {
            color: var(--check-yellow);
            filter: drop-shadow(0 0 2px rgba(250, 204, 21, 0.35));
        }
        .msg-check-svg.read,
        .msg-check-svg.read-green {
            color: var(--check-green);
            filter: drop-shadow(0 0 2px rgba(74, 222, 128, 0.4));
        }

        /* BUBBLE ANIMASI MENGETIK DI BAWAH CHAT TERAKHIR */
        .typing-bubble-wrapper {
            display: none;
            align-items: flex-start;
            width: 100%;
            flex-shrink: 0;
            animation: typingBubbleFadeIn 0.2s ease;
        }
        .typing-bubble-wrapper.active { display: flex; }
        @keyframes typingBubbleFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .typing-bubble-box {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            border-bottom-left-radius: 4px;
            padding: 0.65rem 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
        }
        .typing-dot-circle {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
            animation: typingWaveDot 1.25s infinite ease-in-out;
        }
        .typing-dot-circle:nth-child(2) { animation-delay: 0.16s; background: #3b82f6; }
        .typing-dot-circle:nth-child(3) { animation-delay: 0.32s; background: var(--accent); }
        @keyframes typingWaveDot {
            0%, 60%, 100% { transform: translateY(0) scale(0.92); opacity: 0.45; }
            30% { transform: translateY(-5px) scale(1.12); opacity: 1; }
        }

        /* KARTU RIWAYAT PANGGILAN DI CHAT */
        .call-log-card {
            display: flex; align-items: center; gap: 0.75rem; min-width: 195px;
        }
        .call-log-icon {
            width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 0.95rem; flex-shrink: 0;
        }
        .message-bubble.outgoing .call-log-icon { background: rgba(255, 255, 255, 0.2); color: #fff; }
        .message-bubble.incoming .call-log-icon { background: var(--primary-light); color: var(--primary); }
        .message-bubble.incoming .call-log-icon.missed { background: #fef2f2; color: var(--danger); }
        .call-log-info { display: flex; flex-direction: column; text-align: left; }
        .call-log-title { font-weight: 700; font-size: 0.85rem; line-height: 1.3; }
        .call-log-sub { font-size: 0.74rem; opacity: 0.82; margin-top: 2px; }

        /* PRATINJAU PASFOTO / GAMBAR DI DALAM CHAT */
        .chat-image-preview {
            width: 100%; max-width: 220px; border-radius: 8px; overflow: hidden; margin-bottom: 6px;
            border: 1px solid rgba(0,0,0,0.1); background: #000; display: block;
        }
        .chat-image-preview img {
            width: 100%; height: auto; display: block; object-fit: cover; max-height: 280px;
        }

        /* INPUT PESAN */
        .chat-input-box {
            padding: 0.75rem 1.05rem; background: #fff; border-top: 1px solid var(--border-subtle);
            display: flex; align-items: center; gap: 0.5rem; flex: 0 0 auto; z-index: 10;
        }
        .chat-attach-btn {
            width: 40px; height: 40px; border-radius: 50%; background: var(--bg-body);
            border: 1px solid var(--border-medium); color: var(--text-muted);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            flex-shrink: 0; transition: var(--transition); font-size: 0.95rem;
        }
        .chat-attach-btn:hover,
        .chat-attach-btn.active {
            background: var(--primary-light); border-color: var(--primary); color: var(--primary);
        }
        .chat-input {
            flex: 1; min-width: 0; padding: 0.65rem 1rem; background: var(--bg-body); border: 1px solid var(--border-medium);
            border-radius: var(--radius-full); font-size: 0.88rem; color: var(--text-main);
        }
        .chat-input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        
        .chat-voice-btn {
            width: 40px; height: 40px; border-radius: 50%; background: var(--bg-body);
            border: 1px solid var(--border-medium); color: var(--primary);
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            flex-shrink: 0; transition: var(--transition); font-size: 0.95rem;
        }
        .chat-voice-btn:hover {
            background: var(--primary-light); border-color: var(--primary);
        }

        .chat-send-btn {
            width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: #fff;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); flex-shrink: 0;
        }
        .chat-send-btn:disabled { opacity: 0.65; cursor: not-allowed; }

        #toastContainer { position: fixed; bottom: 24px; right: 24px; z-index: 30000; display: flex; flex-direction: column; gap: 0.5rem; max-width: 340px; }
        .toast { background: #0f172a; color: #fff; padding: 0.85rem 1.15rem; border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 0.75rem; border-left: 4px solid var(--accent); }

        @media (max-width: 768px) {
            html, body { height: 100svh; overflow: hidden; }
            body { padding: 0; }
            .container { max-width: 100%; height: 100svh; max-height: none; }
            .chat-wrapper { border: none; border-radius: 0; height: 100%; }
            .message-bubble { max-width: 88%; }
        }
    </style>
</head>
<body data-package="basic">

    <div id="toastContainer"></div>

    <main class="container">

            <!-- NOTIFIKASI DI BAWAH NAVBAR SAAT SEDANG ADA PANGGILAN -->

function withTimeout(promise, ms = 6000, label = 'Firestore operation') {
    let timerId = null;
    const timeoutPromise = new Promise((_, reject) => {
        timerId = setTimeout(() => {

        if (timerId) clearTimeout(timerId);
    });
}

function formatFileSize(bytes = 0) {
    if (!bytes || bytes <= 0) return '0 B';
    if (bytes < 1024) return `${bytes} B`;
    if (bytes < 1024 * 1024) return `${(bytes / 1024).toFixed(1)} KB`;
    return `${(bytes / (1024 * 1024)).toFixed(2)} MB`;
}

function detectMediaTypeFromFile(file, hintType = '') {
    if (hintType === 'voice') return 'voice';
    const mime = String(file?.type || '').toLowerCase();
    const name = String(file?.name || '').toLowerCase();

    if (mime.startsWith('image/') || /\.(jpg|jpeg|png|gif|webp|bmp|svg|heic)$/.test(name)) {
        return 'image';
    }
    if (mime.startsWith('video/') || /\.(mp4|webm|mov|mkv|avi|3gp)$/.test(name)) {
        return 'video';
    }
    if (mime.startsWith('audio/') || /\.(mp3|wav|ogg|m4a|aac|flac|opus)$/.test(name)) {
        return 'audio';
    }
    if (/\.(pdf|doc|docx|xls|xlsx|ppt|pptx|txt|csv|rtf|odt|ods|odp)$/.test(name)) {
        return 'document';
    }
    return hintType || 'file';
}

function getDocumentIconClass(fileName = '', mimeType = '') {
    const lower = `${fileName} ${mimeType}`.toLowerCase();
    if (lower.includes('pdf')) return 'fas fa-file-pdf';
    if (lower.includes('word') || /\.(doc|docx|rtf|odt)\b/.test(lower)) return 'fas fa-file-word';
    if (lower.includes('excel') || lower.includes('sheet') || /\.(xls|xlsx|csv|ods)\b/.test(lower)) return 'fas fa-file-excel';
    if (lower.includes('powerpoint') || lower.includes('presentation') || /\.(ppt|pptx|odp)\b/.test(lower)) return 'fas fa-file-powerpoint';
    if (/\.(zip|rar|7z|tar|gz)\b/.test(lower)) return 'fas fa-file-archive';
    if (/\.(txt|md|json|xml|html|css|js)\b/.test(lower)) return 'fas fa-file-code';
    return 'fas fa-file-alt';
}

function getMediaSummaryLabel(mediaType, fileName = '', caption = '') {
    const cleanCaption = String(caption || '').trim();
    const cleanName = String(fileName || '').trim();
    let prefix = '📎 File';
    if (mediaType === 'image') prefix = '📷 Foto';
    else if (mediaType === 'video') prefix = '🎬 Video';
    else if (mediaType === 'voice') prefix = '🎤 Pesan suara';
    else if (mediaType === 'audio') prefix = cleanName ? `🎵 Musik: ${cleanName}` : '🎵 Musik';
    else if (mediaType === 'document') prefix = cleanName ? `📄 Dokumen: ${cleanName}` : '📄 Dokumen';
    else if (cleanName) prefix = `📎 File: ${cleanName}`;

    return cleanCaption ? `${prefix} — ${cleanCaption}` : prefix;
}

async function compressImageFile(file, maxDimension = 1440, quality = 0.82) {
    if (!file || !file.type.startsWith('image/')) return file;
    if (file.type === 'image/gif' || file.size <= 350 * 1024) return file;

    return new Promise((resolve) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);

        img.onload = () => {
            URL.revokeObjectURL(objectUrl);
            let { width, height } = img;
            if (width > maxDimension || height > maxDimension) {
                if (width > height) {
                    height = Math.round((height * maxDimension) / width);
                    width = maxDimension;
                } else {
                    width = Math.round((width * maxDimension) / height);
                    height = maxDimension;
                }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            if (!ctx) {
                resolve(file);
                return;
            }
            ctx.drawImage(img, 0, 0, width, height);

            const outType = file.type === 'image/png' ? 'image/png' : 'image/jpeg';
            canvas.toBlob((blob) => {
                if (!blob || blob.size >= file.size) {
                    resolve(file);
                    return;
                }
                const ext = outType === 'image/png' ? 'png' : 'jpg';
                const compressed = new File([blob], `chat_${Date.now()}.${ext}`, { type: outType });
                resolve(compressed);
            }, outType, quality);
        };

        img.onerror = () => {
            URL.revokeObjectURL(objectUrl);
            resolve(file);
        };

        img.src = objectUrl;
    });
}

function extractStoragePathFromUrl(publicUrl = '') {
    if (!publicUrl) return '';
    try {
        const parsed = new URL(String(publicUrl));
        const marker = `/storage/v1/object/public/${SUPABASE_CHAT_BUCKET}/`;
        const idx = parsed.pathname.indexOf(marker);
        if (idx >= 0) {
            return decodeURIComponent(parsed.pathname.slice(idx + marker.length));
        }
    } catch (e) {}
    return '';
}

async function deleteMediaFromSupabase(messageObj = {}) {
    const rawUrl = messageObj?.mediaUrl || messageObj?.imageUrl || '';
    const storagePath = extractStoragePathFromUrl(rawUrl);
    if (!storagePath) return;

    await supabase.storage
        .from(SUPABASE_CHAT_BUCKET)
        .remove([storagePath])
        .catch(() => {});

    await supabase
        .from('chat_media_files')
        .delete()
        .eq('storage_path', storagePath)
        .catch(() => {});
}

async function uploadMediaToSupabase(file, mediaType, chatId, senderUid, recipientUid = '') {
    if (!file) throw new Error('File tidak ditemukan');
    if (!SUPABASE_PUBLISHABLE_KEY) {
        throw new Error('Publishable Key Supabase belum diisi');
    }

    const processedFile = mediaType === 'image' ? await compressImageFile(file) : file;
    const originalName = String(file.name || 'attachment').trim();
    const rawExt = (processedFile.name.split('.').pop() || 'bin').toLowerCase().replace(/[^a-z0-9]/g, '') || 'bin';

    const folderMap = {
        image: 'images',
        video: 'videos',
        audio: 'music',
        voice: 'voice-notes',
        document: 'documents',
        file: 'files'
    };
    const subFolder = folderMap[mediaType] || 'files';
    const safeChatId = String(chatId || 'general').replace(/[^a-zA-Z0-9_-]/g, '_');
    const safeSender = String(senderUid || 'user').replace(/[^a-zA-Z0-9_-]/g, '_');
    const randomPart = Math.random().toString(36).slice(2, 8);
    const objectPath = `chat-media/${safeChatId}/${subFolder}/${Date.now()}_${safeSender}_${randomPart}.${rawExt}`;

    const contentType = (processedFile.type || file.type || 'application/octet-stream').split(';')[0].trim();

    let { error: uploadError } = await withTimeout(
        supabase.storage
            .from(SUPABASE_CHAT_BUCKET)
            .upload(objectPath, processedFile, {
                contentType,
                cacheControl: '3600',
                upsert: true
            }),
        45000,
        'Supabase upload'
    );

    if (uploadError && /mime|not supported/i.test(uploadError.message || '')) {
        const rawArrayBuffer = await processedFile.arrayBuffer();
        const fallbackBlob = new Blob([rawArrayBuffer], { type: 'image/png' });
        const retryRes = await withTimeout(
            supabase.storage
                .from(SUPABASE_CHAT_BUCKET)
                .upload(objectPath, fallbackBlob, {
                    contentType: 'image/png',
                    cacheControl: '3600',
                    upsert: true
                }),
            45000,
            'Supabase upload fallback'
        );
        uploadError = retryRes.error;
    }

    if (uploadError) {
        throw new Error(uploadError.message || 'Gagal upload ke Supabase Storage');
    }

    const { data: pubData } = supabase.storage
        .from(SUPABASE_CHAT_BUCKET)
        .getPublicUrl(objectPath);

    const publicUrl = pubData?.publicUrl ||
        `${SUPABASE_URL}/storage/v1/object/public/${encodeURIComponent(SUPABASE_CHAT_BUCKET)}/${objectPath}`;

    supabase.from('chat_media_files').insert({
        chat_id: chatId,
        sender_uid: senderUid,
        recipient_uid: recipientUid || null,
        media_type: mediaType,
        file_name: originalName,
        file_size: processedFile.size || file.size || 0,
        mime_type: contentType,
        bucket_name: SUPABASE_CHAT_BUCKET,
        storage_path: objectPath,
        public_url: publicUrl
    }).then(() => {}).catch(() => {});

    return {
        url: publicUrl,
        mediaType,
        fileName: originalName,
        fileSize: processedFile.size || file.size || 0,
        mimeType: contentType
    };
}

/* =====================================================
   PEREKAM PESAN SUARA (VOICE NOTE) LANGSUNG
===================================================== */
function cleanupVoiceRecorderResources() {
    if (voiceTimerInterval) {
        clearInterval(voiceTimerInterval);
        voiceTimerInterval = null;
    }
    if (voiceStream) {
        voiceStream.getTracks().forEach(track => track.stop());
        voiceStream = null;
    }
    mediaRecorder = null;
    voiceChunks = [];
    voiceRecordSeconds = 0;

    const bar = document.getElementById('voiceRecordBar');
    const timerEl = document.getElementById('voiceRecordTimer');
    if (bar) bar.classList.remove('active');
    if (timerEl) timerEl.textContent = '00:00';
}

window.startVoiceRecording = async function () {
    if (isSendingMessage || mediaRecorder) return;
    closeAttachMenu();

    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || typeof MediaRecorder === 'undefined') {
        showToast('Browser Anda tidak mendukung perekam suara langsung.');
        return;
    }

    try {
        voiceStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        const mimeCandidates = [
            'audio/webm;codecs=opus',
            'audio/webm',
            'audio/mp4',
            'audio/ogg;codecs=opus'
        ];
        const supportedMime = mimeCandidates.find(m => MediaRecorder.isTypeSupported?.(m)) || '';

        voiceChunks = [];
        isVoiceCancelRequested = false;
        mediaRecorder = supportedMime
            ? new MediaRecorder(voiceStream, { mimeType: supportedMime })
            : new MediaRecorder(voiceStream);

        mediaRecorder.ondataavailable = (e) => {
            if (e.data && e.data.size > 0) {
                voiceChunks.push(e.data);
            }
        };

        mediaRecorder.onstop = async () => {
            const wasCancelled = isVoiceCancelRequested;
            const recordedMime = (mediaRecorder?.mimeType || 'audio/webm').split(';')[0].trim();
            const chunksCopy = [...voiceChunks];
            const finalDuration = voiceRecordSeconds;
            cleanupVoiceRecorderResources();

            if (wasCancelled || chunksCopy.length === 0) {
                return;
            }

            const blob = new Blob(chunksCopy, { type: recordedMime });
            if (blob.size < 400) {
                showToast('Rekaman suara terlalu singkat.');
                return;
            }

            const ext = recordedMime.includes('mp4') ? 'm4a' : (recordedMime.includes('ogg') ? 'ogg' : 'webm');
            const voiceFile = new File([blob], `Pesan_Suara_${formatDuration(finalDuration).replace(':', '-')}.${ext}`, {
                type: recordedMime
            });

            await sendDirectVoiceNoteFile(voiceFile);
        };

        voiceRecordSeconds = 0;
        const bar = document.getElementById('voiceRecordBar');
        const timerEl = document.getElementById('voiceRecordTimer');
        if (timerEl) timerEl.textContent = '00:00';
        if (bar) bar.classList.add('active');

        voiceTimerInterval = setInterval(() => {
            voiceRecordSeconds += 1;
            if (timerEl) timerEl.textContent = formatDuration(voiceRecordSeconds);
            if (voiceRecordSeconds >= 180) {
                window.stopAndSendVoiceRecording();
            }
        }, 1000);

        mediaRecorder.start(250);
    } catch (err) {
        console.error('Voice recorder error:', err);
        cleanupVoiceRecorderResources();
        showToast('Izin mikrofon ditolak atau tidak tersedia.');
    }
};

window.cancelVoiceRecording = function () {
    isVoiceCancelRequested = true;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
    } else {
        cleanupVoiceRecorderResources();
    }
    showToast('Rekaman suara dibatalkan.');
};

window.stopAndSendVoiceRecording = function () {
    isVoiceCancelRequested = false;
    if (mediaRecorder && mediaRecorder.state !== 'inactive') {

    }
};

async function sendDirectVoiceNoteFile(voiceFile) {
    const senderUid = currentUid || auth.currentUser?.uid || getEarlyUid();
    const recipientUid = activeChatUserId;
    const chatId = resolveActiveChatId(senderUid, recipientUid);
    if (!chatId || !senderUid || !recipientUid || isSendingMessage) return;

    isSendingMessage = true;
    const sendBtnEl = document.getElementById('chatSendBtn');
    if (sendBtnEl) {
        sendBtnEl.disabled = true;
        sendBtnEl.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
    }

    const replyToPayload = activeReplyData ? { ...activeReplyData } : null;
    window.clearActiveReply();

    try {
        const uploadedMeta = await uploadMediaToSupabase(voiceFile, 'voice', chatId, senderUid, recipientUid);
        await dispatchNewMessageToFirestore({
            senderUid,
            recipientUid,
            chatId,
            text: '',
            mediaMeta: uploadedMeta,
            replyToPayload
        });
    } catch (err) {
        console.error('Voice note upload error:', err);
        showToast(`Gagal mengirim pesan suara: ${err.message || 'Coba lagi'}`);
    } finally {
        isSendingMessage = false;
        if (sendBtnEl) {
            sendBtnEl.disabled = false;
            sendBtnEl.innerHTML = '<i class="fas fa-paper-plane"></i>';
        }
    }
}

function getHiddenForMeKey(chatId, uid) {
    return `sitenexs_hidden_msgs_${chatId}_${uid}`;
}

function loadHiddenMessageIds(chatId, uid) {
    if (!chatId || !uid) return new Set();
    try {
        const raw = localStorage.getItem(getHiddenForMeKey(chatId, uid));
        if (!raw) return new Set();
        const arr = JSON.parse(raw);
        return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) {
        return new Set();
    }
}

function removeMessageFromLocalCacheAndGreenRead(chatId, msgId) {
    if (!chatId || !msgId) return;
    try {
        const raw = localStorage.getItem(getChatCacheKey(chatId));
        if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) {
                const filtered = parsed.filter(item => item && item.id !== msgId);
                localStorage.setItem(getChatCacheKey(chatId), JSON.stringify(filtered));
            }
        }
    } catch (e) {}

    try {
        const greenSet = loadPersistedGreenReadIds(chatId);
        if (greenSet.has(msgId)) {
            greenSet.delete(msgId);
            localStorage.setItem(getGreenReadStoreKey(chatId), JSON.stringify([...greenSet]));
        }
    } catch (e) {}
}

function hideMessageForMe(chatId, uid, msgId) {
    if (!chatId || !uid || !msgId) return;
    try {
        const set = loadHiddenMessageIds(chatId, uid);
        set.add(msgId);
        localStorage.setItem(getHiddenForMeKey(chatId, uid), JSON.stringify([...set]));
    } catch (e) {}
    const messagesContainer = document.getElementById('chatMessages');
    const el = messagesContainer?.querySelector(`[data-msg-id="${CSS.escape(msgId)}"]`);
    if (el) el.remove();
    if (pinnedMessagesList.some(p => p.id === msgId)) {
        removePinnedMessageById(msgId, false);
    }
}

function getPinnedStoreKey(chatId) {
    return `sitenexs_pinned_msgs_${chatId}`;
}

function normalizePinnedArray(rawPinned, legacySingle = null) {
    let arr = [];
    if (Array.isArray(rawPinned)) {
        arr = rawPinned;
    } else if (legacySingle && typeof legacySingle === 'object' && legacySingle.id) {
        arr = [legacySingle];
    }
    const seen = new Set();
    const clean = [];
    arr.forEach(item => {
        if (!item || !item.id || seen.has(item.id)) return;
        seen.add(item.id);
        clean.push({
            id: item.id,
            senderUid: item.senderUid || '',
            senderName: item.senderName || '',
            text: item.text || ''
        });
    });
    return clean;
}

function getVisiblePinnedMessages() {
    const hiddenSet = loadHiddenMessageIds(activeChatId, currentUid);
    return pinnedMessagesList.filter(p => p && p.id && !hiddenSet.has(p.id));
}

function renderPinnedMessageBar() {
    const bar = document.getElementById('pinnedMessageBar');
    const labelEl = document.getElementById('pinnedMessageLabel');
    const snippetEl = document.getElementById('pinnedMessageSnippet');
    if (!bar || !snippetEl) return;

    const visiblePins = getVisiblePinnedMessages();
    if (visiblePins.length === 0) {
        activePinnedIndex = 0;
        bar.classList.remove('active');
        snippetEl.textContent = '';
        if (labelEl) labelEl.textContent = 'Pesan Tersemat';
        return;
    }

    if (activePinnedIndex >= visiblePins.length) {
        activePinnedIndex = visiblePins.length - 1;
    }
    if (activePinnedIndex < 0) {
        activePinnedIndex = 0;
    }

    const currentPin = visiblePins[activePinnedIndex];
    if (labelEl) {
        labelEl.textContent = visiblePins.length > 1
            ? `Pesan Tersemat (${activePinnedIndex + 1}/${visiblePins.length})`
            : 'Pesan Tersemat';
    }
    snippetEl.textContent = getReplyExcerpt(currentPin.text || '', currentPin);
    bar.classList.add('active');
}

function applyPinnedHighlightToDom() {
    const messagesContainer = document.getElementById('chatMessages');
    if (!messagesContainer) return;
    const pinnedSet = new Set(getVisiblePinnedMessages().map(p => p.id));
    messagesContainer.querySelectorAll('.message-wrapper').forEach(wrapper => {
        const msgId = wrapper.dataset.msgId;
        const bubble = wrapper.querySelector('.message-bubble');
        if (!bubble) return;
        bubble.classList.toggle('pinned-msg', Boolean(msgId && pinnedSet.has(msgId)));
    });
}

function setPinnedMessagesList(nextList, syncRemote = true) {
    pinnedMessagesList = normalizePinnedArray(nextList);

    if (activeChatId) {
        try {
            if (pinnedMessagesList.length > 0) {
                localStorage.setItem(getPinnedStoreKey(activeChatId), JSON.stringify(pinnedMessagesList));
            } else {
                localStorage.removeItem(getPinnedStoreKey(activeChatId));
            }
        } catch (e) {}

        if (syncRemote) {
            const latestSingle = pinnedMessagesList.length > 0 ? pinnedMessagesList[pinnedMessagesList.length - 1] : null;
            setDoc(doc(db, 'chats', activeChatId), {
                pinnedMessages: pinnedMessagesList,
                pinnedMessage: latestSingle
            }, { merge: true }).catch(() => {});
        }
    }

    applyPinnedHighlightToDom();
    renderPinnedMessageBar();
}

function addOrUpdatePinnedMessage(pinObj, syncRemote = true) {
    if (!pinObj || !pinObj.id) return;
    const next = [...pinnedMessagesList];
    const idx = next.findIndex(p => p.id === pinObj.id);
    const normalized = {
        id: pinObj.id,
        senderUid: pinObj.senderUid || '',
        senderName: pinObj.senderName || '',
        text: getReplyExcerpt(pinObj.text || '', pinObj)
    };
    if (idx >= 0) {
        next[idx] = normalized;
        activePinnedIndex = idx;
    } else {
        next.push(normalized);
        activePinnedIndex = next.length - 1;
    }
    setPinnedMessagesList(next, syncRemote);
}

function removePinnedMessageById(msgId, syncRemote = true) {
    if (!msgId) return;
    const next = pinnedMessagesList.filter(p => p.id !== msgId);
    if (activePinnedIndex >= next.length) {
        activePinnedIndex = Math.max(0, next.length - 1);
    }
    setPinnedMessagesList(next, syncRemote);
}

function loadLocalPinnedMessages(chatId) {
    if (!chatId) return;
    try {
        const raw = localStorage.getItem(getPinnedStoreKey(chatId));
        if (!raw) {
            const legacyRaw = localStorage.getItem(`sitenexs_pinned_msg_${chatId}`);
            if (!legacyRaw) return;
            const legacyParsed = JSON.parse(legacyRaw);
            pinnedMessagesList = normalizePinnedArray(null, legacyParsed);
        } else {
            const parsed = JSON.parse(raw);
            pinnedMessagesList = normalizePinnedArray(parsed);
        }
        activePinnedIndex = Math.max(0, getVisiblePinnedMessages().length - 1);
        renderPinnedMessageBar();
    } catch (e) {}
}

window.handlePinnedBarClick = function () {
    const visiblePins = getVisiblePinnedMessages();
    if (visiblePins.length === 0) return;
    if (activePinnedIndex >= visiblePins.length) activePinnedIndex = 0;

    const targetPin = visiblePins[activePinnedIndex];
    if (targetPin?.id) {
        window.scrollToQuotedMessage(targetPin.id);
    }
    if (visiblePins.length > 1) {
        activePinnedIndex = (activePinnedIndex + 1) % visiblePins.length;
        renderPinnedMessageBar();
    }
};

window.handleUnpinFromBar = function (event) {
    if (event) event.stopPropagation();
    const visiblePins = getVisiblePinnedMessages();
    if (visiblePins.length === 0) return;
    const targetPin = visiblePins[activePinnedIndex] || visiblePins[0];
    if (!targetPin?.id) return;
    removePinnedMessageById(targetPin.id, true);
    showToast('Semat pesan dilepas.');
};

window.openMessageContextMenu = function (docId, message) {
    if (!docId || !message) return;
    contextTargetMsg = { id: docId, ...message };

    const backdrop = document.getElementById('msgContextBackdrop');
    const previewEl = document.getElementById('msgContextPreview');
    const pinLabelEl = document.getElementById('ctxPinLabel');
    const editBtnEl = document.getElementById('ctxEditBtn');
    const deleteEveryoneBtnEl = document.getElementById('ctxDeleteEveryoneBtn');

    if (previewEl) {
        previewEl.textContent = getReplyExcerpt(message.text || '', message);
    }

    const isPinnedAlready = pinnedMessagesList.some(p => p.id === docId);
    if (pinLabelEl) {
        pinLabelEl.textContent = isPinnedAlready ? 'Lepas sematan pesan' : 'Sematkan pesan';
    }

    const activeUid = currentUid || auth.currentUser?.uid || getEarlyUid();
    const isMine = message.senderUid === activeUid;
    const isCallLog = String(message.text || '').startsWith('[CALL_LOG]|');
    const isApplication = String(message.text || '').includes('📋 *LAMARAN KERJA BARU*');
    const hasAttachmentWithoutText = Boolean(message.mediaUrl || message.imageUrl) && !String(message.text || '').trim();

    if (editBtnEl) {
        editBtnEl.style.display = (isMine && !isCallLog && !isApplication && !hasAttachmentWithoutText) ? 'flex' : 'none';
    }
    if (deleteEveryoneBtnEl) {
        deleteEveryoneBtnEl.style.display = isMine ? 'flex' : 'none';
    }

    if (backdrop) {
        backdrop.classList.add('active');
    }
};

window.closeMessageContextMenu = function (event) {
    if (event && event.target && event.target.id !== 'msgContextBackdrop') return;
    const backdrop = document.getElementById('msgContextBackdrop');
    if (backdrop) backdrop.classList.remove('active');
    contextTargetMsg = null;
};

window.handleContextPinMessage = function () {
    if (!contextTargetMsg) return;
    const target = { ...contextTargetMsg };
    window.closeMessageContextMenu();

    if (pinnedMessagesList.some(p => p.id === target.id)) {
        removePinnedMessageById(target.id, true);
        showToast('Semat pesan dilepas.');
    } else {
        const senderLabel = getSenderDisplayName(target, currentUid) ||
            (target.senderUid === currentUid ? 'Anda' : (otherUserName || 'Mitra Sitenexs'));
        addOrUpdatePinnedMessage({
            id: target.id,
            senderUid: target.senderUid,
            senderName: senderLabel,
            text: getReplyExcerpt(target.text || '', target)
        }, true);
        showToast('Pesan disematkan.');
    }
};

window.handleContextEditMessage = function () {
    if (!contextTargetMsg) return;
    const target = { ...contextTargetMsg };
    window.closeMessageContextMenu();

    const activeUid = currentUid || auth.currentUser?.uid || getEarlyUid();
    if (target.senderUid !== activeUid) return;
    window.clearSelectedMedia();
    activeReplyData = null;
    editingMessageId = target.id;
    editingOriginalText = target.text || '';
    renderReplyPreviewBar();

    const inputEl = document.getElementById('messageInput');
    if (inputEl) {
        inputEl.value = editingOriginalText;
        inputEl.focus();
    }
};

window.handleContextDeleteForEveryone = async function () {
    if (!contextTargetMsg) return;
    const target = { ...contextTargetMsg };
    const activeUid = currentUid || auth.currentUser?.uid || getEarlyUid();
    const chatId = resolveActiveChatId(activeUid, activeChatUserId);
    window.closeMessageContextMenu();

    if (!chatId || !target.id) return;
    if (activeUid && target.senderUid && target.senderUid !== activeUid) return;

    try {
        // Hapus dokumen pesan di Firestore database
        await deleteDoc(doc(db, 'chats', chatId, 'messages', target.id));

        // Hapus file media di Supabase Storage & tabel chat_media_files jika ada
        await deleteMediaFromSupabase(target);

        // Hapus dari state memori, cache localStorage & sematan
        messagesStore.delete(target.id);
        removeMessageFromLocalCacheAndGreenRead(chatId, target.id);
        if (pinnedMessagesList.some(p => p.id === target.id)) {
            removePinnedMessageById(target.id, true);
        }

        const messagesContainer = document.getElementById('chatMessages');
        const el = messagesContainer?.querySelector(`[data-msg-id="${CSS.escape(target.id)}"]`);
        if (el) el.remove();

        showToast('Pesan & file dihapus dari database dan cache.');
    } catch (err) {
        console.error('Delete for everyone error:', err);
        showToast('Gagal menghapus pesan untuk semua orang.');
    }
};

window.handleContextDeleteForMe = function () {
    if (!contextTargetMsg || !activeChatId || !currentUid) return;
    const target = { ...contextTargetMsg };
    window.closeMessageContextMenu();

    hideMessageForMe(activeChatId, currentUid, target.id);
    showToast('Pesan dihapus untuk saya.');
};

function attachLongPressToMessage(wrapper, bubble, docId, message) {
    const LONG_PRESS_MS = 480;
    let pressTimer = null;
    let startX = 0;
    let startY = 0;
    let longPressTriggered = false;

    const clearPressTimer = () => {
        if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
        }
    };

    const startPress = (clientX, clientY) => {
        clearPressTimer();
        startX = clientX;
        startY = clientY;
        longPressTriggered = false;
        pressTimer = setTimeout(() => {
            longPressTriggered = true;
            window.openMessageContextMenu(docId, messagesStore.get(docId) || message);
        }, LONG_PRESS_MS);
    };

    const movePress = (clientX, clientY) => {
        if (!pressTimer) return;
        if (Math.abs(clientX - startX) > 10 || Math.abs(clientY - startY) > 10) {
            clearPressTimer();
        }
    };

    bubble.addEventListener('touchstart', (e) => {
        if (!e.touches || e.touches.length !== 1) return;
        startPress(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    bubble.addEventListener('touchmove', (e) => {
        if (!e.touches || e.touches.length !== 1) return;
        movePress(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    bubble.addEventListener('touchend', clearPressTimer);
    bubble.addEventListener('touchcancel', clearPressTimer);

    bubble.addEventListener('mousedown', (e) => {
        if (e.button !== 0) return;
        startPress(e.clientX, e.clientY);
    });

    bubble.addEventListener('mousemove', (e) => {
        movePress(e.clientX, e.clientY);
    });

    bubble.addEventListener('mouseup', clearPressTimer);
    bubble.addEventListener('mouseleave', clearPressTimer);

    bubble.addEventListener('contextmenu', (e) => {
        e.preventDefault();
        clearPressTimer();
        window.openMessageContextMenu(docId, messagesStore.get(docId) || message);
    });

    bubble.addEventListener('click', (e) => {
        if (longPressTriggered) {
            e.preventDefault();
            e.stopPropagation();
            longPressTriggered = false;
        }
    }, true);
}

function getReplyExcerpt(rawText = '', mediaObj = null) {
    const clean = String(rawText || '').trim();
    const attachmentUrl = mediaObj?.mediaUrl || mediaObj?.imageUrl || '';
    if (attachmentUrl) {
        const mType = mediaObj?.mediaType || (mediaObj?.imageUrl ? 'image' : 'file');
        return getMediaSummaryLabel(mType, mediaObj?.fileName || '', clean);
    }
    if (!clean) return 'Pesan';
    if (clean.startsWith('[CALL_LOG]|')) {
        const [, callType = 'video'] = clean.split('|');
        return callType === 'audio' ? 'Panggilan Suara' : 'Panggilan Video';
    }
    if (clean.includes('📋 *LAMARAN KERJA BARU*')) {
        const pos = clean.match(/🔹 \*Posisi:\* (.*)/)?.[1]?.trim();
        return pos ? `Lamaran Kerja: ${pos}` : 'Lamaran Kerja';
    }
    return clean.replace(/\s+/g, ' ');
}

function attachSwipeToReply(wrapper, bubble, docId, message, ownerUid) {
    const SWIPE_TRIGGER_PX = 56;
    const SWIPE_MAX_PX = 76;

    const iconEl = document.createElement('div');
    iconEl.className = 'swipe-reply-icon';
    iconEl.innerHTML = '<i class="fas fa-reply"></i>';
    wrapper.insertBefore(iconEl, bubble);

    let startX = 0;
    let startY = 0;
    let currentOffset = 0;
    let isTracking = false;
    let isHorizontalSwipe = false;

    const resetSwipe = () => {
        currentOffset = 0;
        isTracking = false;
        isHorizontalSwipe = false;
        bubble.classList.remove('swiping');
        bubble.style.transform = '';
        iconEl.classList.remove('triggered');
        iconEl.style.opacity = '0';
        iconEl.style.transform = 'translateY(-50%) scale(0.75)';
    };

    const onStart = (clientX, clientY) => {
        startX = clientX;
        startY = clientY;
        currentOffset = 0;
        isTracking = true;
        isHorizontalSwipe = false;
        bubble.classList.add('swiping');
    };

    const onMove = (clientX, clientY, e) => {
        if (!isTracking) return;
        const dx = clientX - startX;
        const dy = clientY - startY;

        if (!isHorizontalSwipe) {
            if (Math.abs(dx) < 8 && Math.abs(dy) < 8) return;
            if (Math.abs(dx) > Math.abs(dy) * 1.25) {
                isHorizontalSwipe = true;
            } else {
                isTracking = false;
                bubble.classList.remove('swiping');
                return;
            }
        }

        if (e && e.cancelable) e.preventDefault();

        const rawDelta = dx > 0 ? Math.min(dx, SWIPE_MAX_PX) : Math.max(dx, -SWIPE_MAX_PX);
        currentOffset = rawDelta;
        bubble.style.transform = `translateX(${currentOffset}px)`;

        const progress = Math.min(Math.abs(currentOffset) / SWIPE_TRIGGER_PX, 1);
        const scale = 0.75 + progress * 0.25;
        iconEl.style.opacity = String(progress);
        iconEl.style.transform = `translateY(-50%) scale(${scale})`;

        if (Math.abs(currentOffset) >= SWIPE_TRIGGER_PX) {
            iconEl.classList.add('triggered');
        } else {
            iconEl.classList.remove('triggered');
        }
    };

    const onEnd = () => {
        if (!isTracking) return;
        const shouldReply = isHorizontalSwipe && Math.abs(currentOffset) >= SWIPE_TRIGGER_PX;
        resetSwipe();

        if (shouldReply) {
            const currentMsg = messagesStore.get(docId) || message;
            const senderLabel = getSenderDisplayName(currentMsg, ownerUid) ||
                (currentMsg.senderUid === ownerUid ? 'Anda' : (otherUserName || 'Mitra Sitenexs'));
            window.setReplyToMessage({
                id: docId,
                senderUid: currentMsg.senderUid,
                senderName: senderLabel,
                text: currentMsg.text || '',
                mediaUrl: currentMsg.mediaUrl || currentMsg.imageUrl || '',
                mediaType: currentMsg.mediaType || (currentMsg.imageUrl ? 'image' : ''),
                fileName: currentMsg.fileName || ''
            });
        }
    };

    wrapper.addEventListener('touchstart', (e) => {
        if (!e.touches || e.touches.length !== 1) return;
        onStart(e.touches[0].clientX, e.touches[0].clientY);
    }, { passive: true });

    wrapper.addEventListener('touchmove', (e) => {
        if (!isTracking || !e.touches || e.touches.length !== 1) return;
        onMove(e.touches[0].clientX, e.touches[0].clientY, e);
    }, { passive: false });

    wrapper.addEventListener('touchend', onEnd);
    wrapper.addEventListener('touchcancel', resetSwipe);

    wrapper.addEventListener('pointerdown', (e) => {
        if (e.pointerType === 'touch') return;
        if (e.button !== 0) return;
        onStart(e.clientX, e.clientY);

        const handlePointerMove = (moveEv) => onMove(moveEv.clientX, moveEv.clientY, moveEv);
        const handlePointerUp = () => {
            window.removeEventListener('pointermove', handlePointerMove);
            window.removeEventListener('pointerup', handlePointerUp);
            onEnd();
        };

        window.addEventListener('pointermove', handlePointerMove);
        window.addEventListener('pointerup', handlePointerUp);
    });
}

function buildQuotedReplyElement(replyTo) {
    if (!replyTo || (!replyTo.senderName && !replyTo.text)) return null;
    const box = document.createElement('div');
    box.className = 'quoted-reply-box';
    if (replyTo.id) {
        box.addEventListener('click', (e) => {
            e.stopPropagation();
            window.scrollToQuotedMessage(replyTo.id);
        });
    }

    const senderEl = document.createElement('div');
    senderEl.className = 'quoted-reply-sender';
    senderEl.textContent = replyTo.senderName || 'Pesan';

    const textEl = document.createElement('div');
    textEl.className = 'quoted-reply-text';
    textEl.textContent = getReplyExcerpt(replyTo.text || '', replyTo);

    box.append(senderEl, textEl);
    return box;
}

function getProfileCacheKey(uid) {

}

function loadCachedProfile(uid) {

/* =====================================================
   MODUL SYNC REALTIME CHAT, CACHE LOKAL & STATUS BACA
===================================================== */
function getChatCacheKey(chatId) {
    return `sitenexs_chat_cache_${chatId}`;
}

function getGreenReadStoreKey(chatId) {
    return `sitenexs_green_read_${chatId}`;
}

function loadPersistedGreenReadIds(chatId) {
    if (!chatId) return new Set();
    try {
        const raw = localStorage.getItem(getGreenReadStoreKey(chatId));
        if (!raw) return new Set();
        const arr = JSON.parse(raw);
        return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) {
        return new Set();
    }
}

function persistGreenReadId(chatId, msgId) {
    if (!chatId || !msgId) return;
    try {
        const set = loadPersistedGreenReadIds(chatId);
        if (!set.has(msgId)) {
            set.add(msgId);
            localStorage.setItem(getGreenReadStoreKey(chatId), JSON.stringify([...set]));
        }
    } catch (e) {}
}

function upsertMessageToCache(chatId, item) {
    if (!chatId || !item?.id) return;
    try {
        const raw = localStorage.getItem(getChatCacheKey(chatId));
        let list = [];
        if (raw) {
            const parsed = JSON.parse(raw);
            if (Array.isArray(parsed)) list = parsed;
        }
        const idx = list.findIndex(x => x.id === item.id);
        if (idx >= 0) {
            list[idx] = { ...list[idx], ...item };
        } else {
            list.push(item);
        }
        list.sort((a, b) => (a.createdAtMs || 0) - (b.createdAtMs || 0));
        localStorage.setItem(getChatCacheKey(chatId), JSON.stringify(list.slice(-120)));
    } catch (e) {}
}

function syncMessageDocToCache(chatId, msgId, msgData) {
    if (!chatId || !msgId || !msgData) return;
    const createdAtMs = msgData?.createdAt?.toDate ? msgData.createdAt.toDate().getTime() : Date.now();
    upsertMessageToCache(chatId, {
        id: msgId,
        senderUid: msgData.senderUid,
        senderName: msgData.senderName,
        senderIsVerified: Boolean(msgData.senderIsVerified),
        senderIsPro: hasYellowBadge(msgData),
        text: msgData.text || '',
        imageUrl: msgData.imageUrl || null,
        mediaUrl: msgData.mediaUrl || msgData.imageUrl || null,
        mediaType: msgData.mediaType || (msgData.imageUrl ? 'image' : null),
        fileName: msgData.fileName || null,
        fileSize: msgData.fileSize || 0,
        mimeType: msgData.mimeType || null,
        replyTo: msgData.replyTo || null,
        isEdited: Boolean(msgData.isEdited),
        status: msgData.status || 'sent',
        checkColor: msgData.checkColor || null,
        delivered: Boolean(msgData.delivered),
        read: Boolean(msgData.read),
        createdAtMs
    });
}

function syncUnreadReset(chatId, uid) {
    if (!chatId || !uid) return Promise.resolve();
    return updateDoc(doc(db, 'chats', chatId), {
        [`unread_${uid}`]: false

function syncChatSummaryOnSend(chatId, senderUid, recipientUid, text) {

    return setDoc(doc(db, 'chats', chatId), {
        participants: [senderUid, recipientUid],
        lastMessage: text,
        lastTimestamp: serverTimestamp(),
        [`unread_${recipientUid}`]: true,
        [`typing_${senderUid}`]: false
    }, { merge: true });
}

function scrollMessagesToBottom(force = false) {
    const messagesContainer = document.getElementById('chatMessages');
    if (!messagesContainer) return;
    const distanceFromBottom = messagesContainer.scrollHeight - messagesContainer.scrollTop - messagesContainer.clientHeight;
    if (!force && !stickToBottom && distanceFromBottom >= 260) return;

    stickToBottom = true;
    if (scrollRafId) cancelAnimationFrame(scrollRafId);
    scrollRafId = requestAnimationFrame(() => {
        scrollRafId = null;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    });
}

function hasYellowBadge(profileOrMsg = {}) {
    const raw = profileOrMsg?.raw || profileOrMsg || {};
    return Boolean(
        profileOrMsg?.isPro ||
        raw?.isPro ||
        raw?.lencanaKuning ||
        raw?.isLencanaKuning
    );
}

function buildCombinedBadgesHtml(profileOrMsg = {}, badgeClass = 'message-bubble-verif') {
    const isVerified = Boolean(profileOrMsg?.isVerified || profileOrMsg?.senderIsVerified);
    const isPro = hasYellowBadge(profileOrMsg);
    let html = '';

    if (isVerified) {
        html += `<img src="${VERIFIED_BADGE_URL}" class="${badgeClass}" alt="Verified" title="Verified">`;
    }
    if (isPro) {
        html += `<img src="${PRO_BADGE_URL}" class="${badgeClass}" alt="Pro Badge" title="Lencana Pro" style="margin-left: 2px;">`;
    }
    if (!html && profileOrMsg?.badgesHtml) {
        html = getUserBadgesHtml(profileOrMsg, { badgeClass });
    }
    return html;
}

function isPlaceholderName(val) {
    const clean = String(val || '').trim().toLowerCase();
    return !clean || clean === 'mitra sitenexs' || clean === 'user' || clean === 'pengguna';
}

function extractProfileName(profile, fallbackName = '') {
    if (profile) {
        const raw = profile.raw || {};
        const depan = String(raw.namaDepan || profile.firstName || '').trim();
        const belakang = String(raw.namaBelakang || profile.lastName || '').trim();
        const combined = [depan, belakang].filter(Boolean).join(' ').trim();
        const full = String(raw.namaLengkap || profile.displayName || profile.name || '').trim();

        if (!isPlaceholderName(full)) return full;
        if (!isPlaceholderName(combined)) return combined;
    }
    const cleanFallback = String(fallbackName || '').trim();
    return isPlaceholderName(cleanFallback) ? '' : cleanFallback;
}

function getEarlyUid() {
    if (auth.currentUser?.uid) return auth.currentUser.uid;

function getSenderDisplayName(message, ownerUid = currentUid) {
    const isOutgoing = message.senderUid === ownerUid;
    if (isOutgoing) {
        if (!isPlaceholderName(myUserName)) return myUserName;
        const cachedMe = loadCachedProfile(ownerUid);
        if (cachedMe && !isPlaceholderName(cachedMe.name)) return cachedMe.name;
        if (!isPlaceholderName(auth.currentUser?.displayName)) return auth.currentUser.displayName.trim();
        if (!isPlaceholderName(message.senderName)) return String(message.senderName).trim();
        return '';
    }
    if (!isPlaceholderName(otherUserName)) return otherUserName;
    const cachedPeer = loadCachedProfile(message.senderUid || activeChatUserId);
    if (cachedPeer && !isPlaceholderName(cachedPeer.name)) return cachedPeer.name;
    if (!isPlaceholderName(message.senderName)) return String(message.senderName).trim();
    return '';
}

function getSenderBadgesHtml(message, ownerUid = currentUid) {
    const isOutgoing = message.senderUid === ownerUid;
    if (isOutgoing) {
        return myBadgesHtml || loadCachedProfile(ownerUid)?.badgesHtml || buildCombinedBadgesHtml({
            isVerified: message.senderIsVerified,
