<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruang Chat — Komunitas Sitenexs</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Kirim dan terima pesan langsung dengan sesama mitra UMKM serta Sitenexs AI di ekosistem Sitenexs.">
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --danger: #ef4444;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 8px 10px -6px rgba(15, 23, 42, 0.07);
            --radius-full: 9999px;
            --radius-lg: 1rem;
            --radius-xl: 1.25rem;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; height: 100svh; overflow: hidden; font-size: 15px; 
            user-select: none; -webkit-user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body); color: var(--text-main); line-height: 1.5;
            -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 0.75rem;
        }

        a { text-decoration: none; color: inherit; }
        button, input { font-family: inherit; outline: none; border: none; }

        .container { width: 100%; max-width: 800px; height: 100%; max-height: 100%; display: flex; flex-direction: column; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.55rem 1.1rem; font-size: 0.85rem; font-weight: 700;
            border-radius: var(--radius-full); cursor: pointer; transition: var(--transition);
            border: 1px solid transparent; background: #fff; color: var(--text-main);
        }
        .btn-secondary { border: 1px solid var(--border-medium); background: #fff; box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .btn-icon-only { width: 38px; height: 38px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* RUANG CHAT UTAMA */
        .chat-wrapper {
            width: 100%; height: 100%; background: #fafbfc; border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-xl); box-shadow: var(--shadow-md); display: flex; flex-direction: column; 
            overflow: hidden; position: relative;
        }
        
        .chat-header {
            padding: 0.75rem 1.25rem; background: #fff; border-bottom: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; z-index: 10;
            box-shadow: var(--shadow-sm);
        }
        .chat-header-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
        .chat-header-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        .chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-medium); flex-shrink: 0; }
        
        .chat-header-info { min-width: 0; display: flex; flex-direction: column; }
        .chat-header-name-row { display: flex; align-items: center; gap: 0.3rem; min-width: 0; }
        .chat-header-name { font-weight: 850; font-size: 0.98rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header-verif { width: 14px; height: 14px; object-fit: contain; flex-shrink: 0; display: inline-block; }

        /* ISI CHAT */
        .chat-messages {
            flex: 1 1 auto; min-height: 0; padding: 1.25rem; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 0.75rem; background-color: #f8fafc;
            background-image: radial-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px), radial-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1px);
            background-size: 24px 24px; background-position: 0 0, 12px 12px; -webkit-overflow-scrolling: touch;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 10px; }

        .message-wrapper { position: relative; display: flex; flex-direction: column; width: 100%; flex-shrink: 0; }
        .message-wrapper.incoming { align-items: flex-start; }
        .message-wrapper.outgoing { align-items: flex-end; }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(14px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message-bubble {
            max-width: 82%; padding: 0.7rem 0.95rem; border-radius: var(--radius-lg); font-size: 0.88rem;
            line-height: 1.5; word-break: break-word; position: relative; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
            animation: messageSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; background: #fff;
        }

        .message-bubble.incoming { background: #ffffff; color: var(--text-main); border: 1px solid var(--border-subtle); border-bottom-left-radius: 4px; }
        .message-bubble.outgoing { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        .message-time { font-size: 0.65rem; opacity: 0.75; margin-top: 0.3rem; text-align: right; font-weight: 500; }

        /* PRATINJAU PASFOTO / GAMBAR DI DALAM CHAT */
        .chat-image-preview {
            width: 100%; max-width: 220px; border-radius: 8px; overflow: hidden; margin-bottom: 6px;
            border: 1px solid rgba(0,0,0,0.1); background: #000; display: block;
        }
        .chat-image-preview img {
            width: 100%; height: auto; display: block; object-fit: cover; max-height: 280px;
        }

        /* INPUT PESAN */
        .chat-input-box {
            padding: 0.75rem 1.25rem; background: #fff; border-top: 1px solid var(--border-subtle);
            display: flex; align-items: center; gap: 0.75rem; flex: 0 0 auto; z-index: 10;
        }
        .chat-input {
            flex: 1; padding: 0.65rem 1rem; background: var(--bg-body); border: 1px solid var(--border-medium);
            border-radius: var(--radius-full); font-size: 0.88rem; color: var(--text-main);
        }
        .chat-input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        
        .chat-send-btn {
            width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: #fff;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); flex-shrink: 0;
        }

        /* OVERLAY & MODAL VIDEO CALL */
        .vc-overlay {
            position: fixed; inset: 0; background: #0f172a; z-index: 20000;
            display: none; flex-direction: column; justify-content: space-between;
        }
        .vc-overlay.active { display: flex; }

        .vc-remote-container {
            position: relative; width: 100%; height: 100%; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
        }
        #remoteVideo {
            width: 100%; height: 100%; object-fit: cover; background: #1e293b;
        }
        .vc-status-banner {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(8px);
            color: #fff; padding: 0.5rem 1.25rem; border-radius: var(--radius-full);
            font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem;
            border: 1px solid rgba(255,255,255,0.15); z-index: 10; white-space: nowrap;
        }
        .vc-local-container {
            position: absolute; bottom: 105px; right: 20px; width: 115px; height: 165px;
            border-radius: 14px; overflow: hidden; border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); background: #000; z-index: 15;
        }
        #localVideo {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
        }
        .vc-controls {
            position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 1.1rem; z-index: 30;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
            padding: 0.75rem 1.5rem; border-radius: var(--radius-full);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .vc-btn {
            width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 1.15rem; cursor: pointer; transition: var(--transition);
            background: rgba(255,255,255,0.18); color: #fff; pointer-events: auto;
        }
        .vc-btn:hover { background: rgba(255,255,255,0.28); }
        .vc-btn.muted { background: #fff; color: #0f172a; }
        .vc-btn.end-call { background: var(--danger); color: #fff; }
        .vc-btn.end-call:hover { background: #dc2626; transform: scale(1.05); }

        /* POPUP NOTIFIKASI PANGGILAN MASUK (OVERLAY TENGAH LAYAR) */
        .incoming-call-backdrop {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.75);
            backdrop-filter: blur(8px); z-index: 25000;
            display: none; align-items: center; justify-content: center; padding: 1.25rem;
        }
        .incoming-call-backdrop.active { display: flex; }

        .incoming-call-modal {
            width: 100%; max-width: 350px; background: #1e293b; color: #fff;
            padding: 2rem 1.5rem; border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex; flex-direction: column; align-items: center; text-align: center;
            animation: popupScaleIn 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        @keyframes popupScaleIn {
            from { opacity: 0; transform: scale(0.88) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .caller-avatar-ring {
            position: relative; width: 88px; height: 88px; border-radius: 50%;
            margin-bottom: 1rem; display: flex; align-items: center; justify-content: center;
        }
        .caller-avatar-ring::before {
            content: ''; position: absolute; inset: -6px; border-radius: 50%;
            border: 2px solid var(--accent); animation: ringWave 1.6s infinite;
        }
        .caller-avatar-img {
            width: 84px; height: 84px; border-radius: 50%; object-fit: cover;
            border: 3px solid #fff; background: var(--primary);
        }

        @keyframes ringWave {
            0% { transform: scale(0.95); opacity: 0.9; }
            70% { transform: scale(1.22); opacity: 0; }
            100% { transform: scale(1.22); opacity: 0; }
        }

        .incoming-call-actions {
            display: flex; align-items: center; justify-content: center; gap: 2rem;
            margin-top: 1.75rem; width: 100%;
        }
        .call-action-group {
            display: flex; flex-direction: column; align-items: center; gap: 0.45rem;
        }
        .call-action-btn {
            width: 58px; height: 58px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: #fff; cursor: pointer; font-size: 1.35rem;
            transition: transform 0.2s ease;
        }
        .call-action-btn:active { transform: scale(0.92); }
        .call-accept { background: var(--accent); animation: pulseGreen 1.5s infinite; }
        .call-reject { background: var(--danger); }

        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 14px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        #toastContainer { position: fixed; bottom: 24px; right: 24px; z-index: 30000; display: flex; flex-direction: column; gap: 0.5rem; max-width: 340px; }
        .toast { background: #0f172a; color: #fff; padding: 0.85rem 1.15rem; border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 0.75rem; border-left: 4px solid var(--accent); }

        @media (max-width: 768px) {
            html, body { height: 100svh; overflow: hidden; }
            body { padding: 0; }
            .container { max-width: 100%; height: 100svh; max-height: none; }
            .chat-wrapper { border: none; border-radius: 0; height: 100%; }
            .message-bubble { max-width: 88%; }
        }
    </style>
</head>
<body data-package="basic">

    <div id="toastContainer"></div>

    <!-- POPUP PANGGILAN MASUK -->
    <div id="incomingCallBackdrop" class="incoming-call-backdrop">
        <div class="incoming-call-modal">
            <div class="caller-avatar-ring">
                <img id="callerAvatarDisplay" src="" class="caller-avatar-img" alt="Penelepon" onerror="this.src='https://ui-avatars.com/api/?name=User&background=2563eb&color=fff'">
            </div>
            <div style="font-size: 0.8rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 0.25rem;">
                <i class="fas fa-video" style="color: var(--accent); margin-right: 4px;"></i> Panggilan Video Masuk
            </div>
            <div id="callerNameDisplay" style="font-weight: 800; font-size: 1.25rem; color: #fff; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Mitra Sitenexs</div>
            <div style="font-size: 0.82rem; color: #cbd5e1; margin-top: 0.2rem;">Mengajak Anda terhubung secara langsung...</div>

            <div class="incoming-call-actions">
                <div class="call-action-group">
                    <button type="button" class="call-action-btn call-reject" onclick="rejectVideoCall()" title="Tolak">
                        <i class="fas fa-phone-slash"></i>
                    </button>
                    <span style="font-size: 0.75rem; font-weight: 600; color: #cbd5e1;">Tolak</span>
                </div>
                <div class="call-action-group">
                    <button type="button" class="call-action-btn call-accept" onclick="acceptVideoCall()" title="Terima">
                        <i class="fas fa-video"></i>
                    </button>
                    <span style="font-size: 0.75rem; font-weight: 600; color: #cbd5e1;">Terima</span>
                </div>
            </div>
        </div>
    </div>

    <!-- LAYAR UTAMA VIDEO CALL -->
    <div id="vcOverlay" class="vc-overlay">
        <div class="vc-remote-container">
            <div class="vc-status-banner">
                <i class="fas fa-circle" style="color: var(--accent); font-size: 0.6rem;"></i>
                <span id="vcStatusText">Menghubungkan...</span>
            </div>
            <video id="remoteVideo" autoplay playsinline></video>
            <div class="vc-local-container">
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
        </div>
        <div class="vc-controls">
            <button type="button" id="toggleMicBtn" class="vc-btn" onclick="toggleMic()" title="Matikan/Nyalakan Mikrofon">
                <i class="fas fa-microphone"></i>
            </button>
            <button type="button" id="toggleCamBtn" class="vc-btn" onclick="toggleCamera()" title="Matikan/Nyalakan Kamera">
                <i class="fas fa-video"></i>
            </button>
            <button type="button" id="endCallBtn" class="vc-btn end-call" onclick="endVideoCall()" title="Akhiri Panggilan">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
    </div>

    <main class="container">
        <div class="chat-wrapper">
            <!-- HEADER ATAS -->
            <div class="chat-header">
                <div class="chat-header-left">
                    <a href="https://sitenexs.com/community/messages/" class="btn btn-secondary btn-icon-only" title="Kembali"><i class="fas fa-arrow-left"></i></a>
                    <img id="activeChatAvatar" src="" class="chat-header-avatar" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=2563eb&color=fff'">
                    <div class="chat-header-info">
                        <div class="chat-header-name-row">
                            <div class="chat-header-name" id="activeChatName">Memuat...</div>
                            <div id="activeChatBadges" style="display: inline-flex; align-items: center; gap: 2px;"></div>
                        </div>
                    </div>
                </div>
                <div class="chat-header-right">
                    <button type="button" id="startVcBtn" class="btn btn-secondary btn-icon-only" onclick="startVideoCall()" title="Panggilan Video">
                        <i class="fas fa-video" style="color: var(--primary);"></i>
                    </button>
                </div>
            </div>

            <!-- ISI PESAN -->
            <div class="chat-messages" id="chatMessages">
                <div id="loadingState" style="text-align: center; margin: auto; padding: 2rem; color: var(--text-muted); font-size: 0.9rem;">
                    <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary); margin-bottom: 0.75rem;"></i>
                    <div>Memuat pesan...</div>
                </div>
            </div>

            <!-- INPUT PESAN BAWAH -->
            <form class="chat-input-box" id="sendMessageForm" onsubmit="handleChatFormSubmit(event)" autocomplete="off">
                <input type="text" id="messageInput" class="chat-input" placeholder="Tulis pesan Anda..." required autocomplete="off">
                <button type="submit" class="chat-send-btn" title="Kirim Pesan"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </main>

    <!-- FIREBASE (FIRESTORE + REALTIME DB) & WEBRTC SCRIPT -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
        import { getFirestore, doc, getDoc, setDoc, updateDoc, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
        import { getDatabase, ref, set, update, push, onValue, onChildAdded, remove, off } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            databaseURL: 'https://sitenexs-62919-default-rtdb.firebaseio.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761'
        };

        const supabaseUrl = 'https://xqcbyamxiekdxytntlno.supabase.co';
        const avatarBucket = 'profile-photos';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const rtdb = getDatabase(app);
        const auth = getAuth(app);
        
        setPersistence(auth, browserLocalPersistence).catch(err => {});

        let currentUid = null;
        let myUserName = "Mitra Sitenexs";
        let activeChatUserId = null;
        let activeChatId = null;
        let otherUserName = "Mitra Sitenexs";
        let unsubscribeMessages = null;

        // --- VARIABEL WEBRTC & POPUP DERING ---
        let peerConnection = null;
        let localStream = null;
        let remoteStream = null;
        let isMicMuted = false;
        let isCamOff = false;
        let currentSessionId = null;
        let incomingOfferData = null;
        let incomingCallRoomId = null;
        let iceCandidateQueue = [];
        let isInCall = false;
        let isStartingCall = false;
        let ringtoneInterval = null;

        const rtcConfig = {
            iceServers: [
                { urls: 'stun:stun.l.google.com:19302' },
                { urls: 'stun:stun1.l.google.com:19302' },
                { urls: 'stun:stun2.l.google.com:19302' },
                {
                    urls: 'turn:openrelay.metered.ca:80',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                },
                {
                    urls: 'turn:openrelay.metered.ca:443',
                    username: 'openrelayproject',
                    credential: 'openrelayproject'
                }
            ],
            iceCandidatePoolSize: 10
        };

        const urlParams = new URLSearchParams(window.location.search);
        const targetUserId = urlParams.get('to');

        if (!targetUserId) {
            window.location.replace('https://sitenexs.com/community/messages/');
        } else {
            activeChatUserId = targetUserId;
        }

        window.showToast = function(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-info-circle" style="color: var(--accent); font-size: 1rem;"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3500);
        }

        function escapeHtml(text) {
            if (!text) return '';
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }

        function renderMessageBody(text) {
            if (text && text.includes('📋 *LAMARAN KERJA BARU*')) {
                const posMatch = text.match(/🔹 \*Posisi:\* (.*)/);
                const nameMatch = text.match(/👤 \*Nama:\* (.*)/);
                const phoneMatch = text.match(/📞 \*WhatsApp:\* (.*)/);
                const emailMatch = text.match(/📧 \*Email:\* (.*)/);
                const cityMatch = text.match(/🏠 \*Domisili:\* (.*)/);
                const fotoMatch = text.match(/🖼️ \*Link Pasfoto \(Bg Merah\):\* (.*)/);
                const cvMatch = text.match(/📄 \*Link CV:\* (.*)/);
                const ijazahMatch = text.match(/🎓 \*Link Ijazah:\* (.*)/);
                const motivasiMatch = text.match(/💬 \*Motivasi:\*\s*"?([\s\S]*?)"?(?:\n|$)/);

                const position = posMatch ? posMatch[1].trim() : 'Pekerjaan';
                const name = nameMatch ? nameMatch[1].trim() : '-';
                const phone = phoneMatch ? phoneMatch[1].trim() : '-';
                const email = emailMatch ? emailMatch[1].trim() : '-';
                const city = cityMatch ? cityMatch[1].trim() : '-';
                const pasfotoUrl = fotoMatch ? fotoMatch[1].trim() : '';
                const cvUrl = cvMatch ? cvMatch[1].trim() : '-';
                const ijazahUrl = ijazahMatch ? ijazahMatch[1].trim() : '#';
                
                let motivasi = motivasiMatch ? motivasiMatch[1].trim() : '-';
                if (!motivasi || motivasi === '') {
                    const parts = text.split('💬 *Motivasi:*');
                    if (parts.length > 1) {
                        motivasi = parts[1].trim().replace(/^"/, '').replace(/"$/, '');
                    }
                }

                return `
                    <div style="background: rgba(0,0,0,0.03); border: 1px solid var(--border-subtle); border-radius: 10px; padding: 12px; font-size: 0.82rem; text-align: left;">
                        <div style="font-weight: 800; font-size: 0.95rem; margin-bottom: 8px; color: var(--primary); display: flex; align-items: center; gap: 6px;">
                            <i class="fas fa-briefcase"></i> Lamaran Kerja: ${position}
                        </div>
                        ${pasfotoUrl ? `
                            <div style="margin-bottom: 10px;">
                                <div style="font-size: 0.72rem; font-weight: 700; margin-bottom: 3px; color: var(--text-muted);">Pasfoto Formal (Bg Merah):</div>
                                <div class="chat-image-preview"><a href="${pasfotoUrl}" target="_blank"><img src="${pasfotoUrl}" alt="Pasfoto"></a></div>
                            </div>
                        ` : ''}
                        <div style="display: flex; flex-direction: column; gap: 3px; margin-bottom: 8px;">
                            <div><b>Nama:</b> ${name}</div>
                            <div><b>WhatsApp:</b> ${phone}</div>
                            <div><b>Email:</b> ${email}</div>
                            <div><b>Domisili:</b> ${city}</div>
                        </div>
                        ${motivasi && motivasi !== '-' ? `
                            <div style="background: #fff; border-left: 3px solid var(--primary); padding: 8px; border-radius: 4px; margin-bottom: 10px; font-size: 0.78rem;">
                                <div style="font-weight: 700; margin-bottom: 2px; color: var(--primary);">Ringkasan & Motivasi:</div>
                                <div style="font-style: italic; opacity: 0.9; white-space: pre-wrap;">${escapeHtml(motivasi)}</div>
                            </div>
                        ` : ''}
                        <div style="display: flex; gap: 6px; flex-wrap: wrap;">
                            ${cvUrl !== '-' ? `<a href="${cvUrl}" target="_blank" class="btn" style="padding: 4px 10px; font-size: 0.75rem; background: var(--primary); color: #fff;"><i class="fas fa-file-pdf"></i> CV</a>` : ''}
                            ${ijazahUrl !== '#' ? `<a href="${ijazahUrl}" target="_blank" class="btn" style="padding: 4px 10px; font-size: 0.75rem; background: var(--accent); color: #fff;"><i class="fas fa-certificate"></i> Ijazah</a>` : ''}
                        </div>
                    </div>
                `;
            }
            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        // ==========================================
        // EFEK NADA DERING & POPUP PANGGILAN MASUK
        // ==========================================
        function playRingtoneOnce() {
            try {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                if (!AudioCtx) return;
                const ctx = new AudioCtx();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(523.25, ctx.currentTime);
                osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.15, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + 0.45);
            } catch (e) {}
        }

        function showIncomingCallPopup(callerUid, callerName, sessionId, offer, roomId) {
            currentSessionId = sessionId;
            incomingOfferData = offer;
            incomingCallRoomId = roomId;

            const avatarUrl = `${supabaseUrl}/storage/v1/object/public/${avatarBucket}/${encodeURIComponent(callerUid)}/profile-photo`;
            document.getElementById('callerAvatarDisplay').src = avatarUrl;
            document.getElementById('callerNameDisplay').innerText = callerName || otherUserName;
            document.getElementById('incomingCallBackdrop').classList.add('active');

            if (navigator.vibrate) {
                navigator.vibrate([300, 200, 300]);
            }
            playRingtoneOnce();
            if (ringtoneInterval) clearInterval(ringtoneInterval);
            ringtoneInterval = setInterval(() => {
                if (navigator.vibrate) navigator.vibrate([300, 200, 300]);
                playRingtoneOnce();
            }, 2200);
        }

        function hideIncomingCallPopup() {
            document.getElementById('incomingCallBackdrop').classList.remove('active');
            if (ringtoneInterval) {
                clearInterval(ringtoneInterval);
                ringtoneInterval = null;
            }
        }

        // ==========================================
        // LOGIKA VIDEO CALL (WEBRTC + REALTIME DB)
        // ==========================================
        async function setupLocalMedia() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user' },
                    audio: true
                });
                const localVideoEl = document.getElementById('localVideo');
                localVideoEl.srcObject = localStream;
                localVideoEl.play().catch(() => {});
                return true;
            } catch (err) {
                showToast("Izin kamera atau mikrofon ditolak: " + err.message);
                return false;
            }
        }

        async function flushIceCandidateQueue() {
            while (iceCandidateQueue.length > 0 && peerConnection && peerConnection.remoteDescription) {
                const candidate = iceCandidateQueue.shift();
                try {
                    await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
                } catch (e) {}
            }
        }

        function createPeerConnection(roomId, sessionId, isCaller) {
            iceCandidateQueue = [];
            peerConnection = new RTCPeerConnection(rtcConfig);
            remoteStream = new MediaStream();
            
            const remoteVideoEl = document.getElementById('remoteVideo');
            remoteVideoEl.srcObject = remoteStream;

            localStream.getTracks().forEach(track => {
                peerConnection.addTrack(track, localStream);
            });

            peerConnection.ontrack = (event) => {
                if (event.streams && event.streams[0]) {
                    event.streams[0].getTracks().forEach(track => {
                        remoteStream.addTrack(track);
                    });
                } else {
                    remoteStream.addTrack(event.track);
                }
                remoteVideoEl.play().catch(() => {});
                document.getElementById('vcStatusText').innerText = otherUserName;
            };

            const localCandidatesPath = isCaller ? 'callerCandidates' : 'calleeCandidates';
            const remoteCandidatesPath = isCaller ? 'calleeCandidates' : 'callerCandidates';

            const localCandidatesRef = ref(rtdb, `calls/${roomId}/${localCandidatesPath}`);
            peerConnection.onicecandidate = (event) => {
                if (event.candidate) {
                    push(localCandidatesRef, {
                        sessionId: sessionId,
                        candidate: event.candidate.toJSON()
                    }).catch(() => {});
                }
            };

            const remoteCandidatesRef = ref(rtdb, `calls/${roomId}/${remoteCandidatesPath}`);
            onChildAdded(remoteCandidatesRef, async (snapshot) => {
                const val = snapshot.val();
                if (!val || !val.candidate || val.sessionId !== sessionId || !peerConnection) return;

                if (peerConnection.remoteDescription && peerConnection.remoteDescription.type) {
                    try {
                        await peerConnection.addIceCandidate(new RTCIceCandidate(val.candidate));
                    } catch (e) {}
                } else {
                    iceCandidateQueue.push(val.candidate);
                }
            });

            peerConnection.oniceconnectionstatechange = () => {
                if (!peerConnection) return;
                const state = peerConnection.iceConnectionState;
                if (state === 'connected' || state === 'completed') {
                    document.getElementById('vcStatusText').innerText = otherUserName;
                    remoteVideoEl.play().catch(() => {});
                } else if (state === 'checking') {
                    document.getElementById('vcStatusText').innerText = "Menyambungkan jaringan...";
                } else if (state === 'failed') {
                    showToast("Koneksi jaringan gagal (NAT/Firewall).");
                    endVideoCall();
                }
            };
        }

        // 1. MEMULAI PANGGILAN (CALLER)
        window.startVideoCall = async function() {
            if (!activeChatId || !currentUid) {
                showToast("Sesi akun belum siap.");
                return;
            }
            if (isStartingCall || isInCall) return;

            isStartingCall = true;
            const mediaReady = await setupLocalMedia();
            if (!mediaReady) {
                isStartingCall = false;
                return;
            }

            const newSessionId = `${currentUid}_${Date.now()}`;
            currentSessionId = newSessionId;
            incomingCallRoomId = activeChatId;
            document.getElementById('vcOverlay').classList.add('active');
            document.getElementById('vcStatusText').innerText = `Memanggil ${otherUserName}...`;

            const roomRef = ref(rtdb, `calls/${activeChatId}`);

            try {
                createPeerConnection(activeChatId, newSessionId, true);

                const offerDescription = await peerConnection.createOffer({
                    offerToReceiveAudio: true,
                    offerToReceiveVideo: true
                });
                await peerConnection.setLocalDescription(offerDescription);

                const callPayload = {
                    roomId: activeChatId,
                    sessionId: newSessionId,
                    callerUid: currentUid,
                    callerName: myUserName,
                    calleeUid: activeChatUserId,
                    status: 'ringing',
                    offer: {
                        type: offerDescription.type,
                        sdp: offerDescription.sdp
                    },
                    timestamp: Date.now()
                };

                // Simpan di calls/{activeChatId} & kirim notifikasi popup ke incomingCalls/{calleeUid}
                await set(roomRef, callPayload);
                await set(ref(rtdb, `incomingCalls/${activeChatUserId}`), callPayload);

                isInCall = true;
                isStartingCall = false;

            } catch (err) {
                isStartingCall = false;
                showToast("Gagal menelepon (Cek RTDB): " + err.message);
                cleanupCallUI();
            }
        };

        // 2. MENERIMA PANGGILAN (CALLEE)
        window.acceptVideoCall = async function() {
            hideIncomingCallPopup();
            if (!incomingOfferData || !currentSessionId) return;

            const targetRoomId = incomingCallRoomId || activeChatId;
            const mediaReady = await setupLocalMedia();
            if (!mediaReady) {
                rejectVideoCall();
                return;
            }

            isInCall = true;
            document.getElementById('vcOverlay').classList.add('active');
            document.getElementById('vcStatusText').innerText = "Menghubungkan...";

            // Bersihkan antrean popup dering di incomingCalls/{currentUid}
            if (currentUid) {
                remove(ref(rtdb, `incomingCalls/${currentUid}`)).catch(() => {});
            }

            createPeerConnection(targetRoomId, currentSessionId, false);

            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(incomingOfferData));
                await flushIceCandidateQueue();

                const answerDescription = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answerDescription);

                await update(ref(rtdb, `calls/${targetRoomId}`), {
                    status: 'connected',
                    answer: {
                        type: answerDescription.type,
                        sdp: answerDescription.sdp
                    }
                });

                // Pantau jika penelepon memutus panggilan saat terhubung di room berbeda
                if (targetRoomId !== activeChatId) {
                    onValue(ref(rtdb, `calls/${targetRoomId}`), (snap) => {
                        if (!snap.exists() && isInCall) {
                            showToast("Panggilan berakhir.");
                            cleanupCallUI();
                        }
                    });
                }

            } catch (err) {
                showToast("Gagal menerima panggilan: " + err.message);
                cleanupCallUI();
            }
        };

        // 3. MENOLAK PANGGILAN
        window.rejectVideoCall = function() {
            const targetRoomId = incomingCallRoomId || activeChatId;
            hideIncomingCallPopup();
            if (currentUid) {
                remove(ref(rtdb, `incomingCalls/${currentUid}`)).catch(() => {});
            }
            if (targetRoomId) {
                update(ref(rtdb, `calls/${targetRoomId}`), {
                    status: 'rejected'
                }).catch(() => {});
            }
            incomingOfferData = null;
            currentSessionId = null;
            incomingCallRoomId = null;
        };

        // 4. MENGAKHIRI PANGGILAN
        window.endVideoCall = function() {
            const roomToRemove = incomingCallRoomId || activeChatId;
            const calleeToRemove = activeChatUserId;
            const myUidToRemove = currentUid;

            cleanupCallUI();

            if (roomToRemove) {
                remove(ref(rtdb, `calls/${roomToRemove}`)).catch(() => {});
            }
            if (calleeToRemove) {
                remove(ref(rtdb, `incomingCalls/${calleeToRemove}`)).catch(() => {});
            }
            if (myUidToRemove) {
                remove(ref(rtdb, `incomingCalls/${myUidToRemove}`)).catch(() => {});
            }
        };

        function cleanupCallUI() {
            isInCall = false;
            isStartingCall = false;
            hideIncomingCallPopup();
            document.getElementById('vcOverlay').classList.remove('active');

            if (localStream) {
                try { localStream.getTracks().forEach(track => track.stop()); } catch (e) {}
                localStream = null;
            }
            if (peerConnection) {
                try { peerConnection.close(); } catch (e) {}
                peerConnection = null;
            }
            document.getElementById('localVideo').srcObject = null;
            document.getElementById('remoteVideo').srcObject = null;

            const roomToClean = incomingCallRoomId || activeChatId;
            if (roomToClean) {
                off(ref(rtdb, `calls/${roomToClean}/callerCandidates`));
                off(ref(rtdb, `calls/${roomToClean}/calleeCandidates`));
            }

            currentSessionId = null;
            incomingOfferData = null;
            incomingCallRoomId = null;
            iceCandidateQueue = [];
            isMicMuted = false;
            isCamOff = false;
            document.getElementById('toggleMicBtn').classList.remove('muted');
            document.getElementById('toggleMicBtn').innerHTML = '<i class="fas fa-microphone"></i>';
            document.getElementById('toggleCamBtn').classList.remove('muted');
            document.getElementById('toggleCamBtn').innerHTML = '<i class="fas fa-video"></i>';
        }

        window.toggleMic = function() {
            if (!localStream) return;
            isMicMuted = !isMicMuted;
            localStream.getAudioTracks().forEach(track => track.enabled = !isMicMuted);
            const btn = document.getElementById('toggleMicBtn');
            btn.classList.toggle('muted', isMicMuted);
            btn.innerHTML = isMicMuted ? '<i class="fas fa-microphone-slash"></i>' : '<i class="fas fa-microphone"></i>';
        };

        window.toggleCamera = function() {
            if (!localStream) return;
            isCamOff = !isCamOff;
            localStream.getVideoTracks().forEach(track => track.enabled = !isCamOff);
            const btn = document.getElementById('toggleCamBtn');
            btn.classList.toggle('muted', isCamOff);
            btn.innerHTML = isCamOff ? '<i class="fas fa-video-slash"></i>' : '<i class="fas fa-video"></i>';
        };

        // LISTENER PANGGILAN (MEMANTAU RUANG CHAT AKTIF + KOTAK MASUK USER)
        function listenToCallRoom() {
            // 1. Listener ruang chat aktif (untuk status connected/rejected/ended)
            const roomRef = ref(rtdb, `calls/${activeChatId}`);
            onValue(roomRef, async (snapshot) => {
                const data = snapshot.val();

                if (isStartingCall) return;

                if (!data) {
                    hideIncomingCallPopup();
                    if (isInCall) {
                        showToast("Panggilan berakhir.");
                        cleanupCallUI();
                    }
                    return;
                }

                if (data.status === 'ringing' && data.timestamp && (Date.now() - data.timestamp > 60000)) {
                    remove(roomRef).catch(() => {});
                    return;
                }

                // Tampilkan popup jika kita penerima
                if (data.calleeUid === currentUid && data.status === 'ringing' && data.offer && !isInCall) {
                    showIncomingCallPopup(data.callerUid, data.callerName, data.sessionId, data.offer, activeChatId);
                }

                // Tangani jawaban jika kita penelepon
                if (data.callerUid === currentUid && isInCall && data.sessionId === currentSessionId) {
                    if (data.status === 'rejected') {
                        showToast("Panggilan ditolak.");
                        cleanupCallUI();
                        remove(roomRef).catch(() => {});
                        return;
                    }
                    if (data.answer && peerConnection && !peerConnection.currentRemoteDescription) {
                        try {
                            await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                            await flushIceCandidateQueue();
                            document.getElementById('vcStatusText').innerText = otherUserName;
                        } catch (e) {}
                    }
                }
            }, (error) => {
                showToast("Koneksi RTDB ditolak: " + error.message);
            });

            // 2. Listener kotak masuk panggilan user (agar popup muncul walau sedang buka chat user lain)
            const myIncomingRef = ref(rtdb, `incomingCalls/${currentUid}`);
            onValue(myIncomingRef, (snapshot) => {
                const data = snapshot.val();
                if (!data) {
                    if (!isInCall) hideIncomingCallPopup();
                    return;
                }
                if (data.timestamp && (Date.now() - data.timestamp > 60000)) {
                    remove(myIncomingRef).catch(() => {});
                    return;
                }
                if (data.calleeUid === currentUid && data.status === 'ringing' && data.offer && !isInCall) {
                    showIncomingCallPopup(data.callerUid, data.callerName, data.sessionId, data.offer, data.roomId || activeChatId);
                }
            });
        }

        // ==========================================
        // INISIALISASI CHAT
        // ==========================================
        async function initChat(user) {
            currentUid = user.uid;
            const participants = [currentUid, activeChatUserId].sort();
            activeChatId = `${participants[0]}_${participants[1]}`;

            // Mulai pantau sinyal Video Call
            listenToCallRoom();

            try {
                await updateDoc(doc(db, "chats", activeChatId), { [`unread_${currentUid}`]: false });
            } catch(e) {}

            // Ambil nama kita sendiri
            try {
                const mySnap = await getDoc(doc(db, "users", currentUid));
                if (mySnap.exists()) {
                    const md = mySnap.data();
                    myUserName = md.namaLengkap || (md.namaDepan + (md.namaBelakang ? ' ' + md.namaBelakang : '')) || myUserName;
                }
            } catch(e) {}

            // Ambil data lawan bicara
            try {
                const userSnap = await getDoc(doc(db, "users", activeChatUserId));
                if (userSnap.exists()) {
                    const d = userSnap.data();
                    otherUserName = d.namaLengkap || (d.namaDepan + (d.namaBelakang ? ' ' + d.namaBelakang : '')) || otherUserName;
                    
                    let badgesHtml = '';
                    if (d.isVerified) {
                        badgesHtml += `<img src="https://sitenexs.com/assets/logo/verified.png" class="chat-header-verif" alt="Verified">`;
                    }
                    document.getElementById('activeChatBadges').innerHTML = badgesHtml;
                }
            } catch(e) {}

            const avatarUrl = `${supabaseUrl}/storage/v1/object/public/${avatarBucket}/${encodeURIComponent(activeChatUserId)}/profile-photo`;
            document.getElementById('activeChatName').innerText = otherUserName;
            document.getElementById('activeChatAvatar').src = avatarUrl;

            const messagesRef = collection(db, "chats", activeChatId, "messages");
            const qMsgs = query(messagesRef, orderBy("createdAt", "asc"));

            if (unsubscribeMessages) unsubscribeMessages();

            unsubscribeMessages = onSnapshot(qMsgs, (snapshot) => {
                const messagesContainer = document.getElementById('chatMessages');
                const loadingState = document.getElementById('loadingState');
                if (loadingState) loadingState.remove();

                let html = '';
                snapshot.forEach(docSnap => {
                    const m = docSnap.data();
                    const isOutgoing = m.senderUid === currentUid;
                    const timeStr = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Baru saja';

                    html += `
                        <div class="message-wrapper ${isOutgoing ? 'outgoing' : 'incoming'}">
                            <div class="message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}">
                                ${renderMessageBody(m.text || '')}
                                <div class="message-time">${timeStr}</div>
                            </div>
                        </div>
                    `;
                });

                messagesContainer.innerHTML = html;
                messagesContainer.scrollTop = messagesContainer.scrollHeight;
            });
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                initChat(user);
            } else {
                const savedUid = localStorage.getItem('sitenexs_uid');
                if (savedUid) {
                    initChat({ uid: savedUid });
                } else {
                    window.location.replace("https://account.sitenexs.com/sign-in/");
                }
            }
        });

        window.handleChatFormSubmit = async function(event) {
            event.preventDefault();
            const inputEl = document.getElementById('messageInput');
            const text = inputEl.value.trim();
            if (!text || !activeChatId || !currentUid) return;

            inputEl.value = '';

            try {
                const recipientUid = activeChatUserId;
                const chatDocRef = doc(db, "chats", activeChatId);
                
                await setDoc(chatDocRef, {
                    participants: [currentUid, activeChatUserId],
                    lastMessage: text,
                    lastTimestamp: serverTimestamp(),
                    [`unread_${recipientUid}`]: true
                }, { merge: true });

                await addDoc(collection(db, "chats", activeChatId, "messages"), {
                    senderUid: currentUid,
                    text: text,
                    createdAt: serverTimestamp(),
                    isEdited: false
                });

            } catch (err) {
                showToast("Gagal mengirim pesan.");
            }
        }
    </script>
