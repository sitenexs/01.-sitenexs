<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ruang Chat — Komunitas Sitenexs</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Kirim dan terima pesan langsung dengan sesama mitra UMKM serta Sitenexs AI di ekosistem Sitenexs.">
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --danger: #ef4444;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 8px 10px -6px rgba(15, 23, 42, 0.07);
            --radius-full: 9999px;
            --radius-lg: 1rem;
            --radius-xl: 1.25rem;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; height: 100svh; overflow: hidden; font-size: 15px; 
            user-select: none; -webkit-user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body); color: var(--text-main); line-height: 1.5;
            -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 0.75rem;
        }

        a { text-decoration: none; color: inherit; }
        button, input { font-family: inherit; outline: none; border: none; }

        .container { width: 100%; max-width: 800px; height: 100%; max-height: 100%; display: flex; flex-direction: column; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.55rem 1.1rem; font-size: 0.85rem; font-weight: 700;
            border-radius: var(--radius-full); cursor: pointer; transition: var(--transition);
            border: 1px solid transparent; background: #fff; color: var(--text-main);
        }
        .btn-secondary { border: 1px solid var(--border-medium); background: #fff; box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .btn-icon-only { width: 38px; height: 38px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* BANNER IZIN NOTIFIKASI HP */
        .notif-permission-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.65rem 1.15rem;
            background: #eff6ff;
            border-bottom: 1px solid #bfdbfe;
            font-size: 0.8rem;
            color: #1e3a8a;
            flex: 0 0 auto;
        }
        .notif-permission-banner.active { display: flex; }
        .notif-enable-btn {
            background: var(--primary);
            color: #fff;
            padding: 0.38rem 0.85rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* BANNER SEDANG ADA PANGGILAN (DI BAWAH NAVBAR) */
        .active-call-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.6rem 1.15rem;
            background: linear-gradient(90deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 700;
            flex: 0 0 auto;
            z-index: 9;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            transition: var(--transition);
        }
        .active-call-banner:hover {
            filter: brightness(1.04);
        }
        .active-call-banner.active {
            display: flex;
        }
        .active-call-banner-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 0;
        }
        .active-call-pulse {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ffffff;
            flex-shrink: 0;
            animation: callBannerPulse 1.3s infinite ease-in-out;
        }
        @keyframes callBannerPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.45); opacity: 0.55; }
        }
        .active-call-banner-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .active-call-banner-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(255, 255, 255, 0.22);
            padding: 0.28rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.74rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        /* RUANG CHAT UTAMA */
        .chat-wrapper {
            width: 100%; height: 100%; background: #fafbfc; border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-xl); box-shadow: var(--shadow-md); display: flex; flex-direction: column; 
            overflow: hidden; position: relative;
        }
        
        .chat-header {
            padding: 0.75rem 1.25rem; background: #fff; border-bottom: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; z-index: 10;
            box-shadow: var(--shadow-sm);
        }
        .chat-header-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
        .chat-header-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        .chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-medium); flex-shrink: 0; }
        
        .chat-header-info { min-width: 0; display: flex; flex-direction: column; }
        .chat-header-name-row { display: flex; align-items: center; gap: 0.3rem; min-width: 0; }
        .chat-header-name { font-weight: 850; font-size: 0.98rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header-verif { width: 14px; height: 14px; object-fit: contain; flex-shrink: 0; display: inline-block; }

        /* ISI CHAT */
        .chat-messages {
            flex: 1 1 auto; min-height: 0; padding: 1.25rem; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 0.75rem; background-color: #f8fafc;
            background-image: radial-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px), radial-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1px);
            background-size: 24px 24px; background-position: 0 0, 12px 12px; -webkit-overflow-scrolling: touch;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 10px; }

        .message-wrapper { position: relative; display: flex; flex-direction: column; width: 100%; flex-shrink: 0; }
        .message-wrapper.incoming { align-items: flex-start; }
        .message-wrapper.outgoing { align-items: flex-end; }

        @keyframes messageSlideIn {
            from { opacity: 0; transform: translateY(14px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message-bubble {
            max-width: 82%; padding: 0.7rem 0.95rem; border-radius: var(--radius-lg); font-size: 0.88rem;
            line-height: 1.5; word-break: break-word; position: relative; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
            animation: messageSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards; background: #fff;
        }

        .message-bubble.incoming { background: #ffffff; color: var(--text-main); border: 1px solid var(--border-subtle); border-bottom-left-radius: 4px; }
        .message-bubble.outgoing { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        .message-time { font-size: 0.65rem; opacity: 0.75; margin-top: 0.3rem; text-align: right; font-weight: 500; }

        /* KARTU RIWAYAT PANGGILAN DI CHAT */
        .call-log-card {
            display: flex; align-items: center; gap: 0.75rem; min-width: 195px;
        }
        .call-log-icon {
            width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 0.95rem; flex-shrink: 0;
        }
        .message-bubble.outgoing .call-log-icon {
            background: rgba(255, 255, 255, 0.2); color: #fff;
        }
        .message-bubble.incoming .call-log-icon {
            background: var(--primary-light); color: var(--primary);
        }
        .message-bubble.incoming .call-log-icon.missed {
            background: #fef2f2; color: var(--danger);
        }
        .call-log-info {
            display: flex; flex-direction: column; text-align: left;
        }
        .call-log-title {
            font-weight: 700; font-size: 0.85rem; line-height: 1.3;
        }
        .call-log-sub {
            font-size: 0.74rem; opacity: 0.82; margin-top: 2px;
        }

        /* PRATINJAU PASFOTO / GAMBAR DI DALAM CHAT */
        .chat-image-preview {
            width: 100%; max-width: 220px; border-radius: 8px; overflow: hidden; margin-bottom: 6px;
            border: 1px solid rgba(0,0,0,0.1); background: #000; display: block;
        }
        .chat-image-preview img {
            width: 100%; height: auto; display: block; object-fit: cover; max-height: 280px;
        }

        /* INPUT PESAN */
        .chat-input-box {
            padding: 0.75rem 1.25rem; background: #fff; border-top: 1px solid var(--border-subtle);
            display: flex; align-items: center; gap: 0.75rem; flex: 0 0 auto; z-index: 10;
        }
        .chat-input {
            flex: 1; padding: 0.65rem 1rem; background: var(--bg-body); border: 1px solid var(--border-medium);
            border-radius: var(--radius-full); font-size: 0.88rem; color: var(--text-main);
        }
        .chat-input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        
        .chat-send-btn {
            width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: #fff;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); flex-shrink: 0;
        }

        #toastContainer { position: fixed; bottom: 24px; right: 24px; z-index: 30000; display: flex; flex-direction: column; gap: 0.5rem; max-width: 340px; }
        .toast { background: #0f172a; color: #fff; padding: 0.85rem 1.15rem; border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 0.75rem; border-left: 4px solid var(--accent); }

        @media (max-width: 768px) {
            html, body { height: 100svh; overflow: hidden; }
            body { padding: 0; }
            .container { max-width: 100%; height: 100svh; max-height: none; }
            .chat-wrapper { border: none; border-radius: 0; height: 100%; }
            .message-bubble { max-width: 88%; }
        }
    </style>
</head>
<body data-package="basic">

    <div id="toastContainer"></div>

    <main class="container">
        <div class="chat-wrapper">
            <!-- BANNER AKTIFKAN PUSH NOTIFIKASI HP -->
            <div id="notifPermissionBanner" class="notif-permission-banner">
                <span><i class="fas fa-bell" style="margin-right: 5px;"></i> Aktifkan notifikasi agar pesan & panggilan masuk muncul di HP.</span>
                <button type="button" class="notif-enable-btn" onclick="requestPushNotificationPermission()">Aktifkan</button>
            </div>

            <!-- HEADER ATAS -->
            <div class="chat-header">
                <div class="chat-header-left">
                    <a href="https://sitenexs.com/community/messages/" class="btn btn-secondary btn-icon-only" title="Kembali"><i class="fas fa-arrow-left"></i></a>
                    <img id="activeChatAvatar" src="" class="chat-header-avatar" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=2563eb&color=fff'">
                    <div class="chat-header-info">
                        <div class="chat-header-name-row">
                            <div class="chat-header-name" id="activeChatName">Memuat...</div>
                            <div id="activeChatBadges" style="display: inline-flex; align-items: center; gap: 2px;"></div>
                        </div>
                    </div>
                </div>
                <div class="chat-header-right">
                    <button type="button" id="notifBellBtn" class="btn btn-secondary btn-icon-only" onclick="requestPushNotificationPermission()" title="Notifikasi HP">
                        <i class="fas fa-bell" style="color: var(--text-muted);"></i>
                    </button>
                    <button type="button" id="startVoiceBtn" class="btn btn-secondary btn-icon-only" onclick="openCallPage('audio')" title="Panggilan Suara">
                        <i class="fas fa-phone" style="color: var(--accent);"></i>
                    </button>
                    <button type="button" id="startVcBtn" class="btn btn-secondary btn-icon-only" onclick="openCallPage('video')" title="Panggilan Video">
                        <i class="fas fa-video" style="color: var(--primary);"></i>
                    </button>
                </div>
            </div>

            <!-- NOTIFIKASI DI BAWAH NAVBAR SAAT SEDANG ADA PANGGILAN -->
            <div id="activeCallBanner" class="active-call-banner" onclick="returnToOngoingCall()" role="button" tabindex="0">
                <div class="active-call-banner-left">
                    <span class="active-call-pulse"></span>
                    <i id="activeCallBannerIcon" class="fas fa-phone-alt"></i>
                    <span id="activeCallBannerText" class="active-call-banner-text">Sedang ada panggilan berlangsung</span>
                </div>
                <span class="active-call-banner-cta">
                    <span>Masuk</span>
                    <i class="fas fa-chevron-right"></i>
                </span>
            </div>

            <!-- ISI PESAN -->
            <div class="chat-messages" id="chatMessages">
                <div id="loadingState" style="text-align: center; margin: auto; padding: 2rem; color: var(--text-muted); font-size: 0.9rem;">
                    <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary); margin-bottom: 0.75rem;"></i>
                    <div>Memuat pesan...</div>
                </div>
            </div>

            <!-- INPUT PESAN BAWAH -->
            <form class="chat-input-box" id="sendMessageForm" onsubmit="handleChatFormSubmit(event)" autocomplete="off">
                <input type="text" id="messageInput" class="chat-input" placeholder="Tulis pesan Anda..." required autocomplete="off">
                <button type="submit" class="chat-send-btn" title="Kirim Pesan"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </main>

 <script type="module">
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';

import {
    doc,
    setDoc,
    updateDoc,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

import {
    ref,
    onValue,
    remove
} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js';

import {
    app,
    db,
    rtdb,
    auth,
    PUSH_WORKER_URL
} from 'https://sitenexs.com/assets/js/sitenexs-config.js';

import {
    fetchUserProfile,
    getUserAvatarUrl
} from 'https://sitenexs.com/assets/js/sitenexs-user-data.js';

import {
    registerPushServiceWorker,
    syncFcmToken,
    listenForegroundMessages,
    triggerLocalSystemNotification,
    sendPushNotification
} from 'https://sitenexs.com/assets/js/sitenexs-push-client.js';

const CALL_PAGE_URL = 'https://sitenexs.com/community/messages/call/';

let currentUid = null;
let myProfile = null;
let myUserName = 'Mitra Sitenexs';

let activeChatUserId = null;
let activeChatId = null;
let otherProfile = null;
let otherUserName = 'Mitra Sitenexs';
let otherUserFcmToken = null;

let unsubscribeMessages = null;
let unsubscribeIncomingCalls = null;
let unsubscribeActiveCallRoom = null;
let isInitialMessagesLoad = true;
let lastNotifiedMessageId = null;
let isRedirectingToCall = false;
let ongoingCallTarget = null;

const urlParams = new URLSearchParams(window.location.search);
const targetUserId = urlParams.get('to');

if (!targetUserId) {
    window.location.replace('https://sitenexs.com/community/messages/');
} else {
    activeChatUserId = targetUserId;
}

window.showToast = function (msg) {
    const container = document.getElementById('toastContainer');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = 'toast';

    const icon = document.createElement('i');
    icon.className = 'fas fa-info-circle';
    icon.style.color = 'var(--accent)';

    const text = document.createElement('span');
    text.textContent = msg;

    toast.append(icon, text);
    container.appendChild(toast);

    setTimeout(() => toast.remove(), 3500);
};

window.openCallPage = function (callType = 'video') {
    if (!activeChatUserId || isRedirectingToCall) return;
    isRedirectingToCall = true;
    const callUrl = new URL(CALL_PAGE_URL);
    callUrl.searchParams.set('to', activeChatUserId);
    callUrl.searchParams.set('mode', 'outgoing');
    callUrl.searchParams.set('type', callType === 'audio' ? 'audio' : 'video');
    window.location.href = callUrl.toString();
};

function setOngoingCallBanner(show, info = null) {
    const banner = document.getElementById('activeCallBanner');
    const textEl = document.getElementById('activeCallBannerText');
    const iconEl = document.getElementById('activeCallBannerIcon');
    if (!banner) return;

    if (!show || !info) {
        ongoingCallTarget = null;
        banner.classList.remove('active');
        return;
    }

    ongoingCallTarget = info;
    const isAudio = info.callType === 'audio';
    if (iconEl) {
        iconEl.className = isAudio ? 'fas fa-phone-alt' : 'fas fa-video';
    }
    if (textEl) {
        const peerLabel = info.peerName || otherUserName || 'Mitra Sitenexs';
        textEl.textContent = isAudio
            ? `Sedang ada panggilan suara dengan ${peerLabel}`
            : `Sedang ada panggilan video dengan ${peerLabel}`;
    }
    banner.classList.add('active');
}

window.returnToOngoingCall = function () {
    if (isRedirectingToCall) return;
    isRedirectingToCall = true;

    const callUrl = new URL(CALL_PAGE_URL);
    if (ongoingCallTarget?.roomId) {
        callUrl.searchParams.set('roomId', ongoingCallTarget.roomId);
    }
    callUrl.searchParams.set('to', ongoingCallTarget?.peerUid || activeChatUserId || '');
    callUrl.searchParams.set('mode', ongoingCallTarget?.mode || 'outgoing');
    callUrl.searchParams.set('type', ongoingCallTarget?.callType === 'audio' ? 'audio' : 'video');
    window.location.href = callUrl.toString();
};

function watchOngoingCallInRoom(callId, fallbackPeerUid, fallbackCallType) {
    if (unsubscribeActiveCallRoom) {
        unsubscribeActiveCallRoom();
        unsubscribeActiveCallRoom = null;
    }
    if (!callId) {
        setOngoingCallBanner(false);
        return;
    }

    const callRef = ref(rtdb, `calls/${callId}`);
    unsubscribeActiveCallRoom = onValue(callRef, snapshot => {
        const data = snapshot.val();
        if (!data || data.status === 'ended' || data.status === 'rejected') {
            setOngoingCallBanner(false);
            return;
        }

        const isParticipant =
            (currentUid && data.participants && Boolean(data.participants[currentUid])) ||
            data.callerUid === currentUid ||
            data.calleeUid === currentUid;

        if (!isParticipant) {
            setOngoingCallBanner(false);
            return;
        }

        const peerUid = data.callerUid === currentUid
            ? (data.calleeUid || fallbackPeerUid)
            : (data.callerUid || fallbackPeerUid);
        const peerName = data.callerUid === currentUid
            ? otherUserName
            : (data.callerName || otherUserName);

        setOngoingCallBanner(true, {
            roomId: callId,
            peerUid,
            peerName,
            callType: data.callType || fallbackCallType || 'video',
            mode: 'outgoing'
        });
    });
}

function updateNotificationUIState() {
    const banner = document.getElementById('notifPermissionBanner');
    const bellBtn = document.getElementById('notifBellBtn');
    if (!('Notification' in window)) {
        if (banner) banner.classList.remove('active');
        if (bellBtn) bellBtn.style.display = 'none';
        return;
    }

    if (Notification.permission === 'granted') {
        if (banner) banner.classList.remove('active');
        if (bellBtn) {
            bellBtn.innerHTML = '<i class="fas fa-bell" style="color: var(--accent);"></i>';
            bellBtn.title = 'Notifikasi HP Aktif';
        }
    } else if (Notification.permission === 'denied') {
        if (banner) banner.classList.remove('active');
        if (bellBtn) {
            bellBtn.innerHTML = '<i class="fas fa-bell-slash" style="color: var(--danger);"></i>';
            bellBtn.title = 'Notifikasi Diblokir Browser';
        }
    } else {
        if (banner) banner.classList.add('active');
        if (bellBtn) {
            bellBtn.innerHTML = '<i class="fas fa-bell" style="color: var(--primary);"></i>';
            bellBtn.title = 'Aktifkan Notifikasi HP';
        }
    }
}

async function refreshFcmToken() {
    await syncFcmToken({
        app,
        db,
        uid: currentUid,
        onTokenSaved: () => showToast('Notifikasi HP aktif.'),
        onError: () => {}
    });
}

window.requestPushNotificationPermission = async function () {
    if (!('Notification' in window)) {
        showToast('Browser Anda tidak mendukung notifikasi sistem.');
        return;
    }

    if (Notification.permission === 'denied') {
        showToast('Notifikasi diblokir. Aktifkan izin notifikasi di pengaturan situs browser HP Anda.');
        return;
    }

    if (Notification.permission === 'granted') {
        await registerPushServiceWorker();
        await refreshFcmToken();
        updateNotificationUIState();
        showToast('Notifikasi HP sudah aktif.');
        return;
    }

    try {
        const permission = await Notification.requestPermission();
        updateNotificationUIState();

        if (permission === 'granted') {
            await registerPushServiceWorker();
            await refreshFcmToken();
            showToast('Notifikasi HP berhasil diaktifkan.');
            triggerLocalSystemNotification(
                'Notifikasi Sitenexs Aktif',
                'Anda akan menerima pemberitahuan saat ada pesan atau panggilan masuk.',
                { tag: 'sitenexs-welcome' }
            );
        } else {
            showToast('Izin notifikasi tidak diaktifkan.');
        }
    } catch (error) {
        console.error('Error meminta izin notifikasi:', error);
    }
};

function playMessageNotificationSound() {
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        const ctx = new AudioContextClass();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.09);

        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.28);
        osc.onended = () => ctx.close().catch(() => {});
    } catch (e) {}
}

function escapeHtml(text) {
    return String(text ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    }[char]));
}

function safeUrl(url) {
    try {
        const parsed = new URL(String(url));
        if (parsed.protocol === 'https:' || parsed.protocol === 'http:') {
            return parsed.href;
        }
    } catch (e) {}
    return '';
}

function formatMessageTime(timestamp) {
    if (!timestamp?.toDate) return 'Baru saja';
    return timestamp.toDate().toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
    });
}

function formatDuration(seconds) {
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function renderMessageBody(text) {
    if (!text) return '';

    if (text.startsWith('[CALL_LOG]|')) {
        const [, callType = 'video', status = 'ended', durationStr = '0'] = text.split('|');
        const durationSec = parseInt(durationStr, 10) || 0;
        const isAudio = callType === 'audio';
        const iconClass = isAudio ? 'fas fa-phone' : 'fas fa-video';
        const title = isAudio ? 'Panggilan Suara' : 'Panggilan Video';

        let statusText = 'Memanggil...';
        let isMissed = false;

        if (status === 'ringing') {
            statusText = 'Memanggil...';
        } else if (status === 'connected') {
            statusText = 'Sedang berlangsung...';
        } else if (status === 'ended') {
            statusText = `Selesai • ${formatDuration(durationSec)}`;
        } else if (status === 'missed') {
            statusText = 'Tidak dijawab';
            isMissed = true;
        } else if (status === 'rejected') {
            statusText = 'Panggilan ditolak';
            isMissed = true;
        }

        return `
            <div class="call-log-card">
                <div class="call-log-icon ${isMissed ? 'missed' : ''}">
                    <i class="${iconClass}"></i>
                </div>
                <div class="call-log-info">
                    <div class="call-log-title">${title}</div>
                    <div class="call-log-sub">${escapeHtml(statusText)}</div>
                </div>
            </div>
        `;
    }

    if (text.includes('📋 *LAMARAN KERJA BARU*')) {
        const getMatch = regex => text.match(regex)?.[1]?.trim() || '-';

        const position = getMatch(/🔹 \*Posisi:\* (.*)/);
        const name = getMatch(/👤 \*Nama:\* (.*)/);
        const phone = getMatch(/📞 \*WhatsApp:\* (.*)/);
        const email = getMatch(/📧 \*Email:\* (.*)/);
        const city = getMatch(/🏠 \*Domisili:\* (.*)/);

        const photo = getMatch(/🖼️ \*Link Pasfoto \(Bg Merah\):\* (.*)/);
        const cv = getMatch(/📄 \*Link CV:\* (.*)/);
        const diploma = getMatch(/🎓 \*Link Ijazah:\* (.*)/);

        let motivation = '-';
        const motivationMatch = text.match(/💬 \*Motivasi:\*\s*([\s\S]*?)(?:\n|$)/);

        if (motivationMatch) {
            motivation = motivationMatch[1].trim().replace(/^"|"$/g, '');
        } else {
            const parts = text.split('💬 *Motivasi:*');
            if (parts.length > 1) {
                motivation = parts[1].trim().replace(/^"|"$/g, '');
            }
        }

        const photoUrl = safeUrl(photo);
        const cvUrl = safeUrl(cv);
        const diplomaUrl = safeUrl(diploma);

        return `
            <div style="background:rgba(0,0,0,.03);border:1px solid var(--border-subtle);border-radius:10px;padding:12px;font-size:.82rem;text-align:left;">
                <div style="font-weight:800;font-size:.95rem;margin-bottom:8px;color:var(--primary);">
                    <i class="fas fa-briefcase"></i> Lamaran Kerja: ${escapeHtml(position)}
                </div>

                ${photoUrl ? `
                    <div style="margin-bottom:10px;">
                        <div style="font-size:.72rem;font-weight:700;margin-bottom:3px;color:var(--text-muted);">Pasfoto Formal:</div>
                        <div class="chat-image-preview">
                            <a href="${photoUrl}" target="_blank" rel="noopener noreferrer">
                                <img src="${photoUrl}" alt="Pasfoto">
                            </a>
                        </div>
                    </div>
                ` : ''}

                <div style="display:flex;flex-direction:column;gap:3px;margin-bottom:8px;">
                    <div><b>Nama:</b> ${escapeHtml(name)}</div>
                    <div><b>WhatsApp:</b> ${escapeHtml(phone)}</div>
                    <div><b>Email:</b> ${escapeHtml(email)}</div>
                    <div><b>Domisili:</b> ${escapeHtml(city)}</div>
                </div>

                ${motivation !== '-' ? `
                    <div style="background:#fff;border-left:3px solid var(--primary);padding:8px;border-radius:4px;margin-bottom:10px;">
                        <div style="font-weight:700;margin-bottom:2px;color:var(--primary);">Motivasi:</div>
                        <div style="font-style:italic;white-space:pre-wrap;">${escapeHtml(motivation)}</div>
                    </div>
                ` : ''}

                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    ${cvUrl ? `<a href="${cvUrl}" target="_blank" rel="noopener noreferrer" class="btn" style="padding:4px 10px;font-size:.75rem;background:var(--primary);color:#fff;"><i class="fas fa-file-pdf"></i> CV</a>` : ''}
                    ${diplomaUrl ? `<a href="${diplomaUrl}" target="_blank" rel="noopener noreferrer" class="btn" style="padding:4px 10px;font-size:.75rem;background:var(--accent);color:#fff;"><i class="fas fa-certificate"></i> Ijazah</a>` : ''}
                </div>
            </div>
        `;
    }

    return escapeHtml(text).replace(/\n/g, '<br>');
}

/* =====================================================
   PAKSA MEMBUKA HALAMAN TELEPON SAAT ADA PANGGILAN MASUK
===================================================== */

function listenIncomingCallsAndForceRedirect() {
    if (!currentUid) return;

    const incomingRef = ref(rtdb, `incomingCalls/${currentUid}`);

    if (unsubscribeIncomingCalls) {
        unsubscribeIncomingCalls();
    }

    unsubscribeIncomingCalls = onValue(incomingRef, snapshot => {
        const data = snapshot.val();
        if (!data) return;

        if (data.timestamp && Date.now() - data.timestamp > 60000) {
            remove(incomingRef).catch(() => {});
            return;
        }

        if (data.callerUid === currentUid) return;

        if (
            data.calleeUid === currentUid &&
            data.status === 'ringing' &&
            !isRedirectingToCall
        ) {
            isRedirectingToCall = true;
            const callUrl = new URL(CALL_PAGE_URL);
            callUrl.searchParams.set('to', data.callerUid);
            callUrl.searchParams.set('mode', 'incoming');
            callUrl.searchParams.set('roomId', data.roomId);
            callUrl.searchParams.set('type', data.callType === 'audio' ? 'audio' : 'video');
            window.location.replace(callUrl.toString());
        }
    }, error => {
        console.error('Incoming call listener error:', error);
    });
}

/* =====================================================
   INITIALIZE CHAT
===================================================== */

async function initChat(user) {
    currentUid = user.uid;

    updateNotificationUIState();
    await registerPushServiceWorker();
    listenForegroundMessages(app, ({ title, body, tag, icon, url }) => {
        if (document.visibilityState === 'hidden') {
            triggerLocalSystemNotification(title, body, { tag, icon, url });
        }
    });
    if ('Notification' in window && Notification.permission === 'granted') {
        refreshFcmToken();
    }

    const participants = [currentUid, activeChatUserId].sort();
    activeChatId = `${participants[0]}_${participants[1]}`;

    // Pantau panggilan masuk & langsung alihkan ke halaman panggilan masuk
    listenIncomingCallsAndForceRedirect();

    try {
        await updateDoc(doc(db, 'chats', activeChatId), {
            [`unread_${currentUid}`]: false
        });
    } catch (error) {}

    myProfile = await fetchUserProfile(db, currentUid);
    myUserName = myProfile.displayName;

    otherProfile = await fetchUserProfile(db, activeChatUserId);
    otherUserName = otherProfile.displayName;
    otherUserFcmToken = otherProfile.fcmToken;

    document.getElementById('activeChatBadges').innerHTML = otherProfile.badgesHtml;
    document.getElementById('activeChatName').textContent = otherUserName;
    document.getElementById('activeChatAvatar').src = otherProfile.avatarUrl;

    const messagesRef = collection(db, 'chats', activeChatId, 'messages');
    const qMsgs = query(messagesRef, orderBy('createdAt', 'asc'));

    if (unsubscribeMessages) {
        unsubscribeMessages();
    }

    isInitialMessagesLoad = true;

    unsubscribeMessages = onSnapshot(qMsgs, snapshot => {
        const messagesContainer = document.getElementById('chatMessages');

        const loadingState = document.getElementById('loadingState');
        if (loadingState) loadingState.remove();

        let html = '';
        let latestCallLog = null;

        snapshot.forEach(docSnap => {
            const message = docSnap.data();
            const isOutgoing = message.senderUid === currentUid;

            if (String(message.text || '').startsWith('[CALL_LOG]|')) {
                const [, cType = 'video', cStatus = 'ended'] = String(message.text).split('|');
                if (cStatus === 'ringing' || cStatus === 'connected') {
                    latestCallLog = {
                        callType: cType,
                        status: cStatus,
                        timestamp: message.createdAt?.toMillis ? message.createdAt.toMillis() : Date.now()
                    };
                } else {
                    latestCallLog = null;
                }
            }

            html += `
                <div class="message-wrapper ${isOutgoing ? 'outgoing' : 'incoming'}">
                    <div class="message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}">
                        ${renderMessageBody(message.text || '')}
                        <div class="message-time">${formatMessageTime(message.createdAt)}</div>
                    </div>
                </div>
            `;
        });

        if (latestCallLog && (Date.now() - latestCallLog.timestamp < 3600000)) {
            setOngoingCallBanner(true, {
                peerUid: activeChatUserId,
                peerName: otherUserName,
                callType: latestCallLog.callType,
                mode: 'outgoing'
            });
        } else if (!unsubscribeActiveCallRoom) {
            setOngoingCallBanner(false);
        }

        messagesContainer.innerHTML = html;
        messagesContainer.scrollTop = messagesContainer.scrollHeight;

        if (!isInitialMessagesLoad) {
            snapshot.docChanges().forEach(change => {
                if (change.type === 'added') {
                    const msgData = change.doc.data();
                    const msgId = change.doc.id;
                    if (
                        msgData.senderUid !== currentUid &&
                        lastNotifiedMessageId !== msgId &&
                        !String(msgData.text || '').startsWith('[CALL_LOG]|')
                    ) {
                        lastNotifiedMessageId = msgId;

                        if (document.visibilityState === 'visible') {
                            updateDoc(doc(db, 'chats', activeChatId), {
                                [`unread_${currentUid}`]: false
                            }).catch(() => {});
                            playMessageNotificationSound();
                        } else {
                            const previewText = String(msgData.text || '').includes('📋 *LAMARAN KERJA BARU*')
                                ? 'Mengirim lamaran kerja baru'
                                : String(msgData.text || 'Pesan baru');

                            triggerLocalSystemNotification(
                                otherUserName,
                                previewText,
                                {
                                    tag: `chat-${activeChatId}`,
                                    icon: otherProfile?.avatarUrl || getUserAvatarUrl(activeChatUserId),
                                    url: window.location.href
                                }
                            );
                        }
                    }
                }
            });
        }
        isInitialMessagesLoad = false;
    }, error => {
        console.error('Message listener error:', error);
        showToast('Gagal memuat pesan.');
    });
}

onAuthStateChanged(auth, user => {
    if (user) {
        initChat(user);
    } else {
        const savedUid = localStorage.getItem('sitenexs_uid');
        if (savedUid) {
            initChat({ uid: savedUid });
        } else {
            window.location.replace('https://account.sitenexs.com/sign-in/');
        }
    }
});

window.handleChatFormSubmit = async function (event) {
    event.preventDefault();

    const inputEl = document.getElementById('messageInput');
    const text = inputEl.value.trim();

    if (!text || !activeChatId || !currentUid) return;

    inputEl.value = '';

    try {
        const recipientUid = activeChatUserId;
        const chatDocRef = doc(db, 'chats', activeChatId);

        await setDoc(chatDocRef, {
            participants: [currentUid, activeChatUserId],
            lastMessage: text,
            lastTimestamp: serverTimestamp(),
            [`unread_${recipientUid}`]: true
        }, { merge: true });

        await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
            senderUid: currentUid,
            text,
            createdAt: serverTimestamp(),
            isEdited: false
        });

        const pushRes = await sendPushNotification({
            db,
            recipientUid: activeChatUserId,
            cachedToken: otherUserFcmToken,
            title: myUserName,
            body: text,
            tag: `chat-${activeChatId}`,
            url: `https://sitenexs.com/community/messages/chat/?to=${encodeURIComponent(currentUid)}`,
            icon: myProfile?.avatarUrl || getUserAvatarUrl(currentUid),
            workerUrl: PUSH_WORKER_URL
        });
        if (pushRes?.token) otherUserFcmToken = pushRes.token;

    } catch (error) {
        console.error('Send message error:', error);
        showToast('Gagal mengirim pesan.');
    }
};
