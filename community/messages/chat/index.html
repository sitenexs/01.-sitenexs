<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Chat — Komunitas Sitenexs</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Kirim dan terima pesan langsung dengan sesama mitra UMKM serta Sitenexs AI di ekosistem Sitenexs.">
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --danger: #ef4444;
            --check-blue: #38bdf8;
            --check-yellow: #facc15;
            --check-green: #4ade80;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 10px 25px -5px rgba(15, 23, 42, 0.07), 0 8px 10px -6px rgba(15, 23, 42, 0.07);
            --radius-full: 9999px;
            --radius-lg: 1rem;
            --radius-xl: 1.25rem;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        html, body { 
            height: 100%; height: 100svh; overflow: hidden; font-size: 15px; 
            user-select: none; -webkit-user-select: none;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body); color: var(--text-main); line-height: 1.5;
            -webkit-font-smoothing: antialiased; display: flex; flex-direction: column;
            justify-content: center; align-items: center; padding: 0.75rem;
        }

        a { text-decoration: none; color: inherit; }
        button, input { font-family: inherit; outline: none; border: none; }

        .container { width: 100%; max-width: 800px; height: 100%; max-height: 100%; display: flex; flex-direction: column; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
            padding: 0.55rem 1.1rem; font-size: 0.85rem; font-weight: 700;
            border-radius: var(--radius-full); cursor: pointer; transition: var(--transition);
            border: 1px solid transparent; background: #fff; color: var(--text-main);
        }
        .btn-secondary { border: 1px solid var(--border-medium); background: #fff; box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .btn-icon-only { width: 38px; height: 38px; padding: 0; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }

        /* BANNER IZIN NOTIFIKASI HP */
        .notif-permission-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.65rem 1.15rem;
            background: #eff6ff;
            border-bottom: 1px solid #bfdbfe;
            font-size: 0.8rem;
            color: #1e3a8a;
            flex: 0 0 auto;
        }
        .notif-permission-banner.active { display: flex; }
        .notif-enable-btn {
            background: var(--primary);
            color: #fff;
            padding: 0.38rem 0.85rem;
            border-radius: var(--radius-full);
            font-size: 0.75rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            flex-shrink: 0;
        }

        /* BANNER DALAM PANGGILAN (DI BAWAH NAVBAR) */
        .active-call-banner {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.6rem 1.15rem;
            background: linear-gradient(90deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 700;
            flex: 0 0 auto;
            z-index: 9;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            transition: var(--transition);
        }
        .active-call-banner:hover {
            filter: brightness(1.04);
        }
        .active-call-banner.active {
            display: flex;
        }
        .active-call-banner-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 0;
        }
        .active-call-pulse {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ffffff;
            flex-shrink: 0;
            animation: callBannerPulse 1.3s infinite ease-in-out;
        }
        @keyframes callBannerPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.45); opacity: 0.55; }
        }
        .active-call-banner-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .active-call-banner-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(255, 255, 255, 0.22);
            padding: 0.28rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.74rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        /* RUANG CHAT UTAMA */
        .chat-wrapper {
            width: 100%; height: 100%; background: #fafbfc; border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-xl); box-shadow: var(--shadow-md); display: flex; flex-direction: column; 
            overflow: hidden; position: relative;
        }
        
        .chat-header {
            padding: 0.75rem 1.25rem; background: #fff; border-bottom: 1px solid var(--border-subtle);
            display: flex; align-items: center; justify-content: space-between; flex: 0 0 auto; z-index: 10;
            box-shadow: var(--shadow-sm);
        }
        .chat-header-left { display: flex; align-items: center; gap: 0.75rem; min-width: 0; }
        .chat-header-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; }
        .chat-header-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-medium); flex-shrink: 0; }
        
        .chat-header-info { min-width: 0; display: flex; flex-direction: column; }
        .chat-header-name-row { display: flex; align-items: center; gap: 0.3rem; min-width: 0; }
        .chat-header-name { font-weight: 850; font-size: 0.98rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .chat-header-verif { width: 14px; height: 14px; object-fit: contain; flex-shrink: 0; display: inline-block; }

        /* STATUS SEDANG MENGETIK DI BAWAH NAMA */
        .header-typing-status {
            display: none;
            font-size: 0.72rem;
            font-weight: 700;
            color: var(--accent);
            line-height: 1.2;
            margin-top: 1px;
        }
        .header-typing-status.active {
            display: block;
        }

        /* ISI CHAT */
        .chat-messages {
            flex: 1 1 auto; min-height: 0; padding: 1.25rem; overflow-y: auto; 
            display: flex; flex-direction: column; gap: 0.75rem; background-color: #f8fafc;
            background-image: radial-gradient(rgba(37, 99, 235, 0.08) 1px, transparent 1px), radial-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1px);
            background-size: 24px 24px; background-position: 0 0, 12px 12px; -webkit-overflow-scrolling: touch;
        }
        .chat-messages::-webkit-scrollbar { width: 5px; }
        .chat-messages::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 10px; }

        .message-wrapper { position: relative; display: flex; flex-direction: column; width: 100%; flex-shrink: 0; }
        .message-wrapper.incoming { align-items: flex-start; }
        .message-wrapper.outgoing { align-items: flex-end; }

        .message-bubble {
            max-width: 82%; padding: 0.65rem 0.95rem 0.7rem; border-radius: var(--radius-lg); font-size: 0.88rem;
            line-height: 1.5; word-break: break-word; position: relative; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.06);
            background: #fff;
        }

        /* NAMA PENGIRIM + CENTANG BIRU / LENCANA KUNING DI DALAM BUBBLE CHAT */
        .message-sender-header {
            display: inline-flex;
            align-items: center;
            gap: 0.25rem;
            margin-bottom: 0.22rem;
            line-height: 1.2;
            max-width: 100%;
        }
        .message-sender-name {
            font-size: 0.69rem;
            font-weight: 800;
            letter-spacing: 0.01em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .message-bubble.incoming .message-sender-name {
            color: var(--primary);
        }
        .message-bubble.outgoing .message-sender-name {
            color: rgba(255, 255, 255, 0.94);
        }
        .message-sender-badges {
            display: inline-flex;
            align-items: center;
            gap: 2px;
            flex-shrink: 0;
        }
        .message-sender-badges img,
        .message-bubble-verif {
            width: 13px;
            height: 13px;
            object-fit: contain;
            display: inline-block;
            vertical-align: middle;
        }

        .message-bubble.incoming { background: #ffffff; color: var(--text-main); border: 1px solid var(--border-subtle); border-bottom-left-radius: 4px; }
        .message-bubble.outgoing { background: var(--primary); color: #fff; border-bottom-right-radius: 4px; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25); }
        
        .message-meta-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 0.3rem;
            margin-top: 0.32rem;
        }
        .message-time { font-size: 0.65rem; opacity: 0.78; font-weight: 500; }

        /* INDIKATOR CENTANG KECIL & RAPI (1 CENTANG, 2 CENTANG, 2 CENTANG BIRU / KUNING / HIJAU) */
        .msg-check-svg {
            display: inline-flex;
            align-items: center;
            vertical-align: middle;
            transition: all 0.2s ease;
        }
        .msg-check-svg.sent {
            color: rgba(255, 255, 255, 0.72);
        }
        .msg-check-svg.delivered {
            color: rgba(255, 255, 255, 0.94);
        }
        .msg-check-svg.read-blue {
            color: var(--check-blue);
            filter: drop-shadow(0 0 2px rgba(56, 189, 248, 0.35));
        }
        .msg-check-svg.read-yellow {
            color: var(--check-yellow);
            filter: drop-shadow(0 0 2px rgba(250, 204, 21, 0.35));
        }
        .msg-check-svg.read,
        .msg-check-svg.read-green {
            color: var(--check-green);
            filter: drop-shadow(0 0 2px rgba(74, 222, 128, 0.4));
        }

        /* BUBBLE ANIMASI MENGETIK DI BAWAH CHAT TERAKHIR */
        .typing-bubble-wrapper {
            display: none;
            align-items: flex-start;
            width: 100%;
            flex-shrink: 0;
            animation: typingBubbleFadeIn 0.2s ease;
        }
        .typing-bubble-wrapper.active {
            display: flex;
        }
        @keyframes typingBubbleFadeIn {
            from { opacity: 0; transform: translateY(6px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .typing-bubble-box {
            background: #ffffff;
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            border-bottom-left-radius: 4px;
            padding: 0.65rem 0.95rem;
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            box-shadow: 0 3px 10px rgba(15, 23, 42, 0.06);
        }
        .typing-dot-circle {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--primary);
            animation: typingWaveDot 1.25s infinite ease-in-out;
        }
        .typing-dot-circle:nth-child(2) { animation-delay: 0.16s; background: #3b82f6; }
        .typing-dot-circle:nth-child(3) { animation-delay: 0.32s; background: var(--accent); }
        @keyframes typingWaveDot {
            0%, 60%, 100% { transform: translateY(0) scale(0.92); opacity: 0.45; }
            30% { transform: translateY(-5px) scale(1.12); opacity: 1; }
        }

        /* KARTU RIWAYAT PANGGILAN DI CHAT */
        .call-log-card {
            display: flex; align-items: center; gap: 0.75rem; min-width: 195px;
        }
        .call-log-icon {
            width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 0.95rem; flex-shrink: 0;
        }
        .message-bubble.outgoing .call-log-icon {
            background: rgba(255, 255, 255, 0.2); color: #fff;
        }
        .message-bubble.incoming .call-log-icon {
            background: var(--primary-light); color: var(--primary);
        }
        .message-bubble.incoming .call-log-icon.missed {
            background: #fef2f2; color: var(--danger);
        }
        .call-log-info {
            display: flex; flex-direction: column; text-align: left;
        }
        .call-log-title {
            font-weight: 700; font-size: 0.85rem; line-height: 1.3;
        }
        .call-log-sub {
            font-size: 0.74rem; opacity: 0.82; margin-top: 2px;
        }

        /* PRATINJAU PASFOTO / GAMBAR DI DALAM CHAT */
        .chat-image-preview {
            width: 100%; max-width: 220px; border-radius: 8px; overflow: hidden; margin-bottom: 6px;
            border: 1px solid rgba(0,0,0,0.1); background: #000; display: block;
        }
        .chat-image-preview img {
            width: 100%; height: auto; display: block; object-fit: cover; max-height: 280px;
        }

        /* INPUT PESAN */
        .chat-input-box {
            padding: 0.75rem 1.25rem; background: #fff; border-top: 1px solid var(--border-subtle);
            display: flex; align-items: center; gap: 0.75rem; flex: 0 0 auto; z-index: 10;
        }
        .chat-input {
            flex: 1; padding: 0.65rem 1rem; background: var(--bg-body); border: 1px solid var(--border-medium);
            border-radius: var(--radius-full); font-size: 0.88rem; color: var(--text-main);
        }
        .chat-input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        
        .chat-send-btn {
            width: 42px; height: 42px; border-radius: 50%; background: var(--primary); color: #fff;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3); flex-shrink: 0;
        }

        #toastContainer { position: fixed; bottom: 24px; right: 24px; z-index: 30000; display: flex; flex-direction: column; gap: 0.5rem; max-width: 340px; }
        .toast { background: #0f172a; color: #fff; padding: 0.85rem 1.15rem; border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; box-shadow: var(--shadow-md); display: flex; align-items: center; gap: 0.75rem; border-left: 4px solid var(--accent); }

        @media (max-width: 768px) {
            html, body { height: 100svh; overflow: hidden; }
            body { padding: 0; }
            .container { max-width: 100%; height: 100svh; max-height: none; }
            .chat-wrapper { border: none; border-radius: 0; height: 100%; }
            .message-bubble { max-width: 88%; }
        }
    </style>
</head>
<body data-package="basic">

    <div id="toastContainer"></div>

    <main class="container">
        <div class="chat-wrapper">
            <!-- BANNER AKTIFKAN PUSH NOTIFIKASI HP -->
            <div id="notifPermissionBanner" class="notif-permission-banner">
                <span><i class="fas fa-bell" style="margin-right: 5px;"></i> Aktifkan notifikasi agar pesan & panggilan masuk muncul di HP.</span>
                <button type="button" class="notif-enable-btn" onclick="requestPushNotificationPermission()">Aktifkan</button>
            </div>

            <!-- HEADER ATAS -->
            <div class="chat-header">
                <div class="chat-header-left">
                    <a href="https://sitenexs.com/community/messages/" class="btn btn-secondary btn-icon-only" title="Kembali"><i class="fas fa-arrow-left"></i></a>
                    <img id="activeChatAvatar" src="" class="chat-header-avatar" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=2563eb&color=fff'">
                    <div class="chat-header-info">
                        <div class="chat-header-name-row">
                            <div class="chat-header-name" id="activeChatName"></div>
                            <div id="activeChatBadges" style="display: inline-flex; align-items: center; gap: 2px;"></div>
                        </div>
                        <div id="headerTypingStatus" class="header-typing-status">Sedang mengetik...</div>
                    </div>
                </div>
                <div class="chat-header-right">
                    <button type="button" id="notifBellBtn" class="btn btn-secondary btn-icon-only" onclick="requestPushNotificationPermission()" title="Notifikasi HP">
                        <i class="fas fa-bell" style="color: var(--text-muted);"></i>
                    </button>
                    <button type="button" id="startVoiceBtn" class="btn btn-secondary btn-icon-only" onclick="openCallPage('audio')" title="Panggilan Suara">
                        <i class="fas fa-phone" style="color: var(--accent);"></i>
                    </button>
                    <button type="button" id="startVcBtn" class="btn btn-secondary btn-icon-only" onclick="openCallPage('video')" title="Panggilan Video">
                        <i class="fas fa-video" style="color: var(--primary);"></i>
                    </button>
                </div>
            </div>

            <!-- NOTIFIKASI DI BAWAH NAVBAR SAAT SEDANG ADA PANGGILAN -->
            <div id="activeCallBanner" class="active-call-banner" role="button" tabindex="0">
                <div class="active-call-banner-left">
                    <span class="active-call-pulse"></span>
                    <i id="activeCallBannerIcon" class="fas fa-phone-alt"></i>
                    <span id="activeCallBannerText" class="active-call-banner-text">Dalam panggilan...</span>
                </div>
                <span class="active-call-banner-cta">
                    <span>Masuk</span>
                    <i class="fas fa-chevron-right"></i>
                </span>
            </div>

            <!-- ISI PESAN -->
            <div class="chat-messages" id="chatMessages">
                <div id="typingBubbleWrapper" class="typing-bubble-wrapper">
                    <div class="typing-bubble-box">
                        <span class="typing-dot-circle"></span>
                        <span class="typing-dot-circle"></span>
                        <span class="typing-dot-circle"></span>
                    </div>
                </div>
            </div>

            <!-- INPUT PESAN BAWAH -->
            <form class="chat-input-box" id="sendMessageForm" onsubmit="handleChatFormSubmit(event)" autocomplete="off">
                <input type="text" id="messageInput" class="chat-input" placeholder="Tulis pesan Anda..." oninput="handleTypingInputChange(event)" required autocomplete="off">
                <button type="submit" class="chat-send-btn" title="Kirim Pesan"><i class="fas fa-paper-plane"></i></button>
            </form>
        </div>
    </main>

 <script type="module">
import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';

import {
    doc,
    setDoc,
    updateDoc,
    collection,
    addDoc,
    query,
    orderBy,
    onSnapshot,
    serverTimestamp
} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

import {
    app,
    db,
    rtdb,
    auth,
    PUSH_WORKER_URL
} from 'https://sitenexs.com/assets/js/sitenexs-config.js';

import {
    fetchUserProfile,
    getUserAvatarUrl,
    getUserBadgesHtml
} from 'https://sitenexs.com/assets/js/sitenexs-user-data.js';

import {
    registerPushServiceWorker,
    syncFcmToken,
    listenForegroundMessages,
    triggerLocalSystemNotification,
    sendPushNotification
} from 'https://sitenexs.com/assets/js/sitenexs-push-client.js';

import {
    DEFAULT_CALL_PAGE_URL,
    attachForcedIncomingCallRedirect,
    attachOngoingCallBanner
} from 'https://sitenexs.com/assets/js/sitenexs-call-presence.js';

import {
    attachFlickerFreeSnapshot
} from 'https://sitenexs.com/assets/js/sitenexs-realtime-sync.js';

const VERIFIED_BADGE_URL = 'https://sitenexs.com/assets/logo/verified.png';
const PRO_BADGE_URL = 'https://sitenexs.com/assets/logo/lencana.png';

let currentUid = null;
let myProfile = null;
let myUserName = '';
let myBadgesHtml = '';

let activeChatUserId = null;
let activeChatId = null;
let otherProfile = null;
let otherUserName = '';
let otherBadgesHtml = '';
let otherUserFcmToken = null;

let cleanupMessagesSync = null;
let unsubscribeChatMeta = null;
let cleanupIncomingRedirect = null;
let cleanupOngoingBanner = null;
let lastNotifiedMessageId = null;
let isRedirectingToCall = false;
let isChatInitialized = false;
let typingStopTimer = null;
let lastTypingSoundAt = 0;

const urlParams = new URLSearchParams(window.location.search);
const targetUserId = urlParams.get('to');

function hasYellowBadge(profileOrMsg = {}) {
    const raw = profileOrMsg?.raw || profileOrMsg || {};
    return Boolean(
        profileOrMsg?.isPro ||
        raw?.isPro ||
        raw?.lencanaKuning ||
        raw?.isLencanaKuning
    );
}

function buildCombinedBadgesHtml(profileOrMsg = {}, badgeClass = 'message-bubble-verif') {
    const isVerified = Boolean(profileOrMsg?.isVerified || profileOrMsg?.senderIsVerified);
    const isPro = hasYellowBadge(profileOrMsg);
    let html = '';

    if (isVerified) {
        html += `<img src="${VERIFIED_BADGE_URL}" class="${badgeClass}" alt="Verified" title="Verified">`;
    }
    if (isPro) {
        html += `<img src="${PRO_BADGE_URL}" class="${badgeClass}" alt="Pro Badge" title="Lencana Pro" style="margin-left: 2px;">`;
    }
    if (!html && profileOrMsg?.badgesHtml) {
        html = getUserBadgesHtml(profileOrMsg, { badgeClass });
    }
    return html;
}

function extractProfileName(profile, fallbackName = '') {
    if (profile) {
        const raw = profile.raw || {};
        const depan = String(raw.namaDepan || profile.firstName || '').trim();
        const belakang = String(raw.namaBelakang || profile.lastName || '').trim();
        const combined = [depan, belakang].filter(Boolean).join(' ').trim();
        const full = String(raw.namaLengkap || profile.displayName || '').trim();
        if (full) return full;
        if (combined) return combined;
    }
    return String(fallbackName || '').trim();
}

function getChatCacheKey(chatId) {
    return `sitenexs_chat_cache_${chatId}`;
}

function getGreenReadStoreKey(chatId) {
    return `sitenexs_green_read_${chatId}`;
}

function loadPersistedGreenReadIds(chatId) {
    if (!chatId) return new Set();
    try {
        const raw = localStorage.getItem(getGreenReadStoreKey(chatId));
        if (!raw) return new Set();
        const arr = JSON.parse(raw);
        return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) {
        return new Set();
    }
}

function persistGreenReadId(chatId, msgId) {
    if (!chatId || !msgId) return;
    try {
        const set = loadPersistedGreenReadIds(chatId);
        if (!set.has(msgId)) {
            set.add(msgId);
            localStorage.setItem(getGreenReadStoreKey(chatId), JSON.stringify([...set]));
        }
    } catch (e) {}
}

function getEarlyUid() {
    if (auth.currentUser?.uid) return auth.currentUser.uid;
    return localStorage.getItem('sitenexs_uid') || null;
}

function getSenderDisplayName(message, ownerUid = currentUid) {
    const isOutgoing = message.senderUid === ownerUid;
    if (isOutgoing) {
        return myUserName || String(message.senderName || '').trim() || String(auth.currentUser?.displayName || '').trim() || '';
    }
    return otherUserName || String(message.senderName || '').trim() || '';
}

function getSenderBadgesHtml(message, ownerUid = currentUid) {
    const isOutgoing = message.senderUid === ownerUid;
    if (isOutgoing) {
        return myBadgesHtml || buildCombinedBadgesHtml({
            isVerified: message.senderIsVerified,
            isPro: message.senderIsPro
        }, 'message-bubble-verif');
    }
    return otherBadgesHtml || buildCombinedBadgesHtml({
        isVerified: message.senderIsVerified,
        isPro: message.senderIsPro
    }, 'message-bubble-verif');
}

function renderCachedMessagesImmediately(chatId, uid) {
    const messagesContainer = document.getElementById('chatMessages');
    const typingBubbleWrapper = document.getElementById('typingBubbleWrapper');
    if (!messagesContainer || !chatId || !uid) return;
    try {
        const raw = localStorage.getItem(getChatCacheKey(chatId));
        if (!raw) return;
        const cachedList = JSON.parse(raw);
        if (!Array.isArray(cachedList) || cachedList.length === 0) return;

        const greenIds = loadPersistedGreenReadIds(chatId);

        cachedList.forEach(item => {
            if (!item?.id) return;
            if (messagesContainer.querySelector(`[data-msg-id="${CSS.escape(item.id)}"]`)) return;
            const fakeTimestamp = item.createdAtMs
                ? { toDate: () => new Date(item.createdAtMs) }
                : null;
            const isGreenPersisted = greenIds.has(item.id);
            const el = buildMessageElement(item.id, {
                senderUid: item.senderUid,
                senderName: item.senderName,
                senderIsVerified: item.senderIsVerified,
                senderIsPro: item.senderIsPro,
                text: item.text,
                isEdited: item.isEdited,
                status: isGreenPersisted ? 'read-green' : (item.status || 'sent'),
                checkColor: isGreenPersisted ? 'green' : (item.checkColor || null),
                delivered: isGreenPersisted ? true : Boolean(item.delivered),
                read: isGreenPersisted ? true : Boolean(item.read),
                createdAt: fakeTimestamp
            }, uid);
            if (typingBubbleWrapper) {
                messagesContainer.insertBefore(el, typingBubbleWrapper);
            } else {
                messagesContainer.appendChild(el);
            }
        });
        messagesContainer.scrollTop = messagesContainer.scrollHeight;
    } catch (e) {}
}

if (!targetUserId) {

}

function updateNotificationUIState() {
    const banner = document.getElementById('notifPermissionBanner');
    const bellBtn = document.getElementById('notifBellBtn');
    if (!('Notification' in window)) {
        if (banner) banner.classList.remove('active');
        if (bellBtn) bellBtn.style.display = 'none';
        return;
    }

    if (Notification.permission === 'granted') {

            bellBtn.innerHTML = '<i class="fas fa-bell" style="color: var(--accent);"></i>';

            bellBtn.innerHTML = '<i class="fas fa-bell-slash" style="color: var(--danger);"></i>';

        }
    } else {
        if (banner) banner.classList.add('active');
        if (bellBtn) {

async function refreshFcmToken() {
    await syncFcmToken({
        app,
        db,
        uid: currentUid,
        onTokenSaved: () => showToast('Notifikasi HP aktif.'),
        onError: () => {}
    });
}

window.requestPushNotificationPermission = async function () {
    if (!('Notification' in window)) {
        showToast('Browser Anda tidak mendukung notifikasi sistem.');
        return;
    }

    if (Notification.permission === 'denied') {
        showToast('Notifikasi diblokir. Aktifkan izin notifikasi di pengaturan situs browser HP Anda.');
        return;
    }

    if (Notification.permission === 'granted') {
        await registerPushServiceWorker();
        await refreshFcmToken();
        updateNotificationUIState();
        showToast('Notifikasi HP sudah aktif.');
        return;
    }

    try {
        const permission = await Notification.requestPermission();
        updateNotificationUIState();

        if (permission === 'granted') {
            await registerPushServiceWorker();
            await refreshFcmToken();
            showToast('Notifikasi HP berhasil diaktifkan.');
            triggerLocalSystemNotification(
                'Notifikasi Sitenexs Aktif',
                'Anda akan menerima pemberitahuan saat ada pesan atau panggilan masuk.',
                { tag: 'sitenexs-welcome' }
            );
        } else {
            showToast('Izin notifikasi tidak diaktifkan.');
        }
    } catch (error) {
        console.error('Error meminta izin notifikasi:', error);
    }
};

function playTypingSound() {
    const now = Date.now();
    if (now - lastTypingSoundAt < 90) return;
    lastTypingSoundAt = now;

    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        const ctx = new AudioContextClass();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'triangle';
        osc.frequency.setValueAtTime(340, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(190, ctx.currentTime + 0.045);

        gain.gain.setValueAtTime(0.06, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.045);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.045);
        osc.onended = () => ctx.close().catch(() => {});
    } catch (e) {}
}

function playSentMessageSound() {
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        const ctx = new AudioContextClass();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(660, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.07);

        gain.gain.setValueAtTime(0.11, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.18);

        osc.connect(gain);
        gain.connect(ctx.destination);

        osc.start();
        osc.stop(ctx.currentTime + 0.18);
        osc.onended = () => ctx.close().catch(() => {});
    } catch (e) {}
}

function playMessageNotificationSound() {
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        const ctx = new AudioContextClass();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();

        osc.type = 'sine';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1174.66, ctx.currentTime + 0.09);

        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);

}

/* =====================================================
   STATUS CENTANG PESAN (1 CENTANG, 2 CENTANG, 2 CENTANG BIRU / KUNING / HIJAU)
===================================================== */
function getMessageCheckStatus(message, docId = '') {
    const persistedGreen = docId && activeChatId ? loadPersistedGreenReadIds(activeChatId).has(docId) : false;
    const rawColor = message?.checkColor || (
        message?.status === 'read-yellow' ? 'yellow' :
        message?.status === 'read-blue' ? 'blue' :
        message?.status === 'read-green' ? 'green' : null
    );

    if (persistedGreen || rawColor === 'green') {
        return 'read-green';
    }
    if (rawColor === 'yellow') {
        return 'read-yellow';
    }
    if (rawColor === 'blue') {
        return 'read-blue';
    }
    if (message?.read === true || message?.status === 'read') {
        return 'read-green';
    }
    if (message?.delivered === true || message?.status === 'delivered') {
        return 'delivered';
    }
    return 'sent';
}

                    <path d="M1.5 6.2L5.2 9.9L11.5 2.2" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

function escapeHtml(text) {
    return String(text ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    }[char]));
}

function safeUrl(url) {
    try {
        const parsed = new URL(String(url));
        if (parsed.protocol === 'https:' || parsed.protocol === 'http:') {
            return parsed.href;
        }
    } catch (e) {}
    return '';
}

function formatMessageTime(timestamp) {
    if (!timestamp?.toDate) return 'Baru saja';
    return timestamp.toDate().toLocaleTimeString([], {
        hour: '2-digit',
        minute: '2-digit'
    });
}

function formatDuration(seconds) {
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function renderMessageBody(text) {
    if (!text) return '';

    if (text.startsWith('[CALL_LOG]|')) {
        const [, callType = 'video', status = 'ended', durationStr = '0'] = text.split('|');
        const durationSec = parseInt(durationStr, 10) || 0;
        const isAudio = callType === 'audio';
        const iconClass = isAudio ? 'fas fa-phone' : 'fas fa-video';
        const title = isAudio ? 'Panggilan Suara' : 'Panggilan Video';

        let statusText = 'Memanggil...';
        let isMissed = false;

        if (status === 'ringing') {
            statusText = 'Memanggil...';
        } else if (status === 'connected') {
            statusText = 'Sedang berlangsung...';
        } else if (status === 'ended') {
            statusText = `Selesai • ${formatDuration(durationSec)}`;
        } else if (status === 'missed') {
            statusText = 'Tidak dijawab';
            isMissed = true;
        } else if (status === 'rejected') {
            statusText = 'Panggilan ditolak';
            isMissed = true;
        }

        return `
            <div class="call-log-card">
                <div class="call-log-icon ${isMissed ? 'missed' : ''}">
                    <i class="${iconClass}"></i>
                </div>
                <div class="call-log-info">
                    <div class="call-log-title">${title}</div>
                    <div class="call-log-sub">${escapeHtml(statusText)}</div>
                </div>
            </div>
        `;
    }

    if (text.includes('📋 *LAMARAN KERJA BARU*')) {
        const getMatch = regex => text.match(regex)?.[1]?.trim() || '-';

        const position = getMatch(/🔹 \*Posisi:\* (.*)/);
        const name = getMatch(/👤 \*Nama:\* (.*)/);
        const phone = getMatch(/📞 \*WhatsApp:\* (.*)/);
        const email = getMatch(/📧 \*Email:\* (.*)/);
        const city = getMatch(/🏠 \*Domisili:\* (.*)/);

        const photo = getMatch(/🖼️ \*Link Pasfoto \(Bg Merah\):\* (.*)/);
        const cv = getMatch(/📄 \*Link CV:\* (.*)/);
        const diploma = getMatch(/🎓 \*Link Ijazah:\* (.*)/);

        let motivation = '-';
        const motivationMatch = text.match(/💬 \*Motivasi:\*\s*([\s\S]*?)(?:\n|$)/);

        if (motivationMatch) {
            motivation = motivationMatch[1].trim().replace(/^"|"$/g, '');
        } else {
            const parts = text.split('💬 *Motivasi:*');
            if (parts.length > 1) {
                motivation = parts[1].trim().replace(/^"|"$/g, '');
            }
        }

        const photoUrl = safeUrl(photo);
        const cvUrl = safeUrl(cv);
        const diplomaUrl = safeUrl(diploma);

        return `
            <div style="background:rgba(0,0,0,.03);border:1px solid var(--border-subtle);border-radius:10px;padding:12px;font-size:.82rem;text-align:left;">
                <div style="font-weight:800;font-size:.95rem;margin-bottom:8px;color:var(--primary);">
                    <i class="fas fa-briefcase"></i> Lamaran Kerja: ${escapeHtml(position)}
                </div>

                ${photoUrl ? `
                    <div style="margin-bottom:10px;">
                        <div style="font-size:.72rem;font-weight:700;margin-bottom:3px;color:var(--text-muted);">Pasfoto Formal:</div>
                        <div class="chat-image-preview">
                            <a href="${photoUrl}" target="_blank" rel="noopener noreferrer">
                                <img src="${photoUrl}" alt="Pasfoto">
                            </a>
                        </div>
                    </div>
                ` : ''}

                <div style="display:flex;flex-direction:column;gap:3px;margin-bottom:8px;">
                    <div><b>Nama:</b> ${escapeHtml(name)}</div>
                    <div><b>WhatsApp:</b> ${escapeHtml(phone)}</div>
                    <div><b>Email:</b> ${escapeHtml(email)}</div>
                    <div><b>Domisili:</b> ${escapeHtml(city)}</div>
                </div>

                ${motivation !== '-' ? `
                    <div style="background:#fff;border-left:3px solid var(--primary);padding:8px;border-radius:4px;margin-bottom:10px;">
                        <div style="font-weight:700;margin-bottom:2px;color:var(--primary);">Motivasi:</div>
                        <div style="font-style:italic;white-space:pre-wrap;">${escapeHtml(motivation)}</div>
                    </div>
                ` : ''}

                <div style="display:flex;gap:6px;flex-wrap:wrap;">
                    ${cvUrl ? `<a href="${cvUrl}" target="_blank" rel="noopener noreferrer" class="btn" style="padding:4px 10px;font-size:.75rem;background:var(--primary);color:#fff;"><i class="fas fa-file-pdf"></i> CV</a>` : ''}
                    ${diplomaUrl ? `<a href="${diplomaUrl}" target="_blank" rel="noopener noreferrer" class="btn" style="padding:4px 10px;font-size:.75rem;background:var(--accent);color:#fff;"><i class="fas fa-certificate"></i> Ijazah</a>` : ''}
                </div>
            </div>
        `;
    }

    return escapeHtml(text).replace(/\n/g, '<br>');
}

function buildSenderHeaderElement(message, ownerUid = currentUid) {
    const header = document.createElement('div');
    header.className = 'message-sender-header';

    const resolvedName = getSenderDisplayName(message, ownerUid);
    const resolvedBadges = getSenderBadgesHtml(message, ownerUid);

    const nameSpan = document.createElement('span');
    nameSpan.className = 'message-sender-name';
    nameSpan.textContent = resolvedName;

    const badgesSpan = document.createElement('span');
    badgesSpan.className = 'message-sender-badges';
    badgesSpan.innerHTML = resolvedBadges;

    header.append(nameSpan, badgesSpan);
    if (!resolvedName && !resolvedBadges) {
        header.style.display = 'none';
    }
    return header;
}

function buildMessageElement(docId, message, ownerUid = currentUid) {
    const isOutgoing = message.senderUid === ownerUid;
    const wrapper = document.createElement('div');
    wrapper.className = `message-wrapper ${isOutgoing ? 'outgoing' : 'incoming'}`;
    wrapper.dataset.msgId = docId;

    const bubble = document.createElement('div');
    bubble.className = `message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}`;

    const senderHeader = buildSenderHeaderElement(message, ownerUid);

    const bodyDiv = document.createElement('div');
    bodyDiv.className = 'message-body';
    bodyDiv.innerHTML = renderMessageBody(message.text || '');

    const metaRow = document.createElement('div');
    metaRow.className = 'message-meta-row';

    const timeDiv = document.createElement('span');
    timeDiv.className = 'message-time';
    timeDiv.textContent = formatMessageTime(message.createdAt);

    metaRow.appendChild(timeDiv);

    if (isOutgoing) {
        const checkState = getMessageCheckStatus(message, docId);
        if (checkState === 'read-green' && activeChatId) {
            persistGreenReadId(activeChatId, docId);
        }
        const statusSpan = document.createElement('span');
        statusSpan.className = 'msg-status-slot';
        statusSpan.innerHTML = renderCheckmarkHtml(checkState);
        metaRow.appendChild(statusSpan);
    }

    bubble.append(senderHeader, bodyDiv, metaRow);
    wrapper.appendChild(bubble);
    return wrapper;
}

function updateMessageElement(wrapper, docId, message, ownerUid = currentUid) {
    const isOutgoing = message.senderUid === ownerUid;
    wrapper.className = `message-wrapper ${isOutgoing ? 'outgoing' : 'incoming'}`;

    const bubble = wrapper.querySelector('.message-bubble');
    if (bubble) {
        bubble.className = `message-bubble ${isOutgoing ? 'outgoing' : 'incoming'}`;

        const resolvedName = getSenderDisplayName(message, ownerUid);
        const resolvedBadges = getSenderBadgesHtml(message, ownerUid);

        let senderHeader = bubble.querySelector('.message-sender-header');
        if (!senderHeader) {
            senderHeader = buildSenderHeaderElement(message, ownerUid);
            bubble.prepend(senderHeader);
        } else {
            const nameSpan = senderHeader.querySelector('.message-sender-name');
            if (nameSpan) {
                nameSpan.textContent = resolvedName;
            }
            const badgesSpan = senderHeader.querySelector('.message-sender-badges');
            if (badgesSpan) {
                badgesSpan.innerHTML = resolvedBadges;
            }
            senderHeader.style.display = (!resolvedName && !resolvedBadges) ? 'none' : 'inline-flex';
        }
    }

    const bodyDiv = wrapper.querySelector('.message-body');
    if (bodyDiv) {
        bodyDiv.innerHTML = renderMessageBody(message.text || '');
    }

    const timeDiv = wrapper.querySelector('.message-time');
    if (timeDiv && message.createdAt) {
        timeDiv.textContent = formatMessageTime(message.createdAt);
    }

    const metaRow = wrapper.querySelector('.message-meta-row');
    if (metaRow) {
        let statusSlot = metaRow.querySelector('.msg-status-slot');
        if (isOutgoing) {
            const checkState = getMessageCheckStatus(message, docId);
            if (checkState === 'read-green' && activeChatId) {
                persistGreenReadId(activeChatId, docId);
            }
            if (!statusSlot) {
                statusSlot = document.createElement('span');
                statusSlot.className = 'msg-status-slot';
                metaRow.appendChild(statusSlot);
            }
            statusSlot.innerHTML = renderCheckmarkHtml(checkState);
        } else if (statusSlot) {
            statusSlot.remove();
        }
    }
}

function refreshVisibleSenderInfo() {
    const messagesContainer = document.getElementById('chatMessages');
    if (!messagesContainer) return;
    messagesContainer.querySelectorAll('.message-wrapper').forEach(wrapper => {
        const isOutgoing = wrapper.classList.contains('outgoing');
        const senderHeader = wrapper.querySelector('.message-sender-header');
        const nameSpan = wrapper.querySelector('.message-sender-name');
        const badgesSpan = wrapper.querySelector('.message-sender-badges');

        const nextName = isOutgoing ? myUserName : otherUserName;
        const nextBadges = isOutgoing ? myBadgesHtml : otherBadgesHtml;

        if (nameSpan && nextName) {
            nameSpan.textContent = nextName;
        }
        if (badgesSpan) {
            badgesSpan.innerHTML = nextBadges;
        }
        if (senderHeader) {
            senderHeader.style.display = (!nameSpan?.textContent && !nextBadges) ? 'none' : 'inline-flex';
        }
    });
}

/* =====================================================
   INITIALIZE CHAT (CACHE PERANGKAT + UPDATE PERUBAHAN SAJA)
===================================================== */

async function initChat(user) {
    if (!user?.uid) return;
    if (isChatInitialized && currentUid === user.uid) return;
    isChatInitialized = true;
    currentUid = user.uid;

    updateNotificationUIState();

    const participants = [currentUid, activeChatUserId].sort();
    activeChatId = `${participants[0]}_${participants[1]}`;

    renderCachedMessagesImmediately(activeChatId, currentUid);

    if (cleanupIncomingRedirect) cleanupIncomingRedirect();
    cleanupIncomingRedirect = attachForcedIncomingCallRedirect({
        rtdb,
        currentUid,
        callPageUrl: DEFAULT_CALL_PAGE_URL,
        fallbackPeerName: otherUserName || 'Mitra Sitenexs'
    });

    if (cleanupOngoingBanner) cleanupOngoingBanner();
    cleanupOngoingBanner = attachOngoingCallBanner({
        rtdb,
        currentUid,
        bannerElement: document.getElementById('activeCallBanner'),
        textElement: document.getElementById('activeCallBannerText'),
        iconElement: document.getElementById('activeCallBannerIcon'),
        filterPeerUid: activeChatUserId,
        filterChatId: activeChatId,
        fallbackPeerName: otherUserName || 'Mitra Sitenexs',
        callPageUrl: DEFAULT_CALL_PAGE_URL
    });

    if (unsubscribeChatMeta) unsubscribeChatMeta();
    unsubscribeChatMeta = onSnapshot(doc(db, 'chats', activeChatId), (chatSnap) => {
        if (!chatSnap.exists()) return;
        const cData = chatSnap.data();
        const isOtherTyping = Boolean(cData[`typing_${activeChatUserId}`]);
        renderOtherTypingIndicator(isOtherTyping);

        if (cData[`unread_${currentUid}`] === true && document.visibilityState === 'visible') {
            updateDoc(doc(db, 'chats', activeChatId), {
                [`unread_${currentUid}`]: false
            }).catch(() => {});
        }
    });

    const messagesRef = collection(db, 'chats', activeChatId, 'messages');
    const qMsgs = query(messagesRef, orderBy('createdAt', 'asc'));
    const messagesContainer = document.getElementById('chatMessages');
    const typingBubbleWrapper = document.getElementById('typingBubbleWrapper');

    if (cleanupMessagesSync) {
        cleanupMessagesSync();
    }

    cleanupMessagesSync = attachFlickerFreeSnapshot({
        queryRef: qMsgs,
        container: messagesContainer,
        keyAttr: 'data-msg-id',
        storageKey: getChatCacheKey(activeChatId),
        autoScroll: true,
        createElement: (msgId, msgData) => buildMessageElement(msgId, msgData, currentUid),
        updateElement: (existingEl, msgId, msgData) => updateMessageElement(existingEl, msgId, msgData, currentUid),
        onAddedItem: (msgId, msgData, docSnap) => {
            if (typingBubbleWrapper && messagesContainer) {
                messagesContainer.appendChild(typingBubbleWrapper);
            }

            if (msgData.senderUid === currentUid) {
                const checkState = getMessageCheckStatus(msgData, msgId);
                if (checkState === 'read-green') {
                    persistGreenReadId(activeChatId, msgId);
                }
            } else {
                const isPageVisible = document.visibilityState === 'visible';
                const updates = {};
                const resolvedColor = msgData.checkColor || (msgData.status === 'read-yellow' ? 'yellow' : msgData.status === 'read-blue' ? 'blue' : 'green');

                if (msgData.delivered !== true) {
                    updates.delivered = true;
                    if (msgData.status !== 'read' && msgData.read !== true) {
                        updates.status = 'delivered';
                    }
                }
                if (isPageVisible && msgData.read !== true) {
                    updates.read = true;
                    updates.status = resolvedColor === 'yellow' ? 'read-yellow' : (resolvedColor === 'blue' ? 'read-blue' : 'read-green');
                    updates.checkColor = resolvedColor;
                }

                if (Object.keys(updates).length > 0 && docSnap?.ref) {
                    updateDoc(docSnap.ref, updates).catch(() => {});
                }

                if (
                    lastNotifiedMessageId !== msgId &&
                    !String(msgData.text || '').startsWith('[CALL_LOG]|')
                ) {
                    lastNotifiedMessageId = msgId;

                    if (isPageVisible) {
                        updateDoc(doc(db, 'chats', activeChatId), {
                            [`unread_${currentUid}`]: false
                        }).catch(() => {});
                        playMessageNotificationSound();
                    } else {
                        const previewText = String(msgData.text || '').includes('📋 *LAMARAN KERJA BARU*')
                            ? 'Mengirim lamaran kerja baru'
                            : String(msgData.text || 'Pesan baru');

                        triggerLocalSystemNotification(
                            otherUserName || String(msgData.senderName || 'Pesan Baru'),
                            previewText,
                            {
                                tag: `chat-${activeChatId}`,
                                icon: otherProfile?.avatarUrl || getUserAvatarUrl(activeChatUserId),
                                url: window.location.href
                            }
                        );
                    }
                }
            }
        },
        onModifiedItem: (msgId, msgData, docSnap) => {
            if (msgData.senderUid === currentUid) {
                const checkState = getMessageCheckStatus(msgData, msgId);
                if (checkState === 'read-green') {
                    persistGreenReadId(activeChatId, msgId);
                }
            } else if (!String(msgData.text || '').startsWith('[CALL_LOG]|')) {
                const isPageVisible = document.visibilityState === 'visible';
                const updates = {};
                const resolvedColor = msgData.checkColor || (msgData.status === 'read-yellow' ? 'yellow' : msgData.status === 'read-blue' ? 'blue' : 'green');

                if (msgData.delivered !== true) {
                    updates.delivered = true;
                    if (!msgData.read && msgData.status !== 'read') {
                        updates.status = 'delivered';
                    }
                }
                if (isPageVisible && msgData.read !== true) {
                    updates.read = true;
                    updates.status = resolvedColor === 'yellow' ? 'read-yellow' : (resolvedColor === 'blue' ? 'read-blue' : 'read-green');
                    updates.checkColor = resolvedColor;
                }
                if (Object.keys(updates).length > 0 && docSnap?.ref) {
                    updateDoc(docSnap.ref, updates).catch(() => {});
                }
            }
        },
        onSnapshotDone: (snapshot) => {
            if (typingBubbleWrapper && messagesContainer) {
                messagesContainer.appendChild(typingBubbleWrapper);
            }
            if (currentUid) {
                snapshot.forEach(docSnap => {
                    const m = docSnap.data();
                    if (m.senderUid === currentUid) {
                        const checkState = getMessageCheckStatus(m, docSnap.id);
                        if (checkState === 'read-green') {
                            persistGreenReadId(activeChatId, docSnap.id);
                        }
                    } else if (m.senderUid && document.visibilityState === 'visible') {
                        const resolvedColor = m.checkColor || (m.status === 'read-yellow' ? 'yellow' : m.status === 'read-blue' ? 'blue' : 'green');
                        if (m.delivered !== true || m.read !== true) {
                            updateDoc(docSnap.ref, {
                                delivered: true,
                                read: true,
                                status: resolvedColor === 'yellow' ? 'read-yellow' : (resolvedColor === 'blue' ? 'read-blue' : 'read-green'),
                                checkColor: resolvedColor
                            }).catch(() => {});
                        }
                    }
                });
            }
        },
        onError: error => {
            console.error('Message listener error:', error);
        }
    });

    updateDoc(doc(db, 'chats', activeChatId), {
        [`unread_${currentUid}`]: false
    }).catch(() => {});

    fetchUserProfile(db, currentUid).then(profile => {
        myProfile = profile;
        myUserName = extractProfileName(profile, user.displayName);
        myBadgesHtml = buildCombinedBadgesHtml(profile, 'message-bubble-verif');
        refreshVisibleSenderInfo();
    }).catch(() => {});

    fetchUserProfile(db, activeChatUserId).then(profile => {
        otherProfile = profile;
        otherUserName = extractProfileName(profile);
        otherBadgesHtml = buildCombinedBadgesHtml(profile, 'message-bubble-verif');
        otherUserFcmToken = profile?.fcmToken || null;
        document.getElementById('activeChatBadges').innerHTML = buildCombinedBadgesHtml(profile, 'chat-header-verif');
        document.getElementById('activeChatName').textContent = otherUserName;
        document.getElementById('activeChatAvatar').src = profile?.avatarUrl || getUserAvatarUrl(activeChatUserId);
        refreshVisibleSenderInfo();
    }).catch(() => {});

    registerPushServiceWorker().then(() => {
        listenForegroundMessages(app, ({ title, body, tag, icon, url }) => {
            if (document.visibilityState === 'hidden') {
                triggerLocalSystemNotification(title, body, { tag, icon, url });
            }
        });
        if ('Notification' in window && Notification.permission === 'granted') {
            refreshFcmToken();
        }
    }).catch(() => {});
}

document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden') {
        setMyTypingState(false);
    } else if (document.visibilityState === 'visible' && activeChatId && currentUid) {
        updateDoc(doc(db, 'chats', activeChatId), {
            [`unread_${currentUid}`]: false
        }).catch(() => {});
    }
});

onAuthStateChanged(auth, user => {
    if (user) {
        initChat(user);
    } else {
        const savedUid = localStorage.getItem('sitenexs_uid');
        if (savedUid) {
            initChat({ uid: savedUid });
        } else {
            window.location.replace('https://account.sitenexs.com/sign-in/');
        }
    }
});

window.handleChatFormSubmit = async function (event) {
    event.preventDefault();

    const inputEl = document.getElementById('messageInput');
    const text = inputEl.value.trim();

    if (!text || !activeChatId || !currentUid) return;

    inputEl.value = '';
    if (typingStopTimer) {
        clearTimeout(typingStopTimer);
        typingStopTimer = null;
    }
    setMyTypingState(false);

    try {
        const recipientUid = activeChatUserId;
        const chatDocRef = doc(db, 'chats', activeChatId);
        const senderNameToSave = myUserName || extractProfileName(myProfile, auth.currentUser?.displayName);
        const senderVerifiedToSave = Boolean(myProfile?.isVerified);
        const senderProToSave = hasYellowBadge(myProfile);

        await setDoc(chatDocRef, {
            participants: [currentUid, activeChatUserId],
            lastMessage: text,
            lastTimestamp: serverTimestamp(),
            [`unread_${recipientUid}`]: true,
            [`typing_${currentUid}`]: false
        }, { merge: true });

        await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
            senderUid: currentUid,
            senderName: senderNameToSave,
            senderIsVerified: senderVerifiedToSave,
            senderIsPro: senderProToSave,
            text,
            createdAt: serverTimestamp(),
            isEdited: false,
            status: 'sent',
            checkColor: null,
            delivered: false,
            read: false
        });

        playSentMessageSound();

        const pushRes = await sendPushNotification({
            db,
            recipientUid: activeChatUserId,
            cachedToken: otherUserFcmToken,
            title: senderNameToSave || 'Pesan Baru',
            body: text,
            tag: `chat-${activeChatId}`,
            url: `https://sitenexs.com/community/messages/chat/?to=${encodeURIComponent(currentUid)}`,
            icon: myProfile?.avatarUrl || getUserAvatarUrl(currentUid),
            workerUrl: PUSH_WORKER_URL
        });
        if (pushRes?.token) otherUserFcmToken = pushRes.token;

    } catch (error) {
        console.error('Send message error:', error);
        showToast('Gagal mengirim pesan.');
    }
};
