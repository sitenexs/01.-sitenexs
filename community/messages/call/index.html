<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panggilan — Sitenexs</title>
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --accent: #10b981;
            --danger: #ef4444;
            --radius-full: 9999px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%; height: 100svh; overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a; color: #fff;
            user-select: none; -webkit-user-select: none;
        }

        button, input { font-family: inherit; outline: none; border: none; }

        .chat-header-verif { width: 15px; height: 15px; object-fit: contain; flex-shrink: 0; display: inline-block; }

        /* LAYAR PANGGILAN MASUK (INCOMING CALL) */
        .incoming-screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            z-index: 25000;
            display: none; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 3.5rem 1.5rem 3rem; text-align: center;
        }
        .incoming-screen.active { display: flex; }

        .incoming-top {
            display: flex; flex-direction: column; align-items: center; margin-top: 1.5rem;
        }
        .caller-avatar-ring {
            position: relative; width: 112px; height: 112px; border-radius: 50%;
            margin-bottom: 1.35rem; display: flex; align-items: center; justify-content: center;
        }
        .caller-avatar-ring::before,
        .caller-avatar-ring::after {
            content: ''; position: absolute; inset: -10px; border-radius: 50%;
            border: 2px solid var(--accent); animation: ringWave 1.8s infinite ease-out;
        }
        .caller-avatar-ring::after { animation-delay: 0.9s; }
        .caller-avatar-img {
            width: 106px; height: 106px; border-radius: 50%; object-fit: cover;
            border: 3px solid #fff; background: var(--primary); position: relative; z-index: 2;
        }
        @keyframes ringWave {
            0% { transform: scale(0.95); opacity: 0.9; }
            100% { transform: scale(1.45); opacity: 0; }
        }

        .incoming-call-actions {
            display: flex; align-items: center; justify-content: center; gap: 3.25rem;
            width: 100%; max-width: 340px; margin-bottom: 1rem;
        }
        .call-action-group {
            display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
        }
        .call-action-btn {
            width: 66px; height: 66px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: #fff; cursor: pointer; font-size: 1.5rem;
            transition: transform 0.2s ease;
        }
        .call-action-btn:active { transform: scale(0.92); }
        .call-accept { background: var(--accent); animation: pulseGreen 1.5s infinite; }
        .call-reject { background: var(--danger); }

        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 16px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* LAYAR GABUNG VIA LINK TAMU (TANPA LOGIN) */
        .guest-join-screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            z-index: 26000;
            display: none; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 3rem 1.5rem 2.75rem; text-align: center;
        }
        .guest-join-screen.active { display: flex; }

        .guest-name-box {
            width: 100%; max-width: 320px; margin-top: 1.25rem;
            display: flex; flex-direction: column; gap: 0.5rem; text-align: left;
        }
        .guest-name-box label {
            font-size: 0.78rem; font-weight: 700; color: #94a3b8; padding-left: 0.25rem;
        }
        .guest-name-input {
            width: 100%; padding: 0.8rem 1.1rem; border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.22);
            color: #fff; font-size: 0.95rem; font-weight: 600;
            user-select: text; -webkit-user-select: text;
        }
        .guest-name-input::placeholder { color: #64748b; }
        .guest-name-input:focus {
            border-color: var(--accent); background: rgba(255, 255, 255, 0.14);
        }

        .guest-join-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.65rem;
            padding: 0.95rem 2.1rem; border-radius: var(--radius-full);
            background: var(--accent); color: #fff; font-size: 1rem; font-weight: 800;
            cursor: pointer; transition: var(--transition);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.38);
        }
        .guest-join-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .guest-join-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* LAYAR UTAMA VIDEO CALL / VOICE CALL */
        .vc-overlay {
            position: fixed; inset: 0; background: #0f172a; z-index: 20000;
            display: none; flex-direction: column; justify-content: space-between;
        }
        .vc-overlay.active { display: flex; }

        .vc-top-actions {
            position: absolute; top: 22px; left: 20px;
            display: flex; align-items: center; gap: 0.5rem; z-index: 25;
        }
        .vc-top-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(8px);
            color: #fff; border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.95rem; transition: var(--transition);
        }
        .vc-top-btn:hover { background: rgba(37, 99, 235, 0.85); }
        .vc-top-btn.share-active {
            background: rgba(16, 185, 129, 0.88);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .vc-remote-container {
            position: relative; width: 100%; height: 100%; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
        }
        #remoteVideo {
            width: 100%; height: 100%; object-fit: cover; background: #1e293b;
        }

        .remote-cam-off-overlay {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 4; padding: 2rem; text-align: center;
        }
        .remote-cam-off-overlay.active { display: flex; }
        .vc-overlay.voice-mode .remote-cam-off-overlay { display: none !important; }

        .remote-media-indicators {
            position: absolute; top: 74px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 0.45rem;
            z-index: 16; pointer-events: none; width: max-content; max-width: 90%;
        }
        .remote-indicator-pill {
            background: rgba(239, 68, 68, 0.92); backdrop-filter: blur(8px);
            color: #fff; padding: 0.4rem 0.95rem; border-radius: var(--radius-full);
            font-size: 0.78rem; font-weight: 700; display: none; align-items: center; gap: 0.45rem;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .remote-indicator-pill.active { display: inline-flex; }

        .voice-call-stage {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; padding: 2rem; text-align: center;
        }
        .vc-overlay.voice-mode .voice-call-stage { display: flex; }
        .vc-overlay.voice-mode #remoteVideo,
        .vc-overlay.voice-mode .vc-local-container { display: none !important; }

        .voice-avatar-ring {
            position: relative; width: 124px; height: 124px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center; margin-bottom: 1.5rem;
        }
        .voice-avatar-ring::before,
        .voice-avatar-ring::after {
            content: ''; position: absolute; inset: -10px; border-radius: 50%;
            border: 2px solid rgba(37, 99, 235, 0.45);
            animation: voicePulse 2.2s infinite ease-out;
        }
        .voice-avatar-ring::after { animation-delay: 1.1s; }
        .voice-avatar-img {
            width: 116px; height: 116px; border-radius: 50%; object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            background: var(--primary); position: relative; z-index: 2;
        }
        @keyframes voicePulse {
            0% { transform: scale(0.95); opacity: 0.85; }
            100% { transform: scale(1.45); opacity: 0; }
        }
        .voice-peer-name {
            font-size: 1.4rem; font-weight: 800; color: #ffffff; margin-bottom: 0.35rem;
            max-width: 90%; display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
        }
        .voice-call-timer {
            font-size: 0.95rem; font-weight: 600; color: #94a3b8;
            letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
        }

        .vc-status-banner {
            position: absolute; top: 24px; left: 50%; transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.78); backdrop-filter: blur(8px);
            color: #fff; padding: 0.5rem 1.25rem; border-radius: var(--radius-full);
            font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.5rem;
            border: 1px solid rgba(255,255,255,0.15); z-index: 10; white-space: nowrap;
            max-width: calc(100vw - 210px); overflow: hidden; text-overflow: ellipsis;
        }
        .vc-timer-pill {
            background: rgba(16, 185, 129, 0.2);
            color: #34d399;
            padding: 0.12rem 0.55rem;
            border-radius: var(--radius-full);
            font-size: 0.78rem;
            font-weight: 700;
            font-variant-numeric: tabular-nums;
            margin-left: 0.2rem;
            display: none;
        }
        .vc-timer-pill.active { display: inline-block; }

        .vc-local-container {
            position: absolute; bottom: 105px; right: 20px; width: 115px; height: 165px;
            border-radius: 14px; overflow: hidden; border: 2px solid rgba(255,255,255,0.3);
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); background: #000; z-index: 15;
        }
        #localVideo {
            width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1);
        }
        .vc-controls {
            position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 1.2rem; z-index: 30;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
            padding: 0.8rem 1.6rem; border-radius: var(--radius-full);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .vc-btn {
            width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 1.18rem; cursor: pointer; transition: var(--transition);
            background: rgba(255,255,255,0.18); color: #fff;
        }
        .vc-btn:hover { background: rgba(255,255,255,0.28); }
        .vc-btn.muted { background: #fff; color: #0f172a; }
        .vc-btn.end-call { background: var(--danger); color: #fff; }
        .vc-btn.end-call:hover { background: #dc2626; transform: scale(1.05); }

        #toastContainer { position: fixed; top: 24px; right: 24px; z-index: 30000; display: flex; flex-direction: column; gap: 0.5rem; max-width: 340px; }
        .toast { background: #1e293b; color: #fff; padding: 0.85rem 1.15rem; border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.75rem; border-left: 4px solid var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.45); }
    </style>
</head>
<body>

    <div id="toastContainer"></div>

    <!-- LAYAR PANGGILAN MASUK (USER TERDAFTAR) -->
    <div id="incomingCallScreen" class="incoming-screen">
        <div class="incoming-top">
            <div class="caller-avatar-ring">
                <img id="callerAvatarDisplay" src="" class="caller-avatar-img" alt="Penelepon" onerror="this.src='https://ui-avatars.com/api/?name=User&background=2563eb&color=fff'">
            </div>
            <div id="incomingCallTypeLabel" style="font-size: 0.82rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.4rem;">
                <i class="fas fa-video" style="color: var(--accent); margin-right: 4px;"></i> Panggilan Video Masuk
            </div>
            <div style="display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem; max-width: 90vw;">
                <div id="callerNameDisplay" style="font-weight: 800; font-size: 1.45rem; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Mitra Sitenexs</div>
                <div id="callerBadgesDisplay" style="display: inline-flex; align-items: center; gap: 2px;"></div>
            </div>
            <div id="incomingSubText" style="font-size: 0.88rem; color: #cbd5e1; margin-top: 0.35rem;">Menghubungkan panggilan masuk...</div>
        </div>

        <div class="incoming-call-actions">
            <div class="call-action-group">
                <button type="button" class="call-action-btn call-reject" onclick="rejectIncomingCall()" title="Tolak">
                    <i class="fas fa-phone-slash"></i>
                </button>
                <span style="font-size: 0.8rem; font-weight: 600; color: #cbd5e1;">Tolak</span>
            </div>
            <div class="call-action-group">
                <button type="button" id="acceptCallBtn" class="call-action-btn call-accept" onclick="acceptIncomingCall()" title="Terima">
                    <i class="fas fa-video"></i>
                </button>
                <span style="font-size: 0.8rem; font-weight: 600; color: #cbd5e1;">Terima</span>
            </div>
        </div>
    </div>

    <!-- LAYAR GABUNG PANGGILAN VIA LINK (TANPA LOGIN) -->
    <div id="guestJoinScreen" class="guest-join-screen">
        <div class="incoming-top">
            <div class="caller-avatar-ring">
                <img id="guestHostAvatar" src="https://sitenexs.com/assets/logo/logo.png" class="caller-avatar-img" alt="Host" onerror="this.src='https://ui-avatars.com/api/?name=Sitenexs&background=2563eb&color=fff'">
            </div>
            <div id="guestCallTypeLabel" style="font-size: 0.82rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.4rem;">
                <i class="fas fa-link" style="color: var(--accent); margin-right: 4px;"></i> Undangan Panggilan Sitenexs
            </div>
            <div style="display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem; max-width: 90vw;">
                <div id="guestHostName" style="font-weight: 800; font-size: 1.4rem; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Memuat ruang panggilan...</div>
                <div id="guestHostBadges" style="display: inline-flex; align-items: center; gap: 2px;"></div>
            </div>
            <div id="guestStatusSubText" style="font-size: 0.86rem; color: #cbd5e1; margin-top: 0.35rem;">Masuk langsung tanpa perlu login akun.</div>

            <div class="guest-name-box">
                <label for="guestDisplayNameInput">Nama Tampilan Anda (Opsional)</label>
                <input type="text" id="guestDisplayNameInput" class="guest-name-input" placeholder="Contoh: Budi (Tamu)" maxlength="32">
            </div>
        </div>

        <div style="display: flex; flex-direction: column; align-items: center; gap: 0.85rem; width: 100%; max-width: 320px;">
            <button type="button" id="guestJoinCallBtn" class="guest-join-btn" onclick="joinCallViaShareLink()" disabled>
                <i class="fas fa-phone-alt"></i> <span id="guestJoinBtnText">Menyiapkan Ruang...</span>
            </button>
            <button type="button" onclick="window.location.replace('https://sitenexs.com/')" style="background: transparent; color: #94a3b8; font-size: 0.82rem; font-weight: 600; cursor: pointer; padding: 0.4rem 1rem;">
                Batal &amp; Ke Beranda
            </button>
        </div>
    </div>

    <!-- LAYAR PANGGILAN AKTIF (VIDEO / SUARA) -->
    <div id="vcOverlay" class="vc-overlay">
        <div class="vc-remote-container">
            <div class="vc-top-actions">
                <button type="button" id="nativePipBtn" class="vc-top-btn" onclick="enterSystemPiP()" title="Jendela Mengambang (PiP)">
                    <i class="fas fa-external-link-alt"></i>
                </button>
                <button type="button" id="shareCallLinkBtn" class="vc-top-btn" onclick="shareCallLink()" title="Bagikan Link Panggilan (Tanpa Login)">
                    <i class="fas fa-link"></i>
                </button>
            </div>

            <div class="vc-status-banner">
                <i class="fas fa-circle" style="color: var(--accent); font-size: 0.6rem;"></i>
                <span id="vcStatusText">Menghubungkan...</span>
                <span id="vcBannerBadges" style="display: inline-flex; align-items: center; gap: 2px;"></span>
                <span id="vcCallTimer" class="vc-timer-pill">00:00</span>
            </div>

            <div class="remote-media-indicators">
                <div id="remoteMutedIndicator" class="remote-indicator-pill">
                    <i class="fas fa-microphone-slash"></i>
                    <span id="remoteMutedText">Mikrofon dibisukan</span>
                </div>
                <div id="remoteCamOffIndicator" class="remote-indicator-pill">
                    <i class="fas fa-video-slash"></i>
                    <span id="remoteCamOffText">Kamera dimatikan</span>
                </div>
            </div>

            <div id="remoteCamOffStage" class="remote-cam-off-overlay">
                <div class="voice-avatar-ring">
                    <img id="remoteCamOffAvatar" src="" class="voice-avatar-img" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=2563eb&color=fff'">
                </div>
                <div class="voice-peer-name">
                    <span id="remoteCamOffPeerName">Mitra Sitenexs</span>
                    <span id="remoteCamOffBadges" style="display: inline-flex; align-items: center; gap: 2px;"></span>
                </div>
                <div style="font-size: 0.88rem; color: #94a3b8; margin-top: 0.25rem;">
                    <i class="fas fa-video-slash" style="margin-right: 4px;"></i> Kamera dimatikan
                </div>
            </div>

            <div id="voiceCallStage" class="voice-call-stage">
                <div class="voice-avatar-ring">
                    <img id="voicePeerAvatar" src="" class="voice-avatar-img" alt="Avatar" onerror="this.src='https://ui-avatars.com/api/?name=User&background=2563eb&color=fff'">
                </div>
                <div class="voice-peer-name">
                    <span id="voicePeerName">Mitra Sitenexs</span>
                    <span id="voicePeerBadges" style="display: inline-flex; align-items: center; gap: 2px;"></span>
                </div>
                <div id="voiceCallTimer" class="voice-call-timer">Menghubungkan...</div>
            </div>

            <video id="remoteVideo" autoplay playsinline></video>
            <div class="vc-local-container">
                <video id="localVideo" autoplay playsinline muted></video>
            </div>
        </div>
        <div class="vc-controls">
            <button type="button" id="toggleMicBtn" class="vc-btn" onclick="toggleMic()" title="Matikan/Nyalakan Mikrofon">
                <i class="fas fa-microphone"></i>
            </button>
            <button type="button" id="toggleCamBtn" class="vc-btn" onclick="toggleCamera()" title="Matikan/Nyalakan Kamera">
                <i class="fas fa-video"></i>
            </button>
            <button type="button" id="endCallBtn" class="vc-btn end-call" onclick="endActiveCall()" title="Akhiri Panggilan">
                <i class="fas fa-phone-slash"></i>
            </button>
        </div>
    </div>

 <script type="module">
import { onAuthStateChanged, signInAnonymously } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';

import {
    doc,
    setDoc,
    updateDoc,
    collection,
    addDoc,
    serverTimestamp
} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

import {
    ref,
    set,
    update,
    push,
    onValue,
    onChildAdded,
    remove
} from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js';

import {
    db,
    rtdb,
    auth,
    PUSH_WORKER_URL
} from 'https://sitenexs.com/assets/js/sitenexs-config.js';

import {
    fetchUserProfile,
    getUserAvatarUrl,
    getUserBadgesHtml
} from 'https://sitenexs.com/assets/js/sitenexs-user-data.js';

import {
    sendPushNotification
} from 'https://sitenexs.com/assets/js/sitenexs-push-client.js';

const CHAT_BASE_URL = 'https://sitenexs.com/community/messages/chat/';
const CALL_BASE_URL = 'https://sitenexs.com/community/messages/call/';
const HOME_BASE_URL = 'https://sitenexs.com/';

const urlParams = new URLSearchParams(window.location.search);
const peerUidParam = urlParams.get('to');
const roomIdParam = urlParams.get('roomId');
const isGuestLinkMode = Boolean(roomIdParam && (urlParams.get('guest') === '1' || !peerUidParam));
const modeParam = isGuestLinkMode ? 'guest_link' : (urlParams.get('mode') || 'outgoing');
const typeParam = urlParams.get('type') === 'audio' ? 'audio' : 'video';

if (!peerUidParam && !roomIdParam) {
    window.location.replace('https://sitenexs.com/community/messages/');
}

let currentUid = null;
let isGuestUser = false;
let myProfile = null;
let myUserName = 'Mitra Sitenexs';
let myIsVerified = false;

let activeChatUserId = peerUidParam || null;
let activeChatId = null;
let otherProfile = null;
let otherUserName = 'Mitra Sitenexs';
let otherUserVerified = false;
let otherUserFcmToken = null;

let peerConnection = null;
let localStream = null;
let remoteStream = null;

let currentCallId = roomIdParam || null;
let currentSessionId = null;
let currentCallType = typeParam;
let currentCallLogDocId = null;
let wasCallConnected = false;
let isShareLinkEnabled = false;
let activeGuestJoinToken = null;

let incomingCallData = null;
let sharedRoomData = null;

let isMicMuted = false;
let isCamOff = false;
let isInCall = false;
let isStartingCall = false;
let callDirection = null;

let ringtoneInterval = null;
let callTimeout = null;
let disconnectGraceTimeout = null;
let callDurationInterval = null;
let callSecondsElapsed = 0;
let wakeLockSentinel = null;

let remoteCandidateQueue = [];

let unsubscribeCallRoom = null;

function returnAfterCall(delayMs = 600) {
    setTimeout(() => {
        if (isGuestUser || !activeChatUserId) {
            window.location.replace(HOME_BASE_URL);
        } else {
            const chatUrl = new URL(CHAT_BASE_URL);
            chatUrl.searchParams.set('to', activeChatUserId);
            window.location.replace(chatUrl.toString());
        }
    }, delayMs);
}

window.showToast = function (msg) {
    const container = document.getElementById('toastContainer');
    if (!container) return;

    const toast = document.createElement('div');
    toast.className = 'toast';

    const icon = document.createElement('i');
    icon.className = 'fas fa-info-circle';
    icon.style.color = 'var(--accent)';

    const text = document.createElement('span');
    text.textContent = msg;

    toast.append(icon, text);
    container.appendChild(toast);

    setTimeout(() => toast.remove(), 3500);
};

window.shareCallLink = async function () {
    if (!currentCallId) {
        showToast('Ruang panggilan belum siap.');
        return;
    }

    isShareLinkEnabled = true;

    const shareUrlObj = new URL(CALL_BASE_URL);
    shareUrlObj.searchParams.set('roomId', currentCallId);
    shareUrlObj.searchParams.set('type', currentCallType);
    shareUrlObj.searchParams.set('guest', '1');
    const shareUrl = shareUrlObj.toString();

    const shareBtn = document.getElementById('shareCallLinkBtn');
    if (shareBtn) shareBtn.classList.add('share-active');

    // Tandai di RTDB agar ruang terbuka untuk peserta via link
    update(ref(rtdb, `calls/${currentCallId}`), {
        allowGuestLink: true,
        shareLinkCreatedAt: Date.now()
    }).catch(() => {});

    // Salin ke clipboard terlebih dahulu sebagai cadangan
    try {
        if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(shareUrl);
        }
    } catch (e) {}

    if (navigator.share) {
        try {
            await navigator.share({
                title: `Panggilan ${currentCallType === 'audio' ? 'Suara' : 'Video'} Sitenexs`,
                text: `${myUserName} mengundang Anda bergabung ke panggilan Sitenexs (klik langsung tanpa login):`,
                url: shareUrl
            });
            showToast('Link panggilan dibagikan!');
            return;
        } catch (err) {
            if (err?.name === 'AbortError') return;
        }
    }

    showToast('Link panggilan disalin! Tempel & kirim ke peserta.');
};

async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator && !wakeLockSentinel) {
            wakeLockSentinel = await navigator.wakeLock.request('screen');
            wakeLockSentinel.addEventListener('release', () => {
                wakeLockSentinel = null;
            });
        }
    } catch (e) {}
}

async function releaseWakeLock() {
    try {
        if (wakeLockSentinel) {
            await wakeLockSentinel.release();
            wakeLockSentinel = null;
        }
    } catch (e) {}
}

window.enterSystemPiP = async function () {
    const remoteVideo = document.getElementById('remoteVideo');
    if (!remoteVideo || currentCallType !== 'video') return;

    try {
        if (document.pictureInPictureEnabled && !remoteVideo.disablePictureInPicture) {
            if (document.pictureInPictureElement !== remoteVideo && remoteVideo.readyState >= 2) {
                await remoteVideo.requestPictureInPicture();
            }
        } else if (typeof remoteVideo.webkitSetPresentationMode === 'function') {
            remoteVideo.webkitSetPresentationMode('picture-in-picture');
        }
    } catch (e) {}
};

async function exitSystemPiP() {
    try {
        if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
        }
        const remoteVideo = document.getElementById('remoteVideo');
        if (remoteVideo && typeof remoteVideo.webkitSetPresentationMode === 'function') {
            remoteVideo.webkitSetPresentationMode('inline');
        }
    } catch (e) {}
}

document.addEventListener('visibilitychange', () => {
    if (!isInCall) return;
    if (document.visibilityState === 'hidden') {
        if (currentCallType === 'video') window.enterSystemPiP();
    } else if (document.visibilityState === 'visible') {
        requestWakeLock();
    }
});

function formatDuration(seconds) {
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function clearCallTimeout() {
    if (callTimeout) {
        clearTimeout(callTimeout);
        callTimeout = null;
    }
}

function clearDisconnectGrace() {
    if (disconnectGraceTimeout) {
        clearTimeout(disconnectGraceTimeout);
        disconnectGraceTimeout = null;
    }
}

function startCallTimer() {
    wasCallConnected = true;
    if (callDurationInterval) return;
    callSecondsElapsed = 0;

    const voiceTimerEl = document.getElementById('voiceCallTimer');
    const bannerTimerEl = document.getElementById('vcCallTimer');

    if (voiceTimerEl) voiceTimerEl.textContent = '00:00';
    if (bannerTimerEl) {
        bannerTimerEl.textContent = '00:00';
        bannerTimerEl.classList.add('active');
    }

    callDurationInterval = setInterval(() => {
        callSecondsElapsed += 1;
        const formatted = formatDuration(callSecondsElapsed);
        if (voiceTimerEl) voiceTimerEl.textContent = formatted;
        if (bannerTimerEl) bannerTimerEl.textContent = formatted;
    }, 1000);
}

function stopCallTimer() {
    if (callDurationInterval) {
        clearInterval(callDurationInterval);
        callDurationInterval = null;
    }
    const bannerTimerEl = document.getElementById('vcCallTimer');
    if (bannerTimerEl) {
        bannerTimerEl.classList.remove('active');
        bannerTimerEl.textContent = '00:00';
    }
}

function updateRemoteMediaIndicators(muted, camOff, peerName) {
    const mutedEl = document.getElementById('remoteMutedIndicator');
    const mutedTextEl = document.getElementById('remoteMutedText');
    const camOffEl = document.getElementById('remoteCamOffIndicator');
    const camOffTextEl = document.getElementById('remoteCamOffText');
    const camOffStage = document.getElementById('remoteCamOffStage');

    const displayPeer = peerName || otherUserName || 'Lawan bicara';

    if (mutedEl && mutedTextEl) {
        mutedTextEl.textContent = `${displayPeer} membisukan mikrofon`;
        mutedEl.classList.toggle('active', Boolean(muted));
    }

    if (camOffEl && camOffTextEl) {
        camOffTextEl.textContent = `${displayPeer} mematikan kamera`;
        camOffEl.classList.toggle('active', Boolean(camOff) && currentCallType === 'video');
    }

    if (camOffStage) {
        camOffStage.classList.toggle('active', Boolean(camOff) && currentCallType === 'video');
    }
}

async function createCallLogMessage(callType) {
    if (!activeChatId || !currentUid || !activeChatUserId || isGuestUser) return null;

    const isAudio = callType === 'audio';
    const labelText = isAudio ? '📞 Panggilan Suara' : '📹 Panggilan Video';
    const rawPayload = `[CALL_LOG]|${callType}|ringing|0`;

    try {
        const chatDocRef = doc(db, 'chats', activeChatId);
        await setDoc(chatDocRef, {
            participants: [currentUid, activeChatUserId],
            lastMessage: labelText,
            lastTimestamp: serverTimestamp(),
            [`unread_${activeChatUserId}`]: true
        }, { merge: true });

        const msgRef = await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
            senderUid: currentUid,
            text: rawPayload,
            createdAt: serverTimestamp(),
            isEdited: false
        });

        return msgRef.id;
    } catch (error) {
        console.error('Gagal membuat riwayat panggilan:', error);
        return null;
    }
}

async function updateCallLogMessage(docId, callType, status, durationSec = 0) {
    if (!activeChatId || !docId || isGuestUser) return;

    const isAudio = callType === 'audio';
    const baseLabel = isAudio ? '📞 Panggilan Suara' : '📹 Panggilan Video';
    let summary = baseLabel;

    if (status === 'ended') {
        summary = `${baseLabel} (${formatDuration(durationSec)})`;
    } else if (status === 'missed') {
        summary = `${baseLabel} • Tidak dijawab`;
    } else if (status === 'rejected') {
        summary = `${baseLabel} • Ditolak`;
    }

    try {
        await updateDoc(doc(db, 'chats', activeChatId, 'messages', docId), {
            text: `[CALL_LOG]|${callType}|${status}|${durationSec}`
        });

        await updateDoc(doc(db, 'chats', activeChatId), {
            lastMessage: summary
        });
    } catch (error) {
        console.warn('Gagal memperbarui log panggilan:', error);
    }
}

function playRingtoneOnce() {
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        const ctx = new AudioContextClass();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(523.25, ctx.currentTime);
        oscillator.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.45);
        oscillator.onended = () => ctx.close().catch(() => {});
    } catch (e) {}
}

    ringtoneInterval = setInterval(() => {
        if (navigator.vibrate) navigator.vibrate([300, 200, 300]);
        playRingtoneOnce();
    }, 2200);
}

function stopIncomingRingtone() {

        clearInterval(ringtoneInterval);
        ringtoneInterval = null;
    }
    if (navigator.vibrate) navigator.vibrate(0);
}

async function setupLocalMedia(callType = 'video') {
    try {
        if (!navigator.mediaDevices?.getUserMedia) {
            showToast('Browser tidak mendukung kamera atau mikrofon.');
            return false;
        }

        const constraints = callType === 'audio'
            ? {
                video: false,
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            }
            : {
                video: {
                    facingMode: 'user',
                    width: { ideal: 640, max: 1280 },
                    height: { ideal: 480, max: 720 },
                    frameRate: { ideal: 24, max: 30 }
                },
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            };

        localStream = await navigator.mediaDevices.getUserMedia(constraints);

        const localVideo = document.getElementById('localVideo');
        if (callType === 'video') {
            localVideo.srcObject = localStream;
            localVideo.muted = true;
            await localVideo.play().catch(() => {});
        } else {
            localVideo.srcObject = null;
        }

        return true;
    } catch (error) {
        const label = callType === 'audio' ? 'Mikrofon' : 'Kamera/mikrofon';
        showToast(`${label} tidak dapat diakses: ` + error.message);
        return false;
    }
}

async function flushRemoteCandidateQueue() {
    if (!peerConnection?.remoteDescription) return;

    while (remoteCandidateQueue.length > 0) {
        const candidate = remoteCandidateQueue.shift();
        try {
            await peerConnection.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (error) {
            console.warn('ICE Candidate gagal:', error);
        }
    }
}

function resetPeerConnectionForRenegotiation() {
    if (unsubscribeRemoteCandidates) {
        unsubscribeRemoteCandidates();
        unsubscribeRemoteCandidates = null;
    }
    if (peerConnection) {
        peerConnection.ontrack = null;
        peerConnection.onicecandidate = null;
        peerConnection.oniceconnectionstatechange = null;
        peerConnection.onconnectionstatechange = null;
        try { peerConnection.close(); } catch (e) {}
        peerConnection = null;
    }
    remoteCandidateQueue = [];
}

function createPeerConnection(callId, sessionId, isCaller) {
    remoteCandidateQueue = [];

    peerConnection = new RTCPeerConnection(rtcConfig);
    remoteStream = new MediaStream();

    const remoteVideo = document.getElementById('remoteVideo');
    remoteVideo.srcObject = remoteStream;

    localStream.getTracks().forEach(track => {
        peerConnection.addTrack(track, localStream);
    });

    peerConnection.ontrack = event => {
        clearCallTimeout();
        clearDisconnectGrace();

        const streams = event.streams;
        if (streams && streams[0]) {
            streams[0].getTracks().forEach(track => {
                if (!remoteStream.getTracks().some(t => t.id === track.id)) {
                    remoteStream.addTrack(track);
                }
            });
        } else if (!remoteStream.getTracks().some(t => t.id === event.track.id)) {
            remoteStream.addTrack(event.track);
        }

        remoteVideo.play().catch(() => {});
        document.getElementById('vcStatusText').textContent =
            currentCallType === 'audio' ? 'Panggilan Suara' : otherUserName;

        startCallTimer();
    };

    const localCandidatePath = isCaller ? 'callerCandidates' : 'calleeCandidates';
    const remoteCandidatePath = isCaller ? 'calleeCandidates' : 'callerCandidates';

    const localCandidatesRef = ref(rtdb, `calls/${callId}/${localCandidatePath}`);
    const remoteCandidatesRef = ref(rtdb, `calls/${callId}/${remoteCandidatePath}`);

    peerConnection.onicecandidate = event => {
        if (!event.candidate) return;
        push(localCandidatesRef, {
            sessionId,
            candidate: event.candidate.toJSON()
        }).catch(error => console.error('Gagal mengirim ICE:', error));
    };

    unsubscribeRemoteCandidates = onChildAdded(remoteCandidatesRef, async snapshot => {
        const value = snapshot.val();
        if (!value?.candidate || value.sessionId !== sessionId) return;
        if (!peerConnection) return;

        if (peerConnection.remoteDescription) {
            try {
                await peerConnection.addIceCandidate(new RTCIceCandidate(value.candidate));
            } catch (error) {
                console.warn('Remote ICE gagal:', error);
            }
        } else {
            remoteCandidateQueue.push(value.candidate);
        }
    });

    peerConnection.oniceconnectionstatechange = () => {
        if (!peerConnection) return;
        const state = peerConnection.iceConnectionState;

        if (state === 'connected' || state === 'completed') {
            clearCallTimeout();
            clearDisconnectGrace();
            document.getElementById('vcStatusText').textContent =
                currentCallType === 'audio' ? 'Panggilan Suara' : otherUserName;
            startCallTimer();
        } else if (state === 'checking') {
            document.getElementById('vcStatusText').textContent = 'Menyambungkan jaringan...';
        } else if (state === 'disconnected') {
            document.getElementById('vcStatusText').textContent = 'Menyambung ulang...';
            if (!disconnectGraceTimeout) {
                disconnectGraceTimeout = setTimeout(() => {
                    if (
                        peerConnection &&
                        (peerConnection.iceConnectionState === 'disconnected' ||
                         peerConnection.iceConnectionState === 'failed')
                    ) {
                        showToast('Koneksi jaringan terputus.');
                        endActiveCall();
                    }
                }, 10000);
            }
        } else if (state === 'failed') {
            clearDisconnectGrace();
            showToast('Koneksi gagal. Jaringan tidak stabil.');
            endActiveCall();
        }
    };

    peerConnection.onconnectionstatechange = () => {
        if (!peerConnection) return;
        const state = peerConnection.connectionState;

        if (state === 'connected') {
            clearCallTimeout();
            clearDisconnectGrace();
            document.getElementById('vcStatusText').textContent =
                currentCallType === 'audio' ? 'Panggilan Suara' : otherUserName;
            startCallTimer();
        } else if (state === 'failed') {
            clearDisconnectGrace();
            showToast('Koneksi panggilan terputus.');
            endActiveCall();
        }
    };
}

function listenToCallRoom(callId, sessionId, isCaller) {
    if (unsubscribeCallRoom) {
        unsubscribeCallRoom();
        unsubscribeCallRoom = null;
    }

    const callRef = ref(rtdb, `calls/${callId}`);

    unsubscribeCallRoom = onValue(callRef, async snapshot => {
        const data = snapshot.val();

        if (!data) {
            if (isInCall) {
                if (isCaller && currentCallLogDocId) {
                    const finalStatus = wasCallConnected ? 'ended' : 'missed';
                    updateCallLogMessage(currentCallLogDocId, currentCallType, finalStatus, callSecondsElapsed);
                }
                showToast('Panggilan berakhir.');
                cleanupCallResources();
                returnAfterCall(700);
            }
            return;
        }

        if (data.sessionId !== sessionId) return;

        const remoteMuted = isCaller ? Boolean(data.calleeMicMuted) : Boolean(data.callerMicMuted);
        const remoteCamOff = isCaller ? Boolean(data.calleeCamOff) : Boolean(data.callerCamOff);
        updateRemoteMediaIndicators(remoteMuted, remoteCamOff, otherUserName);

        if (data.status === 'rejected' && !isShareLinkEnabled && !data.allowGuestLink) {
            if (isCaller && currentCallLogDocId) {
                updateCallLogMessage(currentCallLogDocId, currentCallType, 'rejected', 0);
            }
            showToast('Panggilan ditolak.');
            cleanupCallResources();
            remove(callRef).catch(() => {});
            returnAfterCall(700);
            return;
        }

        if (data.status === 'ended') {
            if (isCaller && currentCallLogDocId) {
                const finalStatus = wasCallConnected ? 'ended' : 'missed';
                updateCallLogMessage(currentCallLogDocId, currentCallType, finalStatus, callSecondsElapsed);
            }
            showToast('Panggilan berakhir.');
            cleanupCallResources();
            returnAfterCall(700);
            return;
        }

        // Jika ada tamu yang bergabung melalui link panggilan
        if (
            isCaller &&
            data.guestJoinRequest &&
            data.guestJoinRequest.token &&
            data.guestJoinRequest.token !== activeGuestJoinToken &&
            localStream
        ) {
            activeGuestJoinToken = data.guestJoinRequest.token;
            otherUserName = data.guestJoinRequest.guestName || 'Tamu Sitenexs';
            otherUserVerified = Boolean(data.guestJoinRequest.guestVerified);

            applyCallOverlayMode(currentCallType, data.guestJoinRequest.guestUid, otherUserName, otherUserVerified);
            document.getElementById('vcStatusText').textContent = `Menghubungkan ${otherUserName}...`;
            showToast(`${otherUserName} bergabung melalui link!`);

            try {
                resetPeerConnectionForRenegotiation();
                await remove(ref(rtdb, `calls/${callId}/callerCandidates`)).catch(() => {});
                await remove(ref(rtdb, `calls/${callId}/calleeCandidates`)).catch(() => {});

                createPeerConnection(callId, sessionId, true);
                const freshOffer = await peerConnection.createOffer();
                await peerConnection.setLocalDescription(freshOffer);

                await update(callRef, {
                    status: 'ringing',
                    calleeUid: data.guestJoinRequest.guestUid,
                    calleeName: otherUserName,
                    calleeMicMuted: false,
                    calleeCamOff: false,
                    answer: null,
                    offer: {
                        type: freshOffer.type,
                        sdp: freshOffer.sdp
                    },
                    offerForGuestToken: activeGuestJoinToken
                });
            } catch (err) {
                console.error('Gagal membuat offer baru untuk tamu:', err);
            }
            return;
        }

        if (
            isCaller &&
            data.answer &&
            peerConnection &&
            !peerConnection.currentRemoteDescription
        ) {
            clearCallTimeout();

            if (currentCallLogDocId) {
                updateCallLogMessage(currentCallLogDocId, currentCallType, 'connected', 0);
            }

            try {
                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.answer));
                await flushRemoteCandidateQueue();

                document.getElementById('vcStatusText').textContent =
                    currentCallType === 'audio' ? 'Panggilan Suara' : otherUserName;

                startCallTimer();
            } catch (error) {
                console.error('Set remote answer gagal:', error);
            }
        }
    });
}

async function startOutgoingCall(callType) {
    if (!currentUid || !activeChatUserId || !activeChatId) return;
    if (isStartingCall || isInCall) return;

    isStartingCall = true;
    callDirection = 'caller';
    currentCallType = callType;
    wasCallConnected = false;
    callSecondsElapsed = 0;

    applyCallOverlayMode(callType, activeChatUserId, otherUserName, otherUserVerified);
    document.getElementById('vcOverlay').classList.add('active');
    document.getElementById('vcStatusText').textContent =
        callType === 'audio' ? 'Panggilan Suara' : `Memanggil ${otherUserName}...`;
    if (callType === 'audio') {
        document.getElementById('voiceCallTimer').textContent = 'Memanggil...';
    }

    const mediaReady = await setupLocalMedia(callType);
    if (!mediaReady) {
        isStartingCall = false;
        callDirection = null;
        returnAfterCall(1200);
        return;
    }

    requestWakeLock();

    const callId = `call_${currentUid}_${Date.now()}`;
    const sessionId = `${currentUid}_${Date.now()}`;

    currentCallId = callId;
    currentSessionId = sessionId;
    isInCall = true;

    currentCallLogDocId = await createCallLogMessage(callType);
    const callRef = ref(rtdb, `calls/${callId}`);

    try {
        createPeerConnection(callId, sessionId, true);
        listenToCallRoom(callId, sessionId, true);

        const offer = await peerConnection.createOffer();
        await peerConnection.setLocalDescription(offer);

        const callPayload = {
            roomId: callId,
            chatId: activeChatId,
            sessionId,
            callType,
            callLogDocId: currentCallLogDocId,
            callerUid: currentUid,
            callerName: myUserName,
            callerVerified: myIsVerified,
            calleeUid: activeChatUserId,
            callerMicMuted: false,
            callerCamOff: false,
            calleeMicMuted: false,
            calleeCamOff: false,
            allowGuestLink: false,
            status: 'ringing',
            offer: {
                type: offer.type,
                sdp: offer.sdp
            },
            timestamp: Date.now()
        };

        await update(callRef, callPayload);
        await set(ref(rtdb, `incomingCalls/${activeChatUserId}`), callPayload);

        const incomingCallLink = new URL(CALL_BASE_URL);
        incomingCallLink.searchParams.set('to', currentUid);
        incomingCallLink.searchParams.set('mode', 'incoming');
        incomingCallLink.searchParams.set('roomId', callId);
        incomingCallLink.searchParams.set('type', callType);

        const callTitle = callType === 'audio' ? 'Panggilan Suara Masuk' : 'Panggilan Video Masuk';
        const pushRes = await sendPushNotification({
            db,
            recipientUid: activeChatUserId,
            cachedToken: otherUserFcmToken,
            title: `${callTitle} • ${myUserName}`,
            body: 'Ketuk untuk menjawab panggilan sekarang.',
            tag: `call-${callId}`,
            url: incomingCallLink.toString(),
            icon: getUserAvatarUrl(currentUid),
            workerUrl: PUSH_WORKER_URL
        });
        if (pushRes?.token) otherUserFcmToken = pushRes.token;

        clearCallTimeout();
        callTimeout = setTimeout(() => {
            if (
                isInCall &&
                currentCallId === callId &&
                peerConnection &&
                !peerConnection.currentRemoteDescription &&
                !isShareLinkEnabled
            ) {
                showToast('Panggilan tidak dijawab.');
                endActiveCall('missed');
            }
        }, 60000);

        isStartingCall = false;
    } catch (error) {
        console.error('Start call error:', error);
        showToast('Gagal memulai panggilan: ' + error.message);
        cleanupCallResources();
        returnAfterCall(1200);
    }
}

/* =====================================================
   GABUNG PANGGILAN MELALUI LINK (TANPA LOGIN)
===================================================== */
function initGuestShareLinkRoom(roomId) {
    const joinScreen = document.getElementById('guestJoinScreen');
    const joinBtn = document.getElementById('guestJoinCallBtn');
    const joinBtnText = document.getElementById('guestJoinBtnText');
    const typeLabel = document.getElementById('guestCallTypeLabel');
    const hostNameEl = document.getElementById('guestHostName');
    const hostAvatarEl = document.getElementById('guestHostAvatar');
    const hostBadgesEl = document.getElementById('guestHostBadges');
    const subTextEl = document.getElementById('guestStatusSubText');
    const nameInput = document.getElementById('guestDisplayNameInput');

    if (!isGuestUser && myUserName && myUserName !== 'Mitra Sitenexs') {
        nameInput.value = myUserName;
    }

    joinScreen.classList.add('active');

    const callRef = ref(rtdb, `calls/${roomId}`);
    if (unsubscribeGuestRoomWatch) unsubscribeGuestRoomWatch();

    unsubscribeGuestRoomWatch = onValue(callRef, (snapshot) => {
        const data = snapshot.val();
        if (!data || data.status === 'ended') {
            sharedRoomData = null;
            hostNameEl.textContent = 'Panggilan Telah Berakhir';
            subTextEl.textContent = 'Link panggilan ini sudah tidak aktif.';
            joinBtn.disabled = true;
            joinBtnText.textContent = 'Tidak Tersedia';
            return;
        }

        sharedRoomData = data;
        currentCallType = data.callType === 'audio' ? 'audio' : typeParam;

        hostNameEl.textContent = data.callerName || 'Mitra Sitenexs';
        hostAvatarEl.src = getSafePeerAvatar(data.callerUid, data.callerName);
        hostBadgesEl.innerHTML = getUserBadgesHtml(Boolean(data.callerVerified));

        typeLabel.innerHTML = currentCallType === 'audio'
            ? '<i class="fas fa-phone" style="color: var(--accent); margin-right: 4px;"></i> Undangan Panggilan Suara'
            : '<i class="fas fa-video" style="color: var(--accent); margin-right: 4px;"></i> Undangan Panggilan Video';

        subTextEl.textContent = 'Klik tombol di bawah untuk langsung masuk tanpa login.';
        joinBtn.disabled = false;
        joinBtnText.textContent = currentCallType === 'audio' ? 'Gabung Panggilan Suara' : 'Gabung Panggilan Video';
    });
}

window.joinCallViaShareLink = async function () {
    if (!roomIdParam || !sharedRoomData || isInCall || isStartingCall) return;

    const customName = document.getElementById('guestDisplayNameInput')?.value.trim();
    if (customName) {
        myUserName = customName;
    } else if (isGuestUser) {
        myUserName = 'Tamu Sitenexs';
    }

    const joinBtn = document.getElementById('guestJoinCallBtn');
    const joinBtnText = document.getElementById('guestJoinBtnText');
    joinBtn.disabled = true;
    joinBtnText.textContent = 'Menghubungkan...';

    isStartingCall = true;
    callDirection = 'callee';
    currentCallId = roomIdParam;
    currentSessionId = sharedRoomData.sessionId;
    currentCallType = sharedRoomData.callType === 'audio' ? 'audio' : 'video';
    otherUserName = sharedRoomData.callerName || 'Mitra Sitenexs';
    otherUserVerified = Boolean(sharedRoomData.callerVerified);

    const mediaReady = await setupLocalMedia(currentCallType);
    if (!mediaReady) {
        isStartingCall = false;
        joinBtn.disabled = false;
        joinBtnText.textContent = 'Coba Lagi';
        return;
    }

    if (unsubscribeGuestRoomWatch) {
        unsubscribeGuestRoomWatch();
        unsubscribeGuestRoomWatch = null;
    }

    requestWakeLock();
    isInCall = true;

    document.getElementById('guestJoinScreen').classList.remove('active');
    applyCallOverlayMode(currentCallType, sharedRoomData.callerUid, otherUserName, otherUserVerified);
    document.getElementById('vcOverlay').classList.add('active');
    document.getElementById('vcStatusText').textContent = 'Menyambungkan ke ruang...';

    const joinToken = `${currentUid}_${Date.now()}`;
    const callRef = ref(rtdb, `calls/${currentCallId}`);

    try {
        // Minta host mengirim offer WebRTC baru khusus untuk sesi tamu ini
        await update(callRef, {
            allowGuestLink: true,
            guestJoinRequest: {
                token: joinToken,
                guestUid: currentUid,
                guestName: myUserName,
                guestVerified: myIsVerified,
                requestedAt: Date.now()
            }
        });

        let answeredForGuest = false;
        if (unsubscribeCallRoom) unsubscribeCallRoom();

        unsubscribeCallRoom = onValue(callRef, async (snapshot) => {
            const data = snapshot.val();
            if (!data || data.status === 'ended') {
                if (isInCall) {
                    showToast('Panggilan berakhir.');
                    cleanupCallResources();
                    returnAfterCall(700);
                }
                return;
            }

            updateRemoteMediaIndicators(Boolean(data.callerMicMuted), Boolean(data.callerCamOff), otherUserName);

            if (
                !answeredForGuest &&
                data.offer &&
                data.offerForGuestToken === joinToken
            ) {
                answeredForGuest = true;
                createPeerConnection(currentCallId, data.sessionId, false);

                await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
                await flushRemoteCandidateQueue();

                const answer = await peerConnection.createAnswer();
                await peerConnection.setLocalDescription(answer);

                await update(callRef, {
                    status: 'connected',
                    calleeMicMuted: false,
                    calleeCamOff: false,
                    answer: {
                        type: answer.type,
                        sdp: answer.sdp
                    },
                    answeredAt: Date.now()
                });

                isStartingCall = false;
            }
        });
    } catch (error) {
        console.error('Guest join error:', error);
        showToast('Gagal terhubung ke panggilan: ' + error.message);
        cleanupCallResources();
        returnAfterCall(1000);
    }
};

window.acceptIncomingCall = async function () {
    const data = incomingCallData;
    stopIncomingRingtone();

    if (!data?.offer || !data?.roomId || !data?.sessionId) {
        showToast('Panggilan sudah berakhir.');
        returnAfterCall(700);
        return;
    }

    if (isInCall) return;

    const callType = data.callType === 'audio' ? 'audio' : 'video';

    currentCallId = data.roomId;
    currentSessionId = data.sessionId;
    currentCallType = callType;
    currentCallLogDocId = data.callLogDocId || null;
    callDirection = 'callee';
    wasCallConnected = false;
    callSecondsElapsed = 0;

    otherUserName = data.callerName || otherUserName;
    if (typeof data.callerVerified === 'boolean') {
        otherUserVerified = data.callerVerified;
    }

    isStartingCall = true;

    const mediaReady = await setupLocalMedia(callType);
    if (!mediaReady) {
        isStartingCall = false;
        rejectIncomingCall(data);
        return;
    }

    requestWakeLock();
    isInCall = true;

    document.getElementById('incomingCallScreen').classList.remove('active');
    applyCallOverlayMode(callType, data.callerUid, otherUserName, otherUserVerified);
    document.getElementById('vcOverlay').classList.add('active');
    document.getElementById('vcStatusText').textContent =
        callType === 'audio' ? 'Panggilan Suara' : 'Menghubungkan...';

    try {
        createPeerConnection(data.roomId, data.sessionId, false);
        listenToCallRoom(data.roomId, data.sessionId, false);

        const callRef = ref(rtdb, `calls/${data.roomId}`);

        await peerConnection.setRemoteDescription(new RTCSessionDescription(data.offer));
        await flushRemoteCandidateQueue();

        const answer = await peerConnection.createAnswer();
        await peerConnection.setLocalDescription(answer);

        await update(callRef, {
            status: 'connected',
            calleeMicMuted: false,
            calleeCamOff: false,
            answer: {
                type: answer.type,
                sdp: answer.sdp
            },
            answeredAt: Date.now()
        });

        if (currentUid && !isGuestUser) {
            remove(ref(rtdb, `incomingCalls/${currentUid}`)).catch(() => {});
        }

        isStartingCall = false;
        incomingCallData = null;
    } catch (error) {
        console.error('Accept call error:', error);
        showToast('Gagal menerima panggilan: ' + error.message);
        cleanupCallResources();
        returnAfterCall(1000);
    }
};

window.rejectIncomingCall = function (callData = incomingCallData) {
    stopIncomingRingtone();
    document.getElementById('incomingCallScreen').classList.remove('active');

    if (callData?.roomId) {
        update(ref(rtdb, `calls/${callData.roomId}`), {
            status: 'rejected',
            rejectedAt: Date.now()
        }).catch(() => {});

        if (callData.callLogDocId) {
            updateCallLogMessage(
                callData.callLogDocId,
                callData.callType === 'audio' ? 'audio' : 'video',
                'rejected',
                0
            );
        }
    }

    if (currentUid && !isGuestUser) {
        remove(ref(rtdb, `incomingCalls/${currentUid}`)).catch(() => {});
    }

    incomingCallData = null;
    returnAfterCall(500);
};

window.endActiveCall = function (forcedStatus = null) {
    const callId = currentCallId;
    const direction = callDirection;
    const logDocId = currentCallLogDocId;
    const callType = currentCallType;
    const duration = callSecondsElapsed;
    const connected = wasCallConnected;

    cleanupCallResources();

    if (logDocId && !isGuestUser) {
        const finalStatus = forcedStatus || (connected ? 'ended' : 'missed');
        updateCallLogMessage(logDocId, callType, finalStatus, duration);
    }

    if (callId) {
        update(ref(rtdb, `calls/${callId}`), {
            status: 'ended',
            endedAt: Date.now()
        }).catch(() => {});
        setTimeout(() => {
            remove(ref(rtdb, `calls/${callId}`)).catch(() => {});
        }, 1200);
    }

    if (direction === 'caller' && activeChatUserId) {
        remove(ref(rtdb, `incomingCalls/${activeChatUserId}`)).catch(() => {});
    }

    if (currentUid && !isGuestUser) {
        remove(ref(rtdb, `incomingCalls/${currentUid}`)).catch(() => {});
    }

    returnAfterCall(500);
};

function cleanupCallResources() {
    isInCall = false;
    isStartingCall = false;

    exitSystemPiP();
    releaseWakeLock();
    clearCallTimeout();
    clearDisconnectGrace();
    stopCallTimer();
    stopIncomingRingtone();

    if (unsubscribeCallRoom) {
        unsubscribeCallRoom();
        unsubscribeCallRoom = null;
    }

    if (unsubscribeGuestRoomWatch) {
        unsubscribeGuestRoomWatch();
        unsubscribeGuestRoomWatch = null;
    }

    if (unsubscribeRemoteCandidates) {
        unsubscribeRemoteCandidates();
        unsubscribeRemoteCandidates = null;
    }

    if (localStream) {
        localStream.getTracks().forEach(track => {
            try { track.stop(); } catch (e) {}
        });
        localStream = null;
    }

    if (peerConnection) {
        peerConnection.ontrack = null;
        peerConnection.onicecandidate = null;
        peerConnection.oniceconnectionstatechange = null;
        peerConnection.onconnectionstatechange = null;
        try { peerConnection.close(); } catch (e) {}
        peerConnection = null;
    }

    document.getElementById('localVideo').srcObject = null;
    document.getElementById('remoteVideo').srcObject = null;
    remoteStream = null;
    remoteCandidateQueue = [];
}

window.toggleMic = function () {
    if (!localStream) return;
    isMicMuted = !isMicMuted;

    localStream.getAudioTracks().forEach(track => {
        track.enabled = !isMicMuted;
    });

    const btn = document.getElementById('toggleMicBtn');
    btn.classList.toggle('muted', isMicMuted);
    btn.innerHTML = isMicMuted
        ? '<i class="fas fa-microphone-slash"></i>'
        : '<i class="fas fa-microphone"></i>';

    if (currentCallId && callDirection) {
        const field = callDirection === 'caller' ? 'callerMicMuted' : 'calleeMicMuted';
        update(ref(rtdb, `calls/${currentCallId}`), { [field]: isMicMuted }).catch(() => {});
    }
};

window.toggleCamera = function () {
    if (!localStream || currentCallType === 'audio') return;
    isCamOff = !isCamOff;

    localStream.getVideoTracks().forEach(track => {
        track.enabled = !isCamOff;
    });

    const btn = document.getElementById('toggleCamBtn');
    btn.classList.toggle('muted', isCamOff);
    btn.innerHTML = isCamOff
        ? '<i class="fas fa-video-slash"></i>'
        : '<i class="fas fa-video"></i>';

    if (currentCallId && callDirection) {
        const field = callDirection === 'caller' ? 'callerCamOff' : 'calleeCamOff';
        update(ref(rtdb, `calls/${currentCallId}`), { [field]: isCamOff }).catch(() => {});
    }
};

function listenIncomingCallForPage() {
    if (!currentUid || isGuestUser) return;
    const incomingRef = ref(rtdb, `incomingCalls/${currentUid}`);

    if (unsubscribeIncomingCalls) unsubscribeIncomingCalls();

    unsubscribeIncomingCalls = onValue(incomingRef, snapshot => {
        const data = snapshot.val();

        if (!data) {
            if (!isInCall) {
                stopIncomingRingtone();
                showToast('Panggilan dibatalkan atau sudah berakhir.');
                returnAfterCall(800);
            }
            return;
        }

        if (data.timestamp && Date.now() - data.timestamp > 60000) {
            remove(incomingRef).catch(() => {});
            if (!isInCall) returnAfterCall(700);
            return;
        }

        if (
            data.calleeUid === currentUid &&
            data.status === 'ringing' &&
            data.offer &&
            !isInCall
        ) {
            activeChatUserId = data.callerUid || activeChatUserId;
            const participants = [currentUid, activeChatUserId].sort();
            activeChatId = `${participants[0]}_${participants[1]}`;
            showIncomingCallScreen(data);
        }
    });
}

async function initCallPage(user, guestFlag = false) {
    currentUid = user.uid;
    isGuestUser = guestFlag;

    if (!isGuestUser) {
        try {
            myProfile = await fetchUserProfile(db, currentUid);
            myUserName = myProfile.displayName || 'Mitra Sitenexs';
            myIsVerified = Boolean(myProfile.isVerified);
        } catch (e) {}
    } else {
        myUserName = 'Tamu Sitenexs';
        myIsVerified = false;
    }

    // Jika dibuka melalui link panggilan (?roomId=...&guest=1)
    if (modeParam === 'guest_link' && roomIdParam) {
        initGuestShareLinkRoom(roomIdParam);
        return;
    }

    const participants = [currentUid, activeChatUserId].sort();
    activeChatId = `${participants[0]}_${participants[1]}`;

    otherProfile = await fetchUserProfile(db, activeChatUserId);
    otherUserName = otherProfile.displayName;
    otherUserVerified = otherProfile.isVerified;
    otherUserFcmToken = otherProfile.fcmToken;

    if (modeParam === 'incoming') {
        document.getElementById('callerAvatarDisplay').src = otherProfile.avatarUrl;
        document.getElementById('callerNameDisplay').textContent = otherUserName;
        document.getElementById('callerBadgesDisplay').innerHTML = otherProfile.badgesHtml;
        document.getElementById('incomingCallScreen').classList.add('active');
        listenIncomingCallForPage();
    } else {
        startOutgoingCall(typeParam);
    }
}

onAuthStateChanged(auth, async user => {
    if (user) {
        initCallPage(user, Boolean(user.isAnonymous));
    } else {
        const savedUid = localStorage.getItem('sitenexs_uid');
        if (savedUid) {
            initCallPage({ uid: savedUid }, false);
        } else if (isGuestLinkMode && roomIdParam) {
            // Masuk langsung sebagai tamu tanpa perlu halaman sign-in
            try {
                const anonCred = await signInAnonymously(auth);
                initCallPage(anonCred.user, true);
            } catch (err) {
                let guestId = sessionStorage.getItem('sitenexs_guest_uid');
                if (!guestId) {
                    guestId = `guest_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
                    sessionStorage.setItem('sitenexs_guest_uid', guestId);
                }
                initCallPage({ uid: guestId }, true);
            }
        } else {
            window.location.replace('https://account.sitenexs.com/sign-in/');
        }
    }
});
