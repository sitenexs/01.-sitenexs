<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Panggilan — Sitenexs</title>
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --accent: #10b981;
            --danger: #ef4444;
            --radius-full: 9999px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            height: 100%; height: 100svh; overflow: hidden;
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #0f172a; color: #fff;
            user-select: none; -webkit-user-select: none;
        }

        button, input { font-family: inherit; outline: none; border: none; }

        .chat-header-verif { width: 16px; height: 16px; object-fit: contain; flex-shrink: 0; display: inline-block; }

        /* LAYAR PANGGILAN MASUK (INCOMING CALL) */
        .incoming-screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            z-index: 25000;
            display: none; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 3.5rem 1.5rem 3rem; text-align: center;
        }
        .incoming-screen.active { display: flex; }

        .incoming-top {
            display: flex; flex-direction: column; align-items: center; margin-top: 1.5rem;
        }
        .caller-avatar-ring {
            position: relative; width: 112px; height: 112px; border-radius: 50%;
            margin-bottom: 1.35rem; display: flex; align-items: center; justify-content: center;
        }
        .caller-avatar-ring::before,
        .caller-avatar-ring::after {
            content: ''; position: absolute; inset: -10px; border-radius: 50%;
            border: 2px solid var(--accent); animation: ringWave 1.8s infinite ease-out;
        }
        .caller-avatar-ring::after { animation-delay: 0.9s; }
        .caller-avatar-img {
            width: 106px; height: 106px; border-radius: 50%; object-fit: cover;
            border: 3px solid #fff; background: var(--primary); position: relative; z-index: 2;
        }
        @keyframes ringWave {
            0% { transform: scale(0.95); opacity: 0.9; }
            100% { transform: scale(1.45); opacity: 0; }
        }

        .incoming-call-actions {
            display: flex; align-items: center; justify-content: center; gap: 3.25rem;
            width: 100%; max-width: 340px; margin-bottom: 1rem;
        }
        .call-action-group {
            display: flex; flex-direction: column; align-items: center; gap: 0.55rem;
        }
        .call-action-btn {
            width: 66px; height: 66px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; color: #fff; cursor: pointer; font-size: 1.5rem;
            transition: transform 0.2s ease;
        }
        .call-action-btn:active { transform: scale(0.92); }
        .call-accept { background: var(--accent); animation: pulseGreen 1.5s infinite; }
        .call-reject { background: var(--danger); }

        @keyframes pulseGreen {
            0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { box-shadow: 0 0 0 16px rgba(16, 185, 129, 0); }
            100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        /* LAYAR GABUNG VIA LINK TAMU (TANPA LOGIN) */
        .guest-join-screen {
            position: fixed; inset: 0;
            background: radial-gradient(circle at top, #1e293b 0%, #0f172a 100%);
            z-index: 26000;
            display: none; flex-direction: column; align-items: center; justify-content: space-between;
            padding: 3rem 1.5rem 2.75rem; text-align: center;
        }
        .guest-join-screen.active { display: flex; }

        .guest-name-box {
            width: 100%; max-width: 320px; margin-top: 1.25rem;
            display: flex; flex-direction: column; gap: 0.5rem; text-align: left;
        }
        .guest-name-box label {
            font-size: 0.78rem; font-weight: 700; color: #94a3b8; padding-left: 0.25rem;
        }
        .guest-name-input {
            width: 100%; padding: 0.8rem 1.1rem; border-radius: var(--radius-full);
            background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.22);
            color: #fff; font-size: 0.95rem; font-weight: 600;
            user-select: text; -webkit-user-select: text;
        }
        .guest-name-input::placeholder { color: #64748b; }
        .guest-name-input:focus {
            border-color: var(--accent); background: rgba(255, 255, 255, 0.14);
        }

        .guest-join-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.65rem;
            padding: 0.95rem 2.1rem; border-radius: var(--radius-full);
            background: var(--accent); color: #fff; font-size: 1rem; font-weight: 800;
            cursor: pointer; transition: var(--transition);
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.38);
        }
        .guest-join-btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
        .guest-join-btn:disabled { opacity: 0.6; cursor: not-allowed; transform: none; }

        /* LAYAR UTAMA VIDEO CALL / VOICE CALL */
        .vc-overlay {
            position: fixed; inset: 0; background: #0f172a; z-index: 20000;
            display: none; flex-direction: column; justify-content: space-between;
        }
        .vc-overlay.active { display: flex; }

        /* Gradasi atas halus agar teks nama tetap jelas tanpa kotak kapsul */
        .vc-top-gradient {
            position: absolute; top: 0; left: 0; right: 0; height: 120px;
            background: linear-gradient(180deg, rgba(15, 23, 42, 0.68) 0%, rgba(15, 23, 42, 0) 100%);
            pointer-events: none; z-index: 9;
        }

        .vc-top-actions {
            position: absolute; top: 20px; left: 16px;
            display: flex; align-items: center; gap: 0.45rem; z-index: 25;
        }
        .vc-top-btn {
            width: 38px; height: 38px; border-radius: 50%;
            background: rgba(15, 23, 42, 0.52); backdrop-filter: blur(8px);
            color: #fff; border: 1px solid rgba(255, 255, 255, 0.18);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; font-size: 0.9rem; transition: var(--transition);
        }
        .vc-top-btn:hover { background: rgba(37, 99, 235, 0.85); }
        .vc-top-btn.share-active {
            background: rgba(16, 185, 129, 0.88);
            border-color: rgba(255, 255, 255, 0.4);
        }

        .vc-remote-container {
            position: relative; width: 100%; height: 100%; display: flex;
            align-items: center; justify-content: center; overflow: hidden;
        }

        /* =====================================================
           HEADER NAMA TENGAH PRESISI (TANPA KAPSUL) + TIMER BAWAH
        ===================================================== */
        .vc-header-center {
            position: absolute;
            top: 22px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 12;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            pointer-events: none;
            width: max-content;
            max-width: calc(100vw - 208px);
        }

        .vc-name-symmetry-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            width: 100%;
        }

        .vc-name-title {
            grid-column: 2;
            font-size: 1.05rem;
            font-weight: 800;
            color: #ffffff;
            letter-spacing: -0.01em;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.72);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: calc(100vw - 236px);
        }

        .vc-badges-right {
            grid-column: 3;
            justify-self: start;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-left: 5px;
            filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.6));
        }

        .vc-timer-sub {
            margin-top: 3px;
            font-size: 0.82rem;
            font-weight: 700;
            color: #e2e8f0;
            letter-spacing: 0.05em;
            font-variant-numeric: tabular-nums;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.78);
            display: none;
        }
        .vc-timer-sub.active {
            display: block;
        }

        .vc-overlay.voice-mode .vc-header-center {
            display: none;
        }

        /* =====================================================
           GRID LAYAR TERBAGI (2 ORANG = FULL + PIP GESER, 3+ = SPLIT)
        ===================================================== */
        .vc-videos-grid {
            position: relative; width: 100%; height: 100%;
            display: grid; grid-template-columns: 1fr; grid-template-rows: 1fr;
            gap: 0; background: #0f172a;
        }

        /* Mode 3 peserta */
        .vc-videos-grid[data-count="3"] {
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr;
            gap: 6px;
            padding: 82px 8px 104px 8px;
        }
        .vc-videos-grid[data-count="3"] .video-tile:nth-child(1) {
            grid-column: 1 / 2;
            grid-row: 1 / 2;
        }
        .vc-videos-grid[data-count="3"] .video-tile:nth-child(2) {
            grid-column: 2 / 3;
            grid-row: 1 / 2;
        }
        .vc-videos-grid[data-count="3"] .video-tile.local-tile {
            grid-column: 1 / 3;
            grid-row: 2 / 3;
            position: relative !important;
            left: auto !important;
            top: auto !important;
            right: auto !important;
            bottom: auto !important;
            width: 100% !important;
            height: 100% !important;
            cursor: default !important;
        }

        /* Mode 4 peserta atau lebih */
        .vc-videos-grid[data-count="4"],
        .vc-videos-grid[data-count="many"] {
            grid-template-columns: 1fr 1fr;
            grid-auto-rows: 1fr;
            gap: 6px;
            padding: 82px 8px 104px 8px;
        }
        .vc-videos-grid[data-count="4"] .video-tile.local-tile,
        .vc-videos-grid[data-count="many"] .video-tile.local-tile {
            position: relative !important;
            left: auto !important;
            top: auto !important;
            right: auto !important;
            bottom: auto !important;
            width: 100% !important;
            height: 100% !important;
            cursor: default !important;
        }

        .video-tile {
            position: relative; width: 100%; height: 100%;
            background: #1e293b; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
        }
        .vc-videos-grid:not([data-count="1"]):not([data-count="2"]) .video-tile {
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.14);
        }

        .video-tile video {
            width: 100%; height: 100%; object-fit: cover; background: #1e293b;
            display: block;
        }
        .video-tile.local-tile video {
            transform: scaleX(-1);
            pointer-events: none;
        }

        /* Saat hanya berdua (1 atau 2 peserta), video lokal mengambang & bisa digeser */
        .vc-videos-grid[data-count="1"] .video-tile.local-tile,
        .vc-videos-grid[data-count="2"] .video-tile.local-tile {
            position: absolute;
            bottom: 108px;
            right: 18px;
            width: 112px;
            height: 162px;
            border-radius: 16px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.35);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.55);
            background: #0f172a;
            z-index: 18;
            touch-action: none;
            cursor: grab;
            transition: left 0.25s cubic-bezier(0.22, 1, 0.36, 1), top 0.25s cubic-bezier(0.22, 1, 0.36, 1), transform 0.18s ease;
        }
        .vc-videos-grid[data-count="1"] .video-tile.local-tile.dragging,
        .vc-videos-grid[data-count="2"] .video-tile.local-tile.dragging {
            transition: none;
            cursor: grabbing;
            transform: scale(1.04);
            border-color: rgba(255, 255, 255, 0.7);
        }

        /* Label nama & status per kotak peserta (mode 3+ orang) */
        .tile-footer-badge {
            position: absolute; bottom: 10px; left: 10px; right: 10px;
            display: flex; align-items: center; justify-content: space-between; gap: 0.4rem;
            z-index: 8; pointer-events: none;
        }
        .vc-videos-grid[data-count="1"] .video-tile.local-tile .tile-footer-badge,
        .vc-videos-grid[data-count="2"] .video-tile.local-tile .tile-footer-badge,
        .vc-videos-grid[data-count="1"] .remote-tile .tile-footer-badge,
        .vc-videos-grid[data-count="2"] .remote-tile .tile-footer-badge {
            display: none;
        }
        .tile-name-pill {
            background: rgba(15, 23, 42, 0.72); backdrop-filter: blur(8px);
            color: #fff; padding: 0.25rem 0.65rem; border-radius: var(--radius-full);
            font-size: 0.74rem; font-weight: 700; display: inline-flex; align-items: center; gap: 0.35rem;
            border: 1px solid rgba(255, 255, 255, 0.14);
            max-width: 85%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }
        .tile-muted-badge {
            width: 26px; height: 26px; border-radius: 50%;
            background: rgba(239, 68, 68, 0.92); color: #fff;
            display: none; align-items: center; justify-content: center;
            font-size: 0.72rem; flex-shrink: 0;
        }
        .tile-muted-badge.active { display: inline-flex; }

        /* Overlay kamera mati / video dijeda per peserta */
        .tile-cam-off-overlay {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 4; padding: 1rem; text-align: center;
            pointer-events: none;
        }
        .tile-cam-off-overlay.active { display: flex; }

        .tile-avatar-img {
            width: 72px; height: 72px; border-radius: 50%; object-fit: cover;
            border: 2.5px solid rgba(255, 255, 255, 0.85);
            background: var(--primary); margin-bottom: 0.6rem;
        }
        .vc-videos-grid[data-count="1"] .remote-tile .tile-avatar-img,
        .vc-videos-grid[data-count="2"] .remote-tile .tile-avatar-img {
            width: 112px; height: 112px; margin-bottom: 1rem;
        }
        .vc-videos-grid[data-count="1"] .local-tile .tile-avatar-img,
        .vc-videos-grid[data-count="2"] .local-tile .tile-avatar-img {
            width: 44px; height: 44px; margin-bottom: 0.25rem;
        }

        /* Indikator status mute/kamera/video dijeda saat berdua */
        .remote-media-indicators {
            position: absolute; top: 82px; left: 50%; transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 0.45rem;
            z-index: 16; pointer-events: none; width: max-content; max-width: 90%;
        }
        .vc-videos-grid:not([data-count="1"]):not([data-count="2"]) ~ .remote-media-indicators {
            display: none !important;
        }
        .remote-indicator-pill {
            background: rgba(239, 68, 68, 0.92); backdrop-filter: blur(8px);
            color: #fff; padding: 0.36rem 0.9rem; border-radius: var(--radius-full);
            font-size: 0.76rem; font-weight: 700; display: none; align-items: center; gap: 0.45rem;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .remote-indicator-pill.paused-pill {
            background: rgba(245, 158, 11, 0.92);
        }
        .remote-indicator-pill.active { display: inline-flex; }

        /* Stage panggilan suara (Audio mode) */
        .voice-call-stage {
            position: absolute; inset: 0;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: none; flex-direction: column; align-items: center; justify-content: center;
            z-index: 5; padding: 2rem; text-align: center;
        }
        .vc-overlay.voice-mode .voice-call-stage { display: flex; }
        .vc-overlay.voice-mode .vc-videos-grid { display: none !important; }

        .voice-group-avatars {
            display: flex; align-items: center; justify-content: center;
            flex-wrap: wrap; gap: 1rem; margin-bottom: 1.5rem;
        }
        .voice-avatar-ring {
            position: relative; width: 112px; height: 112px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
        }
        .voice-avatar-ring::before,
        .voice-avatar-ring::after {
            content: ''; position: absolute; inset: -8px; border-radius: 50%;
            border: 2px solid rgba(37, 99, 235, 0.45);
            animation: voicePulse 2.2s infinite ease-out;
        }
        .voice-avatar-ring::after { animation-delay: 1.1s; }
        .voice-avatar-img {
            width: 104px; height: 104px; border-radius: 50%; object-fit: cover;
            border: 3px solid rgba(255, 255, 255, 0.85);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            background: var(--primary); position: relative; z-index: 2;
        }
        @keyframes voicePulse {
            0% { transform: scale(0.95); opacity: 0.85; }
            100% { transform: scale(1.4); opacity: 0; }
        }
        .voice-peer-name-row {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            width: 100%;
            max-width: 92vw;
            margin-bottom: 0.35rem;
        }
        .voice-peer-name {
            grid-column: 2;
            font-size: 1.35rem;
            font-weight: 800;
            color: #ffffff;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }
        .voice-peer-badges {
            grid-column: 3;
            justify-self: start;
            display: inline-flex;
            align-items: center;
            gap: 3px;
            margin-left: 6px;
        }
        .voice-call-timer {
            font-size: 0.95rem; font-weight: 600; color: #94a3b8;
            letter-spacing: 0.06em; font-variant-numeric: tabular-nums;
        }

        .vc-controls {
            position: absolute; bottom: 28px; left: 50%; transform: translateX(-50%);
            display: flex; align-items: center; gap: 1.2rem; z-index: 30;
            background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(10px);
            padding: 0.8rem 1.6rem; border-radius: var(--radius-full);
            border: 1px solid rgba(255,255,255,0.15);
        }
        .vc-btn {
            width: 54px; height: 54px; border-radius: 50%; display: flex; align-items: center;
            justify-content: center; font-size: 1.18rem; cursor: pointer; transition: var(--transition);
            background: rgba(255,255,255,0.18); color: #fff;
        }
        .vc-btn:hover { background: rgba(255,255,255,0.28); }
        .vc-btn.muted { background: #fff; color: #0f172a; }
        .vc-btn.end-call { background: var(--danger); color: #fff; }
        .vc-btn.end-call:hover { background: #dc2626; transform: scale(1.05); }

        #toastContainer { position: fixed; top: 24px; right: 24px; z-index: 30000; display: flex; flex-direction: column; gap: 0.5rem; max-width: 340px; }
        .toast { background: #1e293b; color: #fff; padding: 0.85rem 1.15rem; border-radius: 0.5rem; font-size: 0.85rem; font-weight: 600; display: flex; align-items: center; gap: 0.75rem; border-left: 4px solid var(--accent); box-shadow: 0 10px 25px rgba(0,0,0,0.45); }
    </style>
</head>
<body>

    <div id="toastContainer"></div>

    <!-- LAYAR PANGGILAN MASUK (USER TERDAFTAR) -->
    <div id="incomingCallScreen" class="incoming-screen">
        <div class="incoming-top">
            <div class="caller-avatar-ring">
                <img id="callerAvatarDisplay" src="" class="caller-avatar-img" alt="Penelepon" onerror="this.src='https://ui-avatars.com/api/?name=User&background=2563eb&color=fff'">
            </div>
            <div id="incomingCallTypeLabel" style="font-size: 0.82rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.4rem;">
                <i class="fas fa-video" style="color: var(--accent); margin-right: 4px;"></i> Panggilan Video Masuk
            </div>
            <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; max-width: 90vw;">
                <div id="callerNameDisplay" style="grid-column: 2; font-weight: 800; font-size: 1.45rem; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Mitra Sitenexs</div>
                <div id="callerBadgesDisplay" style="grid-column: 3; justify-self: start; display: inline-flex; align-items: center; gap: 2px; margin-left: 5px;"></div>
            </div>
            <div id="incomingSubText" style="font-size: 0.88rem; color: #cbd5e1; margin-top: 0.35rem;">Menghubungkan panggilan masuk...</div>
        </div>

        <div class="incoming-call-actions">
            <div class="call-action-group">
                <button type="button" class="call-action-btn call-reject" onclick="rejectIncomingCall()" title="Tolak">
                    <i class="fas fa-phone-slash"></i>
                </button>
                <span style="font-size: 0.8rem; font-weight: 600; color: #cbd5e1;">Tolak</span>
            </div>
            <div class="call-action-group">
                <button type="button" id="acceptCallBtn" class="call-action-btn call-accept" onclick="acceptIncomingCall()" title="Terima">
                    <i class="fas fa-video"></i>
                </button>
                <span style="font-size: 0.8rem; font-weight: 600; color: #cbd5e1;">Terima</span>
            </div>
        </div>
    </div>

    <!-- LAYAR GABUNG PANGGILAN VIA LINK (TANPA LOGIN) -->
    <div id="guestJoinScreen" class="guest-join-screen">
        <div class="incoming-top">
            <div class="caller-avatar-ring">
                <img id="guestHostAvatar" src="https://sitenexs.com/assets/logo/logo.png" class="caller-avatar-img" alt="Host" onerror="this.src='https://ui-avatars.com/api/?name=Sitenexs&background=2563eb&color=fff'">
            </div>
            <div id="guestCallTypeLabel" style="font-size: 0.82rem; color: #94a3b8; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 0.4rem;">
                <i class="fas fa-link" style="color: var(--accent); margin-right: 4px;"></i> Undangan Panggilan Sitenexs
            </div>
            <div style="display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; max-width: 90vw;">
                <div id="guestHostName" style="grid-column: 2; font-weight: 800; font-size: 1.4rem; color: #fff; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">Memuat ruang panggilan...</div>

function pauseVideoKeepVoiceOnLeave() {
    if (!isInCall || isExplicitCallEnded || !currentCallId || !currentUid) return;

    persistOngoingCallState(true);

    if (localStream) {
        localStream.getAudioTracks().forEach(track => {
            track.enabled = !isMicMuted;
        });

        if (currentCallType === 'video') {
            isVideoPausedInBackground = true;
            localStream.getVideoTracks().forEach(track => {
                track.enabled = false;
            });
        }
    }

    update(ref(rtdb, `calls/${currentCallId}/participants/${currentUid}`), {
        camOff: currentCallType === 'video' ? true : isCamOff,
        videoPaused: currentCallType === 'video',
        voiceOnlyBackground: true,
        lastActiveAt: Date.now()
    }).catch(() => {});
}

function resumeVideoWhenReturningToCall() {
    if (!isInCall || isExplicitCallEnded || !currentCallId || !currentUid) return;

    if (currentCallType === 'video' && !isCamOff && localStream) {
        isVideoPausedInBackground = false;
        localStream.getVideoTracks().forEach(track => {
            track.enabled = true;
        });
        const localCamOffOverlay = document.getElementById('localCamOffOverlay');
        if (localCamOffOverlay) localCamOffOverlay.classList.remove('active');
        const localVideo = document.getElementById('localVideo');
        if (localVideo) {
            localVideo.srcObject = localStream;
            localVideo.muted = true;
            localVideo.play().catch(() => {});
        }
    }

    update(ref(rtdb, `calls/${currentCallId}/participants/${currentUid}`), {
        camOff: isCamOff,
        videoPaused: false,
        voiceOnlyBackground: false,
        lastActiveAt: Date.now()
    }).catch(() => {});
}

function initDraggableLocalTile() {
    const localTile = document.getElementById('localVideoTile');
    const grid = document.getElementById('vcVideosGrid');
    if (!localTile || !grid) return;

    let isDragging = false;
    let startX = 0;
    let startY = 0;
    let initialLeft = 0;
    let initialTop = 0;

    function isPipModeActive() {
        const count = grid.getAttribute('data-count');
        return count === '1' || count === '2';
    }

    function snapToNearestEdge() {
        if (!isPipModeActive()) return;
        const rect = localTile.getBoundingClientRect();
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        const margin = 16;
        const topSafe = 82;
        const bottomSafe = 104;

        const targetLeft = (rect.left + rect.width / 2 < winW / 2)
            ? margin
            : Math.max(margin, winW - rect.width - margin);

        const clampedTop = Math.min(
            Math.max(topSafe, rect.top),
            Math.max(topSafe, winH - rect.height - bottomSafe)
        );

        localTile.style.left = `${targetLeft}px`;
        localTile.style.top = `${clampedTop}px`;
        localTile.style.right = 'auto';
        localTile.style.bottom = 'auto';
    }

    localTile.addEventListener('pointerdown', (e) => {
        if (!isPipModeActive()) return;
        isDragging = true;
        localTile.classList.add('dragging');

        const rect = localTile.getBoundingClientRect();
        localTile.style.left = `${rect.left}px`;
        localTile.style.top = `${rect.top}px`;
        localTile.style.right = 'auto';
        localTile.style.bottom = 'auto';

        startX = e.clientX;
        startY = e.clientY;
        initialLeft = rect.left;
        initialTop = rect.top;

        try {
            localTile.setPointerCapture(e.pointerId);
        } catch (err) {}
    });

    localTile.addEventListener('pointermove', (e) => {
        if (!isDragging || !isPipModeActive()) return;

        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const winW = window.innerWidth;
        const winH = window.innerHeight;
        const tileW = localTile.offsetWidth;
        const tileH = localTile.offsetHeight;

        const nextLeft = Math.min(Math.max(10, initialLeft + dx), winW - tileW - 10);
        const nextTop = Math.min(Math.max(76, initialTop + dy), winH - tileH - 96);

        localTile.style.left = `${nextLeft}px`;
        localTile.style.top = `${nextTop}px`;
    });

    function finishDrag(e) {
        if (!isDragging) return;
        isDragging = false;
        localTile.classList.remove('dragging');
        try {
            if (e && e.pointerId !== undefined) {
                localTile.releasePointerCapture(e.pointerId);
            }
        } catch (err) {}
        snapToNearestEdge();
    }

    localTile.addEventListener('pointerup', finishDrag);
    localTile.addEventListener('pointercancel', finishDrag);

    window.addEventListener('resize', () => {
        if (isPipModeActive() && localTile.style.left) {
            snapToNearestEdge();
        }
    });
}

window.shareCallLink = async function () {
    if (!currentCallId) {

        return;
    }

    isShareLinkEnabled = true;

    const shareUrlObj = new URL(CALL_BASE_URL);
    shareUrlObj.searchParams.set('roomId', currentCallId);
    shareUrlObj.searchParams.set('type', currentCallType);
    shareUrlObj.searchParams.set('guest', '1');
    const shareUrl = shareUrlObj.toString();

    const shareBtn = document.getElementById('shareCallLinkBtn');
    if (shareBtn) shareBtn.classList.add('share-active');

    update(ref(rtdb, `calls/${currentCallId}`), {
        allowGuestLink: true,
        shareLinkCreatedAt: Date.now()
    }).catch(() => {});

    try {
        if (navigator.clipboard?.writeText) {
            await navigator.clipboard.writeText(shareUrl);
        }
    } catch (e) {}

    if (navigator.share) {
        try {
            await navigator.share({
                title: `Panggilan ${currentCallType === 'audio' ? 'Suara' : 'Video'} Sitenexs`,
                text: `${myUserName} mengundang Anda bergabung ke panggilan Sitenexs (klik langsung tanpa login):`,
                url: shareUrl
            });
            showToast('Link panggilan dibagikan!');
            return;
        } catch (err) {
            if (err?.name === 'AbortError') return;
        }
    }

    showToast('Link panggilan disalin! Tempel & kirim ke peserta.');
};

async function requestWakeLock() {
    try {
        if ('wakeLock' in navigator && !wakeLockSentinel) {
            wakeLockSentinel = await navigator.wakeLock.request('screen');
            wakeLockSentinel.addEventListener('release', () => {
                wakeLockSentinel = null;
            });
        }
    } catch (e) {}
}

async function releaseWakeLock() {
    try {
        if (wakeLockSentinel) {
            await wakeLockSentinel.release();
            wakeLockSentinel = null;
        }
    } catch (e) {}
}

window.enterSystemPiP = async function () {
    const firstRemoteVideo = document.querySelector('#vcVideosGrid .remote-tile video');
    if (!firstRemoteVideo || currentCallType !== 'video') return;

    try {
        if (document.pictureInPictureEnabled && !firstRemoteVideo.disablePictureInPicture) {
            if (document.pictureInPictureElement !== firstRemoteVideo && firstRemoteVideo.readyState >= 2) {
                await firstRemoteVideo.requestPictureInPicture();
            }
        } else if (typeof firstRemoteVideo.webkitSetPresentationMode === 'function') {
            firstRemoteVideo.webkitSetPresentationMode('picture-in-picture');
        }
    } catch (e) {}
};

async function exitSystemPiP() {
    try {
        if (document.pictureInPictureElement) {
            await document.exitPictureInPicture();
        }
        document.querySelectorAll('#vcVideosGrid video').forEach(v => {
            if (typeof v.webkitSetPresentationMode === 'function') {
                v.webkitSetPresentationMode('inline');
            }
        });
    } catch (e) {}
}

    } else if (document.visibilityState === 'visible') {
        resumeVideoWhenReturningToCall();

});

function formatDuration(seconds) {
    const hrs = Math.floor(seconds / 3600);
    const mins = Math.floor((seconds % 3600) / 60);
    const secs = seconds % 60;
    if (hrs > 0) {
        return `${String(hrs).padStart(2, '0')}:${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }
    return `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
}

function startCallTimer(baseConnectedAt = null) {
    wasCallConnected = true;

    if (baseConnectedAt && Number.isFinite(baseConnectedAt) && baseConnectedAt > 0) {
        callConnectedTimestamp = baseConnectedAt;
    } else if (!callConnectedTimestamp) {
        callConnectedTimestamp = Date.now();
        if (currentCallId) {
            update(ref(rtdb, `calls/${currentCallId}`), {
                connectedAt: callConnectedTimestamp
            }).catch(() => {});
        }
    }

    callSecondsElapsed = Math.max(0, Math.floor((Date.now() - callConnectedTimestamp) / 1000));

    const voiceTimerEl = document.getElementById('voiceCallTimer');
    const bannerTimerEl = document.getElementById('vcCallTimer');
    const initialFormatted = formatDuration(callSecondsElapsed);

    if (voiceTimerEl) voiceTimerEl.textContent = initialFormatted;
    if (bannerTimerEl) {
        bannerTimerEl.textContent = initialFormatted;
        bannerTimerEl.classList.add('active');
    }

    if (callDurationInterval) return;

    callDurationInterval = setInterval(() => {
        callSecondsElapsed = Math.max(0, Math.floor((Date.now() - callConnectedTimestamp) / 1000));
        const formatted = formatDuration(callSecondsElapsed);
        if (voiceTimerEl) voiceTimerEl.textContent = formatted;
        if (bannerTimerEl) bannerTimerEl.textContent = formatted;
    }, 1000);
}

function stopCallTimer() {
    if (callDurationInterval) {
        clearInterval(callDurationInterval);
        callDurationInterval = null;
    }
    callConnectedTimestamp = 0;
    const bannerTimerEl = document.getElementById('vcCallTimer');
    if (bannerTimerEl) {
        bannerTimerEl.classList.remove('active');
        bannerTimerEl.textContent = '00:00';
    }
}

function getSafePeerAvatar(peerUid, peerName) {
    if (peerUid && !String(peerUid).startsWith('guest_')) {
        return getUserAvatarUrl(peerUid);
    }
    return `https://ui-avatars.com/api/?name=${encodeURIComponent(peerName || 'Tamu')}&background=2563eb&color=fff`;
}

function escapeHtml(text) {
    return String(text ?? '').replace(/[&<>"']/g, char => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        '"': '&quot;',
        "'": '&#039;'
    }[char]));
}

                </span>

        `;

function removeRemoteVideoTile(remoteUid) {
    const tile = document.getElementById(`remote-tile-${remoteUid}`);
    if (tile) tile.remove();
    updateGridLayoutCount();
}

function updateGridLayoutCount() {
    const grid = document.getElementById('vcVideosGrid');
    if (!grid) return;

    const remoteTiles = grid.querySelectorAll('.remote-tile');
    const totalParticipants = remoteTiles.length + 1;

    if (totalParticipants <= 1) {
        grid.setAttribute('data-count', '1');
    } else if (totalParticipants === 2) {
        grid.setAttribute('data-count', '2');
    } else if (totalParticipants === 3) {
        grid.setAttribute('data-count', '3');
    } else if (totalParticipants === 4) {
        grid.setAttribute('data-count', '4');
    } else {
        grid.setAttribute('data-count', 'many');
    }

    updateHeaderAndVoiceStageUI();
}

function updateRemoteTileMediaState(remoteUid, muted, camOff, peerName, videoPaused = false) {
    const camOffEl = document.getElementById(`camoff-${remoteUid}`);
    const camOffStatusEl = document.getElementById(`camoff-status-${remoteUid}`);

    if (camOffStatusEl) {

            camOffStatusEl.innerHTML = '<i class="fas fa-pause-circle" style="color: #fbbf24; margin-right: 4px;"></i> Video dijeda • Suara tetap aktif';
        } else {
            camOffStatusEl.innerHTML = '<i class="fas fa-video-slash" style="margin-right: 4px;"></i> Kamera dimatikan';

    }

        mutedBadgeEl.classList.toggle('active', Boolean(muted));

        const mutedTextEl = document.getElementById('remoteMutedText');
        const camOffIndEl = document.getElementById('remoteCamOffIndicator');

        if (mutedEl && mutedTextEl) {

        }

            statusTextEl.textContent = currentCallType === 'audio' ? 'Panggilan Suara' : pName;
        }

async function createCallLogMessage(callType) {
    if (!activeChatId || !currentUid || !activeChatUserId || isGuestUser) return null;

    const isAudio = callType === 'audio';
    const labelText = isAudio ? '📞 Panggilan Suara' : '📹 Panggilan Video';
    const rawPayload = `[CALL_LOG]|${callType}|ringing|0`;

    try {
        const chatDocRef = doc(db, 'chats', activeChatId);
        await setDoc(chatDocRef, {
            participants: [currentUid, activeChatUserId],
            lastMessage: labelText,
            lastTimestamp: serverTimestamp(),
            [`unread_${activeChatUserId}`]: true
        }, { merge: true });

        const msgRef = await addDoc(collection(db, 'chats', activeChatId, 'messages'), {
            senderUid: currentUid,
            text: rawPayload,
            createdAt: serverTimestamp(),
            isEdited: false
        });

        return msgRef.id;
    } catch (error) {
        console.error('Gagal membuat riwayat panggilan:', error);
        return null;
    }
}

async function updateCallLogMessage(docId, callType, status, durationSec = 0) {
    if (!activeChatId || !docId || isGuestUser) return;

    const isAudio = callType === 'audio';
    const baseLabel = isAudio ? '📞 Panggilan Suara' : '📹 Panggilan Video';
    let summary = baseLabel;

    if (status === 'ended') {
        summary = `${baseLabel} (${formatDuration(durationSec)})`;
    } else if (status === 'missed') {
        summary = `${baseLabel} • Tidak dijawab`;
    } else if (status === 'rejected') {
        summary = `${baseLabel} • Ditolak`;
    }

    try {
        await updateDoc(doc(db, 'chats', activeChatId, 'messages', docId), {
            text: `[CALL_LOG]|${callType}|${status}|${durationSec}`
        });

        await updateDoc(doc(db, 'chats', activeChatId), {
            lastMessage: summary
        });
    } catch (error) {
        console.warn('Gagal memperbarui log panggilan:', error);
    }
}

function playRingtoneOnce() {
    try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;

        const ctx = new AudioContextClass();
        const oscillator = ctx.createOscillator();
        const gain = ctx.createGain();

        oscillator.type = 'sine';
        oscillator.frequency.setValueAtTime(523.25, ctx.currentTime);
        oscillator.frequency.setValueAtTime(659.25, ctx.currentTime + 0.15);

        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);

        oscillator.connect(gain);
        gain.connect(ctx.destination);

        oscillator.start();
        oscillator.stop(ctx.currentTime + 0.45);
        oscillator.onended = () => ctx.close().catch(() => {});
    } catch (e) {}
}

    );

function stopIncomingRingtone() {

    if (navigator.vibrate) navigator.vibrate(0);

async function setupLocalMedia(callType = 'video') {
    try {
        if (!navigator.mediaDevices?.getUserMedia) {
            showToast('Browser tidak mendukung kamera atau mikrofon.');
            return false;
        }

        if (localStream) {
            localStream.getTracks().forEach(track => {
                try { track.stop(); } catch (e) {}
            });
            localStream = null;
        }

        const constraints = callType === 'audio'
            ? {
                video: false,
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            }
            : {
                video: {
                    facingMode: 'user',
                    width: { ideal: 640, max: 1280 },
                    height: { ideal: 480, max: 720 },
                    frameRate: { ideal: 24, max: 30 }
                },
                audio: {
                    echoCancellation: true,
                    noiseSuppression: true,
                    autoGainControl: true
                }
            };

        localStream = await navigator.mediaDevices.getUserMedia(constraints);

        const localVideo = document.getElementById('localVideo');
        const localCamOffOverlay = document.getElementById('localCamOffOverlay');
        if (callType === 'video') {
            localStream.getVideoTracks().forEach(track => {
                track.enabled = !isCamOff;
            });
            if (localCamOffOverlay) {
                localCamOffOverlay.classList.toggle('active', isCamOff);
            }
            localVideo.srcObject = localStream;
            localVideo.muted = true;
            await localVideo.play().catch(() => {});
        } else {
            localVideo.srcObject = null;
        }

        return true;
    } catch (error) {
        const label = callType === 'audio' ? 'Mikrofon' : 'Kamera/mikrofon';
        showToast(`${label} tidak dapat diakses: ` + error.message);
        return false;
    }
}

/* =====================================================
   WEBRTC MESH: KONEKSI INDEPENDEN PER PASANGAN PESERTA
===================================================== */
function getMeshPairKey(uidA, uidB) {
    return [String(uidA), String(uidB)].sort().join('__');
}

function closeSinglePeer(remoteUid, shouldRemoveTile = true) {
    const peerObj = peersMap.get(remoteUid);
    if (!peerObj) {
        if (shouldRemoveTile) removeRemoteVideoTile(remoteUid);
        return;
    }

    if (peerObj.disconnectTimer) clearTimeout(peerObj.disconnectTimer);
    if (peerObj.unsubSignal) peerObj.unsubSignal();
    if (peerObj.unsubCandidates) peerObj.unsubCandidates();

    if (peerObj.pc) {
        peerObj.pc.ontrack = null;
        peerObj.pc.onicecandidate = null;
        peerObj.pc.oniceconnectionstatechange = null;
        peerObj.pc.onconnectionstatechange = null;
        try { peerObj.pc.close(); } catch (e) {}
    }

    peersMap.delete(remoteUid);
    if (shouldRemoveTile) removeRemoteVideoTile(remoteUid);
    updateHeaderAndVoiceStageUI();
}

async function flushPeerCandidateQueue(peerObj) {
    if (!peerObj?.pc?.remoteDescription) return;
    while (peerObj.candidateQueue.length > 0) {
        const candidate = peerObj.candidateQueue.shift();
        try {
            await peerObj.pc.addIceCandidate(new RTCIceCandidate(candidate));
        } catch (err) {
            console.warn('ICE Candidate gagal:', err);
        }
    }
}

async function connectToMeshParticipant(callId, remoteUid, peerMeta = {}) {
    if (!callId || !currentUid || !remoteUid || remoteUid === currentUid || !localStream) return;
    if (peersMap.has(remoteUid)) return;

    const isInitiator = String(currentUid) < String(remoteUid);
    const pairKey = getMeshPairKey(currentUid, remoteUid);
    const peerName = peerMeta.name || 'Peserta Sitenexs';
    const peerVerified = Boolean(peerMeta.verified);
    const peerBadgeType = peerMeta.badgeType || (remoteUid === activeChatUserId ? otherUserBadgeType : null);

    ensureRemoteVideoTile(remoteUid, peerName, peerVerified, peerBadgeType);

    const pc = new RTCPeerConnection(rtcConfig);
    const remoteStream = new MediaStream();

    const videoEl = document.getElementById(`video-${remoteUid}`);
    if (videoEl) {
        videoEl.srcObject = remoteStream;
    }

    localStream.getTracks().forEach(track => {
        pc.addTrack(track, localStream);
    });

    const peerObj = {
        uid: remoteUid,
        name: peerName,
        verified: peerVerified,
        badgeType: peerBadgeType,
        pc,
        stream: remoteStream,
        candidateQueue: [],
        unsubSignal: null,
        unsubCandidates: null,
        disconnectTimer: null,
        offerSent: false,
        answerSent: false
    };

    peersMap.set(remoteUid, peerObj);
    updateHeaderAndVoiceStageUI();

    pc.ontrack = event => {
        clearCallTimeout();
        if (peerObj.disconnectTimer) {
            clearTimeout(peerObj.disconnectTimer);
            peerObj.disconnectTimer = null;
        }

        const streams = event.streams;
        if (streams && streams[0]) {
            streams[0].getTracks().forEach(track => {
                if (!remoteStream.getTracks().some(t => t.id === track.id)) {
                    remoteStream.addTrack(track);
                }
            });
        } else if (!remoteStream.getTracks().some(t => t.id === event.track.id)) {
            remoteStream.addTrack(event.track);
        }

        const vEl = document.getElementById(`video-${remoteUid}`);
        if (vEl) vEl.play().catch(() => {});

        if (currentCallLogDocId && callDirection === 'caller') {
            updateCallLogMessage(currentCallLogDocId, currentCallType, 'connected', 0);
        }

        startCallTimer(callConnectedTimestamp || null);
        updateHeaderAndVoiceStageUI();
    };

    const localCandidatesRef = ref(rtdb, `calls/${callId}/mesh/${pairKey}/candidates_${currentUid}`);
    const remoteCandidatesRef = ref(rtdb, `calls/${callId}/mesh/${pairKey}/candidates_${remoteUid}`);
    const signalRef = ref(rtdb, `calls/${callId}/mesh/${pairKey}/signal`);

    pc.onicecandidate = event => {
        if (!event.candidate) return;
        push(localCandidatesRef, event.candidate.toJSON()).catch(() => {});
    };

    peerObj.unsubCandidates = onChildAdded(remoteCandidatesRef, async snap => {
        const cand = snap.val();
        if (!cand || !peersMap.has(remoteUid)) return;
        if (pc.remoteDescription) {
            try {
                await pc.addIceCandidate(new RTCIceCandidate(cand));
            } catch (err) {}
        } else {
            peerObj.candidateQueue.push(cand);
        }
    });

    pc.oniceconnectionstatechange = () => {
        if (!peersMap.has(remoteUid)) return;
        const state = pc.iceConnectionState;

        if (state === 'connected' || state === 'completed') {
            clearCallTimeout();
            if (peerObj.disconnectTimer) {
                clearTimeout(peerObj.disconnectTimer);
                peerObj.disconnectTimer = null;
            }
            startCallTimer(callConnectedTimestamp || null);
            updateHeaderAndVoiceStageUI();
        } else if (state === 'disconnected') {
            if (!peerObj.disconnectTimer) {
                peerObj.disconnectTimer = setTimeout(() => {
                    if (peersMap.has(remoteUid) && (pc.iceConnectionState === 'disconnected' || pc.iceConnectionState === 'failed')) {
                        closeSinglePeer(remoteUid, true);
                    }
                }, 12000);
            }
        } else if (state === 'failed') {
            closeSinglePeer(remoteUid, true);
        }
    };

    if (isInitiator) {
        peerObj.unsubSignal = onValue(signalRef, async snap => {
            const sig = snap.val();
            if (!sig || !peersMap.has(remoteUid)) return;
            if (sig.answer && !pc.currentRemoteDescription) {
                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(sig.answer));
                    await flushPeerCandidateQueue(peerObj);
                } catch (err) {
                    console.error('Set answer mesh gagal:', err);
                }
            }
        });

        try {
            const offer = await pc.createOffer();
            await pc.setLocalDescription(offer);
            await update(signalRef, {
                offer: { type: offer.type, sdp: offer.sdp },
                offerBy: currentUid,
                createdAt: Date.now()
            });
        } catch (err) {
            console.error('Create offer mesh gagal:', err);
        }
    } else {
        peerObj.unsubSignal = onValue(signalRef, async snap => {
            const sig = snap.val();
            if (!sig || !peersMap.has(remoteUid)) return;
            if (sig.offer && !pc.currentRemoteDescription && !peerObj.answerSent) {
                peerObj.answerSent = true;
                try {
                    await pc.setRemoteDescription(new RTCSessionDescription(sig.offer));
                    await flushPeerCandidateQueue(peerObj);

                    const answer = await pc.createAnswer();
                    await pc.setLocalDescription(answer);
                    await update(signalRef, {
                        answer: { type: answer.type, sdp: answer.sdp },
                        answerBy: currentUid,
                        answeredAt: Date.now()
                    });
                } catch (err) {
                    peerObj.answerSent = false;
                    console.error('Create answer mesh gagal:', err);
                }
            }
        });
    }
}

/* =====================================================
   DAFTAR PESERTA REAL-TIME DI RUANG PANGGILAN
===================================================== */
function registerSelfInRoom(callId, preserveJoinedAt = null) {
    if (!callId || !currentUid) return;
    const myParticipantRef = ref(rtdb, `calls/${callId}/participants/${currentUid}`);
    set(myParticipantRef, {
        uid: currentUid,
        name: myUserName,
        verified: myIsVerified,
        badgeType: myBadgeType,
        isGuest: isGuestUser,
        micMuted: isMicMuted,
        camOff: isCamOff,
        videoPaused: false,
        voiceOnlyBackground: false,
        joinedAt: preserveJoinedAt || Date.now(),
        lastActiveAt: Date.now(),
        rejoinedAt: Date.now()
    }).catch(() => {});
}

function listenToRoomParticipants(callId) {
    if (unsubscribeParticipants) {
        unsubscribeParticipants();
        unsubscribeParticipants = null;
    }

    const participantsRef = ref(rtdb, `calls/${callId}/participants`);
    unsubscribeParticipants = onValue(participantsRef, snapshot => {
        const val = snapshot.val() || {};
        const activeUids = new Set(Object.keys(val));

        Object.entries(val).forEach(([uid, pData]) => {
            if (uid === currentUid) return;

            const prevMeta = participantsInfoMap.get(uid);
            const isNew = !prevMeta;
            const hasRejoined = prevMeta && pData.rejoinedAt && prevMeta.rejoinedAt !== pData.rejoinedAt;
            participantsInfoMap.set(uid, pData);

            if (isNew && peersMap.size >= 1) {
                showToast(`${pData.name || 'Peserta baru'} bergabung ke panggilan!`);
            }

            if (hasRejoined && peersMap.has(uid)) {
                closeSinglePeer(uid, false);
            }

            if (!peersMap.has(uid)) {
                connectToMeshParticipant(callId, uid, pData);
            } else {
                const peerObj = peersMap.get(uid);
                peerObj.name = pData.name || peerObj.name;
                peerObj.verified = Boolean(pData.verified);
                peerObj.badgeType = pData.badgeType || peerObj.badgeType;
                ensureRemoteVideoTile(uid, peerObj.name, peerObj.verified, peerObj.badgeType);
            }

            updateRemoteTileMediaState(
                uid,
                Boolean(pData.micMuted),
                Boolean(pData.camOff),
                pData.name,
                Boolean(pData.videoPaused)
            );
        });

        Array.from(peersMap.keys()).forEach(existingUid => {
            if (!activeUids.has(existingUid)) {
                const leftPeer = peersMap.get(existingUid);
                if (leftPeer) {
                    showToast(`${leftPeer.name || 'Peserta'} keluar dari panggilan.`);
                }
                participantsInfoMap.delete(existingUid);
                closeSinglePeer(existingUid, true);
            }
        });

        updateHeaderAndVoiceStageUI();
    });
}

function listenToCallRoom(callId, sessionId, isCaller) {
    if (unsubscribeCallRoom) {
        unsubscribeCallRoom();
        unsubscribeCallRoom = null;
    }

    const callRef = ref(rtdb, `calls/${callId}`);

    unsubscribeCallRoom = onValue(callRef, async snapshot => {
        const data = snapshot.val();

        if (!data) {
            if (isInCall) {
                isExplicitCallEnded = true;
                persistOngoingCallState(false);
                if (isCaller && currentCallLogDocId) {
                    const finalStatus = wasCallConnected ? 'ended' : 'missed';
                    updateCallLogMessage(currentCallLogDocId, currentCallType, finalStatus, callSecondsElapsed);
                }
                showToast('Panggilan berakhir.');
                cleanupCallResources();
                returnAfterCall(700);
            }
            return;
        }

        if (sessionId && data.sessionId && data.sessionId !== sessionId) return;

        // Sinkronkan waktu mulai panggilan jika tersedia di ruang panggilan
        const roomStartTs = data.connectedAt || data.answeredAt || 0;
        if (roomStartTs && !callConnectedTimestamp && data.status === 'connected') {
            startCallTimer(roomStartTs);
        }

        if (data.status === 'rejected' && !isShareLinkEnabled && !data.allowGuestLink && peersMap.size === 0) {
            isExplicitCallEnded = true;
            persistOngoingCallState(false);
            if (isCaller && currentCallLogDocId) {
                updateCallLogMessage(currentCallLogDocId, currentCallType, 'rejected', 0);
            }
            showToast('Panggilan ditolak.');
            cleanupCallResources();
            remove(callRef).catch(() => {});
            returnAfterCall(700);
            return;
        }

        if (data.status === 'ended') {
            isExplicitCallEnded = true;
            persistOngoingCallState(false);
            if (isCaller && currentCallLogDocId) {
                const finalStatus = wasCallConnected ? 'ended' : 'missed';
                updateCallLogMessage(currentCallLogDocId, currentCallType, finalStatus, callSecondsElapsed);
            }
            showToast('Panggilan berakhir.');
            cleanupCallResources();
            returnAfterCall(700);
        }
    });
}

/* =====================================================
   LANJUTKAN PANGGILAN SEBELUMNYA SAAT KEMBALI MASUK KE RUANG
===================================================== */
async function resumeOngoingCallRoom(roomId) {
    if (!currentUid || !roomId || isStartingCall || isInCall) return false;

    try {
        const callRef = ref(rtdb, `calls/${roomId}`);
        const snap = await get(callRef);
        const data = snap.val();

        if (!data || data.status === 'ended' || data.status === 'rejected') {
            persistOngoingCallState(false);
            return false;
        }

        isStartingCall = true;
        isExplicitCallEnded = false;
        isCamOff = false;
        isVideoPausedInBackground = false;
        currentCallId = roomId;
        currentSessionId = data.sessionId || `${currentUid}_${Date.now()}`;
        currentCallType = data.callType === 'audio' ? 'audio' : 'video';
        currentCallLogDocId = data.callLogDocId || null;
        callDirection = data.callerUid === currentUid ? 'caller' : 'callee';

        const resolvedPeerUid = data.callerUid === currentUid
            ? (data.calleeUid || activeChatUserId)
            : (data.callerUid || activeChatUserId);

        if (resolvedPeerUid && resolvedPeerUid !== activeChatUserId) {
            activeChatUserId = resolvedPeerUid;
            try {
                otherProfile = await fetchUserProfile(db, activeChatUserId);
                otherUserName = otherProfile.displayName;
                otherUserVerified = otherProfile.isVerified;
                otherUserBadgeType = resolveBadgeTypeFromProfile(otherProfile);
            } catch (e) {}
        }

        // Ambil timestamp koneksi awal agar waktu telepon terus berlanjut (tidak mengulang dari 00:00)
        const existingConnectedAt = data.connectedAt || data.answeredAt || data.timestamp || 0;
        if (existingConnectedAt > 0) {
            callConnectedTimestamp = existingConnectedAt;
        }

        applyCallOverlayMode(currentCallType, activeChatUserId, otherUserName, otherUserVerified, otherUserBadgeType);
        document.getElementById('vcOverlay').classList.add('active');
        document.getElementById('vcStatusText').textContent = otherUserName || 'Melanjutkan panggilan...';

        if (existingConnectedAt > 0) {
            startCallTimer(existingConnectedAt);
        }

        const mediaReady = await setupLocalMedia(currentCallType);
        if (!mediaReady) {
            isStartingCall = false;
            return false;
        }

        // Pastikan elemen video lokal tampil normal & berputar
        const localVideo = document.getElementById('localVideo');
        const localCamOffOverlay = document.getElementById('localCamOffOverlay');
        if (localCamOffOverlay) localCamOffOverlay.classList.remove('active');
        if (localVideo && currentCallType === 'video') {
            localVideo.srcObject = localStream;
            localVideo.muted = true;
            await localVideo.play().catch(() => {});
        }

        requestWakeLock();
        isInCall = true;
        persistOngoingCallState(true);

        // Bersihkan sinyal negosiasi lama khusus pasangan kita agar WebRTC langsung tersambung ulang
        if (data.participants) {
            const resetPromises = Object.keys(data.participants)
                .filter(uid => uid !== currentUid)
                .map(otherUid => {
                    const pairKey = getMeshPairKey(currentUid, otherUid);
                    return remove(ref(rtdb, `calls/${roomId}/mesh/${pairKey}`)).catch(() => {});
                });
            await Promise.all(resetPromises);
        }

        const prevJoinedAt = data.participants?.[currentUid]?.joinedAt || existingConnectedAt || Date.now();
        registerSelfInRoom(roomId, prevJoinedAt);
        listenToCallRoom(roomId, currentSessionId, callDirection === 'caller');
        listenToRoomParticipants(roomId);

        isStartingCall = false;
        showToast('Panggilan dilanjutkan kembali.');
        return true;
    } catch (error) {
        console.error('Resume call error:', error);
        isStartingCall = false;
        return false;
    }
}

async function startOutgoingCall(callType) {
    if (!currentUid || !activeChatUserId || !activeChatId) return;
    if (isStartingCall || isInCall) return;

    isStartingCall = true;
    isExplicitCallEnded = false;
    callDirection = 'caller';
    currentCallType = callType;
    wasCallConnected = false;
    callSecondsElapsed = 0;
    callConnectedTimestamp = 0;

    applyCallOverlayMode(callType, activeChatUserId, otherUserName, otherUserVerified, otherUserBadgeType);
    document.getElementById('vcOverlay').classList.add('active');
    document.getElementById('vcStatusText').textContent =
        callType === 'audio' ? 'Panggilan Suara' : `Memanggil ${otherUserName}...`;
    if (callType === 'audio') {
        document.getElementById('voiceCallTimer').textContent = 'Memanggil...';
    }

    const mediaReady = await setupLocalMedia(callType);
    if (!mediaReady) {
        isStartingCall = false;
        callDirection = null;
        returnAfterCall(1200);
        return;
    }

    requestWakeLock();

    const callId = `call_${currentUid}_${Date.now()}`;
    const sessionId = `${currentUid}_${Date.now()}`;

    currentCallId = callId;
    currentSessionId = sessionId;
    isInCall = true;
    persistOngoingCallState(true);

    currentCallLogDocId = await createCallLogMessage(callType);
    const callRef = ref(rtdb, `calls/${callId}`);

    try {
        const callPayload = {
            roomId: callId,
            chatId: activeChatId,
            sessionId,
            callType,
            callLogDocId: currentCallLogDocId,
            callerUid: currentUid,
            callerName: myUserName,
            callerVerified: myIsVerified,
            callerBadgeType: myBadgeType,
            calleeUid: activeChatUserId,
            allowGuestLink: false,
            status: 'ringing',
            timestamp: Date.now()
        };

        await update(callRef, callPayload);
        registerSelfInRoom(callId);
        listenToCallRoom(callId, sessionId, true);
        listenToRoomParticipants(callId);

        await set(ref(rtdb, `incomingCalls/${activeChatUserId}`), callPayload);

        const incomingCallLink = new URL(CALL_BASE_URL);
        incomingCallLink.searchParams.set('to', currentUid);
        incomingCallLink.searchParams.set('mode', 'incoming');
        incomingCallLink.searchParams.set('roomId', callId);
        incomingCallLink.searchParams.set('type', callType);

        const callTitle = callType === 'audio' ? 'Panggilan Suara Masuk' : 'Panggilan Video Masuk';
        const pushRes = await sendPushNotification({
            db,
            recipientUid: activeChatUserId,
            cachedToken: otherUserFcmToken,
            title: `${callTitle} • ${myUserName}`,
            body: 'Ketuk untuk menjawab panggilan sekarang.',
            tag: `call-${callId}`,
            url: incomingCallLink.toString(),
            icon: getUserAvatarUrl(currentUid),
            workerUrl: PUSH_WORKER_URL
        });
        if (pushRes?.token) otherUserFcmToken = pushRes.token;

        clearCallTimeout();
        callTimeout = setTimeout(() => {
            if (
                isInCall &&
                currentCallId === callId &&
                !wasCallConnected &&
                !isShareLinkEnabled
            ) {
                showToast('Panggilan tidak dijawab.');
                endActiveCall('missed');
            }
        }, 60000);

        isStartingCall = false;
    } catch (error) {
        console.error('Start call error:', error);
        showToast('Gagal memulai panggilan: ' + error.message);
        persistOngoingCallState(false);
        cleanupCallResources();
        returnAfterCall(1200);
    }
}

/* =====================================================
   GABUNG PANGGILAN MELALUI LINK (TANPA LOGIN -> VC BERTIGA)
===================================================== */
function initGuestShareLinkRoom(roomId) {
    const joinScreen = document.getElementById('guestJoinScreen');
    const joinBtn = document.getElementById('guestJoinCallBtn');
    const joinBtnText = document.getElementById('guestJoinBtnText');
    const typeLabel = document.getElementById('guestCallTypeLabel');
    const hostNameEl = document.getElementById('guestHostName');
    const hostAvatarEl = document.getElementById('guestHostAvatar');
    const hostBadgesEl = document.getElementById('guestHostBadges');
    const subTextEl = document.getElementById('guestStatusSubText');
    const nameInput = document.getElementById('guestDisplayNameInput');

    if (!isGuestUser && myUserName && myUserName !== 'Mitra Sitenexs') {
        nameInput.value = myUserName;
    }

    joinScreen.classList.add('active');

    const callRef = ref(rtdb, `calls/${roomId}`);
    if (unsubscribeGuestRoomWatch) unsubscribeGuestRoomWatch();

    unsubscribeGuestRoomWatch = onValue(callRef, (snapshot) => {
        const data = snapshot.val();
        if (!data || data.status === 'ended') {
            sharedRoomData = null;
            hostNameEl.textContent = 'Panggilan Telah Berakhir';
            subTextEl.textContent = 'Link panggilan ini sudah tidak aktif.';
            joinBtn.disabled = true;
            joinBtnText.textContent = 'Tidak Tersedia';
            return;
        }

        sharedRoomData = data;
        currentCallType = data.callType === 'audio' ? 'audio' : typeParam;

        hostNameEl.textContent = data.callerName || 'Mitra Sitenexs';
        hostAvatarEl.src = getSafePeerAvatar(data.callerUid, data.callerName);
        hostBadgesEl.innerHTML = renderCustomBadgesHtml(Boolean(data.callerVerified), data.callerBadgeType || null);

        const activeCount = data.participants ? Object.keys(data.participants).length : 1;
        typeLabel.innerHTML = currentCallType === 'audio'
            ? `<i class="fas fa-phone" style="color: var(--accent); margin-right: 4px;"></i> Undangan Panggilan Suara (${activeCount} aktif)`
            : `<i class="fas fa-video" style="color: var(--accent); margin-right: 4px;"></i> Undangan Panggilan Video (${activeCount} aktif)`;

        subTextEl.textContent = 'Klik tombol di bawah untuk langsung masuk tanpa login.';
        joinBtn.disabled = false;
        joinBtnText.textContent = currentCallType === 'audio' ? 'Gabung Panggilan Suara' : 'Gabung Panggilan Video';
    });
}

window.joinCallViaShareLink = async function () {
    if (!roomIdParam || !sharedRoomData || isInCall || isStartingCall) return;

    const customName = document.getElementById('guestDisplayNameInput')?.value.trim();
    if (customName) {
        myUserName = customName;
    } else if (isGuestUser) {
        myUserName = 'Tamu Sitenexs';
    }

    const joinBtn = document.getElementById('guestJoinCallBtn');
    const joinBtnText = document.getElementById('guestJoinBtnText');
    joinBtn.disabled = true;
    joinBtnText.textContent = 'Menghubungkan...';

    isStartingCall = true;
    isExplicitCallEnded = false;
    callDirection = 'callee';
    currentCallId = roomIdParam;
    currentSessionId = sharedRoomData.sessionId;
    currentCallType = sharedRoomData.callType === 'audio' ? 'audio' : 'video';
    otherUserName = sharedRoomData.callerName || 'Mitra Sitenexs';
    otherUserVerified = Boolean(sharedRoomData.callerVerified);
    otherUserBadgeType = sharedRoomData.callerBadgeType || null;

    const mediaReady = await setupLocalMedia(currentCallType);
    if (!mediaReady) {
        isStartingCall = false;
        joinBtn.disabled = false;
        joinBtnText.textContent = 'Coba Lagi';
        return;
    }

    if (unsubscribeGuestRoomWatch) {
        unsubscribeGuestRoomWatch();
        unsubscribeGuestRoomWatch = null;
    }

    requestWakeLock();
    isInCall = true;
    persistOngoingCallState(true);

    document.getElementById('guestJoinScreen').classList.remove('active');
    applyCallOverlayMode(currentCallType, sharedRoomData.callerUid, otherUserName, otherUserVerified, otherUserBadgeType);
    document.getElementById('vcOverlay').classList.add('active');
    document.getElementById('vcStatusText').textContent = 'Menyambungkan ke ruang...';

    const callRef = ref(rtdb, `calls/${currentCallId}`);
    const nowTs = Date.now();
    const existingStart = sharedRoomData.connectedAt || sharedRoomData.answeredAt || nowTs;

    try {
        await update(callRef, {
            allowGuestLink: true,
            status: 'connected',
            connectedAt: existingStart
        });

        startCallTimer(existingStart);
        registerSelfInRoom(currentCallId);
        listenToCallRoom(currentCallId, currentSessionId, false);
        listenToRoomParticipants(currentCallId);

        isStartingCall = false;
    } catch (error) {
        console.error('Guest join error:', error);
        showToast('Gagal terhubung ke panggilan: ' + error.message);
        persistOngoingCallState(false);
        cleanupCallResources();
        returnAfterCall(1000);
    }
};

window.acceptIncomingCall = async function () {
    const data = incomingCallData;
    stopIncomingRingtone();

    if (!data?.roomId || !data?.sessionId) {
        showToast('Panggilan sudah berakhir.');
        returnAfterCall(700);
        return;
    }

    if (isInCall) return;

    const callType = data.callType === 'audio' ? 'audio' : 'video';

    currentCallId = data.roomId;
    currentSessionId = data.sessionId;
    currentCallType = callType;
    currentCallLogDocId = data.callLogDocId || null;
    callDirection = 'callee';
    wasCallConnected = false;
    callSecondsElapsed = 0;

    otherUserName = data.callerName || otherUserName;
    if (typeof data.callerVerified === 'boolean') {
        otherUserVerified = data.callerVerified;
    }
    if (data.callerBadgeType) {
        otherUserBadgeType = data.callerBadgeType;
    }

    isStartingCall = true;
    isExplicitCallEnded = false;

    const mediaReady = await setupLocalMedia(callType);
    if (!mediaReady) {
        isStartingCall = false;
        rejectIncomingCall(data);
        return;
    }

    requestWakeLock();
    isInCall = true;
    persistOngoingCallState(true);

    document.getElementById('incomingCallScreen').classList.remove('active');
    applyCallOverlayMode(callType, data.callerUid, otherUserName, otherUserVerified, otherUserBadgeType);
    document.getElementById('vcOverlay').classList.add('active');
    document.getElementById('vcStatusText').textContent =
        callType === 'audio' ? 'Panggilan Suara' : 'Menghubungkan...';

    const answeredNow = Date.now();

    try {
        const callRef = ref(rtdb, `calls/${data.roomId}`);
        await update(callRef, {
            status: 'connected',
            answeredAt: answeredNow,
            connectedAt: answeredNow
        });

        startCallTimer(answeredNow);
        registerSelfInRoom(data.roomId);
        listenToCallRoom(data.roomId, data.sessionId, false);
        listenToRoomParticipants(data.roomId);

        if (currentUid && !isGuestUser) {
            remove(ref(rtdb, `incomingCalls/${currentUid}`)).catch(() => {});
        }

        isStartingCall = false;
        incomingCallData = null;
    } catch (error) {
        console.error('Accept call error:', error);
        showToast('Gagal menerima panggilan: ' + error.message);
        persistOngoingCallState(false);
        cleanupCallResources();
        returnAfterCall(1000);
    }
};

window.rejectIncomingCall = function (callData = incomingCallData) {
    isExplicitCallEnded = true;
    persistOngoingCallState(false);
    stopIncomingRingtone();
    document.getElementById('incomingCallScreen').classList.remove('active');

    if (callData?.roomId) {
        update(ref(rtdb, `calls/${callData.roomId}`), {
            status: 'rejected',
            rejectedAt: Date.now()
        }).catch(() => {});

        if (callData.callLogDocId) {
            updateCallLogMessage(
                callData.callLogDocId,
                callData.callType === 'audio' ? 'audio' : 'video',
                'rejected',
                0
            );
        }
    }

    if (currentUid && !isGuestUser) {
        remove(ref(rtdb, `incomingCalls/${currentUid}`)).catch(() => {});
    }

    incomingCallData = null;
    returnAfterCall(500);
};

window.endActiveCall = function (forcedStatus = null) {
    isExplicitCallEnded = true;
    persistOngoingCallState(false);

    const callId = currentCallId;
    const direction = callDirection;
    const logDocId = currentCallLogDocId;
    const callType = currentCallType;
    const duration = callSecondsElapsed;
    const connected = wasCallConnected;
    const remainingOthers = peersMap.size;

    cleanupCallResources();

    if (logDocId && !isGuestUser && direction === 'caller') {
        const finalStatus = forcedStatus || (connected ? 'ended' : 'missed');
        updateCallLogMessage(logDocId, callType, finalStatus, duration);
    }

    if (callId && currentUid) {
        remove(ref(rtdb, `calls/${callId}/participants/${currentUid}`)).catch(() => {});

        if (remainingOthers <= 1) {
            update(ref(rtdb, `calls/${callId}`), {
                status: 'ended',
                endedAt: Date.now()
            }).catch(() => {});
            setTimeout(() => {
                remove(ref(rtdb, `calls/${callId}`)).catch(() => {});
            }, 1200);
        }
    }

    if (direction === 'caller' && activeChatUserId) {
        remove(ref(rtdb, `incomingCalls/${activeChatUserId}`)).catch(() => {});
    }

    if (currentUid && !isGuestUser) {
        remove(ref(rtdb, `incomingCalls/${currentUid}`)).catch(() => {});
    }

    returnAfterCall(500);
};

function cleanupCallResources() {
    isInCall = false;
    isStartingCall = false;
    isVideoPausedInBackground = false;

    exitSystemPiP();
    releaseWakeLock();
    clearCallTimeout();
    stopCallTimer();
    stopIncomingRingtone();

    if (unsubscribeCallRoom) {
        unsubscribeCallRoom();
        unsubscribeCallRoom = null;
    }

    if (unsubscribeParticipants) {
        unsubscribeParticipants();
        unsubscribeParticipants = null;
    }

    if (unsubscribeGuestRoomWatch) {
        unsubscribeGuestRoomWatch();
        unsubscribeGuestRoomWatch = null;
    }

    Array.from(peersMap.keys()).forEach(uid => {
        closeSinglePeer(uid, true);
    });
    peersMap.clear();
    participantsInfoMap.clear();

    if (localStream) {
        localStream.getTracks().forEach(track => {
            try { track.stop(); } catch (e) {}
        });
        localStream = null;
    }

    document.getElementById('localVideo').srcObject = null;
}

function listenIncomingCallForPage() {
    if (!currentUid || isGuestUser) return;
    const incomingRef = ref(rtdb, `incomingCalls/${currentUid}`);

    if (unsubscribeIncomingCalls) unsubscribeIncomingCalls();

    unsubscribeIncomingCalls = onValue(incomingRef, snapshot => {
        const data = snapshot.val();

        if (!data) {
            if (!isInCall) {
                stopIncomingRingtone();
                showToast('Panggilan dibatalkan atau sudah berakhir.');
                returnAfterCall(800);
            }
            return;
        }

        if (data.timestamp && Date.now() - data.timestamp > 60000) {
            remove(incomingRef).catch(() => {});
            if (!isInCall) returnAfterCall(700);
            return;
        }

        if (
            data.calleeUid === currentUid &&
            data.status === 'ringing' &&
            !isInCall
        ) {
            activeChatUserId = data.callerUid || activeChatUserId;
            const participants = [currentUid, activeChatUserId].sort();
            activeChatId = `${participants[0]}_${participants[1]}`;
            showIncomingCallScreen(data);
        }
    });
}

async function initCallPage(user, guestFlag = false) {
    currentUid = user.uid;
    isGuestUser = guestFlag;

    if (!isGuestUser) {
        try {
            myProfile = await fetchUserProfile(db, currentUid);
            myUserName = myProfile.displayName || 'Mitra Sitenexs';
            myIsVerified = Boolean(myProfile.isVerified);
            myBadgeType = resolveBadgeTypeFromProfile(myProfile);
        } catch (e) {}
    } else {
        myUserName = 'Tamu Sitenexs';
        myIsVerified = false;
        myBadgeType = null;
    }

    if (modeParam === 'guest_link' && roomIdParam) {
        initGuestShareLinkRoom(roomIdParam);
        return;
    }

    if (activeChatUserId) {
        const participants = [currentUid, activeChatUserId].sort();
        activeChatId = `${participants[0]}_${participants[1]}`;

        otherProfile = await fetchUserProfile(db, activeChatUserId);
        otherUserName = otherProfile.displayName;
        otherUserVerified = otherProfile.isVerified;
        otherUserBadgeType = resolveBadgeTypeFromProfile(otherProfile);
        otherUserFcmToken = otherProfile.fcmToken;
    }

    // Jika kembali masuk ke ruang panggilan yang sedang berjalan (baik pemanggil maupun penerima)
    if (roomIdParam && (isResumeParam || modeParam === 'outgoing')) {
        const resumed = await resumeOngoingCallRoom(roomIdParam);
        if (resumed) return;
    }

    if (modeParam === 'incoming') {
        document.getElementById('callerAvatarDisplay').src = otherProfile.avatarUrl;
        document.getElementById('callerNameDisplay').textContent = otherUserName;
        document.getElementById('callerBadgesDisplay').innerHTML = renderCustomBadgesHtml(
            otherUserVerified,
            otherUserBadgeType,
            otherProfile.badgesHtml
        );
        document.getElementById('incomingCallScreen').classList.add('active');
        listenIncomingCallForPage();
    } else {
        startOutgoingCall(typeParam);
    }
}

initDraggableLocalTile();

onAuthStateChanged(auth, async user => {
    if (user) {
        initCallPage(user, Boolean(user.isAnonymous));
    } else {
        const savedUid = localStorage.getItem('sitenexs_uid');
        if (savedUid) {
            initCallPage({ uid: savedUid }, false);
        } else if (isGuestLinkMode && roomIdParam) {
            try {
                const anonCred = await signInAnonymously(auth);
                initCallPage(anonCred.user, true);
            } catch (err) {
                let guestId = sessionStorage.getItem('sitenexs_guest_uid');
                if (!guestId) {
                    guestId = `guest_${Date.now()}_${Math.random().toString(36).slice(2, 8)}`;
                    sessionStorage.setItem('sitenexs_guest_uid', guestId);
                }
                initCallPage({ uid: guestId }, true);
            }
        } else {
            window.location.replace('https://account.sitenexs.com/sign-in/');
        }
    }
});
</script>
