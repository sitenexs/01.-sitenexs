<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pesan Masuk — Komunitas Sitenexs</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Kirim dan terima pesan langsung dengan sesama mitra UMKM di ekosistem Sitenexs.">
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #ffffff;
            --bg-card: #ffffff;
            --bg-alt: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
            --radius-full: 9999px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body[data-package="pro"] {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #f0f9ff;
            --accent: #f59e0b;
        }
        body[data-package="vip"], body[data-package="ultimate"], body[data-package="premium"] {
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --primary-light: #f5f3ff;
            --accent: #fbbf24;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-size: 15px; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button, input { font-family: inherit; outline: none; border: none; }

        /* NAVBAR YANG LEBIH RAPI & KOMPAK */
        #navbar {
            position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
        }
        .nav-container { 
            display: flex; align-items: center; justify-content: space-between; 
            height: 56px; width: 100%; max-width: 800px; margin: 0 auto; padding: 0 1rem; 
        }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 0.95rem; color: var(--text-main); white-space: nowrap; }
        .logo img { height: 28px; width: 28px; border-radius: 50%; object-fit: cover; }
        .logo-text { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #10b981 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; font-weight: 800; letter-spacing: -0.5px; font-size: 0.9rem; }
        .nav-actions { display: flex; gap: 0.4rem; align-items: center; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            padding: 0.45rem 0.85rem; font-size: 0.78rem; font-weight: 700;
            border-radius: var(--radius-full); cursor: pointer; transition: var(--transition);
            border: 1px solid transparent; background: #fff; color: var(--text-main); white-space: nowrap;
        }
        .btn-secondary { border: 1px solid var(--border-medium); background: #fff; box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2); }
        .btn-primary:hover { background: var(--primary-dark); }

        /* INBOX LAYOUT (TANPA CARD / FULL SEAMLESS) */
        .inbox-wrapper {
            width: 100%; max-width: 800px; margin: 0 auto; background: #fff;
            border: none; border-radius: 0; box-shadow: none; 
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }

        .inbox-header { 
            padding: 1rem 1.25rem 0.75rem 1.25rem; border-bottom: 1px solid var(--border-subtle); 
            display: flex; flex-direction: column; gap: 0.75rem; background: #fff; flex-shrink: 0;
        }
        .inbox-title-row { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 1.05rem; color: var(--text-main); }
        
        /* SEARCH BOX */
        .search-box-wrapper { position: relative; width: 100%; }
        .search-box-wrapper input {
            width: 100%; padding: 0.55rem 0.85rem 0.55rem 2.3rem; background: var(--bg-alt);
            border: 1px solid var(--border-subtle); border-radius: var(--radius-full); font-size: 0.85rem;
            color: var(--text-main); transition: var(--transition);
        }
        .search-box-wrapper input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .search-box-wrapper i { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.8rem; }

        .conversations-list { flex: 1; overflow-y: auto; padding: 0.25rem 0; }
        .conversations-list::-webkit-scrollbar { width: 4px; }
        .conversations-list::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 10px; }

        .conversation-item {
            display: flex; align-items: center; gap: 0.85rem; padding: 0.85rem 1.25rem;
            cursor: pointer; transition: var(--transition); position: relative; border-bottom: 1px solid #f1f5f9;
        }
        .conversation-item:hover { background: #f8fafc; }
        
        .conv-avatar-wrap { position: relative; flex-shrink: 0; }
        .conv-avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-medium); }
        .status-dot {
            position: absolute; bottom: 2px; right: 2px; width: 10px; height: 10px;
            background: var(--accent); border: 2px solid #fff; border-radius: 50%;
        }

        .conv-info { flex: 1; min-width: 0; }
        .conv-name-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.2rem; }
        .conv-name { font-weight: 750; font-size: 0.92rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-time { font-size: 0.72rem; color: var(--text-muted); flex-shrink: 0; }
        .conv-last-msg { font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* TOAST */
        #toastContainer { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 0.5rem; max-width: 320px; }
        .toast { background: #0f172a; color: #fff; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.82rem; font-weight: 600; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.1); display: flex; align-items: center; gap: 0.6rem; border-left: 4px solid var(--accent); }

        @media (max-width: 576px) {
            .nav-container { padding: 0 0.75rem; }
            .logo-text { display: none; } /* Sembunyikan teks logo di layar sangat kecil agar navbar sangat lega */
            .conversation-item { padding: 0.75rem 1rem; }
        }
    </style>
</head>
<body data-package="basic">

    <div id="toastContainer"></div>

    <!-- NAVBAR -->
    <header id="navbar">
        <div class="nav-container">
            <a href="https://sitenexs.com/" class="logo">
                <img src="https://sitenexs.com/assets/logo/logo.png" alt="Sitenexs Logo" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Sitenexs&background=2563eb&color=fff'">
                <span class="logo-text">Sitenexs Chat</span>
            </a>
            <div class="nav-actions">
                <a href="https://sitenexs.com/community/" class="btn btn-secondary" title="Komunitas"><i class="fas fa-users"></i> Komunitas</a>
                <a href="https://account.sitenexs.com/profile" class="btn btn-primary"><i class="fas fa-user-circle"></i> Profil</a>
            </div>
        </div>
    </header>

    <!-- KONTEN INBOX -->
    <main class="inbox-wrapper">
        <div class="inbox-header">
            <div class="inbox-title-row">
                <span><i class="fas fa-comments" style="color: var(--primary);"></i> Pesan Masuk</span>
                <span id="chatCountBadge" style="font-size: 0.72rem; background: var(--primary-light); color: var(--primary); padding: 0.15rem 0.55rem; border-radius: var(--radius-full); font-weight: 700;">0 Percakapan</span>
            </div>
            <div class="search-box-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchConversationInput" placeholder="Cari percakapan mitra..." onkeyup="filterConversations()">
            </div>
        </div>
        
        <div class="conversations-list" id="conversationsList">
            <div style="text-align: center; padding: 4rem 1rem; color: var(--text-muted); font-size: 0.88rem;">
                <i class="fas fa-spinner fa-spin fa-2x" style="color: var(--primary); margin-bottom: 0.75rem;"></i>
                <div>Memuat daftar percakapan...</div>
            </div>
        </div>
    </main>

    <!-- FIREBASE & SUPABASE SCRIPT -->
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import { getAuth, onAuthStateChanged, setPersistence, browserLocalPersistence } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
        import { getFirestore, doc, getDoc, collection, query, where, onSnapshot } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761'
        };

        const supabaseUrl = 'https://xqcbyamxiekdxytntlno.supabase.co';
        const avatarBucket = 'profile-photos';

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        
        setPersistence(auth, browserLocalPersistence).catch(err => console.log(err));

        let currentUid = null;
        let allConversationsData = [];

        window.showToast = function(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-check-circle" style="color: var(--accent); font-size: 1rem;"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUid = user.uid;
                loadConversations(currentUid);
            } else {
                const savedUid = localStorage.getItem('sitenexs_uid');
                if (savedUid) {
                    currentUid = savedUid;
                    loadConversations(currentUid);
                } else {
                    window.location.replace("https://account.sitenexs.com/sign-in/");
                }
            }
        });

        async function loadConversations(uid) {
            const listEl = document.getElementById('conversationsList');
            const q = query(collection(db, "chats"), where("participants", "array-contains", uid));

            onSnapshot(q, async (snapshot) => {
                if (snapshot.empty) {
                    listEl.innerHTML = `
                        <div style="text-align: center; padding: 4rem 1.5rem; color: var(--text-muted); font-size: 0.88rem;">
                            <i class="far fa-comments fa-3x" style="color: var(--border-medium); margin-bottom: 1rem;"></i>
                            <div style="font-weight: 750; color: var(--text-main); margin-bottom: 0.35rem; font-size: 1rem;">Belum ada percakapan</div>
                            <div>Mulai kirim pesan dari profil anggota komunitas Sitenexs!</div>
                        </div>`;
                    document.getElementById('chatCountBadge').innerText = '0 Percakapan';
                    return;
                }

                const chats = [];
                snapshot.forEach(docSnap => {
                    chats.push({ id: docSnap.id, ...docSnap.data() });
                });

                chats.sort((a, b) => (b.lastTimestamp?.toMillis() || 0) - (a.lastTimestamp?.toMillis() || 0));
                
                allConversationsData = [];
                for (const chat of chats) {
                    const otherUid = chat.participants.find(p => p !== uid);
                    if (!otherUid) continue;

                    let otherName = "Mitra Sitenexs";
                    try {
                        const userSnap = await getDoc(doc(db, "users", otherUid));
                        if (userSnap.exists()) {
                            const d = userSnap.data();
                            otherName = d.namaLengkap || (d.namaDepan + (d.namaBelakang ? ' ' + d.namaBelakang : '')) || otherName;
                        }
                    } catch(e) {}

                    allConversationsData.push({
                        chatId: chat.id,
                        otherUid: otherUid,
                        otherName: otherName,
                        lastMessage: chat.lastMessage || 'Mulai percakapan...',
                        lastTimestamp: chat.lastTimestamp
                    });
                }

                document.getElementById('chatCountBadge').innerText = `${allConversationsData.length} Percakapan`;
                renderConversationsList(allConversationsData);
            });
        }

        window.renderConversationsList = function(chats) {
            const listEl = document.getElementById('conversationsList');
            if (chats.length === 0) {
                listEl.innerHTML = '<div style="text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.88rem;">Tidak ada percakapan yang cocok dengan pencarian.</div>';
                return;
            }

            let html = '';
            for (const chat of chats) {
                const avatarUrl = `${supabaseUrl}/storage/v1/object/public/${avatarBucket}/${encodeURIComponent(chat.otherUid)}/profile-photo`;
                const fallbackAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(chat.otherName)}&background=2563eb&color=fff`;

                let timeStr = '';
                if (chat.lastTimestamp?.toDate) {
                    const date = chat.lastTimestamp.toDate();
                    const now = new Date();
                    if (date.toDateString() === now.toDateString()) {
                        timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                    } else {
                        timeStr = date.toLocaleDateString([], { month: 'short', day: 'numeric' });
                    }
                }

                html += `
                    <div class="conversation-item" onclick="window.location.href='chat/?to=${chat.otherUid}'">
                        <div class="conv-avatar-wrap">
                            <img src="${avatarUrl}" class="conv-avatar" onerror="this.src='${fallbackAvatar}';">
                            <span class="status-dot"></span>
                        </div>
                        <div class="conv-info">
                            <div class="conv-name-row">
                                <span class="conv-name">${chat.otherName}</span>
                                <span class="conv-time">${timeStr}</span>
                            </div>
                            <div class="conv-last-msg">${chat.lastMessage}</div>
                        </div>
                    </div>
                `;
            }
            listEl.innerHTML = html;
        }

        window.filterConversations = function() {
            const keyword = document.getElementById('searchConversationInput').value.toLowerCase();
            const filtered = allConversationsData.filter(c => c.otherName.toLowerCase().includes(keyword) || c.lastMessage.toLowerCase().includes(keyword));
            renderConversationsList(filtered);
        }
    </script>
</body>
</html>
