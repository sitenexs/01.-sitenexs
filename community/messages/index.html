<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pesan — Komunitas Sitenexs</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Kirim dan terima pesan langsung dengan sesama mitra UMKM di ekosistem Sitenexs.">
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --danger: #ef4444;
            --bg-body: #ffffff;
            --bg-card: #ffffff;
            --bg-alt: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
            --radius-full: 9999px;
            --radius-lg: 1rem;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body[data-package="pro"] {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #f0f9ff;
            --accent: #f59e0b;
        }
        body[data-package="vip"], body[data-package="ultimate"], body[data-package="premium"] {
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --primary-light: #f5f3ff;
            --accent: #fbbf24;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; font-size: 15px; user-select: none; -webkit-user-select: none; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            display: flex;
            flex-direction: column;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button, input { font-family: inherit; outline: none; border: none; }

        /* NAVBAR */
        #navbar {
            position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(16px); border-bottom: 1px solid var(--border-subtle); flex-shrink: 0;
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            padding: 0.45rem 0.85rem; font-size: 0.78rem; font-weight: 700;
            border-radius: var(--radius-full); cursor: pointer; transition: var(--transition);
            border: 1px solid transparent; background: #fff; color: var(--text-main); white-space: nowrap;
        }
        .btn-secondary { border: 1px solid var(--border-medium); background: #fff; box-shadow: var(--shadow-sm); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.2); }
        .btn-primary:hover { background: var(--primary-dark); }

        /* BANNER DALAM PANGGILAN (DI BAWAH NAVBAR) */
        .active-call-banner {
            display: none;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
            align-items: center;
            justify-content: space-between;
            gap: 0.75rem;
            padding: 0.6rem 1.15rem;
            background: linear-gradient(90deg, #059669 0%, #10b981 100%);
            color: #ffffff;
            font-size: 0.82rem;
            font-weight: 700;
            flex-shrink: 0;
            z-index: 999;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
            transition: var(--transition);
        }
        .active-call-banner:hover {
            filter: brightness(1.04);
        }
        .active-call-banner.active {
            display: flex;
        }
        .active-call-banner-left {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 0;
        }
        .active-call-pulse {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #ffffff;
            flex-shrink: 0;
            animation: callBannerPulse 1.3s infinite ease-in-out;
        }
        @keyframes callBannerPulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.45); opacity: 0.55; }
        }
        .active-call-banner-text {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .active-call-banner-cta {
            display: inline-flex;
            align-items: center;
            gap: 0.35rem;
            background: rgba(255, 255, 255, 0.22);
            padding: 0.28rem 0.75rem;
            border-radius: var(--radius-full);
            font-size: 0.74rem;
            font-weight: 800;
            flex-shrink: 0;
        }

        /* INBOX LAYOUT */
        .inbox-wrapper {
            width: 100%; max-width: 800px; margin: 0 auto; background: #fff;
            border: none; border-radius: 0; box-shadow: none; 
            flex: 1; display: flex; flex-direction: column; overflow: hidden;
        }

        .inbox-header { 
            padding: 1rem 1.25rem 0.75rem 1.25rem; border-bottom: 1px solid var(--border-subtle); 
            display: flex; flex-direction: column; gap: 0.75rem; background: #fff; flex-shrink: 0;
        }
        .inbox-title-row { display: flex; align-items: center; justify-content: space-between; font-weight: 800; font-size: 1.05rem; color: var(--text-main); }
        
        /* SEARCH BOX */
        .search-box-wrapper { position: relative; width: 100%; }
        .search-box-wrapper input {
            width: 100%; padding: 0.55rem 0.85rem 0.55rem 2.3rem; background: var(--bg-alt);
            border: 1px solid var(--border-subtle); border-radius: var(--radius-full); font-size: 0.85rem;
            color: var(--text-main); transition: var(--transition);
        }
        .search-box-wrapper input:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-light); }
        .search-box-wrapper i { position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.8rem; }

        .conversations-list { flex: 1; overflow-y: auto; padding: 0.25rem 0; }
        .conversations-list::-webkit-scrollbar { width: 4px; }
        .conversations-list::-webkit-scrollbar-thumb { background: var(--border-medium); border-radius: 10px; }

        .conversation-item {
            display: flex; align-items: center; gap: 0.85rem; padding: 0.85rem 1.25rem;
            cursor: pointer; transition: var(--transition); position: relative; border-bottom: 1px solid #f1f5f9;
        }
        .conversation-item:hover { background: #f8fafc; }
        
        /* GAYA KARTU CHAT BELUM DIBACA */
        .conversation-item.unread-chat-item { background: #f0f7ff; border-left: 4px solid var(--primary); }
        .conversation-item.pinned-chat-item { background: #fafafa; }
        
        .conv-avatar-wrap { position: relative; flex-shrink: 0; width: 46px; height: 46px; }
        .conv-avatar { width: 46px; height: 46px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-medium); display: block; }
        .status-dot {
            position: absolute; bottom: 0px; right: 0px; width: 13px; height: 13px;
            background: #22c55e; border: 2.5px solid #ffffff; border-radius: 50%;
            display: none; z-index: 10; box-shadow: 0 0 0 1px rgba(34, 197, 94, 0.4);
        }
        .status-dot.active {
            display: block !important;
        }

        .conv-info { flex: 1; min-width: 0; }
        .conv-name-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.2rem; }
        
        .conv-name-group { display: flex; align-items: center; gap: 0.3rem; min-width: 0; }
        .conv-name { font-weight: 750; font-size: 0.92rem; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-verif, .chat-header-verif { width: 13px; height: 13px; object-fit: contain; flex-shrink: 0; display: inline-block; }
        .pin-icon { color: var(--primary); font-size: 0.75rem; margin-left: 4px; display: none; }
        .muted-icon { color: var(--text-muted); font-size: 0.75rem; margin-left: 4px; display: none; }

        .conv-time { font-size: 0.72rem; color: var(--text-muted); flex-shrink: 0; }
        
        .conv-msg-row { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
        .conv-last-msg { font-size: 0.82rem; color: var(--text-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .conv-last-msg.unread { font-weight: 800; color: var(--text-main); }
        
        /* TYPING STATUS */
        .conv-typing { font-size: 0.78rem; color: var(--accent); font-weight: 600; font-style: italic; display: none; }
        .typing-dots span { animation: typingBlink 1.4s infinite both; }
        .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
        .typing-dots span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBlink {
            0% { opacity: 0.2; }
            20% { opacity: 1; }
            100% { opacity: 0.2; }
        }

        /* UNREAD BADGE LABEL */
        .unread-badge {
            background: #ef4444; color: #fff; font-size: 0.68rem; font-weight: 800;
            padding: 0.15rem 0.5rem; border-radius: var(--radius-full); flex-shrink: 0; display: none;
            box-shadow: 0 2px 6px rgba(239, 68, 68, 0.25);
        }

        /* ACTION MODAL (LONG PRESS) */
        #actionModal {
            position: fixed; inset: 0; background: rgba(15, 23, 42, 0.4); backdrop-filter: blur(4px);
            z-index: 20000; display: none; align-items: flex-end; justify-content: center;
        }
        .action-sheet {
            background: #fff; width: 100%; max-width: 500px; border-top-left-radius: 1.5rem; border-top-right-radius: 1.5rem;
            padding: 1.25rem 1.25rem 2rem 1.25rem; display: flex; flex-direction: column; gap: 0.5rem; box-shadow: 0 -10px 30px rgba(0,0,0,0.1);
            animation: slideUpSheet 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes slideUpSheet {
            from { transform: translateY(100%); }
            to { transform: translateY(0); }
        }
        .action-btn {
            display: flex; align-items: center; gap: 0.85rem; padding: 0.85rem 1rem; width: 100%;
            background: var(--bg-alt); border-radius: var(--radius-lg); font-size: 0.92rem; font-weight: 700; color: var(--text-main);
            cursor: pointer; transition: var(--transition); border: 1px solid var(--border-subtle);
        }
        .action-btn:hover { background: var(--primary-light); color: var(--primary); border-color: var(--border-medium); }
        .action-btn.warning { color: #d97706; background: #fffbeb; border-color: #fef3c7; }
        .action-btn.warning:hover { background: #fef3c7; color: #b45309; }
        .action-btn.danger { color: var(--danger); background: #fef2f2; border-color: #fee2e2; }
        .action-btn.danger:hover { background: #fee2e2; color: #dc2626; }

        /* TOAST */
        #toastContainer { position: fixed; bottom: 20px; right: 20px; z-index: 10000; display: flex; flex-direction: column; gap: 0.5rem; max-width: 320px; }
        .toast { background: #0f172a; color: #fff; padding: 0.75rem 1rem; border-radius: 0.5rem; font-size: 0.82rem; font-weight: 600; box-shadow: 0 10px 25px -5px rgba(15, 23, 42, 0.1); display: flex; align-items: center; gap: 0.6rem; border-left: 4px solid var(--accent); }

        @media (max-width: 576px) {
            .conversation-item { padding: 0.75rem 1rem; }
        }
    </style>
</head>
<body data-package="basic">

    <div id="toastContainer"></div>

    <!-- MODAL AKSI (LONG PRESS MENU) -->
    <div id="actionModal" onclick="closeActionModal(event)">
        <div class="action-sheet" onclick="event.stopPropagation()">
            <div style="width: 40px; height: 4px; background: var(--border-medium); border-radius: 2px; margin: 0 auto 0.75rem auto;"></div>
            <div style="font-weight: 800; font-size: 1rem; color: var(--text-main); margin-bottom: 0.25rem; text-align: center;" id="modalChatTitle">Opsi Percakapan</div>
            
            <button class="action-btn" onclick="handlePinChat()">
                <i class="fas fa-thumbtack" style="color: var(--primary);"></i> <span id="pinActionText">Sematkan Chat</span>
            </button>
            <button class="action-btn" onclick="handleArchiveChat()">
                <i class="fas fa-archive" style="color: var(--primary);"></i> Arsipkan Chat
            </button>
            <button class="action-btn" onclick="handleMuteChat()">
                <i class="fas fa-bell-slash" style="color: var(--primary);"></i> <span id="muteActionText">Bisukan Notifikasi</span>
            </button>
            <button class="action-btn warning" onclick="handleClearChatHistory()">
                <i class="fas fa-broom"></i> Bersihkan Chat
            </button>
            <button class="action-btn danger" onclick="handleDeleteChat()">
                <i class="fas fa-trash-alt"></i> Hapus Percakapan
            </button>
            <button class="action-btn" onclick="closeActionModal()" style="justify-content: center; background: #fff; margin-top: 0.25rem;">
                Batal
            </button>
        </div>
    </div>

    <!-- NAVBAR DINAMIS DARI MODUL COMMUNITY -->
    <header id="navbar"></header>

    <!-- BANNER DI BAWAH NAVBAR SAAT SEDANG BERADA DI DALAM PANGGILAN -->
    <div id="activeCallBanner" class="active-call-banner" role="button" tabindex="0">
        <div class="active-call-banner-left">
            <span class="active-call-pulse"></span>
            <i id="activeCallBannerIcon" class="fas fa-phone-alt"></i>
            <span id="activeCallBannerText" class="active-call-banner-text">Dalam panggilan...</span>
        </div>
        <span class="active-call-banner-cta">
            <span>Masuk</span>
            <i class="fas fa-chevron-right"></i>
        </span>
    </div>

    <!-- KONTEN INBOX -->
    <main class="inbox-wrapper">
        <div class="inbox-header">
            <div class="inbox-title-row">
                <span><i class="fas fa-comments" style="color: var(--primary);"></i> Pesan Masuk</span>
                <span id="chatCountBadge" style="font-size: 0.72rem; background: var(--primary-light); color: var(--primary); padding: 0.15rem 0.55rem; border-radius: var(--radius-full); font-weight: 700;">0 Percakapan</span>
            </div>
            <div class="search-box-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="searchConversationInput" placeholder="Cari percakapan mitra..." onkeyup="filterConversations()">
            </div>
        </div>
        
        <div class="conversations-list" id="conversationsList"></div>
    </main>

    <!-- MODUL KONFIGURASI, DATA USER, NAVBAR COMMUNITY & PANGGILAN MASUK -->
    <script type="module">
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
        import {
            doc,
            updateDoc,
            deleteDoc,
            setDoc,
            collection,
            query,
            where,
            getDocs,
            writeBatch,
            onSnapshot,
            serverTimestamp as fsServerTimestamp
        } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
        import { ref, onValue, set, onDisconnect, serverTimestamp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js';

        import {
            db,
            rtdb,
            auth
        } from 'https://sitenexs.com/assets/js/sitenexs-config.js';

        import {
            fetchUserProfile,
            getUserAvatarUrl
        } from 'https://sitenexs.com/assets/js/sitenexs-user-data.js';

        import {
            mountSitenexsNavbar,
            setNavbarUserProfile
        } from 'https://sitenexs.com/assets/js/sitenexs-navbar.js';

        import {
            DEFAULT_CALL_PAGE_URL,
            attachForcedIncomingCallRedirect,
            attachOngoingCallBanner
        } from 'https://sitenexs.com/assets/js/sitenexs-call-presence.js';

        mountSitenexsNavbar({
            targetSelector: '#navbar',
            onSelectNotif: ({ postId, focusComments }) => {
                if (!postId) return;
                const url = new URL('https://sitenexs.com/community/');
                url.searchParams.set('post', postId);
                if (focusComments) url.searchParams.set('comments', '1');
                window.location.href = url.toString();
            }
        });

        let currentUid = null;
        let isInitialized = false;
        let allConversationsData = [];
        let unsubscribesMap = {};
        let presenceUnsubsMap = {};
        let fsPresenceUnsubsMap = {};
        let rtdbOnlineMap = {};
        let fsUserOnlineMap = {};
        let chatDocOnlineMap = {};
        let onlineStatusMap = {};
        let unsubscribeConversations = null;
        let unsubscribeMyPresence = null;
        let presenceHeartbeatInterval = null;
        let cleanupIncomingRedirect = null;
        let cleanupOngoingBanner = null;
        
        let selectedChatId = null;
        let selectedChatName = "";
        let pressTimer = null;

        function getInboxCacheKey(uid) {
            return `sitenexs_inbox_cache_${uid}`;
        }

        function saveInboxCache(uid, items) {
            if (!uid) return;
            try {
                const serializable = items.slice(0, 100).map(item => ({
                    chatId: item.chatId,
                    otherUid: item.otherUid,
                    otherName: item.otherName,
                    avatarUrl: item.avatarUrl,
                    badgesHtml: item.badgesHtml,
                    lastMessage: item.lastMessage,
                    lastTimestampMs: item.lastTimestamp?.toMillis ? item.lastTimestamp.toMillis() : (item.lastTimestampMs || 0),
                    unread: Boolean(item.unread),
                    pinned: Boolean(item.pinned),
                    muted: Boolean(item.muted),
                    isOnline: Boolean(item.isOnline)
                }));
                localStorage.setItem(getInboxCacheKey(uid), JSON.stringify(serializable));
            } catch (e) {}
        }

        function restoreInboxFromCache(uid) {
            if (!uid) return;
            try {
                const raw = localStorage.getItem(getInboxCacheKey(uid));
                if (!raw) return;
                const cached = JSON.parse(raw);
                if (!Array.isArray(cached) || cached.length === 0) return;

                allConversationsData = cached.map(item => ({
                    ...item,
                    lastTimestamp: item.lastTimestampMs
                        ? { toDate: () => new Date(item.lastTimestampMs), toMillis: () => item.lastTimestampMs }
                        : null
                }));

                document.getElementById('chatCountBadge').innerText = `${allConversationsData.length} Percakapan`;
                renderConversationsList(allConversationsData);
                updateGlobalUnreadCount();
            } catch (e) {}
        }

        const earlySavedUid = localStorage.getItem('sitenexs_uid');
        if (earlySavedUid) {
            restoreInboxFromCache(earlySavedUid);
        }

        window.showToast = function(msg) {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fas fa-check-circle" style="color: var(--accent); font-size: 1rem;"></i> <span>${msg}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3200);
        }

        function escapeHtml(text) {
            return String(text ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[char]));
        }

        function formatChatTimestamp(lastTimestamp) {
            if (!lastTimestamp?.toDate) return '';
            const date = lastTimestamp.toDate();
            const now = new Date();
            if (date.toDateString() === now.toDateString()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            return date.toLocaleDateString([], { month: 'short', day: 'numeric' });
        }

        /* =====================================================
           SISTEM KEHADIRAN REAL-TIME (RTDB + USERS TANPA LOOP CHATS)
        ===================================================== */
        function broadcastPresence(uid, isOnline) {
            if (!uid) return;

            const myStatusRef = ref(rtdb, `presence/${uid}`);
            set(myStatusRef, {
                online: isOnline,
                lastActive: serverTimestamp(),
                page: 'messages'
            }).catch(() => {});

            setDoc(doc(db, 'users', uid), {
                isOnline: isOnline,
                online: isOnline,
                lastActive: fsServerTimestamp()
            }, { merge: true }).catch(() => {});
        }

        function setupMyPresence(uid) {
            if (!uid) return;

            const connectedRef = ref(rtdb, '.info/connected');
            const myStatusRef = ref(rtdb, `presence/${uid}`);

            if (unsubscribeMyPresence) unsubscribeMyPresence();
            if (presenceHeartbeatInterval) clearInterval(presenceHeartbeatInterval);

            const markOnline = () => {
                if (document.visibilityState === 'hidden') return;
                broadcastPresence(uid, true);
            };

            const markOffline = () => {
                broadcastPresence(uid, false);
            };

            unsubscribeMyPresence = onValue(connectedRef, (snap) => {
                if (snap.val() === true) {
                    onDisconnect(myStatusRef).set({
                        online: false,
                        lastActive: serverTimestamp()
                    }).then(markOnline).catch(markOnline);
                }
            }, () => {});

            markOnline();

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') {
                    markOnline();
                } else {
                    markOffline();
                }
            });

            window.addEventListener('beforeunload', markOffline);
            window.addEventListener('pagehide', markOffline);

            presenceHeartbeatInterval = setInterval(() => {
                if (document.visibilityState === 'visible') {
                    markOnline();
                }
            }, 30000);
        }

        function syncCombinedOnlineState(otherUid) {
            const isOnline = Boolean(rtdbOnlineMap[otherUid]) ||
                             Boolean(fsUserOnlineMap[otherUid]) ||
                             Boolean(chatDocOnlineMap[otherUid]);
            onlineStatusMap[otherUid] = isOnline;

            const convObj = allConversationsData.find(c => c.otherUid === otherUid);
            if (convObj) {
                convObj.isOnline = isOnline;
            }

            const dotEls = document.querySelectorAll(`.status-dot[data-uid="${otherUid}"]`);
            dotEls.forEach(el => {
                if (isOnline) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            });
        }

        function listenOtherUsersPresence(otherUids) {
            const activeSet = new Set(otherUids);

            Object.keys(presenceUnsubsMap).forEach(uid => {
                if (!activeSet.has(uid)) {
                    presenceUnsubsMap[uid]();
                    delete presenceUnsubsMap[uid];
                    delete rtdbOnlineMap[uid];
                }
            });

            Object.keys(fsPresenceUnsubsMap).forEach(uid => {
                if (!activeSet.has(uid)) {
                    fsPresenceUnsubsMap[uid]();
                    delete fsPresenceUnsubsMap[uid];
                    delete fsUserOnlineMap[uid];
                    delete onlineStatusMap[uid];
                }
            });

            otherUids.forEach(otherUid => {
                if (!presenceUnsubsMap[otherUid]) {
                    const userPresenceRef = ref(rtdb, `presence/${otherUid}`);
                    presenceUnsubsMap[otherUid] = onValue(userPresenceRef, (snap) => {
                        const data = snap.val();
                        rtdbOnlineMap[otherUid] = Boolean(data && (data.online === true || data === true));
                        syncCombinedOnlineState(otherUid);
                    }, () => {
                        rtdbOnlineMap[otherUid] = false;
                        syncCombinedOnlineState(otherUid);
                    });
                }

                if (!fsPresenceUnsubsMap[otherUid]) {
                    const userDocRef = doc(db, 'users', otherUid);
                    fsPresenceUnsubsMap[otherUid] = onSnapshot(userDocRef, (docSnap) => {
                        if (!docSnap.exists()) {
                            fsUserOnlineMap[otherUid] = false;
                        } else {
                            const uData = docSnap.data();
                            fsUserOnlineMap[otherUid] = (uData.isOnline === true || uData.online === true);
                        }
                        syncCombinedOnlineState(otherUid);
                    }, () => {
                        fsUserOnlineMap[otherUid] = false;
                        syncCombinedOnlineState(otherUid);
                    });
                }
            });
        }

        async function initInbox(uid) {
            if (isInitialized && currentUid === uid) return;
            isInitialized = true;
            currentUid = uid;

            if (allConversationsData.length === 0) {
                restoreInboxFromCache(uid);
            }

            setNavbarUserProfile(uid).catch(() => {});
            setupMyPresence(uid);

            if (cleanupIncomingRedirect) cleanupIncomingRedirect();
            cleanupIncomingRedirect = attachForcedIncomingCallRedirect({
                rtdb,
                currentUid: uid,
                callPageUrl: DEFAULT_CALL_PAGE_URL
            });

            if (cleanupOngoingBanner) cleanupOngoingBanner();
            cleanupOngoingBanner = attachOngoingCallBanner({
                rtdb,
                currentUid: uid,
                bannerElement: document.getElementById('activeCallBanner'),
                textElement: document.getElementById('activeCallBannerText'),
                iconElement: document.getElementById('activeCallBannerIcon'),
                callPageUrl: DEFAULT_CALL_PAGE_URL
            });

            try {
                const myProfile = await fetchUserProfile(db, uid);
                if (myProfile?.packageName) {
                    document.body.setAttribute('data-package', String(myProfile.packageName).toLowerCase());
                }
            } catch (err) {
                console.warn('Gagal memuat profil paket user:', err);
            }

            loadConversations(uid);
        }

        onAuthStateChanged(auth, (user) => {
            if (user) {
                initInbox(user.uid);
            } else {
                const savedUid = localStorage.getItem('sitenexs_uid');
                if (savedUid) {
                    initInbox(savedUid);
                } else {
                    window.location.replace("https://account.sitenexs.com/sign-in/");
                }
            }
        });

        function buildConversationElement(chat) {
            const fallbackAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(chat.otherName)}&background=2563eb&color=fff`;
            const timeStr = formatChatTimestamp(chat.lastTimestamp);

            const unreadClass = chat.unread ? 'unread' : '';
            const unreadBadgeStyle = chat.unread ? 'display: inline-block;' : 'display: none;';
            const unreadItemClass = chat.unread ? 'unread-chat-item' : '';
            const pinnedItemClass = chat.pinned ? 'pinned-chat-item' : '';

            const pinDisplay = chat.pinned ? 'inline-block' : 'none';
            const muteDisplay = chat.muted ? 'inline-block' : 'none';
            const statusDotClass = (chat.isOnline || onlineStatusMap[chat.otherUid]) ? 'status-dot active' : 'status-dot';

            const itemEl = document.createElement('div');
            itemEl.id = `item-${chat.chatId}`;
            itemEl.className = `conversation-item ${unreadItemClass} ${pinnedItemClass}`.trim();
            itemEl.dataset.chatId = chat.chatId;
            itemEl.dataset.otherUid = chat.otherUid;

            itemEl.addEventListener('pointerdown', () => startPressTimer(chat.chatId, chat.otherName));
            itemEl.addEventListener('pointerup', clearPressTimer);
            itemEl.addEventListener('pointerleave', clearPressTimer);
            itemEl.addEventListener('click', () => openChatSafely(chat.otherUid));

            itemEl.innerHTML = `
                <div class="conv-avatar-wrap">
                    <img src="${chat.avatarUrl}" class="conv-avatar" onerror="this.src='${fallbackAvatar}';">
                    <span class="${statusDotClass}" data-uid="${escapeHtml(chat.otherUid)}"></span>
                </div>
                <div class="conv-info">
                    <div class="conv-name-row">
                        <div class="conv-name-group">
                            <span class="conv-name">${escapeHtml(chat.otherName)}</span>
                            ${chat.badgesHtml}
                            <i class="fas fa-thumbtack pin-icon" id="pin-icon-${chat.chatId}" style="display: ${pinDisplay};"></i>
                            <i class="fas fa-bell-slash muted-icon" id="mute-icon-${chat.chatId}" style="display: ${muteDisplay};"></i>
                        </div>
                        <span class="conv-time" id="time-${chat.chatId}">${timeStr}</span>
                    </div>
                    <div class="conv-msg-row">
                        <div style="min-width: 0; flex: 1;">
                            <div class="conv-last-msg ${unreadClass}" id="msg-${chat.chatId}">${escapeHtml(chat.lastMessage)}</div>
                            <div class="conv-typing" id="typing-${chat.chatId}">Sedang mengetik<span class="typing-dots"><span>.</span><span>.</span><span>.</span></span></div>
                        </div>
                        <span class="unread-badge" id="badge-${chat.chatId}" style="${unreadBadgeStyle}">Baru</span>
                    </div>
                </div>
            `;

            return itemEl;
        }

        function updateConversationElement(itemEl, chat) {
            itemEl.classList.toggle('unread-chat-item', Boolean(chat.unread));
            itemEl.classList.toggle('pinned-chat-item', Boolean(chat.pinned));

            const nameEl = itemEl.querySelector('.conv-name');
            if (nameEl && nameEl.textContent !== chat.otherName) {
                nameEl.textContent = chat.otherName;
            }

            const timeEl = document.getElementById(`time-${chat.chatId}`);
            if (timeEl) {
                timeEl.textContent = formatChatTimestamp(chat.lastTimestamp);
            }

            const msgEl = document.getElementById(`msg-${chat.chatId}`);
            if (msgEl) {
                msgEl.textContent = chat.lastMessage;
                msgEl.classList.toggle('unread', Boolean(chat.unread));
            }

            const badgeEl = document.getElementById(`badge-${chat.chatId}`);
            if (badgeEl) {
                badgeEl.style.display = chat.unread ? 'inline-block' : 'none';
            }

            const pinEl = document.getElementById(`pin-icon-${chat.chatId}`);
            if (pinEl) {
                pinEl.style.display = chat.pinned ? 'inline-block' : 'none';
            }

            const muteEl = document.getElementById(`mute-icon-${chat.chatId}`);
            if (muteEl) {
                muteEl.style.display = chat.muted ? 'inline-block' : 'none';
            }
        }

        function loadConversations(uid) {
            const listEl = document.getElementById('conversationsList');
            const q = query(collection(db, "chats"), where("participants", "array-contains", uid));

            if (unsubscribeConversations) {
                unsubscribeConversations();
            }

            unsubscribeConversations = onSnapshot(q, async (snapshot) => {
                try {
                    if (snapshot.empty) {
                        allConversationsData = [];
                        saveInboxCache(uid, []);
                        listEl.innerHTML = `
                            <div data-empty-state="true" style="text-align: center; padding: 4rem 1.5rem; color: var(--text-muted); font-size: 0.88rem;">
                                <i class="far fa-comments fa-3x" style="color: var(--border-medium); margin-bottom: 1rem;"></i>
                                <div style="font-weight: 750; color: var(--text-main); margin-bottom: 0.35rem; font-size: 1rem;">Belum ada percakapan</div>
                                <div>Mulai kirim pesan dari profil anggota komunitas Sitenexs!</div>
                            </div>`;
                        document.getElementById('chatCountBadge').innerText = '0 Percakapan';
                        updateGlobalUnreadBadge(0);
                        return;
                    }

                    const chatsMap = new Map();
                    snapshot.forEach(docSnap => {
                        const chatData = docSnap.data();
                        if (!chatData.participants || !Array.isArray(chatData.participants)) return;

                        const rawOtherUid = chatData.participants.find(p => String(p).trim() !== String(uid).trim());
                        if (!rawOtherUid) return;
                        const otherUid = String(rawOtherUid).trim();

                        const currentMillis = chatData.lastTimestamp?.toMillis?.() || 0;
                        const existing = chatsMap.get(otherUid);
                        const existingMillis = existing?.lastTimestamp?.toMillis?.() || 0;

                        if (!existing || currentMillis >= existingMillis) {
                            chatsMap.set(otherUid, { id: docSnap.id, otherUid, ...chatData });
                        }
                    });

                    const chats = Array.from(chatsMap.values());
                    const prevByChatId = new Map(allConversationsData.map(item => [item.chatId, item]));

                    const resolvedItems = await Promise.all(chats.map(async (chat) => {
                        const cachedItem = prevByChatId.get(chat.id);
                        let otherName = cachedItem?.otherName || 'Mitra Sitenexs';
                        let avatarUrl = cachedItem?.avatarUrl || getUserAvatarUrl(chat.otherUid);
                        let badgesHtml = cachedItem?.badgesHtml || '';

                        if (!cachedItem) {
                            try {
                                const userProfile = await fetchUserProfile(db, chat.otherUid, {
                                    badgeClass: 'conv-verif'
                                });
                                otherName = userProfile.displayName || 'Mitra Sitenexs';
                                avatarUrl = userProfile.avatarUrl || getUserAvatarUrl(chat.otherUid);
                                const isPro = Boolean(userProfile.raw?.isPro) || Boolean(userProfile.raw?.lencanaKuning) || Boolean(userProfile.raw?.isLencanaKuning);
                                badgesHtml = userProfile.badgesHtml || '';
                                if (isPro) {
                                    badgesHtml += `<img src="https://sitenexs.com/assets/logo/lencana.png" class="conv-verif" alt="Pro" title="Lencana Pro" style="margin-left: 2px;">`;
                                }
                                if (userProfile.raw?.isOnline === true || userProfile.raw?.online === true) {
                                    fsUserOnlineMap[chat.otherUid] = true;
                                }
                            } catch (e) {
                                avatarUrl = `https://ui-avatars.com/api/?name=Mitra&background=2563eb&color=fff`;
                            }
                        }

                        const isUnread = chat[`unread_${uid}`] === true;
                        const isPinned = chat[`pinned_${uid}`] === true;
                        const isArchived = chat[`archived_${uid}`] === true;
                        const isMuted = chat[`muted_${uid}`] === true;

                        if (chat[`online_${chat.otherUid}`] === true) {
                            chatDocOnlineMap[chat.otherUid] = true;
                        }

                        const combinedOnline = Boolean(rtdbOnlineMap[chat.otherUid]) ||
                                               Boolean(fsUserOnlineMap[chat.otherUid]) ||
                                               Boolean(chatDocOnlineMap[chat.otherUid]);
                        onlineStatusMap[chat.otherUid] = combinedOnline;

                        if (isArchived) return null;

                        return {
                            chatId: chat.id,
                            otherUid: chat.otherUid,
                            otherName,
                            avatarUrl,
                            badgesHtml,
                            lastMessage: chat.lastMessage || 'Mulai percakapan...',
                            lastTimestamp: chat.lastTimestamp,
                            lastTimestampMs: chat.lastTimestamp?.toMillis?.() || cachedItem?.lastTimestampMs || 0,
                            unread: isUnread,
                            pinned: isPinned,
                            muted: isMuted,
                            isOnline: combinedOnline
                        };
                    }));

                    allConversationsData = resolvedItems.filter(Boolean);

                    allConversationsData.sort((a, b) => {
                        if (a.pinned !== b.pinned) return b.pinned - a.pinned;
                        return (b.lastTimestamp?.toMillis?.() || b.lastTimestampMs || 0) - (a.lastTimestamp?.toMillis?.() || a.lastTimestampMs || 0);
                    });

                    saveInboxCache(uid, allConversationsData);

                    document.getElementById('chatCountBadge').innerText = `${allConversationsData.length} Percakapan`;
                    
                    const keyword = document.getElementById('searchConversationInput')?.value.toLowerCase() || '';
                    if (keyword) {
                        filterConversations();
                    } else {
                        renderConversationsList(allConversationsData);
                    }

                    updateGlobalUnreadCount();
                    setupRealtimeSublisteners(chats, uid);
                    listenOtherUsersPresence(allConversationsData.map(c => c.otherUid));
                } catch (err) {
                    console.error('Error memproses daftar percakapan:', err);
                }
            }, (error) => {
                console.error('Firestore chats listener error:', error);
            });
        }

        function updateGlobalUnreadCount() {
            const unreadCount = allConversationsData.filter(c => c.unread).length;
            updateGlobalUnreadBadge(unreadCount);
        }

        function updateGlobalUnreadBadge(count) {
            const badge = document.getElementById('globalUnreadBadge');
            if (badge) {
                if (count > 0) {
                    badge.innerText = count;
                    badge.style.display = 'block';
                } else {
                    badge.style.display = 'none';
                }
            }
        }

        function setupRealtimeSublisteners(chats, uid) {
            chats.forEach(chat => {
                const rawOtherUid = chat.participants.find(p => String(p).trim() !== String(uid).trim());
                if (!rawOtherUid) return;
                const otherUid = String(rawOtherUid).trim();

                if (unsubscribesMap[chat.id]) {
                    unsubscribesMap[chat.id]();
                }

                unsubscribesMap[chat.id] = onSnapshot(doc(db, "chats", chat.id), (docSnap) => {
                    if (!docSnap.exists()) return;
                    const data = docSnap.data();

                    const otherChatOnline = data[`online_${otherUid}`] === true || Boolean(data[`typing_${otherUid}`]);
                    chatDocOnlineMap[otherUid] = otherChatOnline;
                    syncCombinedOnlineState(otherUid);
                    
                    const isTyping = data[`typing_${otherUid}`];
                    const typingEl = document.getElementById(`typing-${chat.id}`);
                    const msgEl = document.getElementById(`msg-${chat.id}`);

                    if (typingEl && msgEl) {
                        if (isTyping) {
                            typingEl.style.display = 'inline-block';
                            msgEl.style.display = 'none';
                        } else {
                            typingEl.style.display = 'none';
                            msgEl.style.display = 'block';
                        }
                    }

                    const isUnread = data[`unread_${uid}`] === true;
                    const badgeEl = document.getElementById(`badge-${chat.id}`);
                    const itemEl = document.getElementById(`item-${chat.id}`);

                    const targetConv = allConversationsData.find(c => c.chatId === chat.id);
                    if (targetConv) {
                        targetConv.unread = isUnread;
                        if (typeof data.lastMessage === 'string') {
                            targetConv.lastMessage = data.lastMessage || 'Mulai percakapan...';
                        }
                        saveInboxCache(uid, allConversationsData);
                        updateGlobalUnreadCount();
                    }

                    if (msgEl && typeof data.lastMessage === 'string') {
                        msgEl.textContent = data.lastMessage || 'Mulai percakapan...';
                    }

                    if (badgeEl && msgEl && itemEl) {
                        if (isUnread) {
                            badgeEl.style.display = 'inline-block';
                            msgEl.classList.add('unread');
                            itemEl.classList.add('unread-chat-item');
                        } else {
                            badgeEl.style.display = 'none';
                            msgEl.classList.remove('unread');
                            itemEl.classList.remove('unread-chat-item');
                        }
                    }
                });
            });
        }

        /* =====================================================
           RENDER INKREMENTAL TANPA KEDIP (DOM RECONCILIATION)
        ===================================================== */
        window.renderConversationsList = function(chats) {
            const listEl = document.getElementById('conversationsList');
            const emptyStateEl = listEl.querySelector('[data-empty-state="true"]');

            if (!chats || chats.length === 0) {
                listEl.querySelectorAll('[data-chat-id]').forEach(el => el.remove());
                if (!emptyStateEl) {
                    listEl.innerHTML = '<div data-empty-state="true" style="text-align: center; padding: 3rem; color: var(--text-muted); font-size: 0.88rem;">Tidak ada percakapan aktif.</div>';
                }
                return;
            }

            if (emptyStateEl) {
                emptyStateEl.remove();
            }

            const validIds = new Set(chats.map(c => c.chatId));
            listEl.querySelectorAll('[data-chat-id]').forEach(existingEl => {
                if (!validIds.has(existingEl.dataset.chatId)) {
                    existingEl.remove();
                }
            });

            chats.forEach((chat, index) => {
                let itemEl = document.getElementById(`item-${chat.chatId}`);
                if (!itemEl) {
                    itemEl = buildConversationElement(chat);
                } else {
                    updateConversationElement(itemEl, chat);
                }

                const currentChildAtIdx = listEl.children[index];
                if (currentChildAtIdx !== itemEl) {
                    listEl.insertBefore(itemEl, currentChildAtIdx || null);
                }
            });
        }

        let isLongPress = false;
        window.startPressTimer = function(chatId, chatName) {
            isLongPress = false;
            pressTimer = setTimeout(() => {
                isLongPress = true;
                selectedChatId = chatId;
                selectedChatName = chatName;
                
                const currentChat = allConversationsData.find(c => c.chatId === chatId);
                if (currentChat) {
                    document.getElementById('pinActionText').innerText = currentChat.pinned ? 'Lepas Sematan' : 'Sematkan Chat';
                    document.getElementById('muteActionText').innerText = currentChat.muted ? 'Bunyikan Notifikasi' : 'Bisukan Notifikasi';
                }

                document.getElementById('modalChatTitle').innerText = chatName;
                document.getElementById('actionModal').style.display = 'flex';
                if (navigator.vibrate) navigator.vibrate(50);
            }, 600);
        }

        window.clearPressTimer = function() {
            if (pressTimer) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        }

        window.openChatSafely = function(otherUid) {
            if (isLongPress) {
                isLongPress = false;
                return;
            }
            window.location.href = `chat/?to=${encodeURIComponent(otherUid)}`;
        }

        window.closeActionModal = function() {
            document.getElementById('actionModal').style.display = 'none';
        }

        window.handlePinChat = async function() {
            closeActionModal();
            if (!selectedChatId || !currentUid) return;
            const chatObj = allConversationsData.find(c => c.chatId === selectedChatId);
            if (!chatObj) return;

            const newPinnedState = !chatObj.pinned;
            try {
                await updateDoc(doc(db, "chats", selectedChatId), {
                    [`pinned_${currentUid}`]: newPinnedState
                });
                showToast(newPinnedState ? "Chat berhasil disematkan." : "Sematan chat dilepas.");
            } catch (err) {
                showToast("Gagal memperbarui sematan.");
            }
        }

        window.handleArchiveChat = async function() {
            closeActionModal();
            if (!selectedChatId || !currentUid) return;
            if (!confirm(`Arsipkan percakapan dengan ${selectedChatName}?`)) return;

            try {
                await updateDoc(doc(db, "chats", selectedChatId), {
                    [`archived_${currentUid}`]: true
                });
                showToast("Percakapan diarsipkan.");
            } catch (err) {
                showToast("Gagal mengarsipkan chat.");
            }
        }

        window.handleMuteChat = async function() {
            closeActionModal();
            if (!selectedChatId || !currentUid) return;
            const chatObj = allConversationsData.find(c => c.chatId === selectedChatId);
            if (!chatObj) return;

            const newMutedState = !chatObj.muted;
            try {
                await updateDoc(doc(db, "chats", selectedChatId), {
                    [`muted_${currentUid}`]: newMutedState
                });
                showToast(newMutedState ? "Notifikasi dibisukan." : "Notifikasi diaktifkan kembali.");
            } catch (err) {
                showToast("Gagal mengubah pengaturan notifikasi.");
            }
        }

        window.handleClearChatHistory = async function() {
            closeActionModal();
            const targetChatId = selectedChatId;
            const targetName = selectedChatName;
            if (!targetChatId || !currentUid) return;
            if (!confirm(`Bersihkan semua riwayat chat dengan ${targetName}? Semua pesan di percakapan ini akan dihapus dari Firestore.`)) return;

            try {
                const messagesRef = collection(db, "chats", targetChatId, "messages");
                const messagesSnap = await getDocs(messagesRef);

                if (!messagesSnap.empty) {
                    const docsList = messagesSnap.docs;
                    const BATCH_LIMIT = 450;
                    for (let i = 0; i < docsList.length; i += BATCH_LIMIT) {
                        const batch = writeBatch(db);
                        docsList.slice(i, i + BATCH_LIMIT).forEach(msgDoc => {
                            batch.delete(msgDoc.ref);
                        });
                        await batch.commit();
                    }
                }

                const chatObj = allConversationsData.find(c => c.chatId === targetChatId);
                const chatResetPayload = {
                    lastMessage: '',
                    [`unread_${currentUid}`]: false
                };
                if (chatObj?.otherUid) {
                    chatResetPayload[`unread_${chatObj.otherUid}`] = false;
                }

                await updateDoc(doc(db, "chats", targetChatId), chatResetPayload);

                try {
                    localStorage.removeItem(`sitenexs_chat_cache_${targetChatId}`);
                    localStorage.removeItem(`sitenexs_green_read_${targetChatId}`);
                } catch (e) {}

                if (chatObj) {
                    chatObj.lastMessage = 'Mulai percakapan...';
                    chatObj.unread = false;
                    saveInboxCache(currentUid, allConversationsData);
                    updateGlobalUnreadCount();
                }

                const msgEl = document.getElementById(`msg-${targetChatId}`);
                if (msgEl) {
                    msgEl.textContent = 'Mulai percakapan...';
                    msgEl.classList.remove('unread');
                }

                showToast(`Riwayat chat dengan ${targetName} berhasil dibersihkan.`);
            } catch (err) {
                console.error('Gagal membersihkan riwayat chat:', err);
                showToast("Gagal membersihkan riwayat chat.");
            }
        }

        window.handleDeleteChat = async function() {
            closeActionModal();
            if (!selectedChatId) return;
            if (!confirm("Apakah Anda yakin ingin menghapus percakapan ini secara permanen?")) return;

            try {
                if (unsubscribesMap[selectedChatId]) {
                    unsubscribesMap[selectedChatId]();
                    delete unsubscribesMap[selectedChatId];
                }
                await deleteDoc(doc(db, "chats", selectedChatId));
                try {
                    localStorage.removeItem(`sitenexs_chat_cache_${selectedChatId}`);
                    localStorage.removeItem(`sitenexs_green_read_${selectedChatId}`);
                } catch (e) {}
                showToast("Percakapan berhasil dihapus.");
            } catch (err) {
                showToast("Gagal menghapus percakapan.");
            }
        }

        window.filterConversations = function() {
            const keyword = document.getElementById('searchConversationInput').value.toLowerCase();
            const filtered = allConversationsData.filter(c => c.otherName.toLowerCase().includes(keyword) || c.lastMessage.toLowerCase().includes(keyword));
            renderConversationsList(filtered);
        }
    </script>
</body>
</html>
