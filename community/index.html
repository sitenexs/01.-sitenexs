<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forum Diskusi Komunitas — Sitenexs</title>
    
    <!-- Meta SEO -->
    <meta name="description" content="Forum diskusi resmi Sitenexs. Tempat berdiskusi, bertanya, dan berbagi pengalaman bagi seluruh mitra dan pengguna terdaftar Sitenexs.">
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #f1f5f9;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --border-accent: #93c5fd;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.04);
            --shadow-md: 0 4px 8px -2px rgba(15, 23, 42, 0.08);
            --radius-sm: 0.375rem;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-full: 9999px;
            --transition: all 0.2s ease;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.4;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }
        ul { list-style: none; }
        button, input, textarea, select { font-family: inherit; outline: none; border: none; }

        .container { width: 100%; max-width: 680px; margin: 0 auto; padding: 0 0.75rem; }

        .text-primary { color: var(--primary); }
        .text-muted { color: var(--text-muted); }

        /* BUTTONS */
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem;
            padding: 0.4rem 0.8rem; font-size: 0.75rem; font-weight: 700;
            border-radius: var(--radius-full); cursor: pointer; transition: var(--transition);
            white-space: nowrap;
        }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 6px rgba(37, 99, 235, 0.2); }
        .btn-primary:hover { background: var(--primary-dark); transform: translateY(-1px); }
        .btn-secondary { background: #fff; border: 1px solid var(--border-medium); color: var(--text-main); }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }
        .btn-sm { padding: 0.3rem 0.6rem; font-size: 0.7rem; }

        /* NAV PROFILE BUTTON CUSTOM */
        .nav-profile-btn {
            display: inline-flex; align-items: center; gap: 0.4rem;
            padding: 0.25rem 0.65rem 0.25rem 0.35rem; background: #fff;
            border: 1px solid var(--border-medium); border-radius: var(--radius-full);
            color: var(--text-main); font-size: 0.75rem; font-weight: 700;
            transition: var(--transition); text-decoration: none; cursor: pointer;
        }
        .nav-profile-btn:hover {
            border-color: var(--primary); color: var(--primary);
            box-shadow: var(--shadow-sm); background: var(--primary-light);
        }
        .nav-profile-img {
            width: 26px; height: 26px; border-radius: 50%;
            object-fit: cover; border: 1px solid var(--border-subtle); flex-shrink: 0;
        }

        /* NAVBAR RESPONSIVE */
        #navbar {
            position: sticky; top: 0; z-index: 1000; background: rgba(255, 255, 255, 0.98);
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-subtle); box-shadow: var(--shadow-sm);
        }
        .nav-container { display: flex; align-items: center; justify-content: space-between; height: 55px; width: 100%; max-width: 680px; margin: 0 auto; padding: 0 0.75rem; }
        .logo { display: flex; align-items: center; gap: 0.4rem; font-weight: 800; font-size: 0.95rem; color: var(--text-main); flex-shrink: 0; }
        .logo img { height: 24px; width: 24px; border-radius: 50%; object-fit: cover; }
        
        /* LOGO TEKS GRADIEN SITENEXS */
        .logo-text-gradient {
            background: linear-gradient(135deg, #2563eb 0%, #0284c7 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: -0.2px;
        }

        .nav-actions { display: flex; gap: 0.4rem; align-items: center; }

        /* HEADER FORUM */
        .forum-header { background: #fff; border-bottom: 1px solid var(--border-subtle); padding: 1rem 0; margin-bottom: 1rem; width: 100%; overflow: hidden; }
        .forum-header-content { display: flex; flex-direction: column; align-items: flex-start; gap: 0.6rem; width: 100%; max-width: 680px; margin: 0 auto; padding: 0 0.75rem; }
        
        .forum-header-text { width: 100%; max-width: 100%; word-break: break-word; }
        .forum-header-text h1 { font-size: 1.1rem; font-weight: 800; margin-bottom: 0.1rem; line-height: 1.2; color: var(--text-main); }
        
        .search-bar {
            display: flex; align-items: center; background: var(--bg-body); border: 1px solid transparent;
            border-radius: var(--radius-full); padding: 0.4rem 0.8rem; width: 100%; max-width: 100%;
            transition: var(--transition);
        }
        .search-bar:focus-within { border-color: var(--border-accent); background: #fff; box-shadow: 0 0 0 2px var(--primary-light); }
        .search-bar input { background: transparent; width: 100%; font-size: 0.8rem; margin-left: 0.4rem; min-width: 0; }

        /* MAIN LAYOUT (SINGLE COLUMN CENTERED) */
        .forum-layout {
            display: block; width: 100%; max-width: 680px; margin: 0 auto; padding: 0 0.75rem 4rem 0.75rem;
        }

        /* MAIN FEED & KOTAK POSTINGAN */
        .main-feed { width: 100%; min-width: 0; }
        .post-list { display: flex; flex-direction: column; gap: 0.85rem; width: 100%; }
        
        .create-post-box {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
            padding: 0.6rem 0.85rem; display: flex; align-items: center; gap: 0.5rem; margin-bottom: 0.85rem; cursor: pointer; 
            box-shadow: var(--shadow-sm); width: 100%; transition: var(--transition);
        }
        .create-post-box:hover { box-shadow: var(--shadow-md); }
        .create-post-box img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-subtle); flex-shrink: 0; }
        .create-post-input {
            flex: 1; background: var(--bg-body); padding: 0.5rem 0.75rem; border-radius: var(--radius-full);
            color: var(--text-muted); font-size: 0.8rem; border: 1px solid transparent; transition: var(--transition);
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; cursor: text;
        }
        .create-post-box:hover .create-post-input { background: #e2e8f0; }

        /* POST CARD DINAMIS - GAYA MEDIA SOSIAL */
        .post-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
            padding: 0; box-shadow: var(--shadow-sm); transition: var(--transition); animation: fadeIn 0.3s ease; width: 100%; overflow: hidden;
            user-select: none; -webkit-touch-callout: none;
        }
        .post-card-inner { padding: 0.85rem; }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
        
        .post-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 0.65rem; gap: 0.4rem; }
        .post-author { display: flex; align-items: center; gap: 0.5rem; min-width: 0; flex: 1; }
        
        .post-author-img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 1px solid rgba(0,0,0,0.08); flex-shrink: 0; }
        
        .author-info { display: flex; flex-direction: column; justify-content: center; min-width: 0; }
        
        /* ALIGNMENT NAMA & CENTANG BIRU (POSTINGAN) */
        .author-name-row { display: flex; align-items: center; gap: 0.25rem; min-width: 0; }
        .author-name-link { text-decoration: none; color: inherit; display: inline-flex; align-items: center; min-width: 0; }
        .author-name-link:hover .author-name { text-decoration: underline; color: var(--primary); }
        .author-name { 
            font-weight: 800; 
            font-size: 0.85rem; 
            color: var(--text-main); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
            line-height: 1.3; 
            transition: color 0.2s; 
            padding-bottom: 1px;
        }
        .member-verification-icon { width: 13px; height: 13px; object-fit: contain; flex-shrink: 0; transform: translateY(0.5px); }
        
        .author-time { font-size: 0.65rem; color: var(--text-muted); font-weight: 500; margin-top: 0.05rem; }
        
        .post-badge {
            font-size: 0.6rem; font-weight: 700; padding: 0.15rem 0.4rem; border-radius: var(--radius-full);
            background: var(--bg-body); color: var(--text-muted); flex-shrink: 0; border: 1px solid var(--border-subtle);
        }
        .badge-pengumuman { background: #fef2f2; color: #ef4444; border-color: #fca5a5; }
        .badge-tips { background: #fffbeb; color: #d97706; border-color: #fcd34d; }
        .badge-bug { background: #faf5ff; color: #7e22ce; border-color: #d8b4fe; }

        .post-title { font-size: 0.95rem; font-weight: 800; margin-bottom: 0.3rem; line-height: 1.3; color: var(--text-main); word-break: break-word; }
        .post-content { font-size: 0.8rem; color: var(--text-main); margin-bottom: 0.65rem; line-height: 1.45; white-space: pre-wrap; word-break: break-word; }
        
        /* TOMBOL AKSI GAYA SOSMED & ANIMASI LIKE */
        .post-actions {
            display: flex; align-items: center; justify-content: space-between; 
            border-top: 1px solid var(--border-subtle); padding: 0.3rem 0.85rem; gap: 0.4rem;
        }
        .action-btn { 
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 0.3rem; 
            color: var(--text-muted); font-size: 0.75rem; font-weight: 600; cursor: pointer; 
            transition: all 0.2s; background: transparent; padding: 0.4rem 0; border-radius: var(--radius-sm);
        }
        .action-btn:hover { background: var(--bg-body); color: var(--text-main); }
        .action-btn.liked { color: #ef4444; }
        
        @keyframes likePop {
            0% { transform: scale(1); }
            50% { transform: scale(1.35); }
            100% { transform: scale(1); }
        }
        .action-btn.liked i { 
            font-weight: 900; 
            animation: likePop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
        }

        /* KOMENTAR SECTION - DENGAN ANIMASI BUKA/TUTUP */
        .comments-section {
            background: #fafafa; border-top: 1px solid var(--border-subtle);
            padding: 0.85rem; display: none;
            opacity: 0;
            transform: translateY(-8px);
            transition: opacity 0.25s ease, transform 0.25s ease;
        }
        .comments-section.active { 
            display: block; 
            opacity: 1;
            transform: translateY(0);
            animation: commentSlideIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes commentSlideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .comment-list { display: flex; flex-direction: column; gap: 0.65rem; margin-bottom: 0.85rem; max-height: 250px; overflow-y: auto; padding-right: 0.4rem; }
        
        .comment-item { 
            display: flex; gap: 0.5rem; align-items: flex-start; 
            transition: all 0.3s ease; border-radius: var(--radius-md); padding: 0.15rem;
        }
        .comment-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-subtle); flex-shrink: 0; }
        
        .comment-content-wrapper { flex: 1; min-width: 0; }
        .comment-bubble {
            background: var(--bg-body); padding: 0.4rem 0.6rem; 
            border-radius: 0 var(--radius-md) var(--radius-md) var(--radius-md);
            display: inline-block; width: 100%; border: 1px solid var(--border-subtle);
        }
        
        /* ALIGNMENT NAMA & CENTANG BIRU (KOMENTAR) */
        .comment-header-row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.15rem; }
        .comment-author-left { display: flex; align-items: center; gap: 0.25rem; min-width: 0; }
        .comment-author-link { text-decoration: none; color: inherit; display: inline-flex; align-items: center; min-width: 0; }
        .comment-author-link:hover .comment-author { text-decoration: underline; color: var(--primary); }
        .comment-author { 
            font-weight: 800; 
            font-size: 0.75rem; 
            color: var(--text-main); 
            line-height: 1.3; 
            transition: color 0.2s; 
            padding-bottom: 1px;
        }
        
        .comment-text { font-size: 0.75rem; color: var(--text-main); word-break: break-word; line-height: 1.35; }
        .comment-text .mention-link { color: var(--primary); font-weight: 700; text-decoration: none; }
        .comment-text .mention-link:hover { text-decoration: underline; }

        /* BAGIAN BAWAH KOMENTAR (WAKTU, TOMBOL BALAS & HAPUS) */
        .comment-footer-row { display: flex; align-items: center; gap: 0.5rem; margin-top: 0.2rem; margin-left: 0.3rem; }
        .comment-time { font-size: 0.6rem; color: var(--text-muted); font-weight: 500; }
        .reply-trigger-btn { background: none; border: none; color: var(--primary); font-size: 0.65rem; font-weight: 700; cursor: pointer; padding: 0; transition: var(--transition); }
        .reply-trigger-btn:hover { text-decoration: underline; }
        .delete-comment-btn { background: none; border: none; color: #ef4444; font-size: 0.65rem; font-weight: 700; cursor: pointer; padding: 0; transition: var(--transition); }
        .delete-comment-btn:hover { text-decoration: underline; }

        /* --- FOKUS KOMENTAR & BLUR (TANPA BORDER) --- */
        .comments-section.comment-focus-mode .comment-item:not(.focused-comment) {
            filter: blur(4px);
            opacity: 0.35;
            pointer-events: none;
            user-select: none;
            transition: all 0.3s ease;
        }
        .comment-item.focused-comment {
            position: relative;
            z-index: 50;
            transform: scale(1.02);
            background: #fff;
            box-shadow: 0 4px 16px rgba(15, 23, 42, 0.12);
            border: none;
            padding: 0.3rem;
            transition: all 0.3s ease;
        }

        /* MENTION AUTOCOMPLETE DROPDOWN */
        .mention-dropdown {
            position: absolute; bottom: 100%; left: 0; background: #fff;
            border: 1px solid var(--border-medium); border-radius: var(--radius-md);
            box-shadow: var(--shadow-md); width: 220px; max-height: 150px; overflow-y: auto;
            z-index: 100; display: none; margin-bottom: 4px;
        }
        .mention-dropdown.active { display: block; }
        .mention-item {
            display: flex; align-items: center; gap: 0.5rem; padding: 0.4rem 0.6rem;
            font-size: 0.75rem; cursor: pointer; border-bottom: 1px solid var(--border-subtle);
            transition: var(--transition); color: var(--text-main);
        }
        .mention-item:hover, .mention-item.selected { background: var(--primary-light); color: var(--primary); }
        .mention-item img { width: 20px; height: 20px; border-radius: 50%; object-fit: cover; }

        .comment-form { display: flex; gap: 0.5rem; align-items: center; position: relative; }
        .comment-form-avatar { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; border: 1px solid var(--border-subtle); flex-shrink: 0; }
        .comment-input-wrapper { flex: 1; display: flex; align-items: center; background: #fff; border: 1px solid var(--border-medium); border-radius: var(--radius-full); padding: 0.15rem 0.15rem 0.15rem 0.65rem; transition: var(--transition); position: relative; }
        .comment-input-wrapper:focus-within { border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
        .comment-input { flex: 1; background: transparent; font-size: 0.75rem; color: var(--text-main); height: 28px; }
        .comment-submit-btn { width: 28px; height: 28px; border-radius: 50%; background: var(--primary); color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); flex-shrink: 0; }
        .comment-submit-btn:hover { background: var(--primary-dark); transform: scale(1.05); }

        /* MODAL BUAT POSTINGAN */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(3px);
            z-index: 9999; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.2s ease; padding: 1rem;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            background: #fff; width: 100%; max-width: 480px; border-radius: var(--radius-lg);
            padding: 1.25rem; transform: translateY(15px); transition: all 0.2s ease; box-shadow: var(--shadow-lg);
            max-height: 90vh; overflow-y: auto;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; padding-bottom: 0.65rem; border-bottom: 1px solid var(--border-subtle); }
        .modal-header h3 { font-size: 0.95rem; font-weight: 800; color: var(--text-main); }
        .close-modal { background: var(--bg-body); width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 0.85rem; color: var(--text-muted); cursor: pointer; transition: var(--transition); border: none; }
        .close-modal:hover { background: #fef2f2; color: #ef4444; }
        
        .form-group { margin-bottom: 0.85rem; }
        .form-control {
            width: 100%; padding: 0.5rem 0.75rem; border: 1px solid var(--border-medium);
            border-radius: var(--radius-sm); font-size: 0.8rem; background: var(--bg-body); color: var(--text-main); transition: var(--transition);
        }
        .form-control:focus { background: #fff; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }
        
        .loader-container { text-align: center; padding: 2rem; color: var(--text-muted); font-size: 0.85rem; }

        /* SCROLLBAR CUSTOM */
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        /* UPLOAD FOTO CSS BARU */
        .image-upload-wrapper { display: flex; flex-direction: column; gap: 0.5rem; margin-top: 0.5rem; }
        .image-upload-label { 
            display: inline-flex; align-items: center; gap: 0.4rem; padding: 0.4rem 0.8rem; 
            border: 1px dashed var(--border-medium); border-radius: var(--radius-sm); 
            color: var(--text-muted); cursor: pointer; font-size: 0.75rem; font-weight: 600; 
            transition: var(--transition); width: fit-content;
        }
        .image-upload-label:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .image-preview-container { position: relative; display: none; width: 100%; margin-top: 0.5rem; }
        .image-preview-container img { width: 100%; max-height: 250px; object-fit: cover; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
        .remove-image-btn { 
            position: absolute; top: 0.5rem; right: 0.5rem; background: rgba(15, 23, 42, 0.7); 
            color: #fff; border-radius: 50%; width: 24px; height: 24px; display: flex; 
            align-items: center; justify-content: center; cursor: pointer; border: none; font-size: 0.7rem; 
        }
        .post-image { width: 100%; max-height: 350px; object-fit: cover; border-radius: var(--radius-sm); margin-bottom: 0.65rem; border: 1px solid var(--border-subtle); }

        /* --- MODE FOKUS & BLUR --- */
        body.forum-focus-mode header,
        body.forum-focus-mode .forum-header,
        body.forum-focus-mode .create-post-box,
        body.forum-focus-mode .post-card:not(.focused-card) {
            filter: blur(5px);
            opacity: 0.35;
            pointer-events: none;
            user-select: none;
            transition: all 0.3s ease;
        }
        .post-card.focused-card {
            position: relative;
            z-index: 9999;
            transform: scale(1.02);
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.25);
            border-color: var(--primary);
            transition: all 0.3s ease;
        }
        .focus-backdrop {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(15, 23, 42, 0.4);
            backdrop-filter: blur(2px);
            z-index: 9998;
            display: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        body.forum-focus-mode .focus-backdrop {
            display: block;
            opacity: 1;
        }

        @media (max-width: 768px) {
            .container { padding: 0 0.5rem; }
            .forum-header { padding: 0.85rem 0; margin-bottom: 0.85rem; }
            .create-post-box { margin-bottom: 0.85rem; }
            .post-card { border-radius: var(--radius-md); }
        }
    </style>
</head>
<body>

    <!-- BACKDROP MODE FOKUS -->
    <div class="focus-backdrop" id="focusBackdrop" onclick="exitFocusMode()"></div>

    <!-- NAVBAR -->
    <header id="navbar">
        <div class="nav-container">
            <a href="https://sitenexs.com/" class="logo">
                <img src="https://sitenexs.com/assets/logo/logo.png" alt="Sitenexs Logo" onerror="this.src='https://ui-avatars.com/api/?name=Sitenexs&background=2563eb&color=fff'">
                <!-- TEKS SITENEXS DENGAN GRADIEN -->
                <span class="logo-text-gradient">Sitenexs</span>
            </a>
            <div class="nav-actions">
                <a href="https://sitenexs.com/" class="btn btn-secondary btn-sm"><i class="fas fa-home"></i> Beranda</a>
                <!-- TOMBOL PROFIL MENGARAH KE ACCOUNT SITENEXS PROFILE -->
                <a href="https://account.sitenexs.com/profile" id="authNavBtn" class="nav-profile-btn">
                    <img id="navUserAvatar" src="https://ui-avatars.com/api/?name=User&background=cbd5e1&color=fff" alt="Profil" class="nav-profile-img">
                    <span id="navUserName">Profil</span>
                </a>
            </div>
        </div>
    </header>

    <!-- HEADER FORUM -->
    <div class="forum-header">
        <div class="forum-header-content">
            <div class="forum-header-text">
                <h1></h1>

        function playLikeSound(isLiked) {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();

                osc.type = 'sine';
                if (isLiked) {
                    osc.frequency.setValueAtTime(450, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.12);
                } else {
                    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(350, audioCtx.currentTime + 0.12);
                }

                gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.15);

                osc.connect(gainNode);
                gainNode.connect(audioCtx.destination);

                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } catch (e) {
                console.log("Audio Web API tidak didukung:", e);
            }
        }

            if (e.target.closest('.comment-item.focused-comment')) return;

            if (e.target.closest('button, input, textarea, a, .post-actions, .mention-dropdown')) {
                if ((document.body.classList.contains('forum-focus-mode') && !e.target.closest('.post-card.focused-card')) ||

                exitFocusMode();
                return;
            }

            const commentItem = e.target.closest('.comment-item');
            if (commentItem) {
                startX = e.clientX;
                startY = e.clientY;
                pressTimer = setTimeout(() => {
                    activateCommentFocusMode(commentItem);

                return;
            }

            const card = e.target.closest('.post-card');
            if (!card) {
                exitFocusMode();
                return;
            }

            startX = e.clientX;
            startY = e.clientY;
            pressTimer = setTimeout(() => {
                activateFocusMode(card);
            }, 600);
        });

        document.addEventListener('pointermove', (e) => {
            if (!pressTimer) return;
            if (Math.abs(e.clientX - startX) > 10 || Math.abs(e.clientY - startY) > 10) {
                clearTimeout(pressTimer);
                pressTimer = null;
            }
        });

        document.addEventListener('pointerup', () => {

        function timeAgo(date) {
            if (!date) return 'Baru saja';
            const seconds = Math.floor((new Date() - date) / 1000);
            let interval = seconds / 31536000;
            if (interval > 1) return Math.floor(interval) + "th lalu";
            interval = seconds / 2592000;
            if (interval > 1) return Math.floor(interval) + "bln lalu";
            interval = seconds / 86400;
            if (interval > 1) return Math.floor(interval) + "hr lalu";
            interval = seconds / 3600;
            if (interval > 1) return Math.floor(interval) + "j lalu";
            interval = seconds / 60;
            if (interval > 1) return Math.floor(interval) + "m lalu";
            return "Baru saja";
        }

                let cVerified = '';
                if (c.isVerified === true || String(c.isVerified) === 'true') {
                    cVerified = `<img src="https://sitenexs.com/assets/logo/verified.png" class="member-verification-icon" alt="Verified">`;
                } else {
                    cVerified = `<span class="async-verif-badge" data-uid="${cAuthorUid}"></span>`;
                }

                const formattedText = formatCommentText(c.isi);
                const isMyComment = (cAuthorUid === currentActiveUid);
                const deleteBtnHtml = isMyComment ? `<button type="button" class="delete-comment-btn" onclick="deleteComment('${postId}', '${c.createdAt}', '${cAuthorUid}')">Hapus</button>` : '';

                commentsHtml += `
                    <div class="comment-item">
                        <a href="https://sitenexs.com/community/profile?uid=${encodeURIComponent(cAuthorUid)}" style="flex-shrink: 0;">
                            <img src="${cAvatar}" alt="${c.penulis}" class="comment-avatar" onerror="this.onerror=null; this.src='${cFallback}';">
                        </a>
                        <div class="comment-content-wrapper">
                            <div class="comment-bubble">
                                <div class="comment-header-row">
                                    <div class="comment-author-left">
                                        <a href="https://sitenexs.com/community/profile?uid=${encodeURIComponent(cAuthorUid)}" class="comment-author-link">
                                            <span class="comment-author">${c.penulis}</span>
                                        </a>
                                        ${cVerified}
                                    </div>
                                </div>
                                <div class="comment-text">${formattedText}</div>
                            </div>
                            <div class="comment-footer-row">
                                <div class="comment-time">${cDate}</div>
                                <button type="button" class="reply-trigger-btn" onclick="replyComment('${postId}', '${c.penulis.replace(/'/g, "\\'")}')">Balas</button>
                                ${deleteBtnHtml}
                            </div>
                        </div>
                    </div>
                `;
            });

            if (comments.length === 0) {
                commentsHtml = '<div style="font-size: 0.75rem; color: var(--text-muted); text-align: center; padding: 0.5rem 0;">Belum ada komentar. Jadilah yang pertama membalas!</div>';
            }

            return `
                <article class="post-card" data-post-id="${postId}">
                    <div class="post-card-inner">
                        <div class="post-header">
                            <div class="post-author">
                                <img src="${authorPhoto}" alt="${data.penulis}" class="post-author-img" onerror="this.onerror=null; this.src='${authorFallback}';">
                                <div class="author-info">
                                    <div class="author-name-row">
                                        <a href="https://sitenexs.com/community/profile?uid=${encodeURIComponent(data.authorUid)}" class="author-name-link">
                                            <span class="author-name">${data.penulis}</span>
                                        </a>
                                        ${verifiedIcon}
                                    </div>
                                    <div class="author-time">${waktuString}</div>
                                </div>
                            </div>
                            ${badgeHtml}
                        </div>
                        
                        ${postTitleHtml}
                        <p class="post-content">${data.isi}</p>
                        ${postImageHtml}
                    </div>
                    
                    <div class="post-actions">
                        <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${postId}')">
                            <i class="${isLiked ? 'fas' : 'far'} fa-thumbs-up"></i> <span>${likeCount > 0 ? likeCount : ''} Suka</span>
                        </button>
                        <button class="action-btn" onclick="toggleComments('${postId}')">
                            <i class="far fa-comment-alt"></i> <span>${comments.length > 0 ? comments.length : ''} Komentar</span>
                        </button>
                    </div>

                    <div class="comments-section" id="comments-${postId}">
                        <div class="comment-list">
                            ${commentsHtml}
                        </div>
                        <form class="comment-form" onsubmit="submitComment(event, '${postId}')">
                            <img src="${activeAvatarUrl}" class="comment-form-avatar" onerror="this.onerror=null; this.src='${activeFallback}';">
                            <div class="comment-input-wrapper">
                                <input type="text" id="comment-input-${postId}" class="comment-input" placeholder="Tulis komentar atau ketik @..." oninput="handleCommentInput(event, '${postId}')" required>
                                <div class="mention-dropdown" id="mention-dropdown-${postId}"></div>
                                <button type="submit" class="comment-submit-btn"><i class="fas fa-paper-plane" style="font-size: 0.7rem;"></i></button>
                            </div>
                        </form>
                    </div>
                </article>
            `;
        }

        function runAsyncVerifBadges() {
            setTimeout(() => {
                document.querySelectorAll('.async-verif-badge').forEach(async (el) => {
                    const uid = el.getAttribute('data-uid');
                    if (!uid || uid === 'unknown' || el.innerHTML !== '') return;
                    
                    if (userVerifCache[uid] === undefined) {
                        try {
                            const snap = await getDoc(doc(db, "users", uid));
                            if (snap.exists()) {
                                const d = snap.data();
                                userVerifCache[uid] = Boolean(d.isVerified) || Boolean(d.isFounder) || Boolean(d.isDeveloper);
                            } else {
                                userVerifCache[uid] = false;
                            }
                        } catch(e) {
                            userVerifCache[uid] = false;
                        }
                    }
                    
                    if (userVerifCache[uid]) {
                        el.innerHTML = `<img src="https://sitenexs.com/assets/logo/verified.png" class="member-verification-icon" alt="Verified">`;
                    }
                    el.classList.remove('async-verif-badge');
                });
            }, 100);
        }

        // --- REALTIME RENDER FORUM POSTS (SMART DOM PATCHING) ---
        const q = query(forumCollection, orderBy("createdAt", "desc"));
        onSnapshot(q, (snapshot) => {
            if (snapshot.empty) {
                postContainer.innerHTML = '<div class="loader-container"><p>Belum ada diskusi. Jadilah yang pertama memulai!</p></div>';
                isInitialLoad = false;
                return;
            }

            const currentActiveUid = currentUserData ? currentUserData.uid : localStorage.getItem('sitenexs_uid');

            if (isInitialLoad) {
                let htmlString = "";
                snapshot.forEach((docSnap) => {
                    htmlString += renderPostCardHtml(docSnap, currentActiveUid);
                });
                postContainer.innerHTML = htmlString;
                isInitialLoad = false;
                runAsyncVerifBadges();
                return;
            }

            const existingCards = {};
            document.querySelectorAll('.post-card').forEach(card => {
                existingCards[card.getAttribute('data-post-id')] = card;
            });

            const currentSnapshotIds = new Set();
            const tempDiv = document.createElement('div');

            snapshot.forEach((docSnap) => {
                const postId = docSnap.id;
                currentSnapshotIds.add(postId);
                const data = docSnap.data();
                const existingCard = existingCards[postId];

                const likes = data.likes || [];
                const isLiked = likes.includes(currentActiveUid);
                const likeCount = likes.length;
                const comments = data.comments || [];

                if (existingCard) {
                    const likeBtn = existingCard.querySelector('.action-btn');
                    if (likeBtn && document.activeElement !== likeBtn) {
                        if (isLiked) {
                            likeBtn.classList.add('liked');
                            likeBtn.querySelector('i').className = 'fas fa-thumbs-up';
                        } else {
                            likeBtn.classList.remove('liked');
                            likeBtn.querySelector('i').className = 'far fa-thumbs-up';
                        }
                        likeBtn.querySelector('span').innerText = `${likeCount > 0 ? likeCount : ''} Suka`;
                    }

                    const commentBtn = existingCard.querySelectorAll('.action-btn')[1];
                    if (commentBtn) {
                        commentBtn.querySelector('span').innerText = `${comments.length > 0 ? comments.length : ''} Komentar`;
                    }

                    const commentsListEl = existingCard.querySelector('.comment-list');
                    if (commentsListEl) {
                        let commentsHtml = '';
                        comments.forEach(c => {
                            const cDate = c.createdAt ? timeAgo(new Date(c.createdAt)) : 'Baru saja';
                            const cAuthorUid = c.authorUid || 'unknown';
                            const cAvatar = `${supabaseUrl}/storage/v1/object/public/${avatarBucket}/${encodeURIComponent(cAuthorUid)}/profile-photo`;
                            const cFallback = `https://ui-avatars.com/api/?name=${encodeURIComponent(c.penulis)}&background=random&color=fff`;
                            
                            let cVerified = '';
                            if (c.isVerified === true || String(c.isVerified) === 'true') {
                                cVerified = `<img src="https://sitenexs.com/assets/logo/verified.png" class="member-verification-icon" alt="Verified">`;
                            } else {
                                cVerified = `<span class="async-verif-badge" data-uid="${cAuthorUid}"></span>`;
                            }

                            const formattedText = formatCommentText(c.isi);
                            const isMyComment = (cAuthorUid === currentActiveUid);
                            const deleteBtnHtml = isMyComment ? `<button type="button" class="delete-comment-btn" onclick="deleteComment('${postId}', '${c.createdAt}', '${cAuthorUid}')">Hapus</button>` : '';

                            commentsHtml += `
                                <div class="comment-item">
                                    <a href="https://sitenexs.com/community/profile?uid=${encodeURIComponent(cAuthorUid)}" style="flex-shrink: 0;">
                                        <img src="${cAvatar}" alt="${c.penulis}" class="comment-avatar" onerror="this.onerror=null; this.src='${cFallback}';">
                                    </a>
                                    <div class="comment-content-wrapper">
                                        <div class="comment-bubble">
                                            <div class="comment-header-row">
                                                <div class="comment-author-left">
                                                    <a href="https://sitenexs.com/community/profile?uid=${encodeURIComponent(cAuthorUid)}" class="comment-author-link">
                                                        <span class="comment-author">${c.penulis}</span>
                                                    </a>
                                                    ${cVerified}
                                                </div>
                                            </div>
                                            <div class="comment-text">${formattedText}</div>
                                        </div>
                                        <div class="comment-footer-row">
                                            <div class="comment-time">${cDate}</div>
                                            <button type="button" class="reply-trigger-btn" onclick="replyComment('${postId}', '${c.penulis.replace(/'/g, "\\'")}')">Balas</button>
                                            ${deleteBtnHtml}
                                        </div>
                                    </div>
                                </div>
                            `;
                        });
                        if (comments.length === 0) {
                            commentsHtml = '<div style="font-size: 0.75rem; color: var(--text-muted); text-align: center; padding: 0.5rem 0;">Belum ada komentar. Jadilah yang pertama membalas!</div>';
                        }
                        commentsListEl.innerHTML = commentsHtml;
                    }
                } else {
                    tempDiv.innerHTML = renderPostCardHtml(docSnap, currentActiveUid);
                    const newCard = tempDiv.firstElementChild;
                    postContainer.insertBefore(newCard, postContainer.firstChild);
                }
            });

            Object.keys(existingCards).forEach(postId => {
                if (!currentSnapshotIds.has(postId)) {
                    existingCards[postId].remove();
                }
            });

            runAsyncVerifBadges();

        }, (error) => {
            console.error("Gagal memuat post:", error);
            postContainer.innerHTML = '<div class="loader-container"><p style="color:red;">Gagal memuat forum diskusi.</p></div>';
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const savedUid = localStorage.getItem('sitenexs_uid');
            const isLogged = localStorage.getItem('sitenexs_logged_in') === 'true';

            if (!currentUserData && (auth.currentUser || savedUid)) {
                await fetchUserProfile(auth.currentUser ? auth.currentUser.uid : savedUid);
            }

            if (!currentUserData && !auth.currentUser && !isLogged && !savedUid) {
                window.location.href = "https://account.sitenexs.com/sign-in/";
                return;
            }

            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();

            // HANYA ISI POSTINGAN YANG WAJIB
            if (!content) return;

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
            submitBtn.disabled = true;

            try {
                let imageUrl = null;
                const fileInput = document.getElementById('postImage');
                const file = fileInput.files[0];

                if (file) {
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengunggah Foto...';
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.floor(Math.random()*1000)}.${fileExt}`;
                    
                    const uploadRes = await fetch(`${supabaseUrl}/storage/v1/object/${forumBucket}/${fileName}`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${supabaseKey}`,
                            'apikey': supabaseKey,
                            'Content-Type': file.type
                        },
                        body: file
                    });
                    
                    if (uploadRes.ok) {
                        imageUrl = `${supabaseUrl}/storage/v1/object/public/${forumBucket}/${fileName}`;
                    } else {
                        console.error("Gagal upload gambar, tapi post akan dilanjutkan.", await uploadRes.text());
                    }
                }

                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';

                const activeUser = currentUserData || auth.currentUser;
                const uidVal = activeUser ? activeUser.uid : savedUid;
                const nameVal = activeUser ? activeUser.nama : "Mitra Sitenexs";
                const verifiedVal = currentUserData ? Boolean(currentUserData.isVerified) : false;

                await addDoc(forumCollection, {
                    authorUid: uidVal,
                    penulis: nameVal,
                    isVerified: verifiedVal,
                    judul: title,
                    isi: content,
                    imageUrl: imageUrl,
                    likes: [],
                    comments: [],
                    createdAt: serverTimestamp()
                });

                form.reset();
                removeImage();
                closeModal();
                fetchAllUsersForMention();
            } catch (error) {
                console.error("Gagal mengirim postingan:", error);
                alert("Terjadi kesalahan saat memposting.");
            } finally {
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Posting';
                submitBtn.disabled = false;
            }
        });

        window.filterPosts = function() {
            const input = document.getElementById('searchInput').value.toLowerCase();
            const cards = document.querySelectorAll('.post-card');
            cards.forEach(card => {
                const titleEl = card.querySelector('.post-title');
                const title = titleEl ? titleEl.innerText.toLowerCase() : '';
                const content = card.querySelector('.post-content').innerText.toLowerCase();
                card.style.display = (title.includes(input) || content.includes(input)) ? 'block' : 'none';
            });
        }
    </script>
</body>
</html>
