<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Buat Diskusi Baru — Komunitas Sitenexs</title>
    <meta name="description" content="Tulis pertanyaan, diskusi, atau pengumuman baru di forum komunitas Sitenexs.">

    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --bg-alt: #f1f5f9;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --border-accent: #93c5fd;
            --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 12px -2px rgba(15, 23, 42, 0.08);
            --radius-sm: 0.375rem;
            --radius-md: 0.625rem;
            --radius-lg: 1rem;
            --radius-full: 9999px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        body[data-package="pro"] {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #f0f9ff;
            --border-accent: #38bdf8;
        }

        body[data-package="vip"],
        body[data-package="ultimate"],
        body[data-package="premium"] {
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --primary-light: #f5f3ff;
            --border-accent: #c084fc;
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; font-size: 15px; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            line-height: 1.45;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        a { text-decoration: none; color: inherit; }
        button, input, textarea { font-family: inherit; outline: none; border: none; }

        .active-call-banner {
            display: none; width: 100%; max-width: 680px; margin: 0.5rem auto 0;
            align-items: center; justify-content: space-between; gap: 0.75rem;
            padding: 0.55rem 1rem; background: linear-gradient(90deg, #059669 0%, #10b981 100%);
            color: #ffffff; border-radius: var(--radius-md); font-size: 0.8rem; font-weight: 700; cursor: pointer;
        }
        .active-call-banner.active { display: flex; }
        .active-call-banner-left { display: flex; align-items: center; gap: 0.55rem; min-width: 0; }
        .active-call-pulse {
            width: 8px; height: 8px; border-radius: 50%; background: #ffffff; flex-shrink: 0;
            animation: callBannerPulse 1.3s infinite ease-in-out;
        }
        @keyframes callBannerPulse { 0%, 100% { transform: scale(1); opacity: 1; } 50% { transform: scale(1.45); opacity: 0.55; } }
        .active-call-banner-text { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .active-call-banner-cta {
            display: inline-flex; align-items: center; gap: 0.3rem;
            background: rgba(255, 255, 255, 0.22); padding: 0.24rem 0.65rem;
            border-radius: var(--radius-full); font-size: 0.72rem; font-weight: 800; flex-shrink: 0;
        }

        .create-page-wrapper {
            width: 100%; max-width: 680px; margin: 1rem auto 4rem; padding: 0 1rem;
            display: flex; flex-direction: column; gap: 0.9rem;
        }

        .top-bar { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }

        .back-link {
            display: inline-flex; align-items: center; gap: 0.45rem; font-size: 0.8rem; font-weight: 700;
            color: var(--text-muted); background: var(--bg-card); border: 1px solid var(--border-subtle);
            padding: 0.45rem 0.85rem; border-radius: var(--radius-full); box-shadow: var(--shadow-sm);
            transition: var(--transition);
        }
        .back-link:hover { color: var(--primary); border-color: var(--border-accent); }

        .composer-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg); padding: 1.15rem; box-shadow: var(--shadow-sm);
        }

        .composer-header {
            display: flex; align-items: center; gap: 0.65rem;
            padding-bottom: 0.85rem; margin-bottom: 0.95rem; border-bottom: 1px solid var(--border-subtle);
        }
        .composer-avatar {
            width: 38px; height: 38px; border-radius: 50%; object-fit: cover;
            border: 1px solid var(--border-subtle); flex-shrink: 0;
        }
        .composer-author-name { font-size: 0.88rem; font-weight: 800; color: var(--text-main); }
        .composer-subtitle { font-size: 0.72rem; color: var(--text-muted); }

        .form-group { margin-bottom: 0.85rem; }
        .form-control {
            width: 100%; padding: 0.6rem 0.8rem; border: 1px solid var(--border-medium);
            border-radius: var(--radius-md); font-size: 0.82rem; background: var(--bg-body);
            color: var(--text-main); transition: var(--transition);
        }
        .form-control:focus { background: #ffffff; border-color: var(--primary); box-shadow: 0 0 0 2px var(--primary-light); }

        .image-upload-wrapper { display: flex; flex-direction: column; gap: 0.5rem; }
        .image-upload-label {
            display: inline-flex; align-items: center; gap: 0.45rem; padding: 0.5rem 0.85rem;
            border: 1px dashed var(--border-medium); border-radius: var(--radius-md);
            color: var(--text-muted); cursor: pointer; font-size: 0.78rem; font-weight: 700;
            transition: var(--transition); width: fit-content;
        }
        .image-upload-label:hover { border-color: var(--primary); color: var(--primary); background: var(--primary-light); }
        .image-preview-container { position: relative; display: none; width: 100%; margin-top: 0.35rem; }
        .image-preview-container img { width: 100%; max-height: 280px; object-fit: cover; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); }
        .remove-image-btn {
            position: absolute; top: 0.5rem; right: 0.5rem; background: rgba(15, 23, 42, 0.75);
            color: #fff; border-radius: 50%; width: 26px; height: 26px; display: flex;
            align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem;
        }

        .promote-modal-box {
            margin-top: 0.75rem; padding: 0.8rem; border-radius: var(--radius-md);
            border: 1px solid var(--border-accent); background: var(--primary-light);
        }
        .promote-toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 0.6rem; cursor: pointer; }
        .promote-toggle-left { display: flex; align-items: center; gap: 0.55rem; }
        .promote-toggle-title { font-size: 0.8rem; font-weight: 800; color: var(--text-main); }
        .promote-toggle-sub { font-size: 0.7rem; color: var(--text-muted); margin-top: 0.1rem; }
        .promote-checkbox { width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; flex-shrink: 0; }
        .promote-plans-container { display: none; margin-top: 0.7rem; padding-top: 0.7rem; border-top: 1px dashed var(--border-accent); }
        .promote-plans-container.active { display: block; }
        .promote-plans-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
        @media (max-width: 480px) { .promote-plans-grid { grid-template-columns: 1fr; } }

        .promote-plan-option {
            position: relative; display: flex; flex-direction: column; align-items: center;
            text-align: center; padding: 0.55rem 0.4rem; border-radius: var(--radius-sm);
            border: 1.5px solid var(--border-medium); background: #ffffff; cursor: pointer; transition: var(--transition);
        }
        .promote-plan-option input { position: absolute; opacity: 0; pointer-events: none; }
        .promote-plan-option.selected { border-color: var(--primary); background: #eff6ff; box-shadow: 0 2px 8px rgba(37, 99, 235, 0.15); }
        .promote-plan-duration { font-size: 0.74rem; font-weight: 800; color: var(--text-main); }
        .promote-plan-price { font-size: 0.7rem; font-weight: 700; color: var(--primary); margin-top: 0.15rem; }

        .composer-actions {
            display: flex; justify-content: flex-end; gap: 0.6rem; margin-top: 1.1rem;
            padding-top: 0.85rem; border-top: 1px solid var(--border-subtle);
        }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
            padding: 0.62rem 1.2rem; font-size: 0.82rem; font-weight: 700;
            border-radius: var(--radius-full); cursor: pointer; transition: var(--transition);
        }
        .btn-secondary { background: #fff; border: 1px solid var(--border-medium); color: var(--text-main); }
        .btn-primary {
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
        }
        .btn-primary:disabled { opacity: 0.65; cursor: not-allowed; }

        #toastContainer {
            position: fixed; bottom: 20px; right: 20px; z-index: 10000;
            display: flex; flex-direction: column; gap: 0.5rem; max-width: 320px; width: 100%; pointer-events: none;
        }
        .toast {
            background: #0f172a; color: #fff; padding: 0.75rem 1rem; border-radius: var(--radius-md);
            font-size: 0.8rem; font-weight: 600; box-shadow: var(--shadow-md);
            display: flex; align-items: center; gap: 0.6rem; pointer-events: auto;
        }
        .toast.success { background: #065f46; border-left: 4px solid #10b981; }
        .toast.error { background: #7f1d1d; border-left: 4px solid #ef4444; }
    </style>
</head>
<body data-package="basic">

    <div id="toastContainer"></div>
    <header id="navbar"></header>

    <div id="activeCallBanner" class="active-call-banner" role="button" tabindex="0">
        <div class="active-call-banner-left">
            <span class="active-call-pulse"></span>
            <i id="activeCallBannerIcon" class="fas fa-phone-alt"></i>
            <span id="activeCallBannerText" class="active-call-banner-text">Dalam panggilan...</span>
        </div>
        <span class="active-call-banner-cta">
            <span>Masuk</span>
            <i class="fas fa-chevron-right"></i>
        </span>
    </div>

    <main class="create-page-wrapper">
        <div class="top-bar">
            <a href="https://sitenexs.com/community/" class="back-link">
                <i class="fas fa-arrow-left"></i>
                <span>Kembali ke Forum</span>
            </a>
        </div>

        <section class="composer-card">
            <div class="composer-header">
                <img id="composerAvatar" src="https://ui-avatars.com/api/?name=User&background=cbd5e1&color=fff" alt="User" class="composer-avatar">
                <div>
                    <div class="composer-author-name" id="composerAuthorName">Memuat profil...</div>
                    <div class="composer-subtitle">Buat diskusi baru di Komunitas Sitenexs</div>
                </div>
            </div>

            <form id="createPostForm">
                <div class="form-group">
                    <input type="text" id="postTitle" class="form-control" placeholder="Judul Diskusi (Opsional)" style="font-weight: 700;">
                </div>

                <div class="form-group">
                    <textarea id="postContent" class="form-control" rows="5" placeholder="Jelaskan pertanyaan atau bagikan pemikiran Anda secara detail..." required></textarea>
                </div>

                <div class="form-group image-upload-wrapper">
                    <input type="file" id="postImage" accept="image/*" style="display: none;" onchange="previewImage(event)">
                    <label for="postImage" class="image-upload-label"><i class="fas fa-image"></i> Tambah Foto (Opsional)</label>
                    <div class="image-preview-container" id="imagePreviewContainer">
                        <img id="imagePreview" src="" alt="Preview Foto">
                        <button type="button" class="remove-image-btn" onclick="removeImage()"><i class="fas fa-times"></i></button>
                    </div>
                </div>

                <div class="form-group promote-modal-box">
                    <label class="promote-toggle-row" for="promoteOnCreateCheckbox">
                        <div class="promote-toggle-left">
                            <i class="fas fa-bullhorn text-primary" style="font-size: 0.95rem;"></i>
                            <div>
                                <div class="promote-toggle-title">Jadikan Iklan / Promosikan Postingan</div>
                                <div class="promote-toggle-sub">Lanjut ke pembayaran iklan setelah postingan dibuat</div>
                            </div>
                        </div>
                        <input type="checkbox" id="promoteOnCreateCheckbox" class="promote-checkbox" onchange="togglePromoteOptions()">
                    </label>
                    <div class="promote-plans-container" id="promotePlansContainer">
                        <div class="promote-plans-grid">
                            <label class="promote-plan-option selected" onclick="selectPromotePlan(this)">
                                <input type="radio" name="promotePlan" value="1d" checked>
                                <span class="promote-plan-duration">1 Hari</span>
                                <span class="promote-plan-price">Rp 15.000</span>
                            </label>
                            <label class="promote-plan-option" onclick="selectPromotePlan(this)">
                                <input type="radio" name="promotePlan" value="3d">
                                <span class="promote-plan-duration">3 Hari</span>
                                <span class="promote-plan-price">Rp 39.000</span>
                            </label>
                            <label class="promote-plan-option" onclick="selectPromotePlan(this)">
                                <input type="radio" name="promotePlan" value="7d">
                                <span class="promote-plan-duration">7 Hari</span>
                                <span class="promote-plan-price">Rp 79.000</span>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="composer-actions">
                    <a href="https://sitenexs.com/community/" class="btn btn-secondary">Batal</a>
                    <button type="submit" class="btn btn-primary" id="submitPostBtn">
                        <i class="fas fa-paper-plane"></i> Posting
                    </button>
                </div>
            </form>
        </section>
    </main>

    <script type="module">
        import { onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';
        import { doc, setDoc, collection, addDoc, serverTimestamp, getDocs } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';

        import {
            db,
            rtdb,
            auth,
            supabaseUrl,
            PUSH_WORKER_URL
        } from 'https://sitenexs.com/assets/js/sitenexs-config.js';

        import {
            fetchUserProfile as fetchNormalizedUserProfile,
            getUserAvatarUrl
        } from 'https://sitenexs.com/assets/js/sitenexs-user-data.js';

        import {
            mountSitenexsNavbar,
            setNavbarUserProfile
        } from 'https://sitenexs.com/assets/js/sitenexs-navbar.js';

        import {
            sendPushNotification
        } from 'https://sitenexs.com/assets/js/sitenexs-push-client.js';

        import {
            DEFAULT_CALL_PAGE_URL,
            attachForcedIncomingCallRedirect,
            attachOngoingCallBanner
        } from 'https://sitenexs.com/assets/js/sitenexs-call-presence.js';

        const supabaseKey = 'sb_publishable_XKHXYrEw2EDdfYH17Uyx6w_k_BtGLQa';
        const forumBucket = 'forum-photos';
        const AD_PAYMENT_BASE_URL = 'https://sitenexs.com/community/ads/';
        const COMMUNITY_HOME_URL = 'https://sitenexs.com/community/';
        const forumCollection = collection(db, "forum_posts");

        let currentUserData = null;
        let allRegisteredUsers = [];
        let cleanupIncomingRedirect = null;
        let cleanupOngoingBanner = null;

        const form = document.getElementById('createPostForm');
        const submitBtn = document.getElementById('submitPostBtn');
        const composerAvatar = document.getElementById('composerAvatar');
        const composerAuthorName = document.getElementById('composerAuthorName');

        window.showToast = function(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if (!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `<i class="fas ${type === 'error' ? 'fa-exclamation-circle' : 'fa-check-circle'}"></i> <span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => toast.remove(), 3000);
        };

        mountSitenexsNavbar({
            targetSelector: '#navbar',
            onSelectNotif: ({ postId }) => {
                if (postId) {
                    window.location.href = `${COMMUNITY_HOME_URL}?post=${encodeURIComponent(postId)}`;
                }
            }
        });

        window.buildAdPaymentUrl = function(postId, plan = '') {
            const url = new URL(AD_PAYMENT_BASE_URL);
            if (postId) url.searchParams.set('post', postId);
            if (plan) url.searchParams.set('plan', plan);
            return url.toString();
        };

        window.togglePromoteOptions = function() {
            const checkbox = document.getElementById('promoteOnCreateCheckbox');
            const plansBox = document.getElementById('promotePlansContainer');
            if (!checkbox || !plansBox) return;
            if (checkbox.checked) {
                plansBox.classList.add('active');
                submitBtn.innerHTML = '<i class="fas fa-bullhorn"></i> Posting & Lanjut Bayar';
            } else {
                plansBox.classList.remove('active');
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Posting';
            }
        };

        window.selectPromotePlan = function(labelEl) {
            document.querySelectorAll('.promote-plan-option').forEach(el => el.classList.remove('selected'));
            labelEl.classList.add('selected');
            const radio = labelEl.querySelector('input[type="radio"]');
            if (radio) radio.checked = true;
        };

        window.previewImage = function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('imagePreview').src = e.target.result;
                    document.getElementById('imagePreviewContainer').style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        };

        window.removeImage = function() {
            document.getElementById('postImage').value = '';
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('imagePreview').src = '';
        };

        async function fetchAllUsersForMention() {
            try {
                const usersSnap = await getDocs(collection(db, "users"));
                allRegisteredUsers = [];
                usersSnap.forEach(dSnap => {
                    const d = dSnap.data();
                    const name = d.namaLengkap || (d.namaDepan + (d.namaBelakang ? ' ' + d.namaBelakang : '')) || "Mitra";
                    allRegisteredUsers.push({ uid: dSnap.id, nama: name });
                });
            } catch (err) {
                console.warn('Gagal mengambil pengguna:', err);
            }
        }
        fetchAllUsersForMention();

        function extractMentionedUsers(text, excludeUid = '') {
            if (!text || !allRegisteredUsers.length) return [];
            const matched = [];
            const seenUids = new Set();
            const sortedUsers = [...allRegisteredUsers].sort((a, b) => b.nama.length - a.nama.length);
            for (const u of sortedUsers) {
                if (!u.uid || u.uid === excludeUid || seenUids.has(u.uid)) continue;
                const cleanName = String(u.nama || '').trim();
                if (!cleanName) continue;
                const escaped = cleanName.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
                const regex = new RegExp(`@${escaped}(?=\\s|$|[.,!?;:])`, 'i');
                if (regex.test(text)) {
                    seenUids.add(u.uid);
                    matched.push(u);
                }
            }
            return matched;
        }

        async function saveNotificationToFirestore(targetUid, { id, kind, title, sub, postId }) {
            if (!targetUid) return;
            try {
                const notifId = id || `notif_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
                await setDoc(
                    doc(db, 'users', targetUid, 'notifications', notifId),
                    {
                        kind: kind || 'mention',
                        title,
                        sub: sub || '',
                        postId: postId || '',
                        focusComments: false,
                        unread: true,
                        createdAt: Date.now()
                    },
                    { merge: true }
                );
            } catch (err) {
                console.warn('Gagal menyimpan notifikasi:', err);
            }
        }

        async function initComposerUser(uid, fallbackName = "Mitra Sitenexs") {
            await setNavbarUserProfile(uid);
            const profile = await fetchNormalizedUserProfile(db, uid, { forceRefresh: true });
            const namaLengkap = profile.displayName || fallbackName;
            const photoUrl = `${getUserAvatarUrl(uid)}?t=${Date.now()}`;
            const fallbackUrl = `https://ui-avatars.com/api/?name=${encodeURIComponent(namaLengkap)}&background=2563eb&color=fff`;

            currentUserData = {
                uid,
                nama: namaLengkap,
                isVerified: Boolean(profile.isVerified),
                avatar: photoUrl,
                fallbackAvatar: fallbackUrl
            };

            composerAvatar.src = photoUrl;
            composerAvatar.onerror = () => { composerAvatar.src = fallbackUrl; };
            composerAuthorName.innerText = namaLengkap;

            if (cleanupIncomingRedirect) cleanupIncomingRedirect();
            cleanupIncomingRedirect = attachForcedIncomingCallRedirect({
                rtdb,
                currentUid: uid,
                callPageUrl: DEFAULT_CALL_PAGE_URL,
                fallbackPeerName: namaLengkap
            });

            if (cleanupOngoingBanner) cleanupOngoingBanner();
            cleanupOngoingBanner = attachOngoingCallBanner({
                rtdb,
                currentUid: uid,
                bannerElement: document.getElementById('activeCallBanner'),
                textElement: document.getElementById('activeCallBannerText'),
                iconElement: document.getElementById('activeCallBannerIcon'),
                fallbackPeerName: namaLengkap,
                callPageUrl: DEFAULT_CALL_PAGE_URL
            });
        }

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                await initComposerUser(user.uid, user.displayName);
            } else {
                const savedUid = localStorage.getItem('sitenexs_uid');
                const isLogged = localStorage.getItem('sitenexs_logged_in') === 'true';
                if (isLogged && savedUid) {
                    await initComposerUser(savedUid);
                } else {
                    window.location.href = "https://account.sitenexs.com/sign-in/";
                }
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const savedUid = localStorage.getItem('sitenexs_uid');
            const activeUser = currentUserData || auth.currentUser;
            const uidVal = activeUser ? activeUser.uid : savedUid;

            if (!uidVal) {
                window.location.href = "https://account.sitenexs.com/sign-in/";
                return;
            }

            const title = document.getElementById('postTitle').value.trim();
            const content = document.getElementById('postContent').value.trim();
            const wantsAdPromotion = Boolean(document.getElementById('promoteOnCreateCheckbox')?.checked);
            const selectedPlanEl = document.querySelector('input[name="promotePlan"]:checked');
            const selectedPlan = selectedPlanEl ? selectedPlanEl.value : '1d';

            if (!content) return;

            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Memproses...';
            submitBtn.disabled = true;

            try {
                let imageUrl = null;
                const fileInput = document.getElementById('postImage');
                const file = fileInput.files[0];

                if (file) {
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Mengunggah Foto...';
                    const fileExt = file.name.split('.').pop();
                    const fileName = `${Date.now()}_${Math.floor(Math.random() * 1000)}.${fileExt}`;
                    const uploadRes = await fetch(`${supabaseUrl}/storage/v1/object/${forumBucket}/${fileName}`, {
                        method: 'POST',
                        headers: {
                            'Authorization': `Bearer ${supabaseKey}`,
                            'apikey': supabaseKey,
                            'Content-Type': file.type
                        },
                        body: file
                    });
                    if (uploadRes.ok) {
                        imageUrl = `${supabaseUrl}/storage/v1/object/public/${forumBucket}/${fileName}`;
                    }
                }

                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyimpan...';
                const nameVal = currentUserData?.nama || activeUser?.displayName || "Mitra Sitenexs";
                const verifiedVal = currentUserData ? Boolean(currentUserData.isVerified) : false;

                const createdDoc = await addDoc(forumCollection, {
                    authorUid: uidVal,
                    penulis: nameVal,
                    isVerified: verifiedVal,
                    judul: title,
                    isi: content,
                    imageUrl: imageUrl,
                    likes: [],
                    boostLikes: 0,
                    autoLikeActive: false,
                    autoLikeRate: 1,
                    autoLikeInterval: 60,
                    autoLikeStartTime: null,
                    comments: [],
                    isPrivate: false,
                    isPrioritized: false,
                    isAd: false,
                    adStatus: wantsAdPromotion ? 'pending_payment' : 'none',
                    adPlanRequested: wantsAdPromotion ? selectedPlan : null,
                    commentsDisabled: false,
                    hideStats: false,
                    createdAt: serverTimestamp()
                });

                const mentionedInPost = extractMentionedUsers(`${title} ${content}`, uidVal);
                for (const mUser of mentionedInPost) {
                    const mTitle = `${nameVal} menyebut Anda dalam postingan`;
                    await saveNotificationToFirestore(mUser.uid, {
                        id: `mention_p_${createdDoc.id}_${mUser.uid}_${Date.now()}`,
                        kind: 'mention',
                        title: mTitle,
                        sub: String(title || content).slice(0, 110),
                        postId: createdDoc.id
                    });
                    await sendPushNotification({
                        db,
                        recipientUid: mUser.uid,
                        title: 'Anda Disebut di Postingan',
                        body: `${mTitle}: "${String(title || content).slice(0, 90)}"`,
                        tag: `mention-p-${createdDoc.id}-${mUser.uid}`,
                        url: `${COMMUNITY_HOME_URL}?post=${encodeURIComponent(createdDoc.id)}`,
                        icon: getUserAvatarUrl(uidVal),
                        workerUrl: PUSH_WORKER_URL
                    });
                }

                if (wantsAdPromotion) {
                    showToast("Diskusi diposting! Mengalihkan ke pembayaran iklan...");
                    window.location.href = buildAdPaymentUrl(createdDoc.id, selectedPlan);
                    return;
                }

                showToast("Diskusi baru berhasil diposting!");
                setTimeout(() => {
                    window.location.href = `${COMMUNITY_HOME_URL}?post=${encodeURIComponent(createdDoc.id)}`;
                }, 600);
            } catch (error) {
                console.error('Gagal memposting:', error);
                showToast("Terjadi kesalahan saat memposting.", "error");
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> Posting';
                submitBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
