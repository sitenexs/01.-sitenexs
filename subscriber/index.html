<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Paket — Sitenexs</title>
    
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.07), 0 2px 4px -2px rgb(0 0 0 / 0.07);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.08), 0 4px 6px -4px rgb(0 0 0 / 0.08);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* TEMA & WARNA GRADASI BERDASARKAN PAKET */
        body[data-theme="pro"] {
            --primary: #0284c7;
            --primary-dark: #0369a1;
            --primary-light: #f0f9ff;
            --accent: #f59e0b;
        }

        body[data-theme="vip"],
        body[data-theme="ultimate"],
        body[data-theme="premium"] {
            --primary: #7c3aed;
            --primary-dark: #6d28d9;
            --primary-light: #f5f3ff;
            --accent: #fbbf24;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: var(--bg-body); 
            color: var(--text-main); 
            line-height: 1.5; 
            min-height: 100vh; 
            display: flex; 
            flex-direction: column; 
            font-size: 14px; 
            -webkit-font-smoothing: antialiased;
        }

        .container { width: 100%; max-width: 500px; margin: 0 auto; padding: 0 1rem; }
        
        header { 
            background: rgba(255, 255, 255, 0.85); 
            backdrop-filter: blur(12px); 
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle); 
            padding: 0.85rem 0; 
            position: sticky; 
            top: 0; 
            z-index: 100; 
        }

        .nav-container { display: flex; align-items: center; justify-content: space-between; }
        
        .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.1rem; color: var(--text-main); text-decoration: none; }
        .logo-img { height: 32px; width: 32px; border-radius: 50%; object-fit: cover; border: 2px solid var(--border-subtle); box-shadow: var(--shadow-sm); }
        .logo-text { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .main-content { padding: 1.75rem 0 2.5rem; flex-grow: 1; }
        
        .checkout-card { 
            background: var(--bg-card); 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-xl); 
            padding: 1.5rem; 
            box-shadow: var(--shadow-lg); 
        }

        .checkout-header {
            display: flex;
            align-items: flex-start;
            gap: 0.85rem;
            margin-bottom: 1.25rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid var(--border-subtle);
        }

        .checkout-icon-box {
            width: 44px;
            height: 44px;
            border-radius: var(--radius-lg);
            background: var(--primary-light);
            color: var(--primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.15rem;
            flex-shrink: 0;
        }

        .checkout-title { font-size: 1.2rem; font-weight: 800; color: var(--text-main); letter-spacing: -0.01em; margin-bottom: 0.15rem; }
        .checkout-desc { color: var(--text-muted); font-size: 0.85rem; }
        
        /* Kotak Ringkasan Paket */
        .package-summary { 
            background: linear-gradient(270deg, var(--primary-light), #ffffff, var(--primary-light)); 
            background-size: 200% 200%; 
            animation: gradientMove 6s ease infinite; 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-lg); 
            padding: 1rem 1.15rem; 
            margin-bottom: 1.15rem; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            gap: 0.75rem; 
            box-shadow: var(--shadow-sm);
        }

        .package-info h4 { font-size: 1rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 0.1rem; display: flex; align-items: center; gap: 0.4rem; }
        .pkg-name-badge { width: 20px; height: 20px; object-fit: contain; vertical-align: middle; display: inline-block; }
        .package-info p { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; }
        .package-price { font-size: 1.2rem; font-weight: 800; color: var(--text-main); white-space: nowrap; }

        /* Kotak Fasilitas */
        .package-features-box { 
            background: var(--bg-body); 
            border: 1px solid var(--border-subtle); 
            border-radius: var(--radius-lg); 
            padding: 0.85rem 1rem; 
            margin-bottom: 1.25rem; 
        }
        .package-features-box h5 { font-size: 0.85rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem; }
        .package-features-list { list-style: none; font-size: 0.82rem; color: var(--text-muted); display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 0.75rem; }
        .package-features-list li { display: flex; align-items: flex-start; gap: 0.4rem; }
        .package-features-list li img { width: 16px; height: 16px; object-fit: contain; vertical-align: middle; display: inline-block; margin-top: 2px; }

        /* Form Group */
        .form-group { margin-bottom: 0.85rem; }
        .form-group label { display: block; font-size: 0.81rem; font-weight: 700; margin-bottom: 0.3rem; color: var(--text-main); }
        
        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.field-icon {
            position: absolute;
            left: 0.85rem;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .form-control { 
            width: 100%; 
            padding: 0.65rem 0.85rem 0.65rem 2.4rem; 
            border-radius: var(--radius-md); 
            border: 1px solid var(--border-medium); 
            background-color: #f8fafc; 
            font-size: 0.875rem; 
            color: var(--text-main); 
            font-family: inherit; 
            font-weight: 500;
            pointer-events: none; 
            user-select: none; 
            transition: var(--transition);
        }

        .form-control:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #fff;
        }

        /* Tombol Utama & Sekunder */
        .btn { 
            display: inline-flex; 
            align-items: center; 
            justify-content: center; 
            gap: 0.5rem; 
            padding: 0.75rem 1.25rem; 
            font-size: 0.9rem; 
            font-weight: 700; 
            border-radius: var(--radius-full); 
            transition: var(--transition); 
            cursor: pointer; 
            border: none; 
            text-align: center; 
            width: 100%; 
            text-decoration: none; 
        }

        .btn-primary { 
            background: linear-gradient(270deg, var(--primary), var(--primary-dark), #10b981, var(--primary)); 
            background-size: 300% 300%; 
            animation: gradientMove 5s ease infinite; 
            color: #ffffff; 
            box-shadow: 0 4px 14px rgba(37,99,235,0.3); 
            margin-top: 0.5rem;
        }

        .btn-primary:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 6px 20px rgba(37,99,235,0.4); 
        }
        
        .btn-secondary { 
            background-color: transparent; 
            color: var(--text-muted); 
            border: 1px solid var(--border-medium); 
            margin-top: 0.5rem; 
            font-size: 0.82rem; 
            padding: 0.5rem 1rem; 
            border-radius: var(--radius-md);
        }

        .btn-secondary:hover { 
            border-color: var(--text-main); 
            color: var(--text-main); 
            background-color: #f1f5f9;
        }

        .secure-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1rem;
            text-align: center;
        }

        @media (max-width: 480px) {
            .package-features-list { grid-template-columns: 1fr; }
            .checkout-card { padding: 1.15rem; }
            .package-summary { flex-direction: column; align-items: flex-start; gap: 0.5rem; }
            .package-price { align-self: flex-end; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="https://sitenexs.com/assets/logo/logo.png" alt="Sitenexs Logo" class="logo-img" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Sitenexs&background=2563eb&color=fff&size=64&rounded=true';">
                <span class="logo-text">SiteNexs</span>
            </a>
            <a href="index.html" class="btn btn-secondary" style="width: auto; margin-top: 0; padding: 0.4rem 0.8rem; font-size: 0.8rem;">
                <i class="fas fa-arrow-left"></i> Kembali
            </a>
        </div>
    </header>

    <main class="main-content">
        <div class="container">
            <div class="checkout-card">
                <div class="checkout-header">
                    <div class="checkout-icon-box">
                        <i class="fas fa-receipt"></i>
                    </div>
                    <div>
                        <h1 class="checkout-title">Konfirmasi Pesanan</h1>
                        <p class="checkout-desc">Periksa ringkasan paket dan informasi akun Anda sebelum melanjutkan.</p>
                    </div>
                </div>

                <div class="package-summary">
                    <div class="package-info">
                        <h4 id="packageNameDisplay">Memuat Paket...</h4>
                        <p>Langganan sistem Sitenexs (1 Bulan)</p>
                    </div>
                    <div class="package-price" id="packagePriceDisplay">Rp 0</div>
                </div>

                <div class="package-features-box">
                    <h5><i class="fas fa-list-check" style="color: var(--primary);"></i> Rincian Fasilitas Paket:</h5>
                    <ul class="package-features-list" id="packageFeaturesList">
                        <li><i class="fas fa-spinner fa-spin"></i> <span>Memuat fasilitas...</span></li>
                    </ul>
                </div>

                <form id="checkoutForm">
                    <div class="form-group">
                        <label>Nama Pemilik / Pengelola Usaha</label>
                        <div class="input-wrapper">
                            <i class="fas fa-user field-icon"></i>
                            <input type="text" id="buyerName" class="form-control" readonly value="Memuat...">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Nama Usaha / Toko / UMKM</label>
                        <div class="input-wrapper">
                            <i class="fas fa-store field-icon"></i>
                            <input type="text" id="buyerBusiness" class="form-control" readonly value="Memuat...">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Email Akun Terdaftar</label>
                        <div class="input-wrapper">
                            <i class="fas fa-envelope field-icon"></i>
                            <input type="email" id="buyerEmail" class="form-control" readonly value="Memuat...">
                        </div>
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary">
                        <i class="fas fa-qrcode text-lg"></i> Lanjutkan Pembayaran via QRIS
                    </button>
                    
                    <a href="index.html" class="btn btn-secondary" style="width: 100%;">
                        Batalkan & Kembali ke Beranda
                    </a>
                </form>

                <div class="secure-badge">
                    <i class="fas fa-shield-alt text-emerald-500"></i> Transaksi aman, terenkripsi, dan instan.
                </div>
            </div>
        </div>
    </main>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import { getFirestore, doc, getDoc, collection, getDocs } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761',
            measurementId: 'G-C7YL0Q7YRQ'
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const paketQuery = urlParams.get('paket') || 'Paket Sitenexs';
        const hargaQuery = urlParams.get('harga') || '0';

        document.getElementById('packageNameDisplay').innerText = paketQuery;
        document.getElementById('packagePriceDisplay').innerText = formatRupiah(parseInt(hargaQuery) || 0);

        function applyDynamicTheme(packageName) {
            const p = packageName.toLowerCase();
            if (p.includes('pro') || p.includes('business')) {
                document.body.setAttribute('data-theme', 'pro');
            } else if (p.includes('vip') || p.includes('ultimate') || p.includes('premium')) {
                document.body.setAttribute('data-theme', 'vip');
            } else {
                document.body.removeAttribute('data-theme');
            }
        }
        applyDynamicTheme(paketQuery);

        function formatRupiah(angka) {
            if(angka === 0) return 'Gratis';
            return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        function parseFeatureText(rawText) {
            const urlRegex = /(https?:\/\/[^\s)]+)/g;
            let formatted = rawText.replace(urlRegex, (url) => {
                return `<img src="${url}" alt="Badge">`;
            });
            formatted = formatted.replace(/\(\s*(<img[^>]+>)\s*\)/g, '$1');
            return formatted;
        }

        async function loadPackageFeatures() {
            const listEl = document.getElementById('packageFeaturesList');
            const nameDisplayEl = document.getElementById('packageNameDisplay');
            try {
                const querySnapshot = await getDocs(collection(db, "packages"));
                let matchedFitur = "+ Laporan Keuangan\n- Laporan Penjualan\n- Sistem Kasir (POS)\n- Order Via QR";
                let matchedBadgeUrl = '';
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if(data.namaPaket && data.namaPaket.toLowerCase() === paketQuery.toLowerCase()) {
                        if(data.fitur) matchedFitur = data.fitur;
                        if(data.namaBadgeUrl) matchedBadgeUrl = data.namaBadgeUrl;
                    }
                });

                if (matchedBadgeUrl) {
                    nameDisplayEl.innerHTML = `${paketQuery} <img src="${matchedBadgeUrl}" class="pkg-name-badge" alt="Badge" title="Lencana Paket">`;
                } else {
                    nameDisplayEl.innerText = paketQuery;
                }

                const lines = matchedFitur.split('\n');
                listEl.innerHTML = '';
                lines.forEach(line => {
                    const trimmed = line.trim();
                    if(trimmed === '') return;
                    const type = trimmed.charAt(0);
                    const rawContent = trimmed.substring(1).trim();
                    const parsedContent = parseFeatureText(rawContent);

                    if(type === '+') {
                        listEl.insertAdjacentHTML('beforeend', `<li><i class="fas fa-check" style="color: var(--accent); margin-top: 0.15rem; font-size: 0.7rem;"></i> <span>${parsedContent}</span></li>`);
                    } else if(type === '-') {
                        listEl.insertAdjacentHTML('beforeend', `<li style="opacity: 0.5;"><i class="fas fa-times" style="color: #ef4444; margin-top: 0.15rem; font-size: 0.7rem;"></i> <del>${parsedContent}</del></li>`);
                    } else {
                        listEl.insertAdjacentHTML('beforeend', `<li><span>${parseFeatureText(trimmed)}</span></li>`);
                    }
                });
            } catch (err) {
                nameDisplayEl.innerText = paketQuery;
                listEl.innerHTML = `<li><i class="fas fa-check" style="color: var(--accent);"></i> <span>Akses sistem Sitenexs</span></li>`;
            }
        }
        loadPackageFeatures();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                fetchUserData(user.uid, user.email);
            } else {
                const savedUid = localStorage.getItem('sitenexs_uid');
                if (savedUid) {
                    fetchUserData(savedUid, null);
                } else {
                    document.getElementById('buyerName').value = "Tamu (Belum masuk akun)";
                    document.getElementById('buyerBusiness').value = "-";
                    document.getElementById('buyerEmail').value = "-";
                }
            }
        });

        async function fetchUserData(uid, authEmail) {
            try {
                const userDocRef = doc(db, "users", uid);
                const userSnap = await getDoc(userDocRef);
                
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    document.getElementById('buyerName').value = data.namaLengkap || data.namaDepan || 'Mitra Sitenexs';
                    document.getElementById('buyerBusiness').value = data.bisnis?.nama || 'Belum diatur';
                    document.getElementById('buyerEmail').value = data.email || authEmail || data.noWa || '-';
                }
            } catch (err) {
                console.error("Gagal mengambil data user:", err);
            }
        }

        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('buyerName').value;
            const business = document.getElementById('buyerBusiness').value;
            const email = document.getElementById('buyerEmail').value;

            const targetUrl = `pay/?paket=${encodeURIComponent(paketQuery)}&harga=${hargaQuery}&name=${encodeURIComponent(name)}&business=${encodeURIComponent(business)}&email=${encodeURIComponent(email)}`;
            window.location.href = targetUrl;
        });
    </script>
</body>
</html>
