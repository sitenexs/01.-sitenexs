<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konfirmasi Paket — Sitenexs</title>
    
    <link rel="icon" type="image/png" href="https://sitenexs.com/assets/logo/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --primary-light: #eff6ff;
            --accent: #10b981;
            --bg-body: #f8fafc;
            --bg-card: #ffffff;
            --text-main: #0f172a;
            --text-muted: #475569;
            --border-subtle: #e2e8f0;
            --border-medium: #cbd5e1;
            --radius-md: 0.5rem;
            --radius-lg: 0.75rem;
            --radius-xl: 1rem;
            --radius-full: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: var(--bg-body); color: var(--text-main); line-height: 1.5; min-height: 100vh; display: flex; flex-direction: column; font-size: 14px; }
        .container { width: 100%; max-width: 650px; margin: 0 auto; padding: 0 1rem; }
        
        header { background: #ffffff; border-bottom: 1px solid var(--border-subtle); padding: 0.75rem 0; box-shadow: var(--shadow-sm); position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); background: rgba(255, 255, 255, 0.95); }
        .nav-container { display: flex; align-items: center; justify-content: space-between; }
        .logo { display: flex; align-items: center; gap: 0.5rem; font-weight: 800; font-size: 1.1rem; color: var(--text-main); text-decoration: none; }
        .logo-img { height: 30px; width: 30px; border-radius: 50%; object-fit: cover; border: 2px solid #fff; box-shadow: var(--shadow-sm); }
        .logo-text { background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .main-content { padding: 1.75rem 0; flex-grow: 1; }
        .checkout-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-xl); padding: 1.5rem; box-shadow: var(--shadow-md); margin-bottom: 1.5rem; }
        .checkout-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 0.25rem; color: var(--text-main); }
        .checkout-desc { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 1.15rem; }
        
        .package-summary { background: var(--primary-light); border: 1px solid rgba(37,99,235,0.2); border-radius: var(--radius-lg); padding: 1rem 1.15rem; margin-bottom: 1.15rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 0.5rem; }
        .package-info h4 { font-size: 0.98rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 0.1rem; }
        .package-info p { font-size: 0.8rem; color: var(--text-muted); }
        .package-price { font-size: 1.25rem; font-weight: 800; color: var(--text-main); }

        .package-features-box { background: var(--bg-body); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 0.85rem 1rem; margin-bottom: 1.15rem; }
        .package-features-box h5 { font-size: 0.85rem; font-weight: 700; color: var(--text-main); margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.4rem; }
        .package-features-list { list-style: none; font-size: 0.82rem; color: var(--text-muted); display: grid; grid-template-columns: 1fr 1fr; gap: 0.4rem 0.75rem; }
        .package-features-list li { display: flex; align-items: flex-start; gap: 0.4rem; }
        
        .form-group { margin-bottom: 0.85rem; }
        .form-group label { display: block; font-size: 0.82rem; font-weight: 700; margin-bottom: 0.3rem; color: var(--text-main); }
        .form-control { width: 100%; padding: 0.65rem 0.95rem; border-radius: var(--radius-md); border: 1px solid var(--border-medium); background-color: #f1f5f9; font-size: 0.88rem; color: var(--text-muted); font-family: inherit; pointer-events: none; user-select: none; }

        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem; padding: 0.7rem 1.2rem; font-size: 0.88rem; font-weight: 700; border-radius: var(--radius-full); transition: var(--transition); cursor: pointer; border: none; text-align: center; width: 100%; text-decoration: none; }
        .btn-primary { background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%); color: #ffffff; box-shadow: 0 4px 12px rgba(37,99,235,0.25); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37,99,235,0.35); }
        .btn-secondary { background-color: #ffffff; color: var(--text-main); border: 1px solid var(--border-medium); margin-top: 0.4rem; font-size: 0.82rem; padding: 0.45rem 0.9rem; }
        .btn-secondary:hover { border-color: var(--primary); color: var(--primary); }

        @media (max-width: 600px) {
            .package-features-list { grid-template-columns: 1fr; }
            .checkout-card { padding: 1.15rem; }
        }
    </style>
</head>
<body>

    <header>
        <div class="container nav-container">
            <a href="index.html" class="logo">
                <img src="https://sitenexs.com/assets/logo/logo.png" alt="Sitenexs Logo" class="logo-img" onerror="this.onerror=null; this.src='https://ui-avatars.com/api/?name=Sitenexs&background=2563eb&color=fff&size=64&rounded=true';">
                <span class="logo-text">SiteNexs</span>
            </a>
            <a href="index.html" class="btn btn-secondary" style="width: auto; border-radius: var(--radius-full);">
                <i class="fas fa-arrow-left"></i> Kembali
            </a>
        </div>
    </header>

    <div class="main-content">
        <div class="container">
            <div class="checkout-card">
                <h1 class="checkout-title"><i class="fas fa-receipt text-primary"></i> Konfirmasi Pesanan</h1>
                <p class="checkout-desc">Periksa ringkasan paket dan informasi akun Anda sebelum melanjutkan ke pembayaran.</p>

                <div class="package-summary">
                    <div class="package-info">
                        <h4 id="packageNameDisplay">Memuat Paket...</h4>
                        <p>Langganan sistem Sitenexs (1 Bulan)</p>
                    </div>
                    <div class="package-price" id="packagePriceDisplay">Rp 0</div>
                </div>

                <div class="package-features-box">
                    <h5><i class="fas fa-list-check text-primary"></i> Rincian Fasilitas Paket:</h5>
                    <ul class="package-features-list" id="packageFeaturesList">
                        <li><i class="fas fa-spinner fa-spin"></i> Memuat fasilitas...</li>
                    </ul>
                </div>

                <form id="checkoutForm">
                    <div class="form-group">
                        <label>Nama Pemilik / Pengelola Usaha</label>
                        <input type="text" id="buyerName" class="form-control" readonly value="Memuat...">
                    </div>

                    <div class="form-group">
                        <label>Nama Usaha / Toko / UMKM</label>
                        <input type="text" id="buyerBusiness" class="form-control" readonly value="Memuat...">
                    </div>

                    <div class="form-group">
                        <label>Email Akun Terdaftar</label>
                        <input type="email" id="buyerEmail" class="form-control" readonly value="Memuat...">
                    </div>

                    <button type="submit" id="submitBtn" class="btn btn-primary" style="margin-top: 0.5rem;">
                        <i class="fas fa-arrow-right"></i> Lanjut ke Pembayaran
                    </button>
                    <a href="index.html" class="btn btn-secondary" style="width:100%; border-radius: var(--radius-md); margin-top: 0.4rem; text-align: center;">Batalkan & Kembali</a>
                </form>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js';
        import { getFirestore, doc, getDoc, collection, getDocs } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js';
        import { getAuth, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js';

        const firebaseConfig = {
            apiKey: 'AIzaSyDuN4zlRaSnmcUSuXE_E84IE7d3Mz8E-N4',
            authDomain: 'sitenexs-62919.firebaseapp.com',
            projectId: 'sitenexs-62919',
            storageBucket: 'sitenexs-62919.firebasestorage.app',
            messagingSenderId: '1060348110644',
            appId: '1:1060348110644:web:e45af14d5f26a9cf8e6761',
            measurementId: 'G-C7YL0Q7YRQ'
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);

        const urlParams = new URLSearchParams(window.location.search);
        const paketQuery = urlParams.get('paket') || 'Paket Sitenexs';
        const hargaQuery = urlParams.get('harga') || '0';

        document.getElementById('packageNameDisplay').innerText = paketQuery;
        document.getElementById('packagePriceDisplay').innerText = formatRupiah(parseInt(hargaQuery) || 0);

        function formatRupiah(angka) {
            if(angka === 0) return 'Gratis';
            return 'Rp ' + angka.toString().replace(/\B(?=(\d{3})+(?!\d))/g, ".");
        }

        async function loadPackageFeatures() {
            const listEl = document.getElementById('packageFeaturesList');
            try {
                const querySnapshot = await getDocs(collection(db, "packages"));
                let matchedFitur = "+ Laporan Keuangan\n- Laporan Penjualan\n- Sistem Kasir (POS)\n- Order Via QR";
                
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    if(data.namaPaket && data.namaPaket.toLowerCase() === paketQuery.toLowerCase()) {
                        if(data.fitur) matchedFitur = data.fitur;
                    }
                });

                const lines = matchedFitur.split('\n');
                listEl.innerHTML = '';
                lines.forEach(line => {
                    const trimmed = line.trim();
                    if(trimmed === '') return;
                    const type = trimmed.charAt(0);
                    const text = trimmed.substring(1).trim();

                    if(type === '+') {
                        listEl.insertAdjacentHTML('beforeend', `<li><i class="fas fa-check" style="color: var(--accent); margin-top: 0.15rem; font-size: 0.7rem;"></i> <span>${text}</span></li>`);
                    } else if(type === '-') {
                        listEl.insertAdjacentHTML('beforeend', `<li style="opacity: 0.55;"><i class="fas fa-times" style="color: #ef4444; margin-top: 0.15rem; font-size: 0.7rem;"></i> <del>${text}</del></li>`);
                    } else {
                        listEl.insertAdjacentHTML('beforeend', `<li><span>${trimmed}</span></li>`);
                    }
                });
            } catch (err) {
                listEl.innerHTML = `<li><i class="fas fa-check" style="color: var(--accent);"></i> <span>Akses sistem Sitenexs</span></li>`;
            }
        }
        loadPackageFeatures();

        onAuthStateChanged(auth, async (user) => {
            if (user) {
                fetchUserData(user.uid, user.email);
            } else {
                const savedUid = localStorage.getItem('sitenexs_uid');
                if (savedUid) {
                    fetchUserData(savedUid, null);
                } else {
                    document.getElementById('buyerName').value = "Tamu (Belum masuk akun)";
                    document.getElementById('buyerBusiness').value = "-";
                    document.getElementById('buyerEmail').value = "-";
                }
            }
        });

        async function fetchUserData(uid, authEmail) {
            try {
                const userDocRef = doc(db, "users", uid);
                const userSnap = await getDoc(userDocRef);
                
                if (userSnap.exists()) {
                    const data = userSnap.data();
                    document.getElementById('buyerName').value = data.namaLengkap || data.namaDepan || 'Mitra Sitenexs';
                    document.getElementById('buyerBusiness').value = data.bisnis?.nama || 'Belum diatur';
                    document.getElementById('buyerEmail').value = data.email || authEmail || data.noWa || '-';
                }
            } catch (err) {
                console.error("Gagal mengambil data user:", err);
            }
        }

        // Saat tombol "Lanjut ke Pembayaran" ditekan, pindah ke qris.html dengan membawa data paket & harga
        document.getElementById('checkoutForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('buyerName').value;
            const business = document.getElementById('buyerBusiness').value;
            const email = document.getElementById('buyerEmail').value;

            const targetUrl = `pay/?paket=${encodeURIComponent(paketQuery)}&harga=${hargaQuery}&name=${encodeURIComponent(name)}&business=${encodeURIComponent(business)}&email=${encodeURIComponent(email)}`;
            window.location.href = targetUrl;
        });
    </script>
</body>
</html>
