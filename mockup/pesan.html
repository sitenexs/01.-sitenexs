<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Sitenexs">
    <meta name="language" content="id-ID">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Sistem pemesanan menu digital Sitenexs untuk pelanggan agar dapat memesan makanan dan minuman secara cepat dan mudah.">
    <meta name="theme-color" content="#ea580c">
    <title>Mockup Pesan Menu — Sitenexs</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #ea580c;
            --primary-dark: #c2410c;
            --primary-light: #fff7ed;
            --bg-body: #fafaf9;
            --bg-card: #ffffff;
            --text-main: #292524;
            --text-muted: #78716c;
            --border-subtle: #e7e5e4;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #ef4444;
            --radius-sm: 0.4rem;
            --radius-md: 0.65rem;
            --radius-lg: 1rem;
            --radius-full: 9999px;
            --shadow-sm: 0 2px 4px -1px rgba(28, 25, 23, 0.06);
            --shadow-md: 0 8px 20px -5px rgba(28, 25, 23, 0.08);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-size: 0.75rem;
            padding-bottom: 4.5rem;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            overflow-y: hidden; /* Kunci scroll saat splash */
        }

        /* =========================================
           ANIMASI QR SCANNER (REALISTIS TANPA GAMBAR CAFE)
        ========================================= */
        #qr-splash {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            /* Latar belakang diganti warna gelap solid */
            background: #1c1917; 
            z-index: 9999;
            display: flex; flex-direction: column;
            align-items: center; justify-content: flex-end;
            transition: opacity 0.6s ease, visibility 0.6s ease;
        }

        #qr-splash.hidden { opacity: 0; visibility: hidden; }

        .scene {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100%;
            display: flex; justify-content: center; align-items: flex-end;
            padding-bottom: 15vh; /* Jarak dari bawah */
        }

        /* Kontainer HP & Tangan (Lebih Besar) */
        .hand-phone-container {
            position: relative;
            width: 280px;  /* HP Diperbesar */
            height: 560px; /* HP Diperbesar */
            transform: translateY(100%);
            animation: slideUpPhone 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards 0.2s;
        }

        @keyframes slideUpPhone { to { transform: translateY(0); } }

        /* Perangkat HP bergaya iPhone */
        .phone-device {
            position: absolute;
            top: 0; left: 16px; right: 16px; bottom: -50px;
            background: #111;
            border-radius: 40px;
            border: 8px solid #333;
            box-shadow: inset 0 0 0 3px #000, 0 30px 60px rgba(0,0,0,0.8);
            z-index: 2;
            overflow: hidden;
        }

        /* Poni / Dynamic Island HP */
        .phone-notch {
            position: absolute;
            top: 10px; left: 50%;
            transform: translateX(-50%);
            width: 85px; height: 24px;
            background: #000;
            border-radius: 15px;
            z-index: 10;
        }

        /* Layar HP (Diganti warna gelap dengan efek cahaya kamera) */
        .phone-screen {
            width: 100%; height: 100%;
            /* Efek cahaya senter/kamera menyorot meja */
            background: radial-gradient(circle at center, #3a3633 0%, #111 80%);
            position: relative;
            display: flex; align-items: center; justify-content: center;
            flex-direction: column;
        }
        /* Filter gelap sedikit agar scanner terlihat */
        .phone-screen::before {
            content: ''; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.2);
        }

        /* --- DESAIN TANGAN REALISTIS (CSS) --- */
        
        /* Jari-jari di belakang layar */
        .fingers-back {
            position: absolute;
            top: 220px; left: -8px;
            width: 35px; height: 140px;
            background: linear-gradient(to right, #dca37b, #b87c53); /* Warna kulit */
            border-radius: 20px 0 0 20px;
            z-index: 1;
            box-shadow: inset 3px 0 8px rgba(255,255,255,0.15);
        }
        .fingers-back::before {
            content: ''; position: absolute;
            top: -60px; left: 0; width: 35px; height: 55px;
            background: linear-gradient(to right, #dca37b, #b87c53);
            border-radius: 20px 0 0 20px;
            box-shadow: inset 3px 0 8px rgba(255,255,255,0.15);
        }
        .fingers-back::after {
            content: ''; position: absolute;
            bottom: -60px; left: 0; width: 35px; height: 55px;
            background: linear-gradient(to right, #dca37b, #b87c53);
            border-radius: 20px 0 0 20px;
            box-shadow: inset 3px 0 8px rgba(255,255,255,0.15);
        }

        /* Jempol di depan layar */
        .thumb-front {
            position: absolute;
            bottom: 70px; right: -12px;
            width: 55px; height: 180px;
            background: linear-gradient(135deg, #f3c7a8 0%, #dca37b 50%, #b87c53 100%);
            border-radius: 40px;
            transform: rotate(-14deg);
            z-index: 3;
            box-shadow: -8px 12px 25px rgba(0,0,0,0.6), inset -3px -5px 12px rgba(100,50,20,0.4);
            border-left: 2px solid rgba(255,255,255,0.3);
        }
        /* Kuku Jempol */
        .thumb-front::after {
            content: ''; position: absolute;
            top: 15px; right: 18px; width: 24px; height: 32px;
            background: linear-gradient(to bottom, #fdf5e6, #f3d4c6);
            border-radius: 40% 40% 50% 50%;
            box-shadow: inset 0 -3px 5px rgba(0,0,0,0.15), 0 1px 2px rgba(255,255,255,0.6);
        }
        /* Lekukan Sendi Jempol */
        .thumb-front::before {
            content: ''; position: absolute;
            top: 80px; left: 10px; width: 35px; height: 3px;
            background: rgba(139,87,42,0.25);
            border-radius: 50%;
            box-shadow: 0 6px 0 rgba(139,87,42,0.15);
        }

        /* UI Scanner di Layar HP */
        .scan-frame {
            position: relative; z-index: 5;
            width: 150px; height: 150px; /* Lebih besar */
            display: flex; align-items: center; justify-content: center;
            margin-top: -40px;
        }
        
        .qr-target {
            font-size: 6rem;
            color: rgba(255,255,255,0.15);
            transform: scale(0.8);
            animation: focusQR 0.5s ease forwards 1.2s;
        }

        @keyframes focusQR {
            to { transform: scale(1); color: rgba(255,255,255,0.9); }
        }

        .scan-frame .qr-corner {
            position: absolute;
            width: 30px; height: 30px;
            border: 4px solid var(--primary);
            border-radius: 4px;
        }
        .scan-frame .qr-top-left { top: -5px; left: -5px; border-right: none; border-bottom: none; }
        .scan-frame .qr-top-right { top: -5px; right: -5px; border-left: none; border-bottom: none; }
        .scan-frame .qr-bottom-left { bottom: -5px; left: -5px; border-right: none; border-top: none; }
        .scan-frame .qr-bottom-right { bottom: -5px; right: -5px; border-left: none; border-top: none; }

        .qr-laser {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 3px;
            background: var(--primary);
            box-shadow: 0 0 15px var(--primary), 0 0 30px var(--primary);
            opacity: 0;
            animation: scanLaser 1.5s infinite linear alternate 1.2s;
        }

        @keyframes scanLaser {
            0% { top: 0%; opacity: 0; }
            10% { opacity: 1; }
            90% { opacity: 1; }
            100% { top: 100%; opacity: 0; }
        }

        .qr-status-text {
            position: absolute;
            bottom: 4vh; left: 0; width: 100%;
            z-index: 10;
            color: #fff; font-size: 1.05rem; font-weight: 700;
            letter-spacing: 0.5px; display: flex; flex-direction: column;
            align-items: center; gap: 0.5rem; text-align: center;
        }

        /* --- CSS WEB UTAMA --- */
        .container { width: 100%; max-width: 1024px; margin: 0 auto; padding: 0.75rem; }
        header { background: rgba(255, 255, 255, 0.92); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-subtle); padding: 0.75rem; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm); }
        .header-content { width: 100%; max-width: 1024px; display: flex; justify-content: space-between; align-items: center; }
        .header-brand h2 { font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 0.4rem; }
        .header-brand p { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.1rem; }
        .guide-btn { background: var(--primary-light); border: 1px solid #fed7aa; color: var(--primary); width: 30px; height: 30px; border-radius: var(--radius-full); display: flex; align-items: center; justify-content: center; cursor: pointer; transition: var(--transition); font-size: 0.75rem; }
        .guide-btn:hover { background: var(--primary); color: #fff; transform: scale(1.05); }

        .order-meta-box { background: linear-gradient(135deg, var(--primary-light) 0%, #ffffff 100%); border: 1px solid #fed7aa; padding: 0.6rem; border-radius: var(--radius-md); display: grid; grid-template-columns: 1fr; gap: 0.5rem; margin-bottom: 0.85rem; box-shadow: var(--shadow-sm); }
        .order-meta-box div { display: flex; align-items: center; justify-content: space-between; background: #fff; padding: 0.4rem 0.6rem; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle); }
        .order-meta-box span { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 0.35rem; }
        .order-meta-box input { background: transparent; border: none; font-weight: 700; color: var(--primary); font-size: 0.8rem; text-align: right; width: 120px; outline: none; }

        .filter-control-box { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; margin-bottom: 0.85rem; }
        .search-wrapper { position: relative; width: 100%; }
        .search-wrapper input { width: 100%; padding: 0.5rem 0.6rem 0.5rem 1.8rem; border: 1px solid var(--border-subtle); border-radius: var(--radius-md); font-size: 0.75rem; transition: var(--transition); box-shadow: var(--shadow-sm); }
        .search-wrapper input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15); }
        .search-wrapper i { position: absolute; left: 0.6rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.75rem; }
        
        .category-scroll { display: flex; gap: 0.4rem; overflow-x: auto; padding-bottom: 0.4rem; margin-bottom: 0.85rem; scrollbar-width: none; }
        .category-scroll::-webkit-scrollbar { display: none; }
        .cat-btn { background: #fff; border: 1px solid var(--border-subtle); padding: 0.4rem 0.75rem; border-radius: var(--radius-full); font-size: 0.7rem; font-weight: 600; color: var(--text-muted); cursor: pointer; transition: var(--transition); box-shadow: var(--shadow-sm); white-space: nowrap; }
        .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        .section-title { font-size: 0.9rem; margin-bottom: 0.75rem; font-weight: 700; }
        .menu-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 0.5rem; }
        .menu-card { background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); overflow: hidden; display: flex; flex-direction: column; box-shadow: var(--shadow-sm); transition: var(--transition); }
        .menu-img-wrapper { position: relative; width: 100%; padding-bottom: 100%; overflow: hidden; background: #f5f5f4; cursor: pointer; }
        .menu-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        .menu-body { padding: 0.4rem; flex: 1; display: flex; flex-direction: column; cursor: pointer; }
        .menu-title { font-size: 0.7rem; font-weight: 700; margin-bottom: 0.15rem; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .menu-price { font-size: 0.75rem; color: var(--primary); font-weight: 700; margin-top: auto; }
        .menu-action { padding: 0 0.4rem 0.4rem 0.4rem; }
        .btn { display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem; padding: 0.45rem 0.75rem; font-size: 0.75rem; font-weight: 600; border-radius: var(--radius-sm); cursor: pointer; border: none; transition: var(--transition); width: 100%; }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 4px rgba(234, 88, 12, 0.2); }

        .floating-actions { position: fixed; bottom: 0; left: 0; width: 100%; background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px); border-top: 1px solid var(--border-subtle); padding: 0.6rem 0.75rem; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 -8px 20px -5px rgba(28, 25, 23, 0.08); z-index: 1000; }
        .call-waiter-btn { background: #fffbeb; color: #d97706; border: 1px solid #fef3c7; padding: 0.4rem 0.75rem; border-radius: var(--radius-full); font-size: 0.7rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.3rem; }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(28, 25, 23, 0.6); backdrop-filter: blur(4px); z-index: 2000; align-items: center; justify-content: center; padding: 1rem; opacity: 0; transition: opacity 0.3s ease; }
        .modal.show { display: flex; opacity: 1; }
        .modal-content { background: #ffffff; width: 100%; max-width: 320px; border-radius: var(--radius-lg); padding: 1.25rem; transform: scale(0.95); transition: transform 0.3s ease; box-shadow: var(--shadow-md); }
        .modal.show .modal-content { transform: scale(1); }
    </style>
</head>
<body>

    <!-- ANIMASI SPLASH SCREEN (TANGAN, HP & KAMERA REALISTIS - TANPA GAMBAR) -->
    <div id="qr-splash">
        
        <div class="scene">
            <div class="hand-phone-container">
                <!-- Jari Belakang -->
                <div class="fingers-back"></div>
                
                <!-- Perangkat HP iPhone Style -->
                <div class="phone-device">
                    <div class="phone-notch"></div> <!-- Poni iPhone -->
                    
                    <div class="phone-screen" id="phone-screen">
                        
                        <!-- Frame Scan UI Dalam Kamera -->
                        <div class="scan-frame" id="scan-frame">
                            <div class="qr-corner qr-top-left"></div>
                            <div class="qr-corner qr-top-right"></div>
                            <div class="qr-corner qr-bottom-left"></div>
                            <div class="qr-corner qr-bottom-right"></div>
                            
                            <i class="fas fa-qrcode qr-target"></i>
                            
                            <!-- Garis Laser -->
                            <div class="qr-laser" id="qr-laser"></div>
                        </div>

                    </div>
                </div>
                
                <!-- Jempol Depan -->
                <div class="thumb-front"></div>
            </div>
        </div>

        <div class="qr-status-text" id="qr-status">
            <span style="opacity: 0.8; font-weight: 500; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">Membuka Kamera...</span>
        </div>
    </div>

    <!-- MAIN APP -->
    <header>
        <div class="header-content">
            <div class="header-brand">
                <h2><i class="fas fa-mug-hot" style="color: var(--primary);"></i> Sitenexs Cafe</h2>
                <p>Digital Self-Order Mockup</p>
            </div>
            <button class="guide-btn" onclick="openModal('guide-modal')" title="Panduan">
                <i class="fas fa-question"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Meta Meja & Nama -->
        <div class="order-meta-box">
            <div>
                <span><i class="fas fa-chair" style="color:var(--primary)"></i> Meja</span>
                <input type="text" id="input-meja" value="01" placeholder="No. Meja">
            </div>
            <div>
                <span><i class="fas fa-user" style="color:var(--primary)"></i> Nama</span>
                <input type="text" id="input-nama" value="Tamu" placeholder="Nama Anda">
            </div>
        </div>

        <div class="filter-control-box">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Cari menu..." oninput="filterAndRenderMenu()">
            </div>
        </div>

        <div class="category-scroll">
            <button class="cat-btn active" onclick="filterCategory('all', this)">Semua Menu</button>
            <button class="cat-btn" onclick="filterCategory('makanan', this)">Makanan</button>
            <button class="cat-btn" onclick="filterCategory('minuman', this)">Minuman</button>
            <button class="cat-btn" onclick="filterCategory('snack', this)">Snack</button>
        </div>

        <h3 class="section-title">Daftar Menu</h3>
        <div id="menu-list-container" class="menu-grid"></div>
    </div>

    <!-- Floating Bottom Bar -->
    <div class="floating-actions">
        <button class="call-waiter-btn" onclick="openModal('subscribe-modal')">
            <i class="fas fa-bell"></i> Pelayan
        </button>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <div style="text-align: right;">
                <span id="cart-count" style="font-size: 0.6rem; color: var(--text-muted); display: block;">0 Item</span>
                <span id="cart-total" style="font-size: 0.8rem; font-weight: 700; color: var(--primary);">Rp 0</span>
            </div>
            <button class="btn btn-primary" onclick="openModal('subscribe-modal')">Pesanan</button>
        </div>
    </div>

    <!-- Modals -->
    <div class="modal" id="guide-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; margin-bottom: 1rem;">
                <h3 style="font-size: 0.95rem; font-weight: 700;"><i class="fas fa-book-open" style="color:var(--primary);"></i> Panduan</h3>
                <button onclick="closeModal('guide-modal')" style="background:none; border:none; font-size:1rem; cursor:pointer; color:var(--text-muted);"><i class="fas fa-times"></i></button>
            </div>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1rem;">Ini adalah Tampilan Demo</p>
            <button class="btn btn-primary" style="width:100%" onclick="closeModal('guide-modal')">Tutup</button>
        </div>
    </div>
    
    <div class="modal" id="subscribe-modal" style="z-index: 3000;">
        <div class="modal-content" style="text-align: center;">
            <div style="display: flex; justify-content: flex-end; margin-bottom: -0.5rem;">
                <button onclick="closeModal('subscribe-modal')" style="background:none; border:none; font-size:1.1rem; cursor:pointer; color:var(--text-muted);"><i class="fas fa-times"></i></button>
            </div>
            <i class="fas fa-lock" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 1rem; display: block;"></i>
            <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem;">Fitur Terkunci</h3>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1.25rem;">Silakan berlangganan Premium.</p>
            <button class="btn btn-primary" style="width:100%" onclick="closeModal('subscribe-modal')"><i class="fas fa-crown" style="color:#fef08a;"></i> BERLANGGANAN SEKARANG</button>
        </div>
    </div>

    <script>
        // Logika Animasi Scan QR 
        window.addEventListener('load', () => {
            const splash = document.getElementById('qr-splash');
            const statusText = document.getElementById('qr-status');
            const scanFrame = document.getElementById('scan-frame');
            const phoneScreen = document.getElementById('phone-screen');
            
            // 1. Teks menyesuaikan fokus kamera (1.1 Detik)
            setTimeout(() => {
                statusText.innerHTML = '<span style="animation: pulseText 1s infinite alternate; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));">Memfokuskan QR Code...</span>';
            }, 1100);

            // 2. Berhasil Scan (3.5 Detik)
            setTimeout(() => {
                scanFrame.style.display = 'none'; // Sembunyikan scanner frame
                
                // Munculkan UI Ceklis Sukses di Tengah Layar HP
                phoneScreen.innerHTML += `
                    <div style="position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.4); display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:20;">
                        <i class="fas fa-check-circle" style="color: #4ade80; font-size: 4rem; margin-bottom: 0.5rem; transform: scale(0); animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;"></i>
                        <div style="color: #fff; font-size: 0.85rem; font-weight: bold; opacity:0; animation: fadeIn 0.5s forwards 0.3s;">Sukses</div>
                    </div>
                `;
                
                // Tambah keyframe Ceklis
                const style = document.createElement('style');
                style.innerHTML = `
                    @keyframes popIn { to { transform: scale(1); } }
                    @keyframes pulseText { from { opacity: 0.7; } to { opacity: 1; } }
                    @keyframes fadeIn { to { opacity: 1; } }
                `;
                document.head.appendChild(style);

                // Ubah Teks luar
                statusText.innerHTML = '<span style="color: #4ade80; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5));"><i class="fas fa-check"></i> Meja Teridentifikasi</span>';
                
                // 3. Hilangkan layar Splash secara perlahan (4.8 Detik)
                setTimeout(() => {
                    splash.classList.add('hidden');
                    document.body.style.overflowY = 'auto'; // Kembalikan scroll aplikasi
                }, 1300);

            }, 3500);
        });

        // Supabase Logic SAMA PERSIS SEPERTI SEBELUMNYA
        const SUPABASE_URL = 'https://xqcbyamxiekdxytntlno.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxY2J5YW14aWVrZHh5dG50bG5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MTM2NDIsImV4cCI6MjEwNTk4OTY0Mn0.pkytlWwjfKOQT9bWNS-nuNZReE7jFUi3ITk5ageyrkM';
        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let products = [];
        let currentCategory = 'all';
        let cart = {}; 

        async function fetchMenuProducts() {
            const { data, error } = await _supabase.from('products').select('*');
            if (error) return;
            products = data || [];
            filterAndRenderMenu();
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchMenuProducts();
        });

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterAndRenderMenu();
        }

        function filterAndRenderMenu() {
            const container = document.getElementById('menu-list-container');
            let result = currentCategory === 'all' ? [...products] : products.filter(p => p.category === currentCategory);
            container.innerHTML = '';
            if (result.length === 0) return;

            result.forEach(p => {
                container.innerHTML += `
                    <div class="menu-card">
                        <div class="menu-img-wrapper" onclick="openModal('subscribe-modal')">
                            <img src="${p.img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&auto=format&fit=crop&q=80'}" class="menu-img" alt="${p.name}">
                        </div>
                        <div class="menu-body" onclick="openModal('subscribe-modal')">
                            <div class="menu-title">${p.name}</div>
                            <div class="menu-price">Rp ${p.price.toLocaleString('id-ID')}</div>
                        </div>
                        <div class="menu-action">
                            <button class="btn btn-primary" onclick="openModal('subscribe-modal')"><i class="fas fa-plus"></i> Tambah</button>
                        </div>
                    </div>
                `;
            });
        }

        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }
    </script>
</body>
</html>
