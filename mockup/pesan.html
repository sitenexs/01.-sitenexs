<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Sitenexs">
    <meta name="language" content="id-ID">
    <meta name="robots" content="noindex, nofollow">
    <meta name="description" content="Sistem pemesanan menu digital Sitenexs untuk pelanggan agar dapat memesan makanan dan minuman secara cepat dan mudah.">
    <meta name="theme-color" content="#ea580c">
    <title>Mockup Pesan Menu — Sitenexs</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --primary: #ea580c;
            --primary-dark: #c2410c;
            --primary-light: #fff7ed;
            --bg-body: #fafaf9;
            --bg-card: #ffffff;
            --text-main: #292524;
            --text-muted: #78716c;
            --border-subtle: #e7e5e4;
            --success: #16a34a;
            --warning: #d97706;
            --danger: #ef4444;
            --radius-sm: 0.4rem;
            --radius-md: 0.65rem;
            --radius-lg: 1rem;
            --radius-full: 9999px;
            --shadow-sm: 0 2px 4px -1px rgba(28, 25, 23, 0.06);
            --shadow-md: 0 8px 20px -5px rgba(28, 25, 23, 0.08);
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            font-size: 0.75rem;
            padding-bottom: 4.5rem;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
        }

        .container {
            width: 100%;
            max-width: 1024px;
            margin: 0 auto;
            padding: 0.75rem;
        }

        /* --- HEADER --- */
        header {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-subtle);
            padding: 0.75rem;
            position: sticky;
            top: 0;
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow-sm);
        }
        
        .header-content {
            width: 100%;
            max-width: 1024px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header-brand h2 { font-size: 0.95rem; font-weight: 700; display: flex; align-items: center; gap: 0.4rem; }
        .header-brand p { font-size: 0.65rem; color: var(--text-muted); margin-top: 0.1rem; }
        .guide-btn {
            background: var(--primary-light); border: 1px solid #fed7aa; color: var(--primary);
            width: 30px; height: 30px; border-radius: var(--radius-full);
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: var(--transition); font-size: 0.75rem;
        }
        .guide-btn:hover { background: var(--primary); color: #fff; transform: scale(1.05); }

        /* --- META BOX (Meja & Nama) --- */
        .order-meta-box {
            background: linear-gradient(135deg, var(--primary-light) 0%, #ffffff 100%);
            border: 1px solid #fed7aa; padding: 0.6rem; border-radius: var(--radius-md);
            display: grid; grid-template-columns: 1fr; gap: 0.5rem;
            margin-bottom: 0.85rem; box-shadow: var(--shadow-sm);
        }
        .order-meta-box div {
            display: flex; align-items: center; justify-content: space-between;
            background: #fff; padding: 0.4rem 0.6rem; border-radius: var(--radius-sm); border: 1px solid var(--border-subtle);
        }
        .order-meta-box span { font-size: 0.7rem; font-weight: 600; color: var(--text-muted); display: flex; align-items: center; gap: 0.35rem; }
        .order-meta-box input {
            background: transparent; border: none; font-weight: 700; color: var(--primary);
            font-size: 0.8rem; text-align: right; width: 120px; outline: none;
        }

        /* --- FILTER & SEARCH --- */
        .filter-control-box { display: grid; grid-template-columns: 1fr auto; gap: 0.5rem; margin-bottom: 0.85rem; }
        .search-wrapper { position: relative; width: 100%; }
        .search-wrapper input {
            width: 100%; padding: 0.5rem 0.6rem 0.5rem 1.8rem;
            border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
            font-size: 0.75rem; transition: var(--transition); box-shadow: var(--shadow-sm);
        }
        .search-wrapper input:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 3px rgba(234, 88, 12, 0.15); }
        .search-wrapper i { position: absolute; left: 0.6rem; top: 50%; transform: translateY(-50%); color: var(--text-muted); font-size: 0.75rem; }
        
        .sort-select {
            padding: 0.5rem 1.6rem 0.5rem 0.75rem;
            border: 1px solid var(--border-subtle); border-radius: var(--radius-md);
            font-size: 0.7rem; font-weight: 600; color: var(--text-main);
            appearance: none; box-shadow: var(--shadow-sm); background: #fff; cursor: pointer;
        }
        .sort-select-wrapper { position: relative; height: 100%; }
        .sort-select-wrapper::after {
            content: '\f0dc'; font-family: 'Font Awesome 6 Free'; font-weight: 900;
            position: absolute; right: 0.6rem; top: 50%; transform: translateY(-50%);
            font-size: 0.65rem; color: var(--text-muted); pointer-events: none;
        }

        /* --- KATEGORI SCROLL --- */
        .category-scroll {
            display: flex; gap: 0.4rem; overflow-x: auto;
            padding-bottom: 0.4rem; margin-bottom: 0.85rem; scrollbar-width: none;
        }
        .category-scroll::-webkit-scrollbar { display: none; }
        .cat-btn {
            background: #fff; border: 1px solid var(--border-subtle);
            padding: 0.4rem 0.75rem; border-radius: var(--radius-full);
            font-size: 0.7rem; font-weight: 600; color: var(--text-muted);
            cursor: pointer; transition: var(--transition); box-shadow: var(--shadow-sm); white-space: nowrap;
        }
        .cat-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }

        /* --- MENU GRID --- */
        .section-title { font-size: 0.9rem; margin-bottom: 0.75rem; font-weight: 700; }
        
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.5rem;
        }

        .menu-card {
            background: var(--bg-card); border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md); overflow: hidden;
            display: flex; flex-direction: column; box-shadow: var(--shadow-sm);
            transition: var(--transition); animation: fadeIn 0.4s ease;
        }
        
        .menu-img-wrapper { position: relative; width: 100%; padding-bottom: 100%; overflow: hidden; background: #f5f5f4; cursor: pointer; }
        .menu-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; }
        
        .menu-body { padding: 0.4rem; flex: 1; display: flex; flex-direction: column; cursor: pointer; }
        .menu-title { font-size: 0.7rem; font-weight: 700; margin-bottom: 0.15rem; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .menu-price { font-size: 0.75rem; color: var(--primary); font-weight: 700; margin-top: auto; }
        
        .menu-action { padding: 0 0.4rem 0.4rem 0.4rem; }
        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 0.3rem;
            padding: 0.45rem 0.75rem; font-size: 0.75rem; font-weight: 600;
            border-radius: var(--radius-sm); cursor: pointer; border: none; transition: var(--transition); width: 100%;
        }
        .menu-action .btn { padding: 0.35rem; font-size: 0.65rem; }
        .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 2px 4px rgba(234, 88, 12, 0.2); }

        /* --- FLOATING ACTIONS --- */
        .floating-actions {
            position: fixed; bottom: 0; left: 0; width: 100%;
            background: rgba(255, 255, 255, 0.94); backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-subtle); padding: 0.6rem 0.75rem;
            display: flex; justify-content: space-between; align-items: center;
            box-shadow: 0 -8px 20px -5px rgba(28, 25, 23, 0.08); z-index: 1000;
        }
        
        .call-waiter-btn {
            background: #fffbeb; color: #d97706; border: 1px solid #fef3c7;
            padding: 0.4rem 0.75rem; border-radius: var(--radius-full);
            font-size: 0.7rem; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 0.3rem;
        }
        .floating-actions .btn-primary { width: auto; padding: 0.45rem 0.75rem; font-size: 0.7rem; }

        /* --- MODAL --- */
        .modal {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(28, 25, 23, 0.6); backdrop-filter: blur(4px); z-index: 2000;
            align-items: center; justify-content: center; padding: 1rem; opacity: 0; transition: opacity 0.3s ease;
        }
        .modal.show { display: flex; opacity: 1; }

        .modal-content {
            background: #ffffff; width: 100%; max-width: 320px;
            border-radius: var(--radius-lg); padding: 1.25rem; overflow-y: auto;
            transform: scale(0.95); transition: transform 0.3s ease; box-shadow: var(--shadow-md);
        }
        .modal.show .modal-content { transform: scale(1); }

        /* --- QUANTITY CONTROLLER DI MODAL --- */
        .qty-control {
            display: flex; align-items: center; justify-content: center; gap: 1rem; margin: 1rem 0;
        }
        .qty-btn {
            width: 32px; height: 32px; border-radius: var(--radius-full); border: 1px solid var(--border-subtle);
            background: #fff; font-size: 0.85rem; font-weight: 700; color: var(--primary); cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: var(--transition);
        }
        .qty-btn:hover { background: var(--primary-light); border-color: var(--primary); }
        .qty-input {
            width: 50px; text-align: center; font-size: 0.9rem; font-weight: 700;
            border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 0.3rem; outline: none;
        }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <header>
        <div class="header-content">
            <div class="header-brand">
                <h2><i class="fas fa-mug-hot" style="color: var(--primary);"></i> Sitenexs Cafe</h2>
                <p>Digital Self-Order Mockup</p>
            </div>
            <button class="guide-btn" onclick="openModal('guide-modal')" title="Panduan">
                <i class="fas fa-question"></i>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Meta Meja & Nama -->
        <div class="order-meta-box">
            <div>
                <span><i class="fas fa-chair" style="color:var(--primary)"></i> Meja</span>
                <input type="text" id="input-meja" value="01" placeholder="No. Meja">
            </div>
            <div>
                <span><i class="fas fa-user" style="color:var(--primary)"></i> Nama</span>
                <input type="text" id="input-nama" value="Tamu" placeholder="Nama Anda">
            </div>
        </div>

        <!-- Search & Sort -->
        <div class="filter-control-box">
            <div class="search-wrapper">
                <i class="fas fa-search"></i>
                <input type="text" id="search-input" placeholder="Cari menu..." oninput="filterAndRenderMenu()">
            </div>
            <div class="sort-select-wrapper">
                <select id="sort-select" class="sort-select" onchange="filterAndRenderMenu()">
                    <option value="default">Urutkan</option>
                    <option value="termurah">Termurah</option>
                    <option value="tertinggi">Tertinggi</option>
                </select>
            </div>
        </div>

        <!-- Kategori -->
        <div class="category-scroll">
            <button class="cat-btn active" onclick="filterCategory('all', this)">Semua Menu</button>
            <button class="cat-btn" onclick="filterCategory('makanan', this)">Makanan</button>
            <button class="cat-btn" onclick="filterCategory('minuman', this)">Minuman</button>
            <button class="cat-btn" onclick="filterCategory('snack', this)">Snack</button>
        </div>

        <h3 class="section-title">Daftar Menu</h3>
        <div id="menu-list-container" class="menu-grid">
            <!-- Produk Dinamis -->
        </div>
    </div>

    <!-- Floating Bottom Bar -->
    <div class="floating-actions">
        <button class="call-waiter-btn" onclick="openSubscribeModal()">
            <i class="fas fa-bell"></i> Pelayan
        </button>
        <div style="display: flex; align-items: center; gap: 0.5rem;">
            <div style="text-align: right;">
                <span id="cart-count" style="font-size: 0.6rem; color: var(--text-muted); display: block;">0 Item</span>
                <span id="cart-total" style="font-size: 0.8rem; font-weight: 700; color: var(--primary);">Rp 0</span>
            </div>
            <button class="btn btn-primary" onclick="openSubscribeModal()">Pesanan</button>
        </div>
    </div>

    <!-- Modal Panduan -->
    <div class="modal" id="guide-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="font-size: 0.95rem; font-weight: 700; display:flex; align-items:center; gap:0.4rem;">
                    <i class="fas fa-book-open" style="color:var(--primary);"></i> Panduan Mockup
                </h3>
                <button onclick="closeModal('guide-modal')" style="background:none; border:none; font-size:1rem; cursor:pointer; color:var(--text-muted);"><i class="fas fa-times"></i></button>
            </div>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1rem; line-height: 1.5;">
                Ini adalah Tampilan Demo
            </p>
            <button class="btn btn-primary" style="font-size: 0.75rem; padding: 0.5rem;" onclick="closeModal('guide-modal')">Tutup</button>
        </div>
    </div>

    <!-- Modal Input Jumlah Pesanan -->
    <div class="modal" id="detail-modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: flex-end; margin-bottom: 0.5rem;">
                <button onclick="closeModal('detail-modal')" style="background:none; border:none; font-size:1rem; cursor:pointer; color:var(--text-muted);"><i class="fas fa-times"></i></button>
            </div>
            <div style="width: 100%; height: 120px; background: #f5f5f4; border-radius: var(--radius-sm); margin-bottom: 0.75rem; overflow: hidden;">
                <img id="detail-img" src="" alt="" style="width: 100%; height: 100%; object-fit: cover;">
            </div>
            <h3 id="detail-title" style="font-size: 0.95rem; font-weight: 700; margin-bottom: 0.2rem;"></h3>
            <div id="detail-price" style="font-size: 0.85rem; color: var(--primary); font-weight: 700; margin-bottom: 0.5rem;"></div>
            <p id="detail-desc" style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.75rem; line-height: 1.4;"></p>
            
            <!-- Pengatur Jumlah -->
            <div class="qty-control">
                <button class="qty-btn" onclick="adjustModalQty(-1)"><i class="fas fa-minus"></i></button>
                <input type="number" id="modal-qty" class="qty-input" value="1" min="1">
                <button class="qty-btn" onclick="adjustModalQty(1)"><i class="fas fa-plus"></i></button>
            </div>

            <button id="detail-add-btn" class="btn btn-primary" style="font-size: 0.75rem; padding: 0.5rem;">
                <i class="fas fa-cart-plus"></i> Masukkan ke Pesanan
            </button>
        </div>
    </div>

    <!-- Modal Berlangganan -->
    <div class="modal" id="subscribe-modal" style="z-index: 3000;">
        <div class="modal-content" style="text-align: center;">
            <div style="display: flex; justify-content: flex-end; margin-bottom: -0.5rem;">
                <button onclick="closeModal('subscribe-modal')" style="background:none; border:none; font-size:1.1rem; cursor:pointer; color:var(--text-muted);"><i class="fas fa-times"></i></button>
            </div>
            <i class="fas fa-lock" style="font-size: 2.5rem; color: var(--primary); margin-bottom: 1rem; display: block;"></i>
            <h3 style="font-size: 1.1rem; font-weight: 800; color: var(--text-main); margin-bottom: 0.5rem;">Fitur Terkunci</h3>
            <p style="font-size: 0.75rem; color: var(--text-muted); margin-bottom: 1.25rem; line-height: 1.5;">
                Silakan berlangganan ke versi Premium Sitenexs untuk membuka akses checkout, integrasi sistem pelayan, dan fitur lainnya.
            </p>
            <button class="btn btn-primary" onclick="closeModal('subscribe-modal')" style="padding: 0.6rem; font-size: 0.75rem; border-radius: var(--radius-full); font-weight: 800;">
                <i class="fas fa-crown" style="color: #fef08a;"></i> BERLANGGANAN SEKARANG
            </button>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://xqcbyamxiekdxytntlno.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhxY2J5YW14aWVrZHh5dG50bG5vIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA0MTM2NDIsImV4cCI6MjEwNTk4OTY0Mn0.pkytlWwjfKOQT9bWNS-nuNZReE7jFUi3ITk5ageyrkM';

        const { createClient } = supabase;
        const _supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let products = [];
        let currentCategory = 'all';
        let cart = {}; // { productId: quantity }
        let selectedProductId = null;

        async function fetchMenuProducts() {
            const { data, error } = await _supabase.from('products').select('*');
            if (error) return;
            products = data || [];
            filterAndRenderMenu();
        }

        window.addEventListener('DOMContentLoaded', () => {
            fetchMenuProducts();
            _supabase.channel('public:products').on('postgres_changes', { event: '*', schema: 'public', table: 'products' }, payload => {
                fetchMenuProducts();
            }).subscribe();
        });

        function filterCategory(cat, btn) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            filterAndRenderMenu();
        }

        function filterAndRenderMenu() {
            const container = document.getElementById('menu-list-container');
            const searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            const sortOrder = document.getElementById('sort-select').value;

            let result = currentCategory === 'all' ? [...products] : products.filter(p => p.category === currentCategory);

            if (searchQuery) {
                result = result.filter(p => p.name.toLowerCase().includes(searchQuery) || (p.desc && p.desc.toLowerCase().includes(searchQuery)));
            }

            if (sortOrder === 'termurah') result.sort((a, b) => a.price - b.price);
            else if (sortOrder === 'tertinggi') result.sort((a, b) => b.price - a.price);

            container.innerHTML = '';
            
            if (result.length === 0) {
                container.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 2rem 1rem; color: var(--text-muted); font-size: 0.75rem;">Menu tidak ditemukan.</div>`;
                return;
            }

            result.forEach(p => {
                container.innerHTML += `
                    <div class="menu-card">
                        <div class="menu-img-wrapper" onclick="openDetailModal(${p.id})">
                            <img src="${p.img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&auto=format&fit=crop&q=80'}" class="menu-img" alt="${p.name}">
                        </div>
                        <div class="menu-body" onclick="openDetailModal(${p.id})">
                            <div class="menu-title">${p.name}</div>
                            <div class="menu-price">Rp ${p.price.toLocaleString('id-ID')}</div>
                        </div>
                        <div class="menu-action">
                            <button class="btn btn-primary" onclick="openDetailModal(${p.id})"><i class="fas fa-plus"></i> Tambah</button>
                        </div>
                    </div>
                `;
            });
        }

        function openDetailModal(id) {
            const product = products.find(p => p.id === id);
            if (!product) return;
            
            selectedProductId = product.id;
            document.getElementById('detail-img').src = product.img || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=300&auto=format&fit=crop&q=80';
            document.getElementById('detail-title').innerText = product.name;
            document.getElementById('detail-price').innerText = 'Rp ' + product.price.toLocaleString('id-ID');
            document.getElementById('detail-desc').innerText = product.desc || 'Menu lezat pilihan terbaik dari Sitenexs Cafe.';
            document.getElementById('modal-qty').value = 1; // Reset jumlah ke 1 setiap kali dibuka

            const addBtn = document.getElementById('detail-add-btn');
            addBtn.onclick = () => {
                let qty = parseInt(document.getElementById('modal-qty').value) || 1;
                if (qty < 1) qty = 1;
                cart[selectedProductId] = (cart[selectedProductId] || 0) + qty;
                updateCartUI();
                closeModal('detail-modal');
            };

            openModal('detail-modal');
        }

        function adjustModalQty(change) {
            const input = document.getElementById('modal-qty');
            let currentVal = parseInt(input.value) || 1;
            currentVal += change;
            if (currentVal < 1) currentVal = 1;
            input.value = currentVal;
        }

        function updateCartUI() {
            let totalItems = 0;
            let totalPrice = 0;

            for (let id in cart) {
                let qty = cart[id];
                let product = products.find(p => p.id == id);
                if (product) {
                    totalItems += qty;
                    totalPrice += product.price * qty;
                }
            }

            document.getElementById('cart-count').innerText = `${totalItems} Item`;
            document.getElementById('cart-total').innerText = `Rp ${totalPrice.toLocaleString('id-ID')}`;
        }

        function openSubscribeModal() {
            openModal('subscribe-modal');
        }

        function openModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('show'), 10);
        }

        function closeModal(modalId) {
            const modal = document.getElementById(modalId);
            modal.classList.remove('show');
            setTimeout(() => modal.style.display = 'none', 300);
        }
    </script>
</body>
</html>
